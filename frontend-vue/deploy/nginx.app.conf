# Include inside the HTTPS server block. Replace the API upstream and static root per environment.
# /api is deliberately matched before /app so Vue history fallback can never swallow API requests.
location ^~ /api/ {
    proxy_pass http://mowo_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /app/runtime-config.js {
    root /var/www/mowo;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location ^~ /app/assets/ {
    root /var/www/mowo;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location /app/ {
    root /var/www/mowo;
    try_files $uri $uri/ /app/index.html;
}
