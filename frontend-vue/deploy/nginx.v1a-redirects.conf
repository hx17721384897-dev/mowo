# V1a/V1b cumulative temporary redirects. Include before the legacy static-files location.
# Keep these as 302 during the verification window so rollback only requires
# removing this include; promote to 308 after V6 final cutover approval.
location = /mowo/frontend/pages/index.html          { return 302 /app/; }
location = /mowo/frontend/pages/about.html          { return 302 /app/about; }
location = /mowo/frontend/pages/products.html       { return 302 /app/products; }
location = /mowo/frontend/pages/faq.html            { return 302 /app/faq; }
location = /mowo/frontend/pages/user-agreement.html { return 302 /app/legal/terms; }
location = /mowo/frontend/pages/privacy-policy.html { return 302 /app/legal/privacy; }
location = /mowo/frontend/pages/contact.html        { return 302 /app/contact; }

# V1b联名货架。保留查询参数以兼容旧详情 workId 深链接。
location = /mowo/frontend/pages/showcase.html        { return 302 /app/showcase$is_args$args; }
location = /mowo/frontend/pages/showcase-detail.html { return 302 /app/showcase-detail$is_args$args; }
