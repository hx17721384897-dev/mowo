name: frontend-vue

on:
  pull_request:
    paths:
      - 'frontend-vue/**'
      - '.github/workflows/frontend-vue.yml'
  push:
    branches: [main]
    paths:
      - 'frontend-vue/**'
      - '.github/workflows/frontend-vue.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
