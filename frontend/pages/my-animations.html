<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的动画 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;--accent-b:#7EC8E3;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);--nav-h:65px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}
a{text-decoration:none;color:inherit;}

/* ── NAV ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:var(--nav-h);background:rgba(245,243,239,.96);backdrop-filter:blur(20px);border-bottom:1.5px solid var(--gray1);}
@media(min-width:1024px){.nav{padding:0 48px;}}
.nav-logo{line-height:1;}
.nav-logo-cn{font-weight:900;font-size:22px;color:var(--black);display:block;}
.nav-logo-en{font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray3);display:block;margin-top:1px;}
.nav-links{display:none;list-style:none;gap:32px;}
@media(min-width:1024px){.nav-links{display:flex;}}
.nav-links a{font-weight:800;font-size:14px;color:var(--gray3);transition:color .2s;}
.nav-links a:hover{color:var(--black);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-login-btn{font-weight:800;font-size:13px;padding:9px 20px;border-radius:999px;background:var(--black);color:var(--white);transition:opacity .2s;min-height:40px;}
.nav-login-btn:hover{opacity:.8;}

/* ── PAGE ── */
.page{max-width:860px;margin:0 auto;padding:calc(var(--nav-h) + 48px) 24px 100px;}
@media(min-width:1024px){.page{padding:calc(var(--nav-h) + 64px) 48px 100px;}}

/* ── HEADER ── */
.page-header{margin-bottom:36px;}
.page-title{font-weight:900;font-size:clamp(26px,5vw,40px);letter-spacing:-.03em;line-height:1.1;margin-bottom:8px;}
.page-title em{font-style:normal;background:var(--accent-y);padding:0 10px;border-radius:8px;}
.page-sub{font-weight:700;font-size:14px;color:var(--gray3);}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:28px;flex-wrap:wrap;}
.filter-btn{padding:8px 18px;border-radius:999px;font-weight:800;font-size:12px;color:var(--gray3);border:1.5px solid var(--gray1);background:var(--white);transition:all .2s;min-height:36px;}
.filter-btn:hover{border-color:var(--gray2);color:var(--black);}
.filter-btn.active{background:var(--black);color:var(--white);border-color:var(--black);}
.filter-count{margin-left:auto;font-weight:700;font-size:12px;color:var(--gray3);}

/* ── GRID ── */
.anim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
@media(max-width:640px){.anim-grid{grid-template-columns:1fr;}}

/* ── CARD ── */
.anim-card{background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);overflow:hidden;transition:border-color .22s,box-shadow .22s,transform .22s var(--ease);cursor:pointer;}
.anim-card:hover{border-color:var(--gray2);box-shadow:0 8px 32px rgba(0,0,0,.09);transform:translateY(-3px);}

.card-thumb{height:180px;background:var(--gray1);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.card-thumb canvas{width:100%;height:100%;object-fit:cover;}
.card-thumb-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;}
.card-thumb-icon{font-size:36px;opacity:.35;}
.card-thumb-label{font-weight:800;font-size:11px;color:var(--gray3);letter-spacing:.06em;}
.card-thumb-frames{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,.5);color:#fff;font-weight:800;font-size:10px;padding:3px 8px;border-radius:999px;backdrop-filter:blur(4px);}

.card-status{position:absolute;top:10px;left:10px;}
.status-pill{padding:3px 10px;border-radius:999px;font-weight:900;font-size:10px;}
.status-pending{background:#FFF8E6;color:#C47F00;}
.status-making{background:#EBF5FF;color:#2266CC;}
.status-shipped{background:#E8F9EC;color:#1A7A2C;}
.status-done{background:var(--gray1);color:var(--gray3);}
.status-cancelled{background:#FFF0F0;color:#CC2222;}

.card-body{padding:14px 16px 16px;}
.card-model{font-weight:900;font-size:14px;color:var(--black);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.card-meta-item{font-weight:700;font-size:11px;color:var(--gray3);display:flex;align-items:center;gap:3px;}
.card-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 14px;border-top:1px solid var(--gray1);margin-top:2px;}
.card-date{font-weight:700;font-size:11px;color:var(--gray3);}
.card-link{font-weight:800;font-size:12px;color:var(--black);display:flex;align-items:center;gap:4px;transition:opacity .2s;}
.card-link:hover{opacity:.6;}

/* ── SKELETON ── */
.skeleton{animation:sk-pulse 1.5s ease-in-out infinite;}
@keyframes sk-pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.sk-thumb{height:180px;background:var(--gray1);border-radius:0;}
.sk-line{height:14px;background:var(--gray1);border-radius:6px;margin-bottom:8px;}
.sk-line.w60{width:60%;}
.sk-line.w40{width:40%;}
.sk-body{padding:14px 16px 16px;}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:80px 24px;}
.empty-icon{font-size:52px;margin-bottom:16px;opacity:.4;}
.empty-title{font-weight:900;font-size:20px;margin-bottom:8px;}
.empty-sub{font-weight:700;font-size:14px;color:var(--gray3);margin-bottom:28px;line-height:1.7;}
.btn-go{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:999px;background:var(--black);color:var(--white);font-weight:800;font-size:14px;transition:opacity .2s;}
.btn-go:hover{opacity:.8;}

/* ── ERROR ── */
.error-state{text-align:center;padding:60px 24px;}
.error-icon{font-size:40px;margin-bottom:12px;}
.error-msg{font-weight:700;font-size:14px;color:var(--gray3);margin-bottom:20px;}
.btn-retry{padding:10px 24px;border-radius:999px;background:var(--gray1);font-weight:800;font-size:13px;color:var(--black);transition:background .2s;}
.btn-retry:hover{background:var(--gray2);}

/* ── DELETE BTN ── */
.card-delete-btn{font-weight:800;font-size:12px;color:#CC2222;padding:4px 8px;border-radius:8px;transition:background .2s;cursor:pointer;}
.card-delete-btn:hover{background:#FFF0F0;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);z-index:1200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease);}
.modal-overlay.open{opacity:1;pointer-events:all;}
.confirm-modal{background:var(--white);border-radius:24px;padding:28px;width:100%;max-width:380px;transform:translateY(16px) scale(.97);transition:transform .3s var(--ease);}
.modal-overlay.open .confirm-modal{transform:none;}
.confirm-icon{font-size:40px;margin-bottom:14px;text-align:center;}
.confirm-title{font-weight:900;font-size:18px;text-align:center;margin-bottom:8px;}
.confirm-sub{font-weight:700;font-size:13px;color:var(--gray3);text-align:center;margin-bottom:24px;line-height:1.6;}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.confirm-btn{padding:11px 0;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;transition:all .2s;border:none;}
.confirm-btn-cancel{background:var(--gray1);color:var(--black);}
.confirm-btn-cancel:hover{background:var(--gray2);}
.confirm-btn-delete{background:#FFF0F0;color:#CC2222;border:1.5px solid #FFCCCC;}
.confirm-btn-delete:hover{background:#FFE0E0;}

/* ── TOAST ── */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:9000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── RENAME ── */
.card-name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.card-name-row .card-model{margin-bottom:0;flex:1;min-width:0;}
.rename-btn{font-size:13px;color:var(--gray2);padding:2px 5px;border-radius:6px;line-height:1;flex-shrink:0;cursor:pointer;transition:color .2s,background .2s;}
.rename-btn:hover{color:var(--black);background:var(--gray1);}

/* ── BURGER ── */
.burger{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:8px;min-width:44px;min-height:44px;justify-content:center;align-items:center;}
@media(min-width:1024px){.burger{display:none;}}
.burger span{display:block;width:22px;height:2px;background:var(--black);border-radius:2px;transition:transform .3s,opacity .3s;}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.burger.open span:nth-child(2){opacity:0;}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

/* ── MOBILE MENU ── */
.mobile-menu{position:fixed;inset:0;background:var(--black);z-index:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);}
.mobile-menu.open{opacity:1;pointer-events:all;}
.mobile-menu a{font-weight:900;font-size:clamp(28px,8vw,48px);color:var(--white);transition:color .2s;}
.mobile-menu a:hover{color:var(--accent-y);}
.mobile-menu-footer{position:absolute;bottom:48px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;}
.mobile-login-btn{font-family:var(--font);font-weight:900;font-size:16px;letter-spacing:.05em;padding:14px 48px;background:var(--accent-y);color:var(--black);border-radius:999px;border:none;cursor:pointer;transition:opacity .2s;min-height:52px;}
.mobile-login-btn:hover{opacity:.85;}
.mobile-menu-avatar{display:flex;flex-direction:column;align-items:center;gap:8px;}
.mobile-menu-avatar-btn{width:56px;height:56px;border-radius:50%;background:var(--accent-y);color:var(--black);font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:opacity .2s;}
.mobile-menu-avatar-btn:hover{opacity:.8;}
.mobile-menu-avatar-name{font-weight:700;font-size:13px;color:rgba(255,255,255,.5);letter-spacing:.05em;}
@media(max-width:1023px){.nav-login-text{display:none;}}
@media(min-width:1024px){.nav-login-text{display:flex;}}
</style>
</head>
<body>

<!-- ── 移动端全屏菜单 ── -->
<div class="mobile-menu" id="mobileMenu">
  <a href="about.html" onclick="closeMenu()">关于我们</a>
  <a href="products.html" onclick="closeMenu()">产品介绍</a>
  <a href="showcase.html" onclick="closeMenu()">画师联名</a>
  <a href="customize-start.html" onclick="closeMenu()">创作中心</a>
  <a href="contact.html" onclick="closeMenu()">联络我们</a>
  <div class="mobile-menu-footer">
    <button class="mobile-login-btn" id="mobileLoginBtn" onclick="closeMenu()">登录 / 注册</button>
    <div class="mobile-menu-avatar" id="mobileMenuAvatar" style="display:none">
      <button class="mobile-menu-avatar-btn" id="mobileMenuAvatarBtn" onclick="closeMenu()"></button>
      <span class="mobile-menu-avatar-name" id="mobileMenuAvatarName"></span>
    </div>
  </div>
</div>

<!-- ── 导航栏 ── -->
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo-cn">哞屋</span>
    <span class="nav-logo-en">MOWO</span>
  </a>
  <ul class="nav-links">
    <li><a href="about.html">关于我们</a></li>
    <li><a href="products.html">产品介绍</a></li>
    <li><a href="showcase.html">画师联名</a></li>
    <li><a href="customize-start.html">创作中心</a></li>
    <li><a href="contact.html">联络我们</a></li>
  </ul>
  <div class="nav-right">
    <button class="nav-login nav-login-btn nav-login-text" id="navLoginBtn">登录</button>
    <div class="burger" id="burger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<!-- ── 主内容 ── -->
<main class="page">
  <div class="page-header">
    <h1 class="page-title">我的<em>动画</em></h1>
    <p class="page-sub">你通过定制工具创作的每一帧热爱</p>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all"     onclick="setFilter(this,'all')">全部</button>
    <button class="filter-btn"        data-filter="draft"   onclick="setFilter(this,'draft')">草稿</button>
    <button class="filter-btn"        data-filter="ordered" onclick="setFilter(this,'ordered')">已下单</button>
    <span class="filter-count" id="totalCount"></span>
  </div>

  <!-- 内容区 -->
  <div id="contentArea"></div>
</main>

<!-- ── 重命名弹窗 ── -->
<div class="modal-overlay" id="renameModal" onclick="handleRenameModalBg(event)">
  <div class="confirm-modal" style="max-width:360px;">
    <p class="confirm-title" style="margin-bottom:16px;">重命名动画</p>
    <input id="renameInput" type="text" maxlength="40" placeholder="输入动画名称"
      style="width:100%;height:42px;border:1.5px solid var(--gray1);border-radius:12px;padding:0 14px;font-family:var(--font);font-weight:700;font-size:13px;color:var(--black);background:var(--white);outline:none;transition:border-color .2s;margin-bottom:20px;display:block;"
      onfocus="this.style.borderColor='var(--black)'" onblur="this.style.borderColor='var(--gray1)'"
      onkeydown="handleRenameKey(event)">
    <div class="confirm-actions">
      <button class="confirm-btn confirm-btn-cancel" onclick="closeRenameModal()">取消</button>
      <button class="confirm-btn confirm-btn-delete" id="btnConfirmRename" onclick="confirmRename()" style="background:var(--black);color:var(--white);border-color:var(--black);">保存</button>
    </div>
  </div>
</div>

<!-- ── 删除确认弹窗 ── -->
<div class="modal-overlay" id="deleteModal" onclick="handleDeleteModalBg(event)">
  <div class="confirm-modal">
    <div class="confirm-icon">🗑️</div>
    <p class="confirm-title">确认删除这个动画？</p>
    <p class="confirm-sub" id="deleteConfirmSub">删除后无法恢复。</p>
    <div class="confirm-actions">
      <button class="confirm-btn confirm-btn-cancel" onclick="closeDeleteModal()">取消</button>
      <button class="confirm-btn confirm-btn-delete" id="btnConfirmDelete" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="../js/auth.js"></script>
<script>
const API = (location.hostname==='127.0.0.1'||location.hostname==='localhost')
  ? 'http://127.0.0.1:3001' : 'http://localhost:3001';

let _allItems = [];      // CustomProduct 列表
let _currentFilter = 'all';
let _deleteTarget = null;
let _renameTarget = null;

/* ── Toast ── */
let _toastTimer;
function showToast(msg, dur = 2400) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

/* ── 删除 ── */
function askDelete(id) {
  _deleteTarget = id;
  const item = _allItems.find(i => i.id === id);
  const cfg = safeJson(item?.configJson);
  const name = cfg?.animName || fmtDate(item?.createdAt) || '该动画';
  document.getElementById('deleteConfirmSub').textContent = `「${name}」删除后无法恢复。`;
  document.getElementById('deleteModal').classList.add('open');
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('open');
  _deleteTarget = null;
}

function handleDeleteModalBg(e) {
  if (e.target === document.getElementById('deleteModal')) closeDeleteModal();
}

async function confirmDelete() {
  if (!_deleteTarget) return;
  const btn = document.getElementById('btnConfirmDelete');
  btn.disabled = true; btn.textContent = '删除中…';
  const token = localStorage.getItem('mowo_token');
  try {
    const res = await fetch(`${API}/api/custom-products/${_deleteTarget}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${token}` }
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.message);
    _allItems = _allItems.filter(i => i.id !== _deleteTarget);
    closeDeleteModal();
    renderItems();
    showToast('已删除');
  } catch(e) {
    showToast('删除失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '确认删除';
  }
}

/* ── 工具 ── */
function safeJson(s) { try { return JSON.parse(s) } catch(e) { return null } }
function fmtDate(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtDatetimeMin(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function cpStatusLabel(s) {
  return { draft:'草稿', in_cart:'已加购', ordered:'已下单', removed:'已删除' }[s] || '草稿';
}
function cpStatusClass(s) {
  if (s === 'ordered') return 'status-done';
  if (s === 'in_cart') return 'status-making';
  return 'status-pending';
}

/* ── 重命名 ── */
function openRename(id) {
  _renameTarget = id;
  const item = _allItems.find(i => i.id === id);
  const cfg = safeJson(item?.configJson);
  document.getElementById('renameInput').value = cfg?.animName || '';
  document.getElementById('renameModal').classList.add('open');
  setTimeout(() => { const inp = document.getElementById('renameInput'); inp.focus(); inp.select(); }, 80);
}

function closeRenameModal() {
  document.getElementById('renameModal').classList.remove('open');
  _renameTarget = null;
}

function handleRenameModalBg(e) {
  if (e.target === document.getElementById('renameModal')) closeRenameModal();
}

function handleRenameKey(e) {
  if (e.key === 'Enter') confirmRename();
  if (e.key === 'Escape') closeRenameModal();
}

async function confirmRename() {
  if (!_renameTarget) return;
  const newName = document.getElementById('renameInput').value.trim();
  if (!newName) { showToast('请输入名称'); return; }
  const btn = document.getElementById('btnConfirmRename');
  btn.disabled = true; btn.textContent = '保存中…';
  const token = localStorage.getItem('mowo_token');
  try {
    const item = _allItems.find(i => i.id === _renameTarget);
    const existing = safeJson(item?.configJson) || {};
    const updated = { ...existing, animName: newName };
    const res = await fetch(`${API}/api/custom-products/${_renameTarget}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ configJson: JSON.stringify(updated) })
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.message);
    if (item) item.configJson = JSON.stringify(updated);
    closeRenameModal();
    renderItems();
    showToast('已重命名');
  } catch(e) {
    showToast('重命名失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '保存';
  }
}

/* ── 筛选 ── */
function setFilter(btn, filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  _currentFilter = filter;
  renderItems();
}

/* ── 渲染 ── */
function renderItems() {
  const area = document.getElementById('contentArea');
  let list = _allItems;
  if (_currentFilter === 'draft')   list = list.filter(i => i.status === 'draft' || i.status === 'in_cart');
  if (_currentFilter === 'ordered') list = list.filter(i => i.status === 'ordered');

  document.getElementById('totalCount').textContent = `共 ${_allItems.length} 件`;

  if (list.length === 0) {
    area.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🎬</div>
        <p class="empty-title">${_currentFilter==='all' ? '还没有定制记录' : '该分类暂无记录'}</p>
        <p class="empty-sub">${_currentFilter==='all' ? '去定制你的第一台专属动画机吧！' : '换个分类看看？'}</p>
        ${_currentFilter==='all' ? '<a class="btn-go" href="customize-start.html">开始定制 →</a>' : ''}
      </div>`;
    return;
  }

  area.innerHTML = `<div class="anim-grid">${list.map(animCard).join('')}</div>`;
}

function animCard(item) {
  const frames     = safeJson(item.animationFrames) || [];
  const cfg        = safeJson(item.configJson) || {};
  const frameCount = item.frameCount || frames.length || cfg.frameCount || 0;
  const dateStr    = fmtDate(item.createdAt);
  const statusL    = cpStatusLabel(item.status);
  const statusC    = cpStatusClass(item.status);

  // 规格行：modelName size frameCount帧 material colorName
  const specParts = [cfg.modelName, cfg.size,
    frameCount ? frameCount + '帧' : null,
    cfg.material, cfg.colorName].filter(Boolean);
  const specStr = specParts.join(' ') || `定制动画 ${fmtDatetimeMin(item.createdAt)}`;
  const displayName = cfg.animName || specStr;

  // 预览缩略图：优先 previewUrl，其次第一帧
  let thumbInner;
  if (item.previewUrl) {
    thumbInner = `<img src="${item.previewUrl}" alt="预览" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`;
  } else if (frames.length > 0 && typeof frames[0] === 'string') {
    thumbInner = `<img src="${frames[0].startsWith('data:') ? frames[0] : frames[0]}" alt="第一帧" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`;
  } else {
    thumbInner = `<div class="card-thumb-placeholder"><div class="card-thumb-icon">🎞️</div><div class="card-thumb-label">动画预览</div></div>`;
  }

  // 工程剩余天数
  const now = Date.now();
  const expiry = item.draftExpiresAt ? new Date(item.draftExpiresAt).getTime() : null;
  const daysLeft = expiry ? Math.max(0, Math.ceil((expiry - now) / 86400000)) : null;

  const editHref = `customize-editor.html?editId=${item.id}`;

  return `
  <div class="anim-card">
    <div class="card-thumb">
      ${thumbInner}
      <div class="card-status"><span class="status-pill ${statusC}">${statusL}</span></div>
      ${frameCount ? `<div class="card-thumb-frames">${frameCount}帧</div>` : ''}
    </div>
    <div class="card-body">
      <div class="card-name-row">
        <div class="card-model">${displayName}</div>
        <button class="rename-btn" onclick="event.stopPropagation();openRename('${item.id}')" title="重命名">✎</button>
      </div>
      <div class="card-meta">
        ${daysLeft !== null ? `<span class="card-meta-item">🗂 工程${daysLeft > 0 ? daysLeft + '天' : '已过期'}</span>` : ''}
        <span class="card-meta-item">📅 ${dateStr}</span>
      </div>
    </div>
    <div class="card-footer">
      <a href="${editHref}" class="card-link" onclick="event.stopPropagation()">✏️ 重新编辑</a>
      ${item.status === 'ordered' ? `<span class="card-link" style="color:var(--accent-g)">已下单 ✓</span>` : `<a href="customize-start.html" class="card-link">去选配 →</a>`}
      <button class="card-delete-btn" onclick="event.stopPropagation();askDelete('${item.id}')">删除</button>
    </div>
  </div>`;
}

/* ── 骨架屏 ── */
function renderSkeleton() {
  const area = document.getElementById('contentArea');
  const skCard = `
    <div class="anim-card">
      <div class="sk-thumb skeleton"></div>
      <div class="sk-body">
        <div class="sk-line skeleton"></div>
        <div class="sk-line w60 skeleton"></div>
      </div>
    </div>`;
  area.innerHTML = `<div class="anim-grid">${skCard.repeat(6)}</div>`;
}

/* ── 错误态 ── */
function renderError(msg) {
  document.getElementById('contentArea').innerHTML = `
    <div class="error-state">
      <div class="error-icon">⚠️</div>
      <p class="error-msg">${msg}</p>
      <button class="btn-retry" onclick="loadAnimations()">重新加载</button>
    </div>`;
}

/* ── 移动端菜单 ── */
function toggleMenu() {
  const m = document.getElementById('mobileMenu');
  const b = document.getElementById('burger');
  const open = m.classList.toggle('open');
  b.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
}
function closeMenu() {
  document.getElementById('mobileMenu').classList.remove('open');
  document.getElementById('burger').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── 加载数据 ── */
async function loadAnimations() {
  renderSkeleton();
  const token = localStorage.getItem('mowo_token');
  if (!token) {
    setTimeout(() => { if (typeof openAuthModal === 'function') openAuthModal(); renderError('请先登录后查看'); }, 600);
    return;
  }
  try {
    const res = await fetch(`${API}/api/custom-products?page=1&limit=50`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.message || '加载失败');
    _allItems = json.data?.items || [];
    renderItems();
  } catch(e) {
    renderError('加载失败，请检查网络后重试');
    console.error(e);
  }
}

/* ── 初始化 ── */
window.addEventListener('mowoTokenRefreshed', loadAnimations);
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(loadAnimations, 300);
});
</script>
<script>
(function syncMobileAuth() {
  function applyState() {
    var navLoginBtn     = document.getElementById('navLoginBtn');
    var mowoNavUser     = document.getElementById('mowoNavUser');
    var mobileLoginBtn  = document.getElementById('mobileLoginBtn');
    var mobileAvatar    = document.getElementById('mobileMenuAvatar');
    var mobileAvatarBtn = document.getElementById('mobileMenuAvatarBtn');
    var mobileAvatarName= document.getElementById('mobileMenuAvatarName');
    if (!mobileLoginBtn) return;
    var loggedIn = (navLoginBtn && navLoginBtn.style.display === 'none')
                || (mowoNavUser && mowoNavUser.classList.contains('show'));
    if (loggedIn) {
      mobileLoginBtn.style.display = 'none';
      if (mobileAvatar) mobileAvatar.style.display = 'flex';
      var uname   = document.getElementById('mowoNavUname');
      var initial = document.getElementById('mowoNavAvatarInitial');
      if (mobileAvatarBtn) mobileAvatarBtn.textContent = (initial && initial.textContent) || '?';
      if (mobileAvatarName) mobileAvatarName.textContent = (uname && uname.textContent) || '我的账户';
      if (mobileAvatarBtn) mobileAvatarBtn.onclick = function() {
        document.getElementById('mowoNavAvatarBtn')?.click();
        closeMenu();
      };
    } else {
      mobileLoginBtn.style.display = '';
      if (mobileAvatar) mobileAvatar.style.display = 'none';
      mobileLoginBtn.onclick = function() { closeMenu(); window.openAuthModal && window.openAuthModal(); };
    }
  }
  function startObserving() {
    var navLoginBtn = document.getElementById('navLoginBtn');
    var mowoNavUser = document.getElementById('mowoNavUser');
    if (navLoginBtn) new MutationObserver(applyState).observe(navLoginBtn, { attributes:true, attributeFilter:['style'] });
    if (mowoNavUser) new MutationObserver(applyState).observe(mowoNavUser, { attributes:true, attributeFilter:['class'] });
    applyState();
  }
  if (document.readyState === 'complete') { startObserving(); }
  else { window.addEventListener('load', startObserving); }
  setTimeout(applyState, 800);
})();
</script>
