<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/runtime-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>款式管理 — 哞屋后台</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --white:#FFFFFF; --cream:#F5F3EF; --black:#111110;
  --gray1:#EBEBEA; --gray2:#C4C3BF; --gray3:#787874;
  --accent-y:#F5E642; --accent-o:#FF6B35; --accent-g:#8FD694; --accent-b:#7EC8E3;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --sidebar-w:220px; --sidebar-collapsed:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}

.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--black);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:width .3s cubic-bezier(0.22,1,0.36,1);overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;}
.sidebar-logo-icon{width:32px;height:32px;background:var(--accent-y);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sidebar-logo-text{font-weight:900;font-size:15px;color:var(--white);}
.sidebar-logo-sub{font-weight:700;font-size:10px;color:var(--gray3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:1px;}
.sidebar-toggle{position:absolute;top:26px;right:12px;width:28px;height:28px;background:rgba(255,255,255,.08);border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray3);font-size:12px;transition:background .2s;}
.sidebar-toggle:hover{background:rgba(255,255,255,.15);color:var(--white);}
.sidebar-nav{flex:1;padding:16px 0;overflow-y:auto;overflow-x:hidden;}
.nav-section-label{font-weight:800;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gray3);padding:12px 20px 6px;white-space:nowrap;transition:opacity .2s;}
.sidebar.collapsed .nav-section-label{opacity:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;color:var(--gray3);font-weight:800;font-size:13px;text-decoration:none;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--white);}
.nav-item.active{background:rgba(245,230,66,.12);color:var(--accent-y);}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-y);border-radius:0 2px 2px 0;}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.nav-label{transition:opacity .2s;}
.sidebar.collapsed .nav-label{opacity:0;}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap;overflow:hidden;}
.sidebar-user{display:flex;align-items:center;gap:10px;}
.sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);flex-shrink:0;}
.sidebar-user-name{font-weight:800;font-size:12px;color:var(--white);}
.sidebar-user-role{font-weight:700;font-size:10px;color:var(--gray3);}
.sidebar.collapsed .sidebar-user-info{display:none;}

.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;transition:margin-left .3s cubic-bezier(0.22,1,0.36,1);display:flex;flex-direction:column;}
.main.expanded{margin-left:var(--sidebar-collapsed);}
.topbar{position:sticky;top:0;z-index:50;background:rgba(245,243,239,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray1);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-weight:900;font-size:18px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.topbar-time{font-weight:700;font-size:12px;color:var(--gray3);}
.content{padding:28px 32px;flex:1;}

.btn{height:38px;padding:0 16px;border-radius:10px;font-family:var(--font);font-weight:800;font-size:13px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn-black{background:var(--black);color:var(--white);}
.btn-black:hover{opacity:.85;}
.btn-ghost{background:var(--white);color:var(--black);border:1.5px solid var(--gray1);}
.btn-ghost:hover{border-color:var(--black);}
.btn-red{background:#FFE5E5;color:#C0392B;border:1.5px solid #FFCCCC;}
.btn-red:hover{background:#FFCCCC;}
.btn-green{background:#E8F5E9;color:#2E7D32;border:1.5px solid #C8E6C9;}
.btn-green:hover{background:#C8E6C9;}
.btn-sm{height:32px;padding:0 12px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.4;pointer-events:none;}

.toggle-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:20px;font-family:var(--font);font-weight:800;font-size:11px;border:none;cursor:pointer;transition:all .2s;white-space:nowrap;}
.toggle-btn.on{background:#E8F5E9;color:#2E7D32;}
.toggle-btn.on:hover{background:#FFEBE8;color:#C0392B;}
.toggle-btn.off{background:var(--gray1);color:var(--gray3);}
.toggle-btn.off:hover{background:#E8F5E9;color:#2E7D32;}

.model-status-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer;transition:all .2s;border:none;font-family:var(--font);}
.model-status-tag.on{background:#E8F5E9;color:#2E7D32;}
.model-status-tag.on:hover{background:#FFEBE8;color:#C0392B;}
.model-status-tag.off{background:var(--gray1);color:var(--gray3);}
.model-status-tag.off:hover{background:#E8F5E9;color:#2E7D32;}

.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.models-grid{display:flex;flex-direction:column;gap:16px;}

.model-card{background:var(--white);border-radius:16px;border:1.5px solid var(--gray1);overflow:hidden;transition:box-shadow .2s;}
.model-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.06);}
.model-card.inactive-card{opacity:.7;}
.model-card-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;cursor:pointer;gap:16px;}
.model-card-header:hover{background:var(--cream);}
.model-header-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}
.model-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.model-status-dot.active{background:var(--accent-g);}
.model-status-dot.inactive{background:var(--gray2);}
.model-preview{width:48px;height:48px;border-radius:10px;background:var(--cream);border:1.5px solid var(--gray1);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;}
.model-preview img{width:100%;height:100%;object-fit:cover;}
.model-name{font-weight:900;font-size:15px;}
.model-desc{font-weight:700;font-size:12px;color:var(--gray3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px;}
.model-header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sku-count-badge{background:var(--cream);border:1.5px solid var(--gray1);border-radius:8px;padding:4px 10px;font-weight:800;font-size:11px;color:var(--gray3);}
.model-card-body{border-top:1.5px solid var(--gray1);padding:20px;display:none;}
.model-card-body.open{display:block;}
.model-offline-banner{background:#FFF8E1;border:1.5px solid #FFE082;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:700;font-size:12px;color:#B8860B;display:flex;align-items:center;gap:8px;}

.sku-table-wrap{background:var(--cream);border-radius:12px;overflow:hidden;border:1.5px solid var(--gray1);margin-bottom:14px;}
.sku-table-header{display:grid;grid-template-columns:56px 80px 100px 70px 36px 120px 80px 80px 100px 80px;gap:0;padding:10px 16px;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);border-bottom:1.5px solid var(--gray1);}
.sku-row{display:grid;grid-template-columns:56px 80px 100px 70px 36px 120px 80px 80px 100px 80px;gap:0;padding:12px 16px;border-bottom:1px solid var(--gray1);align-items:center;font-size:13px;font-weight:700;transition:background .15s;}
.sku-row:last-child{border-bottom:none;}
.sku-row:hover{background:var(--white);}
.sku-row.sku-inactive{opacity:.5;}
.sku-empty{padding:28px;text-align:center;font-weight:700;font-size:13px;color:var(--gray3);}
.price-cell{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:background .15s;border:1.5px solid transparent;}
.price-cell:hover{background:var(--cream);border-color:var(--gray1);}
.price-display{font-weight:900;font-size:14px;color:var(--black);}
.price-edit-icon{font-size:11px;color:var(--gray2);opacity:0;transition:opacity .15s;}
.price-cell:hover .price-edit-icon{opacity:1;}
.price-input-wrap{display:flex;align-items:center;gap:4px;}
.price-inline-input{width:72px;height:30px;border:1.5px solid var(--black);border-radius:8px;padding:0 6px 0 14px;font-family:var(--font);font-weight:900;font-size:13px;color:var(--black);outline:none;}
.price-inline-prefix{font-weight:900;font-size:13px;position:absolute;left:6px;pointer-events:none;}
.price-confirm-btn{width:26px;height:26px;border-radius:6px;background:var(--black);color:var(--white);border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.price-confirm-btn:hover{opacity:.8;}
.price-cancel-btn{width:26px;height:26px;border-radius:6px;background:var(--gray1);color:var(--gray3);border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.price-cancel-btn:hover{background:var(--gray2);}
.sku-img-box{width:44px;height:44px;border-radius:8px;border:1.5px dashed var(--gray2);background:var(--cream);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;transition:border-color .2s;flex-shrink:0;}
.sku-img-box:hover{border-color:var(--black);background:var(--gray1);}
.sku-img-box img{width:100%;height:100%;object-fit:cover;}
.sku-img-input{display:none;}
.color-swatch{width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.1);}
.stock-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-weight:800;font-size:11px;}
.stock-normal{background:#E8F5E9;color:#2E7D32;}
.stock-low{background:#FFF8E1;color:#B8860B;}
.stock-out{background:#FFE5E5;color:#C0392B;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.modal-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(17,17,16,.5);align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--white);border-radius:20px;padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
.modal-title{font-weight:900;font-size:18px;margin-bottom:6px;}
.modal-sub{font-weight:700;font-size:13px;color:var(--gray3);margin-bottom:20px;}
.modal-actions{display:flex;gap:10px;margin-top:24px;}
.modal-actions .btn{flex:1;height:46px;}

.form-field{margin-bottom:16px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.form-label{font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--gray3);display:block;margin-bottom:6px;}
.form-label em{font-style:normal;font-weight:700;color:var(--gray2);margin-left:4px;letter-spacing:0;text-transform:none;}
.form-input{width:100%;height:44px;border:1.5px solid var(--gray1);border-radius:10px;padding:0 14px;font-family:var(--font);font-weight:700;font-size:14px;color:var(--black);outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--black);}
.form-textarea{width:100%;min-height:80px;border:1.5px solid var(--gray1);border-radius:10px;padding:12px 14px;font-family:var(--font);font-weight:700;font-size:14px;color:var(--black);outline:none;resize:vertical;transition:border-color .2s;}
.form-textarea:focus{border-color:var(--black);}
.divider{height:1px;background:var(--gray1);margin:18px 0;}
.loading-state{padding:60px 20px;text-align:center;font-weight:700;font-size:14px;color:var(--gray3);}

/* ══ 智能下拉选择器 ══ */
.smart-select-wrap{position:relative;}
.smart-select-btn{
  width:100%;height:44px;border:1.5px solid var(--gray1);border-radius:10px;
  padding:0 14px;font-family:var(--font);font-weight:700;font-size:14px;
  color:var(--black);background:var(--white);outline:none;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  transition:border-color .2s;
}
.smart-select-btn:hover,.smart-select-btn.open{border-color:var(--black);}
.smart-select-btn-text{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.smart-select-arrow{font-size:10px;color:var(--gray3);flex-shrink:0;transition:transform .2s;}
.smart-select-btn.open .smart-select-arrow{transform:rotate(180deg);}

.smart-select-dropdown{
  display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--white);border:1.5px solid var(--gray1);border-radius:12px;
  z-index:100;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.1);
}
.smart-select-dropdown.open{display:block;}
.smart-select-option{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;cursor:pointer;font-weight:700;font-size:13px;
  transition:background .15s;gap:8px;
}
.smart-select-option:hover{background:var(--cream);}
.smart-select-option.selected{background:rgba(245,230,66,.15);color:var(--black);}
.smart-select-option-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.smart-select-del{
  width:20px;height:20px;border-radius:50%;background:var(--gray1);
  border:none;cursor:pointer;font-size:11px;color:var(--gray3);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;
}
.smart-select-del:hover{background:#FFCCCC;color:#C0392B;}

.smart-select-add{
  padding:10px 14px;border-top:1px solid var(--gray1);
  font-weight:800;font-size:13px;color:var(--gray3);
  cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:background .15s;
}
.smart-select-add:hover{background:var(--cream);color:var(--black);}

/* 新增输入行（手动输入新选项） */
.smart-select-new-row{
  padding:10px 14px;border-top:1px solid var(--gray1);
  display:none;flex-direction:column;gap:8px;
}
.smart-select-new-row.open{display:flex;}
.smart-select-new-input{
  width:100%;height:38px;border:1.5px solid var(--gray1);border-radius:8px;
  padding:0 12px;font-family:var(--font);font-weight:700;font-size:13px;
  color:var(--black);outline:none;transition:border-color .2s;
}
.smart-select-new-input:focus{border-color:var(--black);}
.smart-select-new-actions{display:flex;gap:6px;}
.smart-select-new-actions .btn{flex:1;height:34px;font-size:12px;}

/* 颜色选择器特殊样式 */
.color-option-swatch{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.1);flex-shrink:0;}
.color-new-row{padding:10px 14px;border-top:1px solid var(--gray1);display:none;flex-direction:column;gap:10px;}
.color-new-row.open{display:flex;}
.color-new-inputs{display:grid;grid-template-columns:1fr 52px;gap:8px;align-items:center;}
.color-hex-picker{width:52px;height:38px;border:1.5px solid var(--gray1);border-radius:8px;padding:2px;cursor:pointer;outline:none;}
.color-preview-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--cream);border-radius:8px;}
.color-preview-dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.1);flex-shrink:0;}

/* ══ 排序Modal ══ */
.sort-modal-overlay { display:none; position:fixed; inset:0; z-index:400; background:rgba(17,17,16,.5); align-items:center; justify-content:center; }
.sort-modal-overlay.show { display:flex; }
.sort-modal { background:var(--white); border-radius:20px; padding:28px; width:480px; max-width:92vw; box-shadow:0 20px 60px rgba(0,0,0,.18); max-height:80vh; display:flex; flex-direction:column; }
.sort-modal-title { font-weight:900; font-size:17px; margin-bottom:4px; }
.sort-modal-sub { font-weight:700; font-size:12px; color:var(--gray3); margin-bottom:16px; }
.sort-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
.sort-item { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--cream); border-radius:10px; border:1.5px solid var(--gray1); cursor:grab; user-select:none; transition:box-shadow .15s, border-color .15s; }
.sort-item:active { cursor:grabbing; }
.sort-item.dragging { opacity:.5; border-color:var(--accent-y); box-shadow:0 4px 16px rgba(0,0,0,.12); }
.sort-item.drag-over { border-color:var(--black); background:var(--white); }
.sort-handle { font-size:16px; color:var(--gray3); flex-shrink:0; cursor:grab; }
.sort-item-info { flex:1; min-width:0; }
.sort-item-name { font-weight:900; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sort-item-sub { font-weight:700; font-size:11px; color:var(--gray3); margin-top:2px; }
.sort-item-num { width:24px; height:24px; background:var(--black); color:var(--white); border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:11px; flex-shrink:0; }
.sort-move-btns { display:flex; flex-direction:column; gap:2px; }
.sort-move-btn { width:24px; height:20px; background:var(--gray1); border:none; border-radius:4px; cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center; transition:background .15s; }
.sort-move-btn:hover { background:var(--gray2); }
.sort-modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:16px; border-top:1.5px solid var(--gray1); }

/* ── 移动端侧边栏开关 ── */
.menu-btn{width:36px;height:36px;border-radius:10px;background:var(--gray1);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-right:4px;}
.menu-btn:hover{background:var(--gray2);}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:190;display:none;}
.sidebar-backdrop.show{display:block;}
@media(max-width:1023px){
  .sidebar{transform:translateX(-100%);z-index:200;}
  .sidebar.open{transform:none;}
  .main{margin-left:0!important;}
  .topbar{padding:0 16px;}
  .menu-btn{display:flex;}
}
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main" id="main">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" onclick="openSidebar()">&#9776;</button>
    <span class="topbar-title">款式管理</span>
    <div class="topbar-right">
      <span class="topbar-time" id="topbarTime"></span>
      <button class="btn btn-ghost btn-sm" onclick="loadModels()">↻ 刷新</button>
    </div>
  </header>
  <div class="content">
    <div class="toolbar">
      <div style="font-weight:700;font-size:13px;color:var(--gray3);">
        共 <strong id="modelCount" style="color:var(--black);">—</strong> 个款式
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="openSortModal('model')">↕ 调整款式顺序</button>
        <button class="btn btn-black" onclick="openModelModal(null)">＋ 新增款式</button>
      </div>
    </div>
    <div class="models-grid" id="modelsGrid">
      <div class="loading-state">正在加载…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Modal：新增/编辑款式 -->
<div class="modal-overlay" id="modelModal">
  <div class="modal">
    <div class="modal-title" id="modelModalTitle">新增款式</div>
    <div class="modal-sub">款式基本信息，SKU规格在款式创建后单独添加</div>
    <div class="form-field">
      <label class="form-label">款式名称 <em>必填</em></label>

<script>
const API = window.MOWO_API_BASE || ''
const ROLE_LABEL = {0:'用户',1:'生产端',2:'管理员',3:'超级管理员'}

// localStorage key
const LS_SIZES     = 'mowo_sku_sizes'
const LS_MATERIALS = 'mowo_sku_materials'
const LS_FRAMES    = 'mowo_sku_frames'
const LS_COLORS    = 'mowo_sku_colors'

// 预设默认值
const DEFAULT_SIZES     = ['5x5cm', '8x8cm']
const DEFAULT_MATERIALS = ['椴木板', '亚克力']
const DEFAULT_FRAMES    = [6, 8, 10, 12, 16, 18, 24, 30, 36]
const DEFAULT_COLORS    = [
  { name:'原色', hex:'#D4B896' },
  { name:'深棕', hex:'#6B3A2A' },
  { name:'浅灰', hex:'#C8C8C8' },
  { name:'透明', hex:'#F0F0F0' },
]

let _token            = localStorage.getItem('mowo_token') || ''
window.addEventListener('mowoTokenRefreshed', () => { _token = localStorage.getItem('mowo_token') || ''; });
let _models           = []
let _inventories      = {}
let _editModelId      = null
let _curModelId       = null
let _curSkuId         = null
let _curDeleteModelId = null

// 当前选中的SKU字段值
let _selSize     = ''
let _selMaterial = ''
let _selFrame    = ''
let _selColor    = null  // { name, hex }

// 删除选项相关
let _deleteOptionCb = null

// ══ 初始化 ══
window.addEventListener('DOMContentLoaded', async () => {
  setInterval(() => {
    document.getElementById('topbarTime').textContent =
      new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
  }, 1000)

  if (!_token) { location.href = 'index.html'; return }
  try {
    const res  = await fetch(`${API}/api/v1/account/me`, {
      credentials: 'include',
      headers:{Authorization:`Bearer ${_token}`}
    })
    const json = await res.json()
    if (!json.success || !['OWNER','CUSTOMER_SERVICE'].includes(json.data.staffRole)) { location.href = 'index.html'; return }
    const u = json.data
    document.getElementById('sidebarName').textContent   = u.profile?.nickname || u.maskedPhone || '管理员'
    document.getElementById('sidebarRole').textContent   = u.staffRole === 'OWNER' ? '负责人' : '运营客服'
    document.getElementById('sidebarAvatar').textContent = (u.profile?.nickname || u.maskedPhone || '管')[0].toUpperCase()
  } catch { location.href = 'index.html'; return }

  // 点击空白关闭下拉
  document.addEventListener('click', () => {
    document.querySelectorAll('.smart-select-dropdown.open').forEach(d => {
      d.classList.remove('open')
      d.previousElementSibling?.classList.remove('open')
    })
  })

  await loadModels()
})

// ══ localStorage 工具 ══
function lsGet(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback } catch { return fallback }
}
function lsSet(key, val) { localStorage.setItem(key, JSON.stringify(val)) }

function getSizes()     { return lsGet(LS_SIZES, [...DEFAULT_SIZES]) }
function getMaterials() { return lsGet(LS_MATERIALS, [...DEFAULT_MATERIALS]) }
function getFrames()    { return lsGet(LS_FRAMES, [...DEFAULT_FRAMES]) }
function getColors()    { return lsGet(LS_COLORS, [...DEFAULT_COLORS]) }

// ══ 智能下拉组件 ══
// type: 'text' | 'color'
function buildSmartSelect(containerId, options, selected, type, onSelect) {
  const wrap = document.getElementById(containerId)
  wrap.innerHTML = ''

  const btn = document.createElement('button')
  btn.type = 'button'
  btn.className = 'smart-select-btn'

  const btnText = document.createElement('span')
  btnText.className = 'smart-select-btn-text'

  if (type === 'color' && selected) {
    btnText.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px;">
      <span style="width:14px;height:14px;border-radius:50%;background:${safeColor(selected.hex)};border:1.5px solid rgba(0,0,0,.1);display:inline-block;"></span>
      ${esc(selected.name)}
    </span>`
  } else {
    btnText.textContent = selected || '请选择'
  }

  const arrow = document.createElement('span')
  arrow.className = 'smart-select-arrow'
  arrow.textContent = '▾'
  btn.appendChild(btnText)
  btn.appendChild(arrow)

  const dropdown = document.createElement('div')
  dropdown.className = 'smart-select-dropdown'

  // 渲染选项
  function renderOptions() {
    dropdown.innerHTML = ''
    options.forEach((opt, idx) => {
      const isCustom = type === 'text'
        ? !DEFAULT_SIZES.includes(opt) && !DEFAULT_MATERIALS.includes(opt) && !DEFAULT_FRAMES.includes(String(opt))
        : !DEFAULT_COLORS.find(c => c.name === opt.name)

      const item = document.createElement('div')
      item.className = 'smart-select-option'
      const isSelected = type === 'color'
        ? selected && selected.name === opt.name
        : String(selected) === String(opt)
      if (isSelected) item.classList.add('selected')

      const left = document.createElement('div')
      left.className = 'smart-select-option-left'

      if (type === 'color') {
        left.innerHTML = `
          <div class="color-option-swatch" style="background:${safeColor(opt.hex)};"></div>
          <span>${esc(opt.name)}</span>
          <span style="font-size:11px;color:var(--gray3);">${opt.hex}</span>`
      } else {
        left.textContent = String(opt)
      }

      item.appendChild(left)

      // 只有手动添加的才能删除
      if (isCustom) {
        const del = document.createElement('button')
        del.className = 'smart-select-del'
        del.textContent = '✕'
        del.onclick = (e) => {
          e.stopPropagation()
          const label = type === 'color' ? opt.name : String(opt)
          openDeleteOptionModal(label, () => {
            options.splice(idx, 1)
            saveOptions()
            if (type === 'color' && selected?.name === opt.name) { onSelect(null); selected = null }
            else if (String(selected) === String(opt)) { onSelect(''); selected = '' }
            buildSmartSelect(containerId, options, selected, type, onSelect)
          })
        }
        item.appendChild(del)
      }

      item.addEventListener('click', (e) => {
        if (e.target.closest('.smart-select-del')) return
        onSelect(type === 'color' ? opt : String(opt))
        selected = type === 'color' ? opt : String(opt)
        closeDropdown()
        buildSmartSelect(containerId, options, selected, type, onSelect)
      })

      dropdown.appendChild(item)
    })

    // ── 先创建新增行，再设置 addRow.onclick（避免变量提升问题）

    // 文字新增行
    let newTextRow = null
    if (type !== 'color') {
      newTextRow = document.createElement('div')
      newTextRow.className = 'smart-select-new-row'
      const newInput = document.createElement('input')
      newInput.className = 'smart-select-new-input'
      newInput.placeholder = '输入新选项后回车确认'

      function confirmNewText() {
        const val = newInput.value.trim()
        if (!val) { showToast('请输入内容'); return }
        if (options.map(String).includes(String(val))) { showToast('该选项已存在'); return }
        options.push(val)
        saveOptions()
        onSelect(String(val))
        selected = String(val)
        newInput.value = ''
        closeDropdown()
        buildSmartSelect(containerId, options, selected, type, onSelect)
      }

      newInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmNewText() })

      const newActions = document.createElement('div')
      newActions.className = 'smart-select-new-actions'
      const cancelBtn = document.createElement('button')
      cancelBtn.className = 'btn btn-ghost btn-sm'
      cancelBtn.textContent = '取消'
      cancelBtn.type = 'button'
      cancelBtn.onclick = () => { newTextRow.classList.remove('open'); newInput.value = '' }
      const confirmBtn = document.createElement('button')
      confirmBtn.className = 'btn btn-black btn-sm'
      confirmBtn.textContent = '确认添加'
      confirmBtn.type = 'button'
      confirmBtn.onclick = confirmNewText
      newActions.appendChild(cancelBtn)
      newActions.appendChild(confirmBtn)
      newTextRow.appendChild(newInput)
      newTextRow.appendChild(newActions)
    }

    // 颜色新增行
    let newColorRow = null
    if (type === 'color') {
      newColorRow = document.createElement('div')
      newColorRow.className = 'color-new-row'

      const nameInput = document.createElement('input')
      nameInput.className = 'smart-select-new-input'
      nameInput.placeholder = '颜色名称，如：深棕'

      const colorInputWrap = document.createElement('div')
      colorInputWrap.className = 'color-new-inputs'
      const hexPicker = document.createElement('input')
      hexPicker.type = 'color'
      hexPicker.className = 'color-hex-picker'
      hexPicker.value = '#D4B896'

      const previewRow = document.createElement('div')
      previewRow.className = 'color-preview-row'
      const previewDot = document.createElement('div')
      previewDot.className = 'color-preview-dot'
      previewDot.style.background = '#D4B896'
      const previewLabel = document.createElement('span')
      previewLabel.style.cssText = 'font-weight:800;font-size:13px;'
      previewLabel.textContent = '预览颜色'
      const previewHex = document.createElement('span')
      previewHex.style.cssText = 'font-weight:700;font-size:12px;color:var(--gray3);'
      previewHex.textContent = '#D4B896'

      hexPicker.oninput = () => { previewDot.style.background = hexPicker.value; previewHex.textContent = hexPicker.value }
      nameInput.oninput = () => { previewLabel.textContent = nameInput.value || '预览颜色' }

      previewRow.appendChild(previewDot)
      previewRow.appendChild(previewLabel)
      previewRow.appendChild(previewHex)
      colorInputWrap.appendChild(nameInput)
      colorInputWrap.appendChild(hexPicker)

      const colorActions = document.createElement('div')
      colorActions.className = 'smart-select-new-actions'
      const cancelColorBtn = document.createElement('button')
      cancelColorBtn.className = 'btn btn-ghost btn-sm'
      cancelColorBtn.type = 'button'
      cancelColorBtn.textContent = '取消'
      cancelColorBtn.onclick = () => { newColorRow.classList.remove('open') }
      const confirmColorBtn = document.createElement('button')
      confirmColorBtn.className = 'btn btn-black btn-sm'
      confirmColorBtn.type = 'button'
      confirmColorBtn.textContent = '确认添加'
      confirmColorBtn.onclick = () => {
        const name = nameInput.value.trim()
        const hex  = hexPicker.value
        if (!name) { showToast('请填写颜色名称'); return }
        if (options.find(c => c.name === name)) { showToast('该颜色名称已存在'); return }
        const newColor = { name, hex }
        options.push(newColor)
        saveOptions()
        onSelect(newColor)
        selected = newColor
        nameInput.value = ''
        closeDropdown()
        buildSmartSelect(containerId, options, selected, type, onSelect)
      }
      colorActions.appendChild(cancelColorBtn)
      colorActions.appendChild(confirmColorBtn)
      newColorRow.appendChild(colorInputWrap)
      newColorRow.appendChild(previewRow)
      newColorRow.appendChild(colorActions)
    }

    // ── 新增按钮（现在 newTextRow / newColorRow 已经存在了）
    const addRow = document.createElement('div')
    addRow.className = 'smart-select-add'

    if (type === 'color') {
      addRow.textContent = '＋ 新增颜色'
      addRow.onclick = (e) => {
        e.stopPropagation()
        newColorRow.classList.toggle('open')
      }
    } else {
      addRow.textContent = '＋ 手动输入新选项'
      addRow.onclick = (e) => {
        e.stopPropagation()
        newTextRow.classList.toggle('open')
        if (newTextRow.classList.contains('open')) newTextRow.querySelector('input').focus()
      }
    }

    dropdown.appendChild(addRow)
    if (newTextRow)  dropdown.appendChild(newTextRow)
    if (newColorRow) dropdown.appendChild(newColorRow)
  }

  function saveOptions() {
    if (containerId === 'sizeSelectWrap')     lsSet(LS_SIZES, options)
    if (containerId === 'materialSelectWrap') lsSet(LS_MATERIALS, options)
    if (containerId === 'frameSelectWrap')    lsSet(LS_FRAMES, options)
    if (containerId === 'colorSelectWrap')    lsSet(LS_COLORS, options)
  }

  function closeDropdown() {
    dropdown.classList.remove('open')
    btn.classList.remove('open')
  }

  // 下拉框内所有点击阻止冒泡，防止触发 document 的关闭逻辑
  dropdown.addEventListener('click', (e) => { e.stopPropagation() })

  btn.addEventListener('click', (e) => {
    e.stopPropagation()
    const isOpen = dropdown.classList.contains('open')
    document.querySelectorAll('.smart-select-dropdown.open').forEach(d => {
      d.classList.remove('open')
      d.previousElementSibling?.classList.remove('open')
    })
    if (!isOpen) {
      dropdown.classList.add('open')
      btn.classList.add('open')
    }
  })

  renderOptions()
  wrap.appendChild(btn)
  wrap.appendChild(dropdown)
}

// ══ 加载款式 ══
async function loadModels() {
  // 记录当前展开的卡片
  const openCards = new Set()
  document.querySelectorAll('.model-card-body.open').forEach(b => {
    openCards.add(b.id.replace('body-', ''))
  })

  document.getElementById('modelsGrid').innerHTML = '<div class="loading-state">正在加载…</div>'
  try {
    const res  = await fetch(`${API}/api/machine-models/admin/all`, {
      headers: { Authorization:`Bearer ${_token}` }
    })
    const json = await res.json()
    if (!json.success) throw new Error(json.message)

    const models = json.data
    await Promise.all(models.map(async m => {
      try {
        const r = await fetch(`${API}/api/machine-models/admin/${m.id}/skus`, {
          headers: { Authorization:`Bearer ${_token}` }
        })
        const j = await r.json()
        m.skus = j.success ? j.data : []
      } catch { m.skus = [] }
    }))

    try {
      const ir = await fetch(`${API}/api/inventory`, { headers:{Authorization:`Bearer ${_token}`} })
      const ij = await ir.json()
      if (ij.success) _inventories = Object.fromEntries(ij.data.map(i => [i.skuId, i]))
    } catch {}

    _models = models
    document.getElementById('modelCount').textContent = models.length
    renderModels(models)

    // 恢复展开状态
    openCards.forEach(id => {
      const body = document.getElementById(`body-${id}`)
      if (body) body.classList.add('open')
    })

    // 加载所有SKU的展示图片
    const allSkus = models.flatMap(m => m.skus || []).filter(s => s.previewImage)
    if (allSkus.length) loadSkuImages(allSkus)
  } catch {
    document.getElementById('modelsGrid').innerHTML = '<div class="loading-state">加载失败，请刷新重试</div>'
  }
}

// ══ 只更新单个SKU行（不重新渲染整个列表）══
async function toggleSkuActive(skuId, current) {
  try {
    const res  = await fetch(`${API}/api/machine-models/skus/${skuId}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json', Authorization:`Bearer ${_token}`},
      body: JSON.stringify({ isActive: !current })
    })
    const json = await res.json()
    if (!json.success) { showToast('操作失败：' + json.message); return }

    // 只更新这一行的UI，不刷新整个列表
    const newActive = !current
    const row = document.getElementById(`sku-row-${skuId}`)
    if (row) {
      row.classList.toggle('sku-inactive', !newActive)
      const toggleBtn = row.querySelector('.toggle-btn')
      if (toggleBtn) {
        toggleBtn.className = `toggle-btn ${newActive ? 'on' : 'off'}`
        toggleBtn.textContent = newActive ? '● 已上架' : '○ 已下架'
        toggleBtn.onclick = () => toggleSkuActive(skuId, newActive)
      }
    }

    // 同步更新内存数据
    _models.forEach(m => {
      const sku = m.skus?.find(s => s.id === skuId)
      if (sku) sku.isActive = newActive
    })

    showToast(newActive ? '✓ 该SKU已上架' : '✓ 该SKU已下架')
  } catch { showToast('网络错误') }
}

// ══ 渲染款式列表 ══
function renderModels(models) {
  const grid = document.getElementById('modelsGrid')
  if (!models.length) {
    grid.innerHTML = '<div class="loading-state">暂无款式，点击右上角新增</div>'
    return
  }
  grid.innerHTML = models.map(m => {
    const preview = m.previewImage
      ? `<div class="model-preview">${safeImageUrl(m.previewImage) ? `<img src="${esc(safeImageUrl(m.previewImage))}" alt="">` : '📦'}</div>`
      : `<div class="model-preview">📦</div>`

    const modelToggle = m.isActive
      ? `<button class="model-status-tag on" onclick="event.stopPropagation();toggleModelActive('${m.id}',true)">● 已上架</button>`
      : `<button class="model-status-tag off" onclick="event.stopPropagation();toggleModelActive('${m.id}',false)">○ 已下架</button>`

    return `
    <div class="model-card ${m.isActive ? '':'inactive-card'}" id="card-${m.id}">
      <div class="model-card-header" onclick="toggleCard('${m.id}')">
        <div class="model-header-left">
          <div class="model-status-dot ${m.isActive ? 'active':'inactive'}"></div>
          ${preview}
          <div style="min-width:0;">
            <div class="model-name">${esc(m.name)}</div>
            <div class="model-desc">${esc(m.description || '暂无介绍')}</div>
          </div>
        </div>
        <div class="model-header-right">
          <span class="sku-count-badge">${m.skus.length} 个SKU</span>
          <span id="price-tag-${m.id}">${(()=>{
            const prices = m.skus.filter(s=>s.isActive && s.price).map(s=>Number(s.price));
            if (!prices.length) return '<span style="font-weight:800;font-size:12px;color:var(--gray2);padding:0 4px;">暂无定价</span>';
            const min = Math.min(...prices), max = Math.max(...prices);
            const label = min === max ? `¥${min}` : `¥${min} ~ ¥${max}`;
            return `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--accent-y);color:var(--black);font-weight:900;font-size:13px;letter-spacing:.01em;padding:5px 12px;border-radius:20px;box-shadow:0 2px 0 #C8BB00;">${label}</span>`;
          })()}</span>

function renderSkuTable(m) {
  if (!m.skus.length) return `<div class="sku-empty">暂无SKU，点击下方按钮添加第一个规格</div>`
  const rows = m.skus.map(s => {
    const inv       = _inventories[s.id]
    const available = inv ? inv.currentStock - inv.reservedStock : null
    let stockHtml   = `<span style="color:var(--gray3);font-weight:700;font-size:12px;">—</span>`
    if (inv) {
      const cls   = inv.isOut ? 'stock-out' : inv.isLow ? 'stock-low' : 'stock-normal'
      const label = inv.isOut ? '缺货' : `${available}`
      stockHtml   = `<span class="stock-badge ${cls}">${label}</span>`
    }
    const skuToggle = s.isActive
      ? `<button class="toggle-btn on" onclick="toggleSkuActive('${s.id}',true)">● 已上架</button>`
      : `<button class="toggle-btn off" onclick="toggleSkuActive('${s.id}',false)">○ 已下架</button>`

    const imgHtml = s.previewImage
      ? `<div class="sku-img-box" onclick="triggerSkuImgUpload('${s.id}')" title="点击更换图片"><img id="sku-img-${s.id}" src="" alt=""></div>`
      : `<div class="sku-img-box" onclick="triggerSkuImgUpload('${s.id}')" title="点击上传图片">＋</div>`

    return `
    <div class="sku-row ${s.isActive ? '':'sku-inactive'}" id="sku-row-${s.id}">
      <div>${imgHtml}<input class="sku-img-input" type="file" accept="image/*" id="sku-file-${s.id}" onchange="onSkuImageSelected('${s.id}', this)"></div>
      <div style="font-weight:800;">${esc(s.size)}</div>
      <div>${esc(s.material)}</div>
      <div style="font-weight:800;">${s.frameCount} 帧</div>
      <div><div class="color-swatch" style="background:${safeColor(s.colorHex)};" title="${esc(s.colorName)}"></div></div>
      <div>
        <div style="font-weight:800;">${esc(s.colorName)}</div>
        <div style="color:var(--gray3);font-size:11px;margin-top:1px;">${esc(s.colorHex)}</div>
      </div>
      <div>
        <div class="price-cell" id="price-cell-${s.id}" onclick="startEditPrice('${s.id}',${Number(s.price||0)})">
          <span class="price-display">¥${Number(s.price||0).toFixed(0)}</span>
          <span class="price-edit-icon">✏</span>
        </div>
      </div>
      <div>${stockHtml}</div>
      <div>${skuToggle}</div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <button class="btn btn-red btn-sm"
          onclick="openDeleteSkuModal('${s.id}',${jsArg(`${s.size}·${s.material}·${s.frameCount}帧·${s.colorName}`)})">
          删除
        </button>
        <button class="btn btn-ghost btn-sm"
          onclick="openExampleMediaModal('${s.id}',${jsArg(`${s.size}·${s.material}·${s.frameCount}帧`)})">
          示例图
        </button>
        <button class="btn btn-ghost btn-sm"
          onclick="openBomModal('${s.id}',${jsArg(`${m.name} · ${s.size} · ${s.frameCount}帧`)})">
          材料清单
        </button>
      </div>
    </div>`
  }).join('')

  return `
  <div class="sku-table-wrap">
    <div class="sku-table-header">
      <div>图片</div><div>尺寸</div><div>材质</div><div>帧数</div><div></div>
      <div>颜色</div><div>价格</div><div>库存</div><div>上下架</div><div>操作</div>
    </div>${rows}
  </div>`
}

async function toggleModelActive(modelId, current) {
  try {
    const res  = await fetch(`${API}/api/machine-models/${modelId}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json', Authorization:`Bearer ${_token}`},
      body: JSON.stringify({ isActive: !current })
    })
    const json = await res.json()
    if (json.success) {
      showToast(current ? '✓ 款式已下架' : '✓ 款式已上架')
      await loadModels()
    } else showToast('操作失败：' + json.message)
  } catch { showToast('网络错误') }

function openModelModal(modelId) {
  _editModelId = modelId
  document.getElementById('modelModalTitle').textContent = modelId ? '编辑款式' : '新增款式'
  if (modelId) {
    const m = _models.find(x => x.id === modelId)
    document.getElementById('mName').value         = m.name
    document.getElementById('mDescription').value  = m.description || ''
    document.getElementById('mPreviewImage').value = m.previewImage || ''
    document.getElementById('mVideoUrl').value     = m.videoUrl || ''
    document.getElementById('mModelType').value    = m.modelType || 'single'
  } else {
    document.getElementById('mName').value         = ''
    document.getElementById('mDescription').value  = ''
    document.getElementById('mPreviewImage').value = ''
    document.getElementById('mVideoUrl').value     = ''
    document.getElementById('mModelType').value    = 'single'
  }
  document.getElementById('modelModal').classList.add('show')
}
function closeModelModal() { document.getElementById('modelModal').classList.remove('show') }

async function submitModel() {
  const name         = document.getElementById('mName').value.trim()
  const description  = document.getElementById('mDescription').value.trim()
  const previewImage = document.getElementById('mPreviewImage').value.trim()
  const videoUrl     = document.getElementById('mVideoUrl').value.trim()
  const modelType    = document.getElementById('mModelType').value
  if (!name)        { showToast('请填写款式名称'); return }
  if (!description) { showToast('请填写款式介绍'); return }
  try {
    let res
    if (_editModelId) {
      res = await fetch(`${API}/api/machine-models/${_editModelId}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json', Authorization:`Bearer ${_token}`},
        body: JSON.stringify({ name, description, previewImage: previewImage || null, videoUrl: videoUrl || null, modelType })
      })
    } else {
      res = await fetch(`${API}/api/machine-models`, {
        method: 'POST',
        headers: {'Content-Type':'application/json', Authorization:`Bearer ${_token}`},
        body: JSON.stringify({ name, description, previewImage: previewImage || null, videoUrl: videoUrl || null, modelType })
      })
    }
    const json = await res.json()
    if (json.success) {
      showToast(_editModelId ? '✓ 款式已更新' : '✓ 款式已创建')
      closeModelModal()
      await loadModels()
    } else showToast('操作失败：' + json.message)
  } catch { showToast('网络错误') }
}

// ══ 排序 ══
let _sortMode    = ''   // 'model' | 'sku'
let _sortModelId = ''
let _sortItems   = []   // [{ id, name, sub }]
let _dragSrcIdx  = null

function openSortModal(mode, modelId = '', modelName = '') {
  _sortMode    = mode
  _sortModelId = modelId

  if (mode === 'model') {
    document.getElementById('sortModalTitle').textContent = '调整款式顺序'
    document.getElementById('sortModalSub').textContent   = '拖拽或点击箭头调整，顺序决定生产导出优先级'
    _sortItems = _models.map(m => ({ id: m.id, name: m.name, sub: `${m.skus?.length || 0} 个SKU` }))
  } else {
    document.getElementById('sortModalTitle').textContent = `调整 SKU 顺序 — ${modelName}`
    document.getElementById('sortModalSub').textContent   = '顺序决定生产时的导出优先级'
    const m = _models.find(x => x.id === modelId)
    _sortItems = (m?.skus || []).map(s => ({
      id: s.id,
      name: `${s.size} · ${s.frameCount}帧 · ${s.material}`,
      sub:  `${s.colorName} ${s.colorHex}`
    }))
  }

  renderSortList()
  document.getElementById('sortModal').classList.add('show')
}

function closeSortModal() {
  document.getElementById('sortModal').classList.remove('show')
}

function renderSortList() {
  const list = document.getElementById('sortList')
  list.innerHTML = _sortItems.map((item, i) => `
    <div class="sort-item" id="sort-item-${i}"
      draggable="true"
      ondragstart="onDragStart(${i})"
      ondragover="onDragOver(event,${i})"
      ondrop="onDrop(event,${i})"
      ondragend="onDragEnd()">
      <span class="sort-handle">⠿</span>
      <span class="sort-item-num">${i + 1}</span>
      <div class="sort-item-info">
        <div class="sort-item-name">${esc(item.name)}</div>
        <div class="sort-item-sub">${esc(item.sub)}</div>
      </div>
      <div class="sort-move-btns">
        <button class="sort-move-btn" onclick="moveItem(${i},-1)" ${i === 0 ? 'disabled style="opacity:.3"' : ''}>▲</button>
        <button class="sort-move-btn" onclick="moveItem(${i},1)" ${i === _sortItems.length - 1 ? 'disabled style="opacity:.3"' : ''}>▼</button>
      </div>
    </div>`).join('')
}

function moveItem(idx, dir) {
  const newIdx = idx + dir
  if (newIdx < 0 || newIdx >= _sortItems.length) return
  const tmp = _sortItems[idx]
  _sortItems[idx]    = _sortItems[newIdx]
  _sortItems[newIdx] = tmp
  renderSortList()
}

// 拖拽
function onDragStart(idx) { _dragSrcIdx = idx; setTimeout(() => document.getElementById(`sort-item-${idx}`)?.classList.add('dragging'), 0) }
function onDragOver(e, idx) { e.preventDefault(); document.querySelectorAll('.sort-item').forEach(el => el.classList.remove('drag-over')); document.getElementById(`sort-item-${idx}`)?.classList.add('drag-over') }
function onDrop(e, idx) {
  e.preventDefault()
  if (_dragSrcIdx === null || _dragSrcIdx === idx) return
  const tmp = _sortItems[_dragSrcIdx]
  _sortItems.splice(_dragSrcIdx, 1)
  _sortItems.splice(idx, 0, tmp)
  _dragSrcIdx = null
  renderSortList()
}
function onDragEnd() { _dragSrcIdx = null; document.querySelectorAll('.sort-item').forEach(el => el.classList.remove('dragging', 'drag-over')) }

async function submitSort() {
  const ids = _sortItems.map(item => item.id)
  try {
    let url, body
    if (_sortMode === 'model') {
      url  = `${API}/api/machine-models/reorder`
      body = { modelIds: ids }
    } else {
      url  = `${API}/api/machine-models/${_sortModelId}/skus/reorder`
      body = { skuIds: ids }
    }
    const res  = await fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
      body: JSON.stringify(body)
    })
    const json = await res.json()
    if (json.success) {
      showToast('✓ 顺序已保存')
      closeSortModal()
      await loadModels()
    } else {
      showToast('保存失败：' + json.message)
    }
  } catch(e) { showToast('网络错误') }
}

// ══ Toast ══
let _toastTimer
function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  clearTimeout(_toastTimer)
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2800)
}

// ══ SKU 价格行内编辑 ══

function startEditPrice(skuId, currentPrice) {
  const cell = document.getElementById(`price-cell-${skuId}`)
  if (!cell) return

  // 渲染成输入状态
  cell.innerHTML = `
    <div class="price-input-wrap" style="position:relative;">
      <span class="price-inline-prefix">¥</span>
      <input class="price-inline-input" id="price-input-${skuId}"
        type="number" min="0" step="1" value="${currentPrice}"
        onclick="event.stopPropagation()"
        onkeydown="if(event.key==='Enter')submitPriceEdit('${skuId}');if(event.key==='Escape')cancelPriceEdit('${skuId}',${currentPrice})">
      <button class="price-confirm-btn" onclick="event.stopPropagation();submitPriceEdit('${skuId}')" title="确认">✓</button>
      <button class="price-cancel-btn" onclick="event.stopPropagation();cancelPriceEdit('${skuId}',${currentPrice})" title="取消">✕</button>
    </div>`

  // 聚焦并全选
  const input = document.getElementById(`price-input-${skuId}`)
  if (input) { input.focus(); input.select() }
}

function cancelPriceEdit(skuId, price) {
  const cell = document.getElementById(`price-cell-${skuId}`)
  if (cell) {
    cell.innerHTML = `<span class="price-display">¥${Number(price).toFixed(0)}</span><span class="price-edit-icon">✏</span>`
    cell.onclick = () => startEditPrice(skuId, price)
  }
}

async function submitPriceEdit(skuId) {
  const input = document.getElementById(`price-input-${skuId}`)
  if (!input) return
  const newPrice = Number(input.value)
  if (isNaN(newPrice) || newPrice < 0) { showToast('请输入有效价格'); return }

  try {
    const res  = await fetch(`${API}/api/machine-models/skus/${skuId}/price`, {
      method:  'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
      body:    JSON.stringify({ price: newPrice })
    })
    const json = await res.json()
    if (!json.success) { showToast('更新失败：' + json.message); return }

    // 更新单元格显示
    const cell = document.getElementById(`price-cell-${skuId}`)
    if (cell) {
      cell.innerHTML = `<span class="price-display">¥${newPrice}</span><span class="price-edit-icon">✏</span>`
      cell.onclick = () => startEditPrice(skuId, newPrice)
    }

    // 同步内存数据
    _models.forEach(m => {
      const sku = m.skus?.find(s => s.id === skuId)
      if (sku) sku.price = newPrice
    })

    // 同步刷新款式头部价格区间（不重新渲染整个列表）
    refreshModelPriceTag(skuId)

    showToast(`✓ 价格已更新为 ¥${newPrice}`)
  } catch { showToast('网络错误') }
}

// 只刷新对应款式头部的价格区间标签
function refreshModelPriceTag(skuId) {
  const model = _models.find(m => m.skus?.some(s => s.id === skuId))
  if (!model) return
  const prices = model.skus.filter(s => s.isActive && s.price).map(s => Number(s.price))
  const tagEl  = document.getElementById(`price-tag-${model.id}`)
  if (!tagEl) return
  if (!prices.length) {
    tagEl.innerHTML = '<span style="font-weight:800;font-size:12px;color:var(--gray2);padding:0 4px;">暂无定价</span>'
    return
  }
  const min = Math.min(...prices), max = Math.max(...prices)
  const label = min === max ? `¥${min}` : `¥${min} ~ ¥${max}`
  tagEl.innerHTML = `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--accent-y);color:var(--black);font-weight:900;font-size:13px;letter-spacing:.01em;padding:5px 12px;border-radius:20px;box-shadow:0 2px 0 #C8BB00;">${label}</span>`
}

// ══ SKU 图片上传 ══

// 渲染完成后为有图片的SKU加载预签名URL
async function loadSkuImages(skus) {
  for (const s of skus) {
    if (!s.previewImage) continue
    try {
      // 通过 presign-image 接口获取读取URL（复用上传接口，传空filename）
      // 实际用 ossPresignGet，这里直接调后端返回previewUrl
      const res  = await fetch(`${API}/api/machine-models/skus/${s.id}/image-url`, {
        headers: { Authorization: `Bearer ${_token}` }
      })
      const json = await res.json()
      if (json.success && safeImageUrl(json.data.previewUrl)) {
        const img = document.getElementById(`sku-img-${s.id}`)
        if (img) img.src = safeImageUrl(json.data.previewUrl)
      }
    } catch {}
  }
}

// 触发文件选择
function triggerSkuImgUpload(skuId) {
  const input = document.getElementById(`sku-file-${skuId}`)
  if (input) input.click()
}

// 用户选择了文件
async function onSkuImageSelected(skuId, input) {
  const file = input.files?.[0]
  if (!file) return
  if (!file.type.startsWith('image/')) { showToast('请选择图片文件'); return }
  if (file.size > 5 * 1024 * 1024) { showToast('图片不能超过 5MB'); return }

  showToast('正在上传…')

  try {
    // 用 FormData 把文件发给后端，后端再上传到 OSS
    const form = new FormData()
    form.append('file', file, file.name)

    const res  = await fetch(`${API}/api/machine-models/skus/${skuId}/upload-image`, {
      method:  'POST',
      headers: { Authorization: `Bearer ${_token}` },  // 不设 Content-Type，让浏览器自动加 boundary
      body:    form
    })
    const json = await res.json()
    if (!json.success) { showToast('上传失败：' + json.message); return }

    // 立即更新页面图片预览
    const box = document.querySelector(`#sku-row-${skuId} .sku-img-box`)
    if (box && safeImageUrl(json.data.previewUrl)) {
      box.innerHTML = `<img src="${esc(safeImageUrl(json.data.previewUrl))}" alt="" style="width:100%;height:100%;object-fit:cover;">`
    }

    // 同步更新内存数据
    _models.forEach(m => {
      const sku = m.skus?.find(s => s.id === skuId)
      if (sku) sku.previewImage = json.data.previewImage
    })

    showToast('✓ 图片已上传')
  } catch(e) {
    showToast('网络错误，请重试')
  }

  input.value = ''
}

function safeColor(value) { return /^#[0-9a-fA-F]{6}$/.test(String(value || '')) ? value : '#C4C3BF' }
function safeImageUrl(value) { try { const url = new URL(String(value || '')); return ['http:', 'https:'].includes(url.protocol) ? url.href : '' } catch { return '' } }
function jsArg(value) { return JSON.stringify(String(value ?? '')).replace(/&/g,'\\u0026').replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/"/g,'&quot;') }
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

/* ════════════════════════════════════════
   示例物料管理
════════════════════════════════════════ */
let _exMediaSkuId  = null
let _exMediaSkuLabel = ''
let _exMediaList   = []  // objectKey 数组

async function openExampleMediaModal(skuId, label) {
  _exMediaSkuId    = skuId
  _exMediaSkuLabel = label

  document.getElementById('exMediaOverlay').style.display = 'flex'
  document.body.style.overflow = 'hidden'
  document.getElementById('exMediaTitle').textContent = `示例图 — ${label}`
  document.getElementById('exMediaGrid').innerHTML = '<p style="font-weight:700;font-size:13px;color:var(--gray3);padding:12px 0;">加载中…</p>'

  // 从已加载的 model 数据中读取 exampleMedia
  const sku = _models.flatMap(m => m.skus || []).find(s => s.id === skuId)
  let rawList = []
  try { rawList = sku?.exampleMedia ? JSON.parse(sku.exampleMedia) : [] } catch { rawList = [] }
  _exMediaList = rawList

  await renderExMediaGrid()
}

async function renderExMediaGrid() {
  const grid = document.getElementById('exMediaGrid')
  if (!_exMediaList.length) {
    grid.innerHTML = '<p style="font-weight:700;font-size:13px;color:var(--gray3);padding:12px 0;">暂无示例图，点击"上传示例图"添加</p>'
    return
  }
  grid.innerHTML = _exMediaList.map((key, i) => `
    <div style="position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1.5px solid var(--gray1);background:var(--cream);">
      <img id="exmedia-img-${i}" src="" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.opacity='.3'">
      <button onclick="deleteExMedia(${jsArg(key)})"
        style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:999px;
               width:24px;height:24px;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;">×</button>
    </div>`).join('')

  // 获取每张图的预签名 URL
  for (let i = 0; i < _exMediaList.length; i++) {
    try {
      const res  = await fetch(`${API}/api/machine-models/skus/${_exMediaSkuId}/example-media-url?key=${encodeURIComponent(_exMediaList[i])}`, {
        headers: { Authorization: `Bearer ${_token}` }
      })
      const json = await res.json()
      const url  = json.data?.url || json.url || ''
      const img  = document.getElementById(`exmedia-img-${i}`)
      if (img && safeImageUrl(url)) img.src = safeImageUrl(url)
    } catch {}
  }
}

function closeExMediaModal() {
  document.getElementById('exMediaOverlay').style.display = 'none'
  document.body.style.overflow = ''
  _exMediaSkuId = null
}

function triggerExMediaUpload() {
  if (_exMediaList.length >= 5) { showToast('示例图最多5张'); return }
  document.getElementById('exMediaFileInput').click()
}

async function onExMediaFileSelected(input) {
  if (!input.files || !input.files[0]) return
  if (!_exMediaSkuId) return
  const file = input.files[0]
  input.value = ''

  if (file.size > 5 * 1024 * 1024) { showToast('图片不超过 5MB'); return }

  const btn = document.getElementById('exMediaUploadBtn')
  btn.disabled = true
  btn.textContent = '上传中…'

  try {
    const fd = new FormData()
    fd.append('file', file)
    const res  = await fetch(`${API}/api/machine-models/skus/${_exMediaSkuId}/example-media`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${_token}` },
      body: fd
    })
    const json = await res.json()
    if (!json.success) throw new Error(json.message)
    _exMediaList = json.data.exampleMedia || []

    // 更新本地 sku 缓存
    const sku = _models.flatMap(m => m.skus || []).find(s => s.id === _exMediaSkuId)
    if (sku) sku.exampleMedia = JSON.stringify(_exMediaList)

    await renderExMediaGrid()
    showToast('示例图已上传')
  } catch(e) {
    showToast('上传失败: ' + e.message)
  } finally {
    btn.disabled = false
    btn.textContent = '上传示例图'
  }
}

async function deleteExMedia(objectKey) {
  if (!confirm('确认删除此示例图？')) return
  try {
    const res  = await fetch(`${API}/api/machine-models/skus/${_exMediaSkuId}/example-media`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
      body: JSON.stringify({ objectKey })
    })
    const json = await res.json()
    if (!json.success) throw new Error(json.message)
    _exMediaList = json.data.exampleMedia || []

    const sku = _models.flatMap(m => m.skus || []).find(s => s.id === _exMediaSkuId)
    if (sku) sku.exampleMedia = JSON.stringify(_exMediaList)

    await renderExMediaGrid()
    showToast('已删除')
  } catch(e) {
    showToast('删除失败: ' + e.message)
  }
}
</script>

<!-- SKU 材料清单：只选择库存页已建立的零件 -->
<div id="bomOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:2000;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--white);border-radius:16px;width:100%;max-width:680px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;">
    <div style="padding:20px 24px 16px;border-bottom:1px solid var(--gray1);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;">
      <div>
        <div id="bomTitle" style="font-weight:900;font-size:17px;">材料清单</div>
        <div id="bomSub" style="font-weight:700;font-size:12px;color:var(--gray3);margin-top:5px;"></div>
      </div>
      <button onclick="closeBomModal()" style="font-size:22px;color:var(--gray3);cursor:pointer;">×</button>
    </div>
    <div style="padding:16px 24px;overflow-y:auto;flex:1;">
      <div style="font-weight:700;font-size:12px;color:var(--gray3);line-height:1.6;margin-bottom:12px;">这里只能选择已经在“库存管理”建立的零件。每套用量表示入库一套材料包时要扣除多少。</div>
      <input id="bomSearch" class="form-input" placeholder="搜索零件名称、编码或规格" oninput="renderBomMaterials()" style="margin-bottom:12px;">
      <div id="bomMaterialList"><div class="loading-state">正在加载…</div></div>
    </div>
    <div style="padding:14px 24px 20px;border-top:1px solid var(--gray1);display:flex;justify-content:space-between;align-items:center;gap:12px;">
      <a href="admin-inventory.html" class="btn btn-ghost">去库存管理新增零件</a>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="closeBomModal()">取消</button>
        <button class="btn btn-black" id="bomSaveBtn" onclick="saveBom()">保存材料清单</button>
      </div>
    </div>
  </div>
</div>

<script>
let _bomSkuId = null
let _bomMaterials = []
let _bomSelected = new Map()

async function openBomModal(skuId, label) {
  _bomSkuId = skuId
  _bomSelected = new Map()
  document.getElementById('bomTitle').textContent = '材料清单'
  document.getElementById('bomSub').textContent = label
  document.getElementById('bomSearch').value = ''
  document.getElementById('bomMaterialList').innerHTML = '<div class="loading-state">正在加载…</div>'
  document.getElementById('bomOverlay').style.display = 'flex'
  try {
    const [materialsRes, bomRes] = await Promise.all([
      fetch(`${API}/api/materials`, { headers:{Authorization:`Bearer ${_token}`} }),
      fetch(`${API}/api/machine-models/skus/${skuId}/bom`, { headers:{Authorization:`Bearer ${_token}`} })
    ])
    const materialsJson = await materialsRes.json()
    const bomJson = await bomRes.json()
    if (!materialsJson.success) throw new Error(materialsJson.message)
    if (!bomJson.success) throw new Error(bomJson.message)
    _bomMaterials = materialsJson.data || []
    for (const row of bomJson.data.items || []) _bomSelected.set(row.materialId, row.qtyPerUnit)
    renderBomMaterials()
  } catch (error) {
    document.getElementById('bomMaterialList').innerHTML = `<div class="loading-state">加载失败：${esc(error.message)}</div>`
  }
}

function closeBomModal() {
  document.getElementById('bomOverlay').style.display = 'none'
  _bomSkuId = null
}

function renderBomMaterials() {
  const q = (document.getElementById('bomSearch')?.value || '').trim().toLowerCase()
  const typeLabel = { RAW:'散装/基础零件', PACKED:'已分装零件', CONSUMABLE:'直接耗材' }
  const rows = _bomMaterials.filter(item => [item.name,item.itemCode,item.specification].join(' ').toLowerCase().includes(q))
  const list = document.getElementById('bomMaterialList')
  if (!rows.length) {
    list.innerHTML = '<div class="loading-state">没有找到零件，请先到库存管理建立</div>'
    return
  }
  list.innerHTML = rows.map(item => {
    const checked = _bomSelected.has(item.id)
    const qty = _bomSelected.get(item.id) || 1
    return `<label style="display:grid;grid-template-columns:24px 1fr 132px;gap:12px;align-items:center;padding:12px;border:1px solid var(--gray1);border-radius:8px;margin-bottom:8px;cursor:pointer;">
      <input type="checkbox" ${checked?'checked':''} onchange="toggleBomMaterial('${item.id}',this.checked)">
      <span>
        <strong style="font-size:13px;">${esc(item.name)}</strong>
        <span style="display:block;font-size:11px;color:var(--gray3);margin-top:3px;">${esc(typeLabel[item.itemType]||item.itemType)}${item.specification?' · '+esc(item.specification):''}${item.itemCode?' · '+esc(item.itemCode):''} · 库存 ${item.currentStock}${esc(item.unit)}</span>
      </span>
      <span style="display:flex;align-items:center;gap:6px;">
        <input type="number" min="1" step="1" value="${qty}" ${checked?'':'disabled'} id="bomQty-${item.id}" class="form-input" style="height:36px;padding:0 8px;" onclick="event.stopPropagation()" onchange="setBomQty('${item.id}',this.value)">
        <span style="font-size:11px;color:var(--gray3);white-space:nowrap;">${esc(item.unit)}/套</span>
      </span>
    </label>`
  }).join('')
}

function toggleBomMaterial(id, checked) {
  if (checked) _bomSelected.set(id, Number(document.getElementById(`bomQty-${id}`)?.value || 1))
  else _bomSelected.delete(id)
  renderBomMaterials()
}

function setBomQty(id, value) {
  const qty = Number(value)
  if (_bomSelected.has(id) && Number.isInteger(qty) && qty > 0) _bomSelected.set(id, qty)
}

async function saveBom() {
  if (!_bomSkuId) return
  const items = [..._bomSelected.entries()].map(([materialId, qtyPerUnit]) => ({materialId, qtyPerUnit}))
  if (items.some(item => !Number.isInteger(item.qtyPerUnit) || item.qtyPerUnit <= 0)) return showToast('每套用量必须为正整数')
  const btn = document.getElementById('bomSaveBtn')
  btn.disabled = true
  try {
    const res = await fetch(`${API}/api/machine-models/skus/${_bomSkuId}/bom`, {
      method:'PUT', headers:{'Content-Type':'application/json',Authorization:`Bearer ${_token}`},
      body:JSON.stringify({items})
    })
    const json = await res.json()
    if (!json.success) throw new Error(json.message)
    showToast('材料清单已保存')
    closeBomModal()
  } catch (error) { showToast('保存失败：'+error.message) }
  finally { btn.disabled = false }
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
  document.body.style.overflow = '';
}
</script>
