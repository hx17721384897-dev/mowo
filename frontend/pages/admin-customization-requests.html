<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>定制处理 — 哞屋后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--white:#fff;--cream:#F5F3EF;--black:#111110;--gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;--yellow:#F5E642;--orange:#E8662A;--blue:#397EA5;--green:#4F9B59;--font:'Nunito','Noto Sans SC',sans-serif;--sidebar-w:220px;--sidebar-collapsed:60px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);background:var(--cream);color:var(--black);min-height:100vh}.main{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .3s}.main.expanded{margin-left:var(--sidebar-collapsed)}button,input,select{font-family:inherit}.topbar{height:60px;padding:0 30px;border-bottom:1px solid var(--gray1);background:rgba(245,243,239,.95);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}.topbar-title{font-weight:900;font-size:18px}.topbar-note{font-weight:700;font-size:11px;color:var(--gray3)}.content{padding:26px 30px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--gray1);margin-bottom:16px}.metric{padding:16px 18px;border-right:1px solid var(--gray1)}.metric:last-child{border:0}.metric strong{display:block;font-size:24px}.metric span{font-weight:800;font-size:10px;color:var(--gray3)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input,.select,.btn{height:38px;border:1px solid var(--gray2);background:#fff;padding:0 12px;font-weight:800;font-size:12px}.input{width:250px}.btn{cursor:pointer}.btn.dark{background:var(--black);color:#fff;border-color:var(--black)}.table{background:#fff;border:1px solid var(--gray1);overflow:auto}.row{display:grid;grid-template-columns:minmax(180px,1.2fr) 110px 120px minmax(150px,1fr) 150px 80px;gap:14px;align-items:center;min-width:900px;padding:14px 16px;border-bottom:1px solid var(--gray1)}.row:last-child{border:0}.head{background:#fafafa;color:var(--gray3);font-weight:900;font-size:10px;padding-top:11px;padding-bottom:11px}.number{font-weight:900;font-size:13px;letter-spacing:.03em}.sub{font-weight:700;font-size:11px;color:var(--gray3);margin-top:3px}.badge{display:inline-flex;padding:4px 8px;border-radius:5px;font-weight:900;font-size:10px}.mode-self{background:#FFF8D9;color:#776400}.mode-human{background:#FFF0E9;color:#9A421D}.s-SUBMITTED{background:#FFF3D8;color:#966000}.s-REVIEWING{background:#E8F3FA;color:#286A90}.s-NEEDS_SUPPLEMENT,.s-OPTIONS_READY{background:#FFF0E9;color:#9A421D}.s-CONFIRMED{background:#EAF6EC;color:#34753C}.s-UNAVAILABLE,.s-CLOSED{background:#eee;color:#666}.view{height:32px;border:1px solid var(--gray2);background:#fff;padding:0 10px;font-weight:900;font-size:11px;cursor:pointer}.empty{padding:60px;text-align:center;color:var(--gray3);font-weight:800}.modal-bg{position:fixed;inset:0;z-index:700;background:rgba(17,17,16,.55);display:none;align-items:center;justify-content:center;padding:20px}.modal-bg.open{display:flex}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff}.modal-head{padding:18px 22px;border-bottom:1px solid var(--gray1);display:flex;justify-content:space-between;gap:16px;position:sticky;top:0;background:#fff;z-index:2}.modal-title{font-weight:900;font-size:20px}.close{width:34px;height:34px;border:0;border-radius:50%;background:var(--gray1);font-size:18px;cursor:pointer}.modal-body{padding:20px 22px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.label{font-weight:800;font-size:9px;letter-spacing:.08em;color:var(--gray3);margin-bottom:4px}.value{font-weight:800;font-size:13px;line-height:1.5}.section-title{font-weight:900;font-size:14px;margin:22px 0 10px}.note-box{padding:13px 14px;background:var(--cream);font-weight:700;font-size:12px;line-height:1.7;white-space:pre-wrap}.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.file{border:1px solid var(--gray1);padding:10px;min-width:0}.file-media{width:100%;aspect-ratio:4/3;background:var(--cream);object-fit:contain;display:block}.file-name{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}.file a{display:inline-block;font-weight:800;font-size:10px;color:var(--black);margin-top:5px}.timeline{border-left:2px solid var(--gray1);padding-left:16px;margin-left:5px}.event{padding:0 0 14px;position:relative}.event::before{content:'';position:absolute;left:-22px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--yellow)}.event strong{font-size:12px}.event p{font-size:11px;color:var(--gray3);margin-top:3px}.menu-btn{display:none;width:36px;height:36px;border:0;background:var(--gray1)}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:190;display:none}.sidebar-backdrop.show{display:block}@media(max-width:1023px){.main{margin-left:0!important}.topbar{padding:0 16px}.content{padding:16px}.menu-btn{display:block}.sidebar{transform:translateX(-100%);z-index:200}.sidebar.open{transform:none}.metrics{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr 1fr}.files{grid-template-columns:1fr}}
</style>
<style>
.row{grid-template-columns:minmax(180px,1.2fr) 110px 120px minmax(150px,1fr) 150px 150px;min-width:980px}
.view.primary{background:var(--black);border-color:var(--black);color:#fff}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.assignee{margin-top:5px;font-size:10px;font-weight:800;color:var(--blue)}
.s-FRAME_ACCEPTED,.s-CONFIRMED{background:#EAF6EC;color:#34753C}.s-STYLE_SELECTED{background:#E8F3FA;color:#286A90}
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div><aside class="sidebar" id="sidebar"></aside>
<main class="main" id="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="menu-btn" onclick="openSidebar()">&#9776;</button><span class="topbar-title">定制处理</span></div><span class="topbar-note">处理人工筛帧任务并查看定制记录</span></header><div class="content">
  <section class="metrics"><div class="metric"><strong id="mSubmitted">0</strong><span>等待处理</span></div><div class="metric"><strong id="mReviewing">0</strong><span>正在处理</span></div><div class="metric"><strong id="mAction">0</strong><span>等待用户</span></div><div class="metric"><strong id="mDone">0</strong><span>已结束</span></div></section>
  <div class="toolbar"><select class="select" id="status" onchange="loadList()"><option value="">全部状态</option><option value="SUBMITTED">等待处理</option><option value="REVIEWING">正在处理</option><option value="NEEDS_SUPPLEMENT">需要补充</option><option value="OPTIONS_READY">待确认方案</option><option value="CONFIRMED">已确认</option><option value="UNAVAILABLE">无法制作</option></select><select class="select" id="mode" onchange="loadList()"><option value="">全部方式</option><option value="SELF">自己筛选</option><option value="HUMAN">人工筛选</option></select><input class="input" id="keyword" placeholder="定制编号或用户昵称"><button class="btn dark" onclick="loadList()">查询</button><button class="btn" onclick="loadAll()">&#8635; 刷新</button></div>
  <div class="table"><div class="row head"><div>定制编号 / 用户</div><div>处理方式</div><div>状态</div><div>期望款式</div><div>提交时间</div><div>操作</div></div><div id="rows"><div class="empty">正在加载</div></div></div>
</div></main>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeDetail()"><section class="modal"><div class="modal-head"><div><div class="label">定制申请</div><h2 class="modal-title" id="modalTitle">—</h2></div><button class="close" onclick="closeDetail()">×</button></div><div class="modal-body" id="modalBody"></div></section></div>
<script src="../js/auth.js"></script><script src="../js/admin-sidebar.js?v=20260820-customization"></script>
<script>
const API=location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001';const LABEL={SUBMITTED:'等待处理',REVIEWING:'正在处理',NEEDS_SUPPLEMENT:'需要补充素材',OPTIONS_READY:'待确认方案',UNAVAILABLE:'暂时无法制作',CONFIRMED:'已确认',CLOSED:'已关闭'};let token='';
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function dt(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—'}function size(v){if(!v)return'—';return v>1048576?(v/1048576).toFixed(1)+' MB':(v/1024).toFixed(1)+' KB'}
document.addEventListener('DOMContentLoaded',async()=>{token=localStorage.getItem('mowo_token')||'';if(!token){location.href='index.html';return}const u=await window.fetchCurrentUser?.();if(!['OWNER','CUSTOMER_SERVICE','PRODUCTION'].includes(u?.staffRole)){alert('当前岗位无权查看定制处理');location.href='index.html';return}loadAll()});
async function loadAll(){await Promise.all([loadStats(),loadList()])}async function loadStats(){try{const r=await fetch(`${API}/api/admin/customization-requests/stats`,{headers:{Authorization:`Bearer ${token}`}}),j=await r.json();if(!j.success)throw new Error(j.message);const s=j.data;document.getElementById('mSubmitted').textContent=s.SUBMITTED||0;document.getElementById('mReviewing').textContent=s.REVIEWING||0;document.getElementById('mAction').textContent=(s.NEEDS_SUPPLEMENT||0)+(s.OPTIONS_READY||0);document.getElementById('mDone').textContent=(s.UNAVAILABLE||0)+(s.CONFIRMED||0)+(s.CLOSED||0)}catch{}}
async function loadList(){const q=new URLSearchParams({limit:50});const status=document.getElementById('status').value,mode=document.getElementById('mode').value,keyword=document.getElementById('keyword').value.trim();if(status)q.set('status',status);if(mode)q.set('mode',mode);if(keyword)q.set('keyword',keyword);try{const r=await fetch(`${API}/api/admin/customization-requests?${q}`,{headers:{Authorization:`Bearer ${token}`}}),j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||'加载失败');render(j.data.items)}catch(e){document.getElementById('rows').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function render(items){document.getElementById('rows').innerHTML=items.length?items.map(x=>`<div class="row"><div><div class="number">${esc(x.requestNo)}</div><div class="sub">${esc(x.user.nickname)} · 手机尾号 ${esc(x.user.phoneTail||'—')}</div></div><div><span class="badge mode-${x.mode.toLowerCase()}">${x.mode==='HUMAN'?'人工筛选':'自己筛选'}</span></div><div><span class="badge s-${x.status}">${esc(LABEL[x.status]||x.status)}</span></div><div><div class="number">${esc(x.modelName)}</div><div class="sub">第 ${x.version} 版</div></div><div class="sub">${dt(x.submittedAt)}</div><div><button class="view" onclick="openDetail('${x.id}')">查看</button></div></div>`).join(''):'<div class="empty">没有符合条件的定制申请</div>'}
function media(f){const url=esc(f.url),name=esc(f.filename);const el=f.mimeType?.startsWith('video/')?`<video class="file-media" controls preload="metadata" src="${url}"></video>`:`<img class="file-media" src="${url}" alt="${name}">`;return`<div class="file">${el}<div class="file-name">${name}</div><div class="sub">${size(f.sizeBytes)}</div><a href="${url}" target="_blank" rel="noopener">单独打开</a></div>`}
async function openDetail(id){try{const r=await fetch(`${API}/api/admin/customization-requests/${encodeURIComponent(id)}`,{headers:{Authorization:`Bearer ${token}`}}),j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||'加载失败');const d=j.data,s=d.screeningData||{};document.getElementById('modalTitle').textContent=d.requestNo;document.getElementById('modalBody').innerHTML=`<div class="detail-grid"><div><div class="label">用户</div><div class="value">${esc(d.user.nickname)} · 尾号 ${esc(d.user.phoneTail||'—')}</div></div><div><div class="label">处理方式</div><div class="value">${d.mode==='HUMAN'?'人工帮忙筛选':'用户自己筛选'}</div></div><div><div class="label">期望款式</div><div class="value">${esc(d.model?.name||'—')}</div></div><div><div class="label">当前状态</div><div class="value">${esc(LABEL[d.status]||d.status)}</div></div><div><div class="label">素材数量</div><div class="value">${s.sourceCount||d.sourceFiles.length}</div></div><div><div class="label">素材大小</div><div class="value">${size(s.totalBytes)}</div></div><div><div class="label">比例检查</div><div class="value">${s.ratioOk===false?'需人工确认':'未发现明显问题'}</div></div><div><div class="label">创作者声明</div><div class="value">${d.creatorDeclared?'是':'否'}</div></div></div><h3 class="section-title">用户说明</h3><div class="note-box">${esc(d.userNote||'未填写')}</div><h3 class="section-title">原始素材</h3><div class="files">${d.sourceFiles.map(media).join('')||'<div class="sub">没有可读取的原素材</div>'}</div>${d.selectedFrames.length?`<h3 class="section-title">用户选中帧</h3><div class="files">${d.selectedFrames.map(media).join('')}</div>`:''}<h3 class="section-title">处理时间线</h3><div class="timeline">${d.events.map(e=>`<div class="event"><strong>${esc(LABEL[e.toStatus]||e.eventType)}</strong><p>${esc(e.publicMessage||'记录已更新')} · ${dt(e.createdAt)}</p></div>`).join('')}</div>`;document.getElementById('modal').classList.add('open')}catch(e){alert(e.message)}}function closeDetail(){document.getElementById('modal').classList.remove('open')}function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarBackdrop').classList.add('show')}function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarBackdrop').classList.remove('show')}
</script><script src="../js/admin-customization-workbench.js?v=20260821"></script></body></html>
