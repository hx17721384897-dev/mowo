<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单详情 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;--accent-b:#7EC8E3;
  --red:#E03030;--font:'Nunito','Noto Sans SC',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);--nav-h:65px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}
a{text-decoration:none;}

/* NAV — identical */
.nav{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:var(--nav-h);background:rgba(245,243,239,.96);backdrop-filter:blur(20px);border-bottom:1.5px solid var(--gray1);}
@media(min-width:1024px){.nav{padding:0 48px;}}
.nav-logo{line-height:1;}
.nav-logo-cn{font-weight:900;font-size:22px;color:var(--black);display:block;}
.nav-logo-en{font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray3);display:block;margin-top:1px;}
.nav-links{display:none;list-style:none;gap:32px;}
@media(min-width:1024px){.nav-links{display:flex;}}
.nav-links a{font-weight:800;font-size:14px;color:var(--gray3);transition:color .2s;}
.nav-links a:hover{color:var(--black);}
.nav-right{display:flex;align-items:center;}
.nav-user{position:relative;}
.nav-avatar-btn{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:2px solid transparent;transition:border-color .2s,background .2s;min-height:44px;}
.nav-avatar-btn:hover,.nav-avatar-btn.open{border-color:var(--gray1);background:var(--white);}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);border:1.5px solid rgba(0,0,0,.08);flex-shrink:0;}
.nav-uname{font-weight:800;font-size:13px;display:none;}
@media(min-width:640px){.nav-uname{display:block;}}
.nav-chevron{font-size:10px;color:var(--gray3);transition:transform .25s var(--ease);}
.nav-avatar-btn.open .nav-chevron{transform:rotate(180deg);}
.user-dropdown{position:absolute;top:calc(100% + 10px);right:0;width:232px;background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);box-shadow:0 8px 40px rgba(0,0,0,.12);padding:8px;opacity:0;pointer-events:none;transform:translateY(-8px) scale(.97);transform-origin:top right;transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:100;}
.user-dropdown.open{opacity:1;pointer-events:all;transform:none;}
.dropdown-head{padding:12px 14px 14px;border-bottom:1px solid var(--gray1);margin-bottom:6px;display:flex;align-items:center;gap:12px;}
.dh-av{width:38px;height:38px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:var(--black);border:2px solid var(--gray1);}
.dh-name{font-weight:900;font-size:14px;}.dh-role{font-size:11px;font-weight:700;color:var(--gray3);margin-top:2px;}
.di{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:12px;font-weight:800;font-size:13px;color:var(--black);transition:background .15s;width:100%;text-align:left;}
.di:hover{background:var(--cream);}
.di-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.di.cart .di-ic{background:#FFF3EC;}.di.fav .di-ic{background:#FFFBE6;}.di.orders .di-ic{background:#EDFBEE;}.di.works .di-ic{background:#EBF5FF;}.di.dashboard .di-ic{background:#F0EBFF;}.di.settings .di-ic,.di.help .di-ic{background:var(--gray1);}
.di.danger{color:var(--red);}.di.danger:hover{background:#FFF5F5;}.di.danger .di-ic{background:#FFF5F5;}
.dd-sep{height:1px;background:var(--gray1);margin:6px 0;}
.cart-bdg{margin-left:auto;background:var(--accent-o);color:var(--white);font-weight:900;font-size:10px;padding:2px 7px;border-radius:999px;}

/* ── PAGE ── */
.page{max-width:720px;margin:0 auto;padding:calc(var(--nav-h) + 40px) 24px 100px;}
@media(min-width:1024px){.page{padding:calc(var(--nav-h) + 52px) 48px 100px;}}

/* Back link */
.back-link{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--gray3);margin-bottom:28px;padding:8px 0;transition:color .18s;cursor:pointer;}
.back-link:hover{color:var(--black);}

/* ── STATUS HERO ── */
.status-hero{
  background:var(--black);border-radius:24px;padding:28px 28px 24px;
  margin-bottom:20px;color:var(--white);
}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;}
.hero-status-label{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin-bottom:4px;}
.hero-status-val{font-weight:900;font-size:24px;letter-spacing:-.02em;}
.hero-order-no{font-weight:700;font-size:11px;opacity:.4;margin-top:4px;}
.hero-icon{font-size:44px;line-height:1;}

/* Progress in hero */
.hero-progress{margin-bottom:20px;}
.hero-steps{display:flex;align-items:center;position:relative;margin-bottom:12px;}
.hero-line{position:absolute;top:14px;left:14px;right:14px;height:2px;background:rgba(255,255,255,.15);z-index:0;}
.hero-line-fill{position:absolute;top:14px;left:14px;height:2px;background:var(--accent-y);z-index:1;transition:width .7s var(--ease);}
.h-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;z-index:2;}
.h-dot{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .3s var(--ease);}
.h-dot.done{background:var(--accent-y);border-color:var(--accent-y);font-weight:900;color:var(--black);}
.h-dot.done::after{content:'✓';font-size:11px;font-weight:900;}
.h-dot.current{background:var(--white);border-color:var(--white);}
.h-dot.current .h-dot-inner{width:10px;height:10px;border-radius:50%;background:var(--black);}
.h-label{font-weight:800;font-size:10px;opacity:.5;text-align:center;line-height:1.3;}
.h-label.cur{opacity:1;color:var(--accent-y);}

/* ETA */
.hero-eta{
  background:rgba(255,255,255,.08);border-radius:14px;
  padding:12px 16px;display:flex;align-items:center;gap:10px;
}
.hero-eta-icon{font-size:18px;}
.hero-eta-text{font-weight:800;font-size:13px;}
.hero-eta-text span{color:var(--accent-y);}
.hero-tracking{font-weight:700;font-size:12px;opacity:.5;margin-top:4px;}

/* ── SECTIONS ── */
.section{background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);margin-bottom:14px;overflow:hidden;}
.sec-head{padding:16px 20px;border-bottom:1px solid var(--gray1);display:flex;align-items:center;justify-content:space-between;}
.sec-title{font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px;}
.sec-title-icon{font-size:16px;}
.sec-action{font-weight:800;font-size:12px;color:var(--gray3);padding:6px 0;transition:color .18s;}
.sec-action:hover{color:var(--black);}

/* Items */
.order-item{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--gray1);}
.order-item:last-child{border-bottom:none;}
.oi-cover{width:68px;height:68px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;cursor:pointer;transition:transform .2s var(--ease);}
.oi-cover:hover{transform:scale(1.04);}
.oi-info{flex:1;min-width:0;}
.oi-title{font-weight:900;font-size:14px;margin-bottom:3px;cursor:pointer;transition:color .18s;}
.oi-title:hover{color:var(--accent-o);}
.oi-machine{font-weight:700;font-size:12px;color:var(--gray3);margin-bottom:6px;}
.oi-qty{font-weight:800;font-size:12px;color:var(--gray3);}
.oi-price{font-weight:900;font-size:16px;flex-shrink:0;}

/* Payment info */
.info-rows{padding:4px 0;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:11px 20px;}
.info-row + .info-row{border-top:1px solid var(--gray1);}
.info-k{font-weight:700;font-size:13px;color:var(--gray3);}
.info-v{font-weight:800;font-size:13px;color:var(--black);}
.info-v.total{font-weight:900;font-size:17px;color:var(--accent-o);}

/* Address */
.address-block{padding:16px 20px;}
.addr-name{font-weight:900;font-size:15px;margin-bottom:4px;}
.addr-phone{font-weight:700;font-size:13px;color:var(--gray3);margin-bottom:6px;}
.addr-full{font-weight:700;font-size:13px;color:var(--black);line-height:1.7;}

/* ── REVIEW SECTION ── */
.review-section{background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);padding:24px;margin-bottom:14px;}
.review-title{font-weight:900;font-size:14px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.stars-row{display:flex;gap:8px;margin-bottom:16px;}
.star-btn{font-size:28px;opacity:.3;transition:opacity .15s,transform .15s;cursor:pointer;line-height:1;}
.star-btn.lit{opacity:1;}
.star-btn:hover{transform:scale(1.15);}
.review-textarea{
  width:100%;border:1.5px solid var(--gray1);border-radius:14px;
  padding:14px 16px;font-family:var(--font);font-weight:700;font-size:13px;
  color:var(--black);resize:none;height:90px;
  transition:border-color .2s;outline:none;background:var(--cream);
}
.review-textarea:focus{border-color:var(--black);}
.review-textarea::placeholder{color:var(--gray2);}
.btn-submit-review{
  width:100%;height:50px;border-radius:14px;margin-top:14px;
  background:var(--black);color:var(--white);
  font-weight:900;font-size:14px;transition:opacity .2s;
}
.btn-submit-review:hover{opacity:.85;}
.review-done{
  background:var(--cream);border-radius:14px;padding:16px;
  display:flex;align-items:center;gap:12px;
  font-weight:800;font-size:13px;color:var(--gray3);
}

/* ── ACTION BAR ── */
.action-bar{
  background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);
  padding:20px;margin-bottom:14px;
}
.action-bar-title{font-weight:900;font-size:13px;letter-spacing:.05em;color:var(--gray3);text-transform:uppercase;margin-bottom:14px;}
.action-btns{display:flex;gap:10px;flex-wrap:wrap;}
.btn-action{padding:11px 20px;border-radius:999px;font-weight:900;font-size:13px;transition:all .18s;min-height:44px;}
.btn-action.primary{background:var(--black);color:var(--white);}
.btn-action.primary:hover{opacity:.82;}
.btn-action.yellow{background:var(--accent-y);color:var(--black);}
.btn-action.yellow:hover{opacity:.85;}
.btn-action.outline{border:2px solid var(--gray1);color:var(--black);}
.btn-action.outline:hover{border-color:var(--black);}
.btn-action.danger{border:2px solid rgba(224,48,48,.25);color:var(--red);}
.btn-action.danger:hover{background:#FFF5F5;border-color:var(--red);}

/* ── REFUND MODAL ── */
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(17,17,16,.55);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal-box{width:100%;max-width:420px;background:var(--white);border-radius:28px;padding:32px;border:1.5px solid var(--gray1);box-shadow:0 24px 80px rgba(0,0,0,.18);transform:translateY(16px) scale(.97);transition:transform .38s var(--ease);}
.modal-bg.open .modal-box{transform:none;}
.modal-icon{font-size:40px;margin-bottom:16px;}
.modal-title{font-weight:900;font-size:20px;letter-spacing:-.02em;margin-bottom:8px;}
.modal-desc{font-weight:700;font-size:13px;color:var(--gray3);line-height:1.85;margin-bottom:20px;}
.refund-reasons{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.reason-opt{
  display:flex;align-items:center;gap:12px;
  border:2px solid var(--gray1);border-radius:14px;padding:12px 16px;
  cursor:pointer;transition:all .18s;font-weight:800;font-size:13px;
}
.reason-opt:hover{border-color:var(--gray2);}
.reason-opt.sel{border-color:var(--black);background:var(--cream);}
.reason-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--gray2);flex-shrink:0;transition:all .18s;display:flex;align-items:center;justify-content:center;}
.reason-opt.sel .reason-radio{border-color:var(--black);background:var(--black);}
.reason-opt.sel .reason-radio::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--white);}
.modal-btns{display:flex;gap:10px;}
.btn-modal-cancel{flex:1;height:50px;border-radius:14px;border:2px solid var(--gray1);font-weight:800;font-size:14px;color:var(--gray3);transition:all .18s;}
.btn-modal-cancel:hover{border-color:var(--black);color:var(--black);}
.btn-modal-confirm{flex:1;height:50px;border-radius:14px;background:var(--red);color:var(--white);font-weight:900;font-size:14px;transition:opacity .18s;}
.btn-modal-confirm:hover{opacity:.85;}

/* ── AFTERSALE TYPE BUTTONS ── */
.type-btns{display:flex;gap:10px;margin-bottom:18px;}
.type-btn{flex:1;padding:14px 10px;border-radius:16px;border:2px solid var(--gray1);font-weight:800;font-size:13px;text-align:center;cursor:pointer;transition:all .18s;background:none;font-family:var(--font);}
.type-btn .tb-icon{font-size:22px;display:block;margin-bottom:6px;}
.type-btn:hover{border-color:var(--gray2);}
.type-btn.sel{border-color:var(--black);background:var(--cream);}
/* ── DESCRIPTION TEXTAREA ── */
.modal-textarea{width:100%;height:80px;border:2px solid var(--gray1);border-radius:14px;padding:12px;font-family:var(--font);font-weight:700;font-size:13px;resize:none;outline:none;transition:border-color .18s;margin-bottom:14px;background:var(--white);}
.modal-textarea:focus{border-color:var(--black);}
.modal-textarea::placeholder{color:var(--gray2);}
/* ── IMAGE UPLOAD ── */
.img-upload-area{margin-bottom:16px;}
.img-upload-label{font-weight:900;font-size:12px;color:var(--gray3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;display:block;}
.img-upload-row{display:flex;gap:8px;flex-wrap:wrap;}
.img-thumb{width:68px;height:68px;border-radius:12px;object-fit:cover;border:1.5px solid var(--gray1);}
.img-add-btn{width:68px;height:68px;border-radius:12px;border:2px dashed var(--gray2);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;color:var(--gray2);background:none;transition:all .18s;font-family:var(--font);}
.img-add-btn:hover{border-color:var(--gray3);color:var(--gray3);}
.img-note{font-size:11px;color:var(--gray2);font-weight:700;margin-top:6px;}
.upload-spin{display:inline-block;animation:spin .8s linear infinite;margin-left:4px;}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── MODAL LEGAL NOTICE ── */
.modal-legal{font-size:11px;color:var(--gray2);font-weight:700;line-height:1.7;margin-bottom:16px;padding:10px 12px;background:var(--cream);border-radius:10px;}
/* ── AFTERSALE STATUS DISPLAY ── */
.aftersale-tag{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:900;font-size:11px;letter-spacing:.04em;}
.aftersale-tag.pending{background:#FFF3E0;color:#E65100;}
.aftersale-tag.approved{background:#E8F5E9;color:#2E7D32;}
.aftersale-tag.rejected{background:#FFEBEE;color:#C62828;}
.aftersale-tag.completed{background:#E3F2FD;color:#1565C0;}
.aftersale-note-box{background:var(--cream);border-radius:12px;padding:14px;margin-top:12px;font-size:13px;font-weight:700;line-height:1.7;color:var(--black);}
.aftersale-note-label{font-size:11px;font-weight:900;color:var(--gray3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}

/* REVEAL */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease);}
.reveal.on{opacity:1;transform:none;}
.d1{transition-delay:.06s}.d2{transition-delay:.12s}.d3{transition-delay:.18s}.d4{transition-delay:.24s}.d5{transition-delay:.3s}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);z-index:9500;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* CURSOR */
#cdot,#cring{position:fixed;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
#cdot{width:8px;height:8px;background:var(--black);}
#cring{width:32px;height:32px;border:1.5px solid rgba(17,17,16,.25);transition:width .3s,height .3s;}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo-cn">哞屋</span>
    <span class="nav-logo-en">MOWO</span>
  </a>
  <ul class="nav-links">
    <li><a href="about.html">关于我们</a></li><li><a href="products.html">产品介绍</a></li>
    <li><a href="/app/showcase">联名作品</a></li><li><a href="customize-start.html">创作中心</a></li>
    <li><a href="contact.html">联络我们</a></li>
  </ul>
  <div class="nav-right">
    <button class="nav-login nav-login-btn" id="navLoginBtn">登录</button>
    <div class="burger" id="burger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<!-- PAGE -->
<main class="page">
  <div class="back-link reveal" onclick="goBack()">← 返回我的订单</div>

  <!-- Status Hero -->
  <div class="status-hero reveal d1" id="statusHero"></div>

  <!-- Items -->
  <div class="section reveal d2">
    <div class="sec-head">
      <span class="sec-title"><span class="sec-title-icon">🎨</span> 商品明细</span>
    </div>
    <div id="itemsList"></div>
  </div>

  <!-- Address -->
  <div class="section reveal d3" id="addressSection">
    <div class="sec-head">
      <span class="sec-title"><span class="sec-title-icon">📍</span> 收货地址</span>
    </div>
    <div class="address-block" id="addressBlock">—</div>
  </div>

  <!-- Payment -->
  <div class="section reveal d3">
    <div class="sec-head">
      <span class="sec-title"><span class="sec-title-icon">💳</span> 支付信息</span>
    </div>
    <div class="info-rows" id="paymentRows"></div>
  </div>

  <!-- Review section (only for completed, not yet reviewed) -->
  <div id="reviewSection"></div>

  <!-- Action bar -->
  <div class="action-bar reveal d4" id="actionBar"></div>
</main>

<!-- 申请售后弹窗 -->
<div class="modal-bg" id="refundModal" onclick="handleModalBg(event)">
  <div class="modal-box" style="max-height:90vh;overflow-y:auto" onclick="event.stopPropagation()">
    <div class="modal-icon">🔄</div>
    <div class="modal-title">申请售后</div>
    <div class="modal-desc">请选择申请类型和原因，客服将在 1–3 个工作日内联系您处理。</div>

    <!-- 类型选择 -->
    <div class="type-btns" id="typeBtns">
      <button class="type-btn" id="typeRefund" onclick="pickType('refund')">
        <span class="tb-icon">💸</span>退款申请<br>
        <span style="font-weight:700;font-size:11px;color:var(--gray3)">未收到货 / 不想要</span>
      </button>
      <button class="type-btn" id="typeQuality" onclick="pickType('quality')">
        <span class="tb-icon">🔧</span>质量售后<br>
        <span style="font-weight:700;font-size:11px;color:var(--gray3)">收货后发现问题</span>
      </button>
    </div>

    <!-- 原因列表 -->
    <div class="refund-reasons" id="refundReasons" style="display:none"></div>

    <!-- 补充说明 -->
    <div id="descArea" style="display:none">
      <textarea class="modal-textarea" id="refundDesc" placeholder="请详细描述问题，有助于我们快速处理（选填）" maxlength="300"></textarea>
    </div>

    <!-- 图片上传（质量问题时显示） -->
    <div class="img-upload-area" id="imgUploadArea" style="display:none">
      <span class="img-upload-label">上传凭证图片（最多 3 张）</span>
      <div class="img-upload-row" id="imgRow">
        <button class="img-add-btn" onclick="triggerImgPick()" id="imgAddBtn">＋</button>
      </div>
      <div class="img-note">仅支持 JPG / PNG / WebP，每张限 10MB</div>
      <input type="file" accept="image/jpeg,image/png,image/webp" multiple id="imgFileInput" style="display:none" onchange="handleImgFiles(this)">
    </div>

    <!-- 法律提示 -->
    <div class="modal-legal">
      ⚠️ 根据《消费者权益保护法》，个性化定制商品不适用无理由退货。如属质量问题，我们将积极协助解决（换货/补发/协商退款）。
    </div>

    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeRefund()">取消</button>
      <button class="btn-modal-confirm" id="submitRefundBtn" onclick="submitRefund()">提交申请</button>
    </div>
  </div>
</div>

<!-- 售后进度弹窗 -->
<div class="modal-bg" id="aftersaleModal" onclick="if(event.target.id==='aftersaleModal')closeAftersale()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-icon">🔄</div>
    <div class="modal-title">售后申请进度</div>
    <div id="aftersaleContent" style="margin-bottom:20px"></div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeAftersale()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/runtime-config.js"></script>
<script>
const CAPI = window.MOWO_API_BASE || ''

const STATUS_STEPS = ['待付款','制作中','运输中','已完成']
const STATUS_IDX = {
  pending:0, paid:1, locked:1, processing:1, producing:1,
  shipped:2, received:3, cancelled:-1, aftersale:-1
}
const STATUS_NAME = {
  pending:'等待付款', paid:'正在制作', locked:'正在制作',
  processing:'正在制作', producing:'正在制作',
  shipped:'快递运输中', received:'订单已完成',
  cancelled:'订单已取消', aftersale:'售后处理中'
}
const STATUS_ICON = {
  pending:'⏳', paid:'🎨', locked:'🎨',
  processing:'🎨', producing:'🎨',
  shipped:'🚚', received:'✅',
  cancelled:'❌', aftersale:'🔄'
}
const FILL_PCT = { 0:'0%', 1:'33%', 2:'66%', 3:'100%' }
const REFUND_REASONS = {
  refund:  ['不想要了','拍错了','价格有变动','物流异常/未收到货','其他原因'],
  quality: ['机器运转异常','帧图印刷错误/模糊','外壳破损或配件缺失','与描述不符','其他质量问题']
}
const AFTERSALE_STATUS_LABEL = {
  pending:'待处理', approved:'已同意', rejected:'已拒绝', completed:'已完成', cancelled:'已取消'
}
const AFTERSALE_TYPE_LABEL = { refund:'退款申请', quality:'质量售后' }

let ORDER = null
let selectedReason = null
let selectedType   = null
let uploadedOssKeys = []
let isUploading     = false
let tT

/* ─── LOAD ─── */
async function loadOrder() {
  const id    = new URLSearchParams(location.search).get('id')
  const token = localStorage.getItem('mowo_token')
  if (!id) { showError('缺少订单 ID'); return }
  if (!token) { showError('请先登录后查看订单'); return }

  showSkeleton()
  try {
    const res  = await fetch(`${CAPI}/api/orders/${id}`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    if (res.status === 401) { showError('登录已过期，请重新登录'); return }
    if (res.status === 403) { showError('无权查看此订单'); return }
    const json = await res.json()
    if (!json.success) throw new Error(json.message)
    ORDER = json.data
    buildPage()
  } catch(e) {
    showError(e.message || '网络异常')
  }
}

/* ─── BUILD PAGE ─── */
function buildPage() {
  const o = ORDER
  const stepIdx = STATUS_IDX[o.status] ?? -1
  const heroFill = stepIdx >= 0 ? (FILL_PCT[stepIdx] || '0%') : '0%'

  // ── Status Hero
  const etaHtml = buildEtaHtml(o)
  const stepsHtml = STATUS_STEPS.map((s, si) => {
    const dotCls = si < stepIdx ? ' done' : si === stepIdx ? ' current' : ''
    const inner  = si === stepIdx ? '<div class="h-dot-inner"></div>' : ''
    return `<div class="h-step">
      <div class="h-dot${dotCls}">${inner}</div>
      <span class="h-label${si === stepIdx ? ' cur' : ''}">${s}</span>
    </div>`
  }).join('')

  document.getElementById('statusHero').innerHTML = `
    <div class="hero-top">
      <div>
        <div class="hero-status-label">订单状态</div>
        <div class="hero-status-val">${STATUS_NAME[o.status] || o.status}</div>
        <div class="hero-order-no">NO. ${escHtml(o.orderNo || o.id)}</div>
      </div>
      <div class="hero-icon">${STATUS_ICON[o.status] || '📦'}</div>
    </div>
    <div class="hero-progress">
      <div class="hero-steps">
        <div class="hero-line"></div>
        <div class="hero-line-fill" style="width:${heroFill}"></div>
        ${stepsHtml}
      </div>
    </div>
    ${etaHtml}`

  // ── Items：一个用户订单可以包含多条商品，每条再展开为单件生产任务
  const orderItems = o.items?.length ? o.items : [{
    productTitle:o.productTitle, coverUrl:o.coverUrl, modelName:o.modelName,
    size:o.size, frameCount:o.frameCount, material:o.material, colorName:o.colorName,
    quantity:1, lineTotal:o.totalAmount, itemType:o.sourceType === 'collab' ? 'MARKET' : 'CUSTOM'
  }]
  document.getElementById('itemsList').innerHTML = orderItems.map(item => {
    const coverHtml = item.coverUrl
      ? `<img src="${escHtml(item.coverUrl)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">`
      : (item.itemType === 'MARKET' ? '🎬' : '🎨')
    const specText = [item.modelName, item.size, item.frameCount ? item.frameCount + '帧' : null, item.material, item.colorName].filter(Boolean).join(' · ') || '—'
    const productionText = item.productionTasks?.length
      ? ` · 已生成 ${item.productionTasks.length} 个生产任务`
      : ''
    return `<div class="order-item">
      <div class="oi-cover" style="background:var(--cream)">${coverHtml}</div>
      <div class="oi-info">
        <div class="oi-title">${escHtml(item.productTitle || '—')}</div>
        <div class="oi-machine">⚙ ${escHtml(specText)}</div>
        <div class="oi-qty">数量：${Number(item.quantity || 1)}${productionText}</div>
      </div>
      <div class="oi-price">¥${Number(item.lineTotal || 0).toFixed(2)}</div>
    </div>`
  }).join('')

  // ── Address
  const phone = maskPhone(o.receiverPhone)
  const addrLine = [o.receiverCity, o.receiverAddress].filter(Boolean).join(' ')
  document.getElementById('addressBlock').innerHTML = o.receiverName ? `
    <div class="addr-name">${escHtml(o.receiverName)}</div>
    <div class="addr-phone">${escHtml(phone)}</div>
    <div class="addr-full">${escHtml(addrLine || '—')}</div>` : '暂无收货地址信息'

  // ── Payment
  const createdStr = o.createdAt ? new Date(o.createdAt).toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—'
  document.getElementById('paymentRows').innerHTML = `
    <div class="info-row"><span class="info-k">商品合计</span><span class="info-v">¥${Number(o.totalAmount || 0).toFixed(2)}</span></div>
    <div class="info-row"><span class="info-k">运费</span><span class="info-v">包邮</span></div>
    <div class="info-row"><span class="info-k">下单时间</span><span class="info-v">${escHtml(createdStr)}</span></div>
    <div class="info-row"><span class="info-k">实付金额</span><span class="info-v total">¥${Number(o.totalAmount || 0).toFixed(2)}</span></div>`

  // ── Review section
  const rs = document.getElementById('reviewSection')
  if (o.status === 'received') {
    rs.innerHTML = `
      <div class="section reveal d4">
        <div class="sec-head"><span class="sec-title"><span class="sec-title-icon">⭐</span> 订单评价</span></div>
        <div style="padding:20px;text-align:center;color:var(--gray3);font-weight:700;font-size:13px;line-height:2">
          评价功能即将上线 ✍️<br>感谢您选择哞屋！
        </div>
      </div>`
  } else {
    rs.innerHTML = ''
  }

  // ── Action bar
  buildActionBar(o)

  document.querySelectorAll('.reveal').forEach(el => revObs.observe(el))
}

function buildEtaHtml(o) {
  if (o.status === 'shipped') {
    if (o.trackingNo) {
      const co = escHtml(o.trackingCompany || '快递')
      const no = escHtml(o.trackingNo)
      return `<div class="hero-eta" style="cursor:pointer" onclick="copyTracking('${o.trackingNo}')">
        <span class="hero-eta-icon">📦</span>
        <div>
          <div class="hero-eta-text"><span>${co} ${no}</span></div>
          <div class="hero-tracking">点击复制快递单号</div>
        </div>
      </div>`
    }
    return `<div class="hero-eta">
      <span class="hero-eta-icon">🚚</span>
      <div class="hero-eta-text">已发货，请留意快递通知</div>
    </div>`
  }
  if (['paid','locked','processing','producing'].includes(o.status)) {
    return `<div class="hero-eta">
      <span class="hero-eta-icon">🔧</span>
      <div class="hero-eta-text">生产周期约 <span>7–14 个工作日</span></div>
    </div>`
  }
  return ''
}

function buildActionBar(o) {
  const ab = document.getElementById('actionBar')
  let btns = ''

  if (o.status === 'pending') {
    // 待付款：可自助取消
    btns = `<button class="btn-action outline" onclick="goContact()">联系客服</button>
            <button class="btn-action danger" onclick="cancelOrder()">取消订单</button>`

  } else if (['paid','locked','processing','producing'].includes(o.status)) {
    // 已付款进入生产流程，不可自助取消
    btns = `<button class="btn-action outline" onclick="goContact()">联系客服</button>
            <button class="btn-action danger" onclick="openRefund()">申请售后</button>`

  } else if (o.status === 'shipped') {
    // 运输中：确认收货（主操作）+ 售后申请
    btns = `<button class="btn-action yellow" onclick="confirmReceipt()">确认收货</button>
            <button class="btn-action outline" onclick="goContact()">联系客服</button>
            <button class="btn-action danger" onclick="openRefund()">申请售后</button>`

  } else if (o.status === 'received') {
    // 已完成：判断 7 天时效
    const receivedAt = o.receivedAt ? new Date(o.receivedAt) : null
    const daysSince  = receivedAt ? (Date.now() - receivedAt.getTime()) / 86400000 : 999
    if (daysSince <= 7) {
      btns = `<button class="btn-action outline" onclick="goContact()">联系客服</button>
              <button class="btn-action danger" onclick="openRefund()">申请售后</button>`
    } else {
      btns = `<button class="btn-action outline" onclick="goContact()">联系客服</button>
              <button class="btn-action outline" style="color:var(--gray2);cursor:default" title="收货超过7天，请联系客服处理">售后已过期</button>`
    }

  } else if (o.status === 'aftersale') {
    // 售后处理中：查看进度
    btns = `<button class="btn-action primary" onclick="showAftersaleStatus()">查看售后进度</button>
            <button class="btn-action outline" onclick="goContact()">联系客服</button>`

  } else if (o.status === 'cancelled') {
    btns = `<button class="btn-action outline" onclick="goContact()">联系客服</button>`
  }

  ab.innerHTML = `<div class="action-bar-title">操作</div><div class="action-btns">${btns}</div>`
  ab.querySelectorAll('button').forEach(b => {
    b.addEventListener('mouseenter', () => { if(ring) { ring.style.width='48px'; ring.style.height='48px' } })
    b.addEventListener('mouseleave', () => { if(ring) { ring.style.width='32px'; ring.style.height='32px' } })
  })
}

/* ─── API ACTIONS ─── */
async function cancelOrder() {
  if (!ORDER) return
  if (!confirm('确认取消此订单？\n\n取消后不可恢复，如有疑问请先联系客服。')) return
  const token = localStorage.getItem('mowo_token')
  try {
    const res  = await fetch(`${CAPI}/api/orders/${ORDER.id}/cancel`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` }
    })
    const json = await res.json()
    if (json.success) {
      toast('✓ 订单已取消')
      setTimeout(() => loadOrder(), 800)
    } else {
      toast('❌ ' + (json.message || '操作失败，如需取消请联系客服'))
    }
  } catch(err) {
    toast('❌ 网络异常，请稍后重试')
  }
}

async function confirmReceipt() {
  if (!ORDER) return
  if (!confirm('确认已收到商品？\n\n确认后将正式完成订单，并启动售后保护期计算。')) return
  const token = localStorage.getItem('mowo_token')
  try {
    const res  = await fetch(`${CAPI}/api/orders/${ORDER.id}/confirm-receipt`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` }
    })
    const json = await res.json()
    if (json.success) {
      toast('✓ 已确认收货，感谢您的支持！')
      setTimeout(() => loadOrder(), 800)
    } else {
      toast('❌ ' + (json.message || '操作失败'))
    }
  } catch(err) {
    toast('❌ 网络异常，请稍后重试')
  }
}

function copyTracking(no) {
  navigator.clipboard.writeText(no).then(() => {
    toast('✓ 快递单号已复制：' + no)
  }).catch(() => {
    toast('快递单号：' + no)
  })
}

/* ─── 申请售后弹窗 ─── */
function openRefund() {
  // 重置状态
  selectedType    = null
  selectedReason  = null
  uploadedOssKeys = []
  document.getElementById('typeRefund').classList.remove('sel')
  document.getElementById('typeQuality').classList.remove('sel')
  document.getElementById('refundReasons').style.display = 'none'
  document.getElementById('refundReasons').innerHTML = ''
  document.getElementById('descArea').style.display = 'none'
  document.getElementById('refundDesc').value = ''
  document.getElementById('imgUploadArea').style.display = 'none'
  document.getElementById('imgRow').innerHTML = '<button class="img-add-btn" onclick="triggerImgPick()" id="imgAddBtn">＋</button>'

  // quality 类型限制：只在 received 状态允许
  const qBtn = document.getElementById('typeQuality')
  if (ORDER && ORDER.status !== 'received') {
    qBtn.style.opacity = '.4'
    qBtn.style.pointerEvents = 'none'
    qBtn.title = '质量售后需在确认收货后申请'
  } else {
    qBtn.style.opacity = ''
    qBtn.style.pointerEvents = ''
    qBtn.title = ''
  }

  document.getElementById('refundModal').classList.add('open')
  document.body.style.overflow = 'hidden'
}

function pickType(type) {
  selectedType   = type
  selectedReason = null
  document.getElementById('typeRefund').classList.toggle('sel', type === 'refund')
  document.getElementById('typeQuality').classList.toggle('sel', type === 'quality')

  // 渲染原因列表
  const reasons = REFUND_REASONS[type] || []
  document.getElementById('refundReasons').innerHTML = reasons.map((r, i) => `
    <div class="reason-opt" onclick="pickReason(${i})">
      <div class="reason-radio"></div>
      <span>${r}</span>
    </div>`).join('')
  document.getElementById('refundReasons').style.display = 'flex'
  document.getElementById('descArea').style.display = 'block'

  // 质量售后显示图片上传区
  document.getElementById('imgUploadArea').style.display = type === 'quality' ? 'block' : 'none'
}

function pickReason(i) {
  selectedReason = i
  document.querySelectorAll('.reason-opt').forEach((el, idx) => el.classList.toggle('sel', idx === i))
}

function closeRefund() {
  document.getElementById('refundModal').classList.remove('open')
  document.body.style.overflow = ''
}

function handleModalBg(e) { if (e.target.id === 'refundModal') closeRefund() }

/* ─── 图片上传 ─── */
function triggerImgPick() {
  if (uploadedOssKeys.length >= 3) { toast('最多上传 3 张图片'); return }
  document.getElementById('imgFileInput').click()
}

async function handleImgFiles(input) {
  const files = Array.from(input.files).slice(0, 3 - uploadedOssKeys.length)
  if (!files.length) return
  input.value = ''

  const token = localStorage.getItem('mowo_token')
  for (const file of files) {
    if (file.size > 10 * 1024 * 1024) { toast('图片超过 10MB，跳过'); continue }
    // 在缩略图区显示加载中
    const loadId = 'img-loading-' + Date.now()
    document.getElementById('imgRow').insertAdjacentHTML('beforeend',
      `<div id="${loadId}" style="width:68px;height:68px;border-radius:12px;background:var(--gray1);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--gray3)">上传中</div>`)
    try {
      // 获取预签名 URL
      const presignRes  = await fetch(`${CAPI}/api/upload/presign`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ fileName: file.name, fileType: file.type, fileSize: file.size, purpose: 'AFTERSALE_EVIDENCE' })
      })
      const presignJson = await presignRes.json()
      if (!presignJson.success) throw new Error(presignJson.message)
      const { uploadUrl, objectKey, completeUrl } = presignJson.data

      // 直传 OSS
      const uploadRes = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Type': file.type }, body: file })
      if (!uploadRes.ok) throw new Error('文件上传失败')
      if (completeUrl) {
        const completeRes = await fetch(completeUrl, { method: 'POST', headers: { Authorization: `Bearer ${token}` } })
        const completeJson = await completeRes.json()
        if (!completeJson.success) throw new Error(completeJson.message || '文件校验失败')
      }

      uploadedOssKeys.push(objectKey)
      // 替换 loading 占位为缩略图
      const objUrl = URL.createObjectURL(file)
      document.getElementById(loadId).outerHTML =
        `<img class="img-thumb" src="${objUrl}" title="${file.name}">`

      // 超过 3 张隐藏添加按钮
      if (uploadedOssKeys.length >= 3) {
        const addBtn = document.getElementById('imgAddBtn')
        if (addBtn) addBtn.style.display = 'none'
      }
    } catch(err) {
      document.getElementById(loadId)?.remove()
      toast('❌ 图片上传失败：' + err.message)
    }
  }
}

/* ─── 提交售后申请 ─── */
async function submitRefund() {
  if (!selectedType)   { toast('请选择申请类型'); return }
  if (selectedReason === null) { toast('请选择申请原因'); return }
  if (!ORDER) return

  const reasons = REFUND_REASONS[selectedType] || []
  const reason  = reasons[selectedReason]
  const description = document.getElementById('refundDesc').value.trim()

  const btn = document.getElementById('submitRefundBtn')
  btn.textContent = '提交中…'; btn.disabled = true

  const token = localStorage.getItem('mowo_token')
  try {
    const res  = await fetch(`${CAPI}/api/orders/${ORDER.id}/aftersale`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ type: selectedType, reason, description: description || undefined, imageUrls: uploadedOssKeys })
    })
    const json = await res.json()
    if (json.success) {
      closeRefund()
      toast('✓ 申请已提交，客服将在 1–3 个工作日内联系您')
      setTimeout(() => loadOrder(), 900)
    } else {
      toast('❌ ' + (json.message || '提交失败'))
    }
  } catch(err) {
    toast('❌ 网络异常，请稍后重试')
  } finally {
    btn.textContent = '提交申请'; btn.disabled = false
  }
}

/* ─── 售后进度弹窗 ─── */
async function showAftersaleStatus() {
  if (!ORDER) return
  document.getElementById('aftersaleModal').classList.add('open')
  document.body.style.overflow = 'hidden'
  document.getElementById('aftersaleContent').innerHTML = '<div style="text-align:center;padding:16px;color:var(--gray3)">加载中…</div>'

  const token = localStorage.getItem('mowo_token')
  try {
    const res  = await fetch(`${CAPI}/api/orders/${ORDER.id}/aftersale`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    const json = await res.json()
    if (!json.success || !json.data) {
      document.getElementById('aftersaleContent').innerHTML = '<div style="color:var(--gray3);font-weight:700;font-size:13px">暂无售后申请记录</div>'
      return
    }
    const r = json.data
    const statusTag = `<span class="aftersale-tag ${r.status}">${AFTERSALE_STATUS_LABEL[r.status] || r.status}</span>`
    const createdStr = r.createdAt ? new Date(r.createdAt).toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—'
    const processedStr = r.processedAt ? new Date(r.processedAt).toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : null

    let html = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-weight:900;font-size:13px">${AFTERSALE_TYPE_LABEL[r.type] || r.type}</span>
        ${statusTag}
      </div>
      <div style="font-size:13px;font-weight:700;margin-bottom:6px">📌 原因：${escHtml(r.reason)}</div>
      ${r.description ? `<div style="font-size:12px;color:var(--gray3);margin-bottom:10px">${escHtml(r.description)}</div>` : ''}
      <div style="font-size:11px;color:var(--gray2);font-weight:700">申请时间：${createdStr}</div>`

    if (r.adminNote) {
      html += `<div class="aftersale-note-box">
        <div class="aftersale-note-label">客服回复</div>
        ${escHtml(r.adminNote)}
        ${processedStr ? `<div style="font-size:11px;color:var(--gray2);margin-top:6px">处理时间：${processedStr}</div>` : ''}
      </div>`
    } else if (r.status === 'pending') {
      html += `<div style="font-size:12px;color:var(--gray3);font-weight:700;margin-top:12px">⏳ 客服正在处理，请耐心等待（1–3 个工作日）</div>`
    }

    document.getElementById('aftersaleContent').innerHTML = html
  } catch(err) {
    document.getElementById('aftersaleContent').innerHTML = '<div style="color:var(--red);font-weight:700;font-size:13px">加载失败，请重试</div>'
  }
}

function closeAftersale() {
  document.getElementById('aftersaleModal').classList.remove('open')
  document.body.style.overflow = ''
}

/* ─── UTILS ─── */
function maskPhone(phone) {
  if (!phone) return '—'
  const s = String(phone)
  if (s.length === 11) return s.slice(0, 3) + ' **** ' + s.slice(7)
  return s
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

/* ─── NAV ─── */
function goBack() { window.location.href = 'orders.html' }
function goContact() { window.location.href = 'contact.html' }
function toggleDD() {
  const dd = document.getElementById('userDD'), btn = document.getElementById('navBtn')
  const o = dd.classList.toggle('open')
  btn.classList.toggle('open', o)
  if (o) setTimeout(() => document.addEventListener('click', outsideDD), 0)
}
function closeDD() {
  const dd = document.getElementById('userDD'), btn = document.getElementById('navBtn')
  if (dd) dd.classList.remove('open')
  if (btn) btn.classList.remove('open')
  document.removeEventListener('click', outsideDD)
}
function outsideDD(e) {
  const btn = document.getElementById('navBtn'), dd = document.getElementById('userDD')
  if (btn && dd && !btn.contains(e.target) && !dd.contains(e.target)) closeDD()
}

/* ─── TOAST ─── */
function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2800)
}

/* ─── REVEAL ─── */
const revObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); revObs.unobserve(e.target) } })
}, { threshold: 0.04 })
document.querySelectorAll('.reveal').forEach(el => revObs.observe(el))

/* ─── SKELETON CSS ─── */
;(function injectSkCss() {
  const s = document.createElement('style')
  s.textContent = '.sk{border-radius:8px;background:rgba(255,255,255,.1);}'
  document.head.appendChild(s)
})()

/* ─── CURSOR ─── */
let ring
if (window.matchMedia('(pointer:fine)').matches) {
  const dot = document.createElement('div'); dot.id = 'cdot'
  ring = document.createElement('div'); ring.id = 'cring'
  document.body.append(dot, ring)
  document.body.style.cursor = 'none'
  let mx=0,my=0,rx=0,ry=0
  document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; dot.style.left=mx+'px'; dot.style.top=my+'px' })
  ;(function tick() { rx+=(mx-rx)*.12; ry+=(my-ry)*.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(tick) })()
  document.querySelectorAll('a,button,.reason-opt').forEach(el => {
    el.addEventListener('mouseenter', () => { ring.style.width='48px'; ring.style.height='48px' })
    el.addEventListener('mouseleave', () => { ring.style.width='32px'; ring.style.height='32px' })
  })
}

/* ─── INIT ─── */
loadOrder()
