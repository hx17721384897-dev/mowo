<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的定制 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/nav.css">
<script src="../js/runtime-config.js"></script>
<style>
:root{--white:#fff;--cream:#F5F3EF;--black:#111110;--gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;--yellow:#f0c040;--orange:#e8662a;--green:#4F9B59;--blue:#397EA5;--font:'Nunito','Noto Sans SC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);background:#fafaf8;color:var(--black);min-height:100vh}button,a{font-family:inherit}.wrap{max-width:1120px;margin:0 auto;padding:42px 24px 90px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{font-weight:800;font-size:10px;letter-spacing:.16em;color:var(--gray3);margin-bottom:7px}.title{font-weight:900;font-size:34px;letter-spacing:0}.sub{font-weight:700;font-size:13px;color:var(--gray3);margin-top:7px}.new-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border:0;border-radius:8px;background:var(--black);color:#fff;text-decoration:none;font-weight:900;font-size:13px}.submitted{display:none;background:#ECF7EE;border-left:5px solid var(--green);padding:14px 16px;margin-bottom:20px;font-weight:800;font-size:13px}.submitted.show{display:block}.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px}.tab{border:1.5px solid var(--gray1);background:#fff;color:var(--gray3);border-radius:8px;min-height:38px;padding:0 15px;font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer}.tab.active{background:var(--black);border-color:var(--black);color:#fff}.list{display:grid;gap:12px}.request{background:#fff;border:1.5px solid var(--gray1);border-radius:8px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(170px,.7fr) auto;gap:18px;align-items:center}.request-main{min-width:0}.request-no{font-weight:900;font-size:16px;letter-spacing:.03em}.request-name{font-weight:800;font-size:13px;margin-top:6px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.chip{font-weight:800;font-size:10px;padding:4px 8px;border-radius:6px;background:var(--cream);color:var(--gray3)}.status{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:12px}.status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}.s-draft{color:var(--gray3)}.s-wait{color:#A66A00}.s-work{color:var(--blue)}.s-action{color:var(--orange)}.s-ok{color:var(--green)}.s-closed{color:var(--gray3)}.time{font-weight:700;font-size:11px;color:var(--gray3);margin-top:7px}.view-btn{min-width:74px;height:36px;border:1.5px solid var(--gray1);border-radius:8px;background:#fff;font-weight:900;font-size:12px;cursor:pointer}.view-btn:hover{border-color:var(--black)}.empty{padding:80px 20px;text-align:center;background:#fff;border:1.5px solid var(--gray1);border-radius:8px;color:var(--gray3);font-weight:800}.loading{padding:60px;text-align:center;font-weight:800;color:var(--gray3)}.modal-bg{position:fixed;inset:0;background:rgba(17,17,16,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:1200}.modal-bg.open{display:flex}.modal{width:min(620px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:8px}.modal-head{padding:20px 22px;border-bottom:1.5px solid var(--gray1);display:flex;justify-content:space-between;gap:16px}.modal-title{font-weight:900;font-size:19px}.close{width:34px;height:34px;border:0;border-radius:50%;background:var(--gray1);font-size:18px;cursor:pointer}.modal-body{padding:20px 22px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}.label{font-weight:800;font-size:10px;color:var(--gray3);margin-bottom:4px}.value{font-weight:800;font-size:13px}.timeline{border-left:2px solid var(--gray1);margin-left:5px;padding-left:18px}.event{position:relative;padding:0 0 18px}.event::before{content:'';position:absolute;left:-24px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--yellow);border:2px solid #fff}.event-title{font-weight:900;font-size:13px}.event-message{font-weight:700;font-size:12px;line-height:1.6;color:var(--gray3);margin-top:3px}
@media(max-width:720px){.wrap{padding:28px 18px 70px}.page-head{align-items:flex-start}.title{font-size:28px}.request{grid-template-columns:1fr auto}.request-status{grid-column:1/2}.view-btn{grid-column:2;grid-row:1/3}.detail-grid{grid-template-columns:1fr}}
</style>
<style>
.request-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
.review-btn{display:inline-flex;align-items:center;justify-content:center;min-width:92px;height:36px;padding:0 12px;border:1.5px solid var(--black);border-radius:8px;background:var(--black);color:#fff;text-decoration:none;font-weight:900;font-size:12px}
@media(max-width:720px){.request-actions{grid-column:2;grid-row:1/3;flex-direction:column}.request-actions .view-btn{grid-column:auto;grid-row:auto}}
</style>
</head>
<body>
<script src="../js/nav.js"></script>
<main class="wrap">
  <header class="page-head">
    <div><p class="eyebrow">MOWO CUSTOM</p><h1 class="title">我的定制</h1><p class="sub">查看草稿、人工处理进度和待确认方案</p></div>
    <a class="new-btn" href="customize-start.html">＋ 新建定制</a>
  </header>
  <div class="submitted" id="submittedBanner"></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-filter="ALL">全部</button><button class="tab" data-filter="DRAFT">草稿</button>
    <button class="tab" data-filter="PROCESSING">处理中</button><button class="tab" data-filter="ACTION">待我确认</button>
    <button class="tab" data-filter="CLOSED">已结束</button>
  </div>
  <div class="list" id="list"><div class="loading">正在加载</div></div>
</main>
<div class="modal-bg" id="detailModal" onclick="if(event.target===this)closeDetail()"><section class="modal"><div class="modal-head"><div><p class="eyebrow">定制记录</p><h2 class="modal-title" id="detailTitle">—</h2></div><button class="close" onclick="closeDetail()">×</button></div><div class="modal-body" id="detailBody"></div></section></div>
<script>
const API=window.MOWO_API_BASE||'';
const LABEL={DRAFT:'草稿',EXPIRING:'草稿清理中',SUBMITTED:'等待处理',REVIEWING:'正在处理',NEEDS_SUPPLEMENT:'需要补充素材',OPTIONS_READY:'待确认筛帧',FRAME_ACCEPTED:'筛帧已确认，请选款式',STYLE_SELECTED:'款式已选择，请提交订单',UNAVAILABLE:'暂时无法制作',CONFIRMED:'已进入订单',CLOSED:'已关闭'};
let items=[],filter='ALL';
function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function statusClass(s){if(['DRAFT','EXPIRING'].includes(s))return's-draft';if(s==='SUBMITTED')return's-wait';if(['REVIEWING','STYLE_SELECTED'].includes(s))return's-work';if(['NEEDS_SUPPLEMENT','OPTIONS_READY','FRAME_ACCEPTED'].includes(s))return's-action';if(s==='CONFIRMED')return's-ok';return's-closed'}
function groupMatch(item){if(filter==='ALL')return true;if(filter==='PROCESSING')return['SUBMITTED','REVIEWING','STYLE_SELECTED'].includes(item.status);if(filter==='ACTION')return['NEEDS_SUPPLEMENT','OPTIONS_READY','FRAME_ACCEPTED'].includes(item.status);if(filter==='CLOSED')return['UNAVAILABLE','CONFIRMED','CLOSED'].includes(item.status);return item.status===filter}
function fmtTime(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—'}
function render(){const rows=items.filter(groupMatch);document.getElementById('list').innerHTML=rows.length?rows.map(item=>{const review=['OPTIONS_READY','FRAME_ACCEPTED'].includes(item.status);return`<article class="request"><div class="request-main"><div class="request-no">${esc(item.requestNo||'未提交草稿')}</div><div class="request-name">${esc(item.model?.name||'定制款式')}</div><div class="meta"><span class="chip">${item.mode==='HUMAN'?'人工帮忙筛选':'自己筛选'}</span><span class="chip">第 ${item.version} 版</span>${item.desiredSku?`<span class="chip">${esc(item.desiredSku.size)} · ${esc(item.desiredSku.material)}</span>`:''}</div></div><div class="request-status"><div class="status ${statusClass(item.status)}">${esc(LABEL[item.status]||item.status)}</div><div class="time">更新于 ${fmtTime(item.updatedAt)}</div></div><div class="request-actions"><button class="view-btn" onclick="openDetail('${item.id}')">查看</button>${review?`<a class="review-btn" href="customize-editor.html?reviewRequestId=${encodeURIComponent(item.id)}">${item.status==='OPTIONS_READY'?'确认筛帧':'继续选款式'}</a>`:''}</div></article>`}).join(''):'<div class="empty">这里暂时没有定制记录</div>'}
async function load(){const token=localStorage.getItem('mowo_token');if(!token){const redirect=location.pathname+location.search;location.href=`index.html?auth=1&redirect=${encodeURIComponent(redirect)}`;return}try{const r=await fetch(`${API}/api/customization-requests/mine?limit=50`,{headers:{Authorization:`Bearer ${token}`}});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||'加载失败');items=j.data.items;render()}catch(e){document.getElementById('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function openDetail(id){const token=localStorage.getItem('mowo_token');try{const r=await fetch(`${API}/api/customization-requests/mine/${encodeURIComponent(id)}`,{headers:{Authorization:`Bearer ${token}`}});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||'加载失败');const d=j.data;document.getElementById('detailTitle').textContent=d.requestNo||'未提交草稿';document.getElementById('detailBody').innerHTML=`<div class="detail-grid"><div><div class="label">处理方式</div><div class="value">${d.mode==='HUMAN'?'人工帮忙筛选':'自己筛选'}</div></div><div><div class="label">当前状态</div><div class="value">${esc(LABEL[d.status]||d.status)}</div></div><div><div class="label">款式</div><div class="value">${esc(d.model?.name||'—')}</div></div><div><div class="label">素材版本</div><div class="value">第 ${d.version} 版</div></div></div><div class="timeline">${d.events.map(e=>`<div class="event"><div class="event-title">${esc(LABEL[e.toStatus]||e.eventType)}</div><div class="event-message">${esc(e.publicMessage||'记录已更新')} · ${fmtTime(e.createdAt)}</div></div>`).join('')}</div>`;document.getElementById('detailModal').classList.add('open')}catch(e){alert(e.message)}}
function closeDetail(){document.getElementById('detailModal').classList.remove('open')}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
const submitted=new URLSearchParams(location.search).get('submitted');if(submitted){const b=document.getElementById('submittedBanner');b.textContent=`定制需求 ${submitted} 已提交，可在这里查看处理进度。`;b.classList.add('show')}
load();
</script>
<script src="../js/auth.js"></script>
</body>
</html>
