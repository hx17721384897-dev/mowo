<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的收藏 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;--accent-b:#7EC8E3;
  --red:#E03030;--font:'Nunito','Noto Sans SC',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);--nav-h:65px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}
a{text-decoration:none;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:var(--nav-h);background:rgba(245,243,239,.96);backdrop-filter:blur(20px);border-bottom:1.5px solid var(--gray1);}
@media(min-width:1024px){.nav{padding:0 48px;}}
.nav-logo{line-height:1;}
.nav-logo-cn{font-weight:900;font-size:22px;color:var(--black);display:block;}
.nav-logo-en{font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray3);display:block;margin-top:1px;}
.nav-links{display:none;list-style:none;gap:32px;}
@media(min-width:1024px){.nav-links{display:flex;}}
.nav-links a{font-weight:800;font-size:14px;color:var(--gray3);transition:color .2s;}
.nav-links a:hover{color:var(--black);}
.nav-right{display:flex;align-items:center;gap:8px;}

/* User dropdown */
.nav-user{position:relative;}
.nav-avatar-btn{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:2px solid transparent;transition:border-color .2s,background .2s;min-height:44px;}
.nav-avatar-btn:hover,.nav-avatar-btn.open{border-color:var(--gray1);background:var(--white);}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);border:1.5px solid rgba(0,0,0,.08);flex-shrink:0;}
.nav-uname{font-weight:800;font-size:13px;display:none;}
@media(min-width:640px){.nav-uname{display:block;}}
.nav-chevron{font-size:10px;color:var(--gray3);transition:transform .25s var(--ease);}
.nav-avatar-btn.open .nav-chevron{transform:rotate(180deg);}

.user-dropdown{position:absolute;top:calc(100% + 10px);right:0;width:232px;background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);box-shadow:0 8px 40px rgba(0,0,0,.12);padding:8px;opacity:0;pointer-events:none;transform:translateY(-8px) scale(.97);transform-origin:top right;transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:100;}
.user-dropdown.open{opacity:1;pointer-events:all;transform:none;}
.dropdown-head{padding:12px 14px 14px;border-bottom:1px solid var(--gray1);margin-bottom:6px;display:flex;align-items:center;gap:12px;}
.dh-av{width:38px;height:38px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:var(--black);border:2px solid var(--gray1);}
.dh-name{font-weight:900;font-size:14px;}
.dh-role{font-size:11px;font-weight:700;color:var(--gray3);margin-top:2px;}
.di{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:12px;font-weight:800;font-size:13px;color:var(--black);transition:background .15s;width:100%;text-align:left;position:relative;}
.di:hover{background:var(--cream);}
.di-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.di.cart .di-ic{background:#FFF3EC;}
.di.fav .di-ic{background:#FFFBE6;}
.di.orders .di-ic{background:#EDFBEE;}
.di.works .di-ic{background:#EBF5FF;}
.di.dashboard .di-ic{background:#F0EBFF;}
.di.settings .di-ic,.di.help .di-ic{background:var(--gray1);}
.di.danger{color:var(--red);}
.di.danger:hover{background:#FFF5F5;}
.di.danger .di-ic{background:#FFF5F5;}
.dd-divider{height:1px;background:var(--gray1);margin:6px 0;}
/* cart badge */
.cart-bdg{margin-left:auto;background:var(--accent-o);color:var(--white);font-weight:900;font-size:10px;padding:2px 7px;border-radius:999px;min-width:20px;text-align:center;transition:transform .3s var(--ease);}
.cart-bdg.bump{animation:bdgBump .35s var(--ease);}
.cart-bdg.zero{display:none;}
@keyframes bdgBump{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}

/* PAGE */
.page{max-width:1100px;margin:0 auto;padding:calc(var(--nav-h) + 52px) 24px 100px;}
@media(min-width:1024px){.page{padding:calc(var(--nav-h) + 64px) 48px 100px;}}

.page-header{margin-bottom:32px;}
.page-title{font-weight:900;font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;line-height:1.1;margin-bottom:6px;}
.page-title em{font-style:normal;background:var(--accent-y);padding:1px 9px;border-radius:8px;transform:rotate(-1.5deg);display:inline-block;}
.page-sub{font-weight:700;font-size:14px;color:var(--gray3);}

/* Cart nudge bar */
.cart-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--white);border:1.5px solid var(--gray1);border-radius:16px;padding:14px 20px;margin-bottom:32px;}
.cart-bar-info{font-weight:800;font-size:14px;}
.cart-bar-info strong{color:var(--accent-o);}
.btn-go-cart{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:999px;font-weight:900;font-size:13px;background:var(--black);color:var(--white);transition:opacity .2s;min-height:40px;}
.btn-go-cart:hover{opacity:.82;}

/* FAV GRID */
.fav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media(min-width:600px){.fav-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:1024px){.fav-grid{grid-template-columns:repeat(4,1fr);gap:20px;}}

.fav-card{background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);overflow:hidden;cursor:pointer;transition:transform .28s var(--ease),box-shadow .28s,border-color .28s;position:relative;}
.fav-card:hover{transform:translateY(-5px);box-shadow:0 14px 40px rgba(0,0,0,.1);border-color:var(--gray2);}
.fav-cover{position:relative;aspect-ratio:1/1;overflow:hidden;}
.fc-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:clamp(36px,8vw,56px);transition:transform .4s var(--ease);}
.fav-card:hover .fc-inner{transform:scale(1.06);}
.fc-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.48),transparent 55%);opacity:0;transition:opacity .28s;}
.fav-card:hover .fc-overlay{opacity:1;}
.badge-sale{position:absolute;top:10px;left:10px;background:var(--accent-o);color:var(--white);font-weight:900;font-size:10px;padding:3px 10px;border-radius:999px;pointer-events:none;}
.btn-unfav{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(17,17,16,.5);backdrop-filter:blur(8px);color:var(--white);font-size:13px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s,background .2s;z-index:2;}
.fav-card:hover .btn-unfav{opacity:1;}
.btn-unfav:hover{background:rgba(220,40,40,.75);}

.fav-body{padding:12px 14px 15px;}
.fav-meta{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.fav-av{width:20px;height:20px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:8px;color:var(--black);}
.fav-author{font-weight:800;font-size:11px;color:var(--gray3);}
.fav-title{font-weight:900;font-size:13px;line-height:1.45;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fav-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.fav-price{font-weight:900;font-size:14px;}
.fav-price small{font-weight:700;font-size:10px;color:var(--gray3);}
.fav-price.view-only{font-weight:700;font-size:12px;color:var(--gray3);}
.btn-add-cart{display:flex;align-items:center;gap:4px;padding:7px 13px;border-radius:999px;font-weight:900;font-size:11px;background:var(--black);color:var(--white);flex-shrink:0;transition:opacity .2s,transform .15s;}
.btn-add-cart:hover{opacity:.82;}
.btn-add-cart:active{transform:scale(.93);}

/* EMPTY */
.empty-state{text-align:center;padding:88px 24px;}
.empty-icon{font-size:60px;margin-bottom:18px;opacity:.4;}
.empty-title{font-weight:900;font-size:20px;margin-bottom:8px;}
.empty-desc{font-weight:700;font-size:14px;color:var(--gray3);line-height:1.9;margin-bottom:26px;}
.btn-go{display:inline-flex;align-items:center;gap:7px;padding:13px 26px;border-radius:999px;font-weight:900;font-size:13px;background:var(--black);color:var(--white);transition:opacity .2s;}
.btn-go:hover{opacity:.82;}

/* ═══════════ WORK DETAIL MODAL ═══════════ */
.modal-bg{position:fixed;inset:0;z-index:800;background:rgba(17,17,16,.6);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);}
@media(min-width:720px){.modal-bg{align-items:center;padding:24px;}}
.modal-bg.open{opacity:1;pointer-events:all;}

.wm{width:100%;max-width:900px;max-height:93vh;background:var(--white);border-radius:28px 28px 0 0;overflow-y:auto;transform:translateY(56px);transition:transform .42s var(--ease);position:relative;}
@media(min-width:720px){.wm{border-radius:28px;max-height:90vh;transform:translateY(28px) scale(.97);}}
.modal-bg.open .wm{transform:none;}

.wm-drag{width:40px;height:4px;border-radius:2px;background:var(--gray1);display:block;margin:14px auto 0;}
@media(min-width:720px){.wm-drag{display:none;}}

.wm-close{position:sticky;top:12px;float:right;margin:12px 16px 0 0;width:34px;height:34px;border-radius:50%;background:var(--gray1);color:var(--gray3);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .18s;z-index:10;flex-shrink:0;}
.wm-close:hover{background:var(--gray2);color:var(--black);}

.wm-body{display:grid;grid-template-columns:1fr;clear:both;}
@media(min-width:720px){.wm-body{grid-template-columns:1fr 1fr;min-height:500px;}}

/* Media side */
.wm-media{background:var(--gray1);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
@media(min-width:720px){.wm-media{aspect-ratio:auto;border-radius:0 0 0 28px;}}
.wm-media-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;opacity:.15;pointer-events:none;}
.wm-media-emoji{position:relative;z-index:1;font-size:clamp(72px,14vw,104px);}

/* Info side */
.wm-info{padding:24px 24px 32px;overflow-y:auto;}
@media(min-width:720px){.wm-info{padding:36px 32px 40px;max-height:90vh;}}

.wm-author-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.wm-av{width:40px;height:40px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--black);border:2px solid var(--gray1);flex-shrink:0;}
.wm-aname{font-weight:900;font-size:14px;}
.wm-asub{font-weight:700;font-size:11px;color:var(--gray3);margin-top:2px;}
.btn-follow{margin-left:auto;padding:8px 16px;border-radius:999px;border:2px solid var(--black);font-weight:900;font-size:12px;color:var(--black);transition:all .2s;flex-shrink:0;}
.btn-follow:hover,.btn-follow.on{background:var(--black);color:var(--white);}

.wm-title{font-weight:900;font-size:clamp(17px,3vw,22px);letter-spacing:-.02em;line-height:1.3;margin-bottom:10px;}
.wm-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.wm-tag{padding:4px 12px;border-radius:999px;background:var(--gray1);font-weight:800;font-size:11px;color:var(--gray3);}

.wm-stats{display:flex;gap:24px;margin-bottom:18px;padding:14px 0;border-top:1px solid var(--gray1);border-bottom:1px solid var(--gray1);}
.wm-stat-n{font-weight:900;font-size:18px;display:block;}
.wm-stat-l{font-weight:700;font-size:11px;color:var(--gray3);}

.wm-desc{font-weight:700;font-size:13px;color:var(--gray3);line-height:1.85;margin-bottom:18px;}

.wm-specs{border-radius:14px;border:1.5px solid var(--gray1);overflow:hidden;margin-bottom:22px;}
.spec-row{display:flex;padding:10px 16px;border-bottom:1px solid var(--gray1);}
.spec-row:last-child{border-bottom:none;}
.spec-k{font-weight:800;font-size:12px;color:var(--gray3);width:76px;flex-shrink:0;}
.spec-v{font-weight:800;font-size:12px;color:var(--black);}

.sec-label{font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray3);margin-bottom:12px;display:block;}

.machine-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:22px;}
.m-opt{border:2px solid var(--gray1);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:center;transition:all .2s;}
.m-opt:hover{border-color:var(--gray2);}
.m-opt.sel{border-color:var(--black);background:var(--cream);}
.m-opt-ic{font-size:22px;margin-bottom:4px;}
.m-opt-name{font-weight:900;font-size:12px;}
.m-opt-price{font-weight:700;font-size:11px;color:var(--gray3);margin-top:2px;}

/* CTA box */
.wm-cta{background:var(--black);border-radius:18px;padding:20px;}
.cta-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:3px;}
.cta-price{font-weight:900;font-size:28px;color:var(--white);}
.cta-orig{font-weight:700;font-size:14px;color:var(--gray3);text-decoration:line-through;}
.cta-hint{font-weight:700;font-size:12px;color:var(--gray3);margin-bottom:16px;min-height:18px;}
.cta-hint span{color:var(--accent-y);font-weight:900;}
.cta-btns{display:flex;gap:10px;}
.btn-buy{flex:1;height:52px;border-radius:14px;background:var(--accent-y);color:var(--black);font-weight:900;font-size:14px;transition:opacity .18s;}
.btn-buy:hover{opacity:.85;}
.btn-cart-modal{flex:1;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.2);color:var(--white);font-weight:900;font-size:14px;transition:border-color .18s,background .18s;}
.btn-cart-modal:hover{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.07);}
.btn-cart-modal:disabled{opacity:.3;cursor:not-allowed;}

/* ═══ FLY ANIMATION ═══ */
.fly-dot{position:fixed;z-index:9999;border-radius:14px;display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.22);}
@keyframes cartBounce{0%,100%{transform:scale(1)}40%{transform:scale(1.25)}70%{transform:scale(.9)}}
.bounce{animation:cartBounce .4s var(--ease);}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);z-index:9500;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* REVEAL */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
.reveal.on{opacity:1;transform:none;}
.d1{transition-delay:.06s}.d2{transition-delay:.12s}.d3{transition-delay:.18s}.d4{transition-delay:.24s}

/* CURSOR */
#cdot,#cring{position:fixed;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
#cdot{width:8px;height:8px;background:var(--black);}
#cring{width:32px;height:32px;border:1.5px solid rgba(17,17,16,.25);transition:width .3s,height .3s;}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo-cn">哞屋</span>
    <span class="nav-logo-en">MOWO</span>
  </a>
  <ul class="nav-links">
    <li><a href="about.html">关于我们</a></li>
    <li><a href="products.html">产品介绍</a></li>
    <li><a href="community.html">社区分享</a></li>
    <li><a href="customize-start.html">创作中心</a></li>
    <li><a href="contact.html">联络我们</a></li>
  </ul>
  <div class="nav-right">
    <div class="nav-user">
      <button class="nav-avatar-btn" id="navBtn" onclick="toggleDD()">
        <div class="nav-avatar" id="navAv">橘</div>
        <span class="nav-uname">小橘酱</span>
        <span class="nav-chevron">▾</span>
      </button>
      <div class="user-dropdown" id="userDD">
        <div class="dropdown-head">
          <div class="dh-av">橘</div>
          <div><div class="dh-name">小橘酱</div><div class="dh-role">普通用户</div></div>
        </div>
        <button class="di cart" onclick="goCart()">
          <div class="di-ic">🛒</div><span>购物车</span>
          <span class="cart-bdg" id="cartBdg">3</span>
        </button>
        <button class="di fav" onclick="closeDD()">
          <div class="di-ic">❤</div><span>我的收藏</span>
        </button>
        <button class="di orders"><div class="di-ic">📦</div><span>我的订单</span></button>
        <button class="di works"><div class="di-ic">🎨</div><span>我的作品</span></button>
        <button class="di dashboard"><div class="di-ic">📊</div><span>创作者数据台</span></button>
        <div class="dd-divider"></div>
        <button class="di settings"><div class="di-ic">⚙️</div><span>账号设置</span></button>
        <button class="di help"><div class="di-ic">💬</div><span>帮助与反馈</span></button>
        <div class="dd-divider"></div>
        <button class="di danger"><div class="di-ic">🚪</div><span>退出登录</span></button>
      </div>
    </div>
  </div>
</nav>

<!-- PAGE -->
<main class="page">
  <div class="page-header reveal">
    <h1 class="page-title">我的收藏 <em>❤</em></h1>
    <p class="page-sub">点击作品查看详情，选好机型加入购物车</p>
  </div>

  <div class="cart-bar reveal d1">
    <span class="cart-bar-info">购物车中有 <strong id="cartBarCount">3</strong> 件商品等待结算</span>
    <a href="cart.html" class="btn-go-cart">去购物车 →</a>
  </div>

  <div class="fav-grid" id="favGrid"></div>
  <div class="empty-state" id="favEmpty" style="display:none">
    <div class="empty-icon">🔖</div>
    <div class="empty-title">还没有收藏任何作品</div>
    <div class="empty-desc">在社区浏览时，点击作品上的 ❤ 收藏<br>喜欢的作品会在这里等你</div>
    <a href="community.html" class="btn-go">去社区逛逛 →</a>
  </div>
</main>

<!-- WORK DETAIL MODAL -->
<div class="modal-bg" id="modalBg" onclick="handleBgClick(event)">
  <div class="wm" id="wm" onclick="event.stopPropagation()">
    <span class="wm-drag"></span>
    <button class="wm-close" onclick="closeModal()">✕</button>
    <div class="wm-body">
      <!-- media -->
      <div class="wm-media" id="wmMedia">
        <div class="wm-media-bg" id="wmBg"></div>
        <div class="wm-media-emoji" id="wmEmoji"></div>
      </div>
      <!-- info -->
      <div class="wm-info">
        <div class="wm-author-row">
          <div class="wm-av" id="wmAv"></div>
          <div>
            <div class="wm-aname" id="wmAname"></div>
            <div class="wm-asub" id="wmAsub"></div>
          </div>
          <button class="btn-follow" id="btnFollow" onclick="toggleFollow()">+ 关注</button>
        </div>
        <div class="wm-title" id="wmTitle"></div>
        <div class="wm-tags" id="wmTags"></div>
        <div class="wm-stats">
          <div><span class="wm-stat-n" id="wmViews"></span><span class="wm-stat-l">浏览</span></div>
          <div><span class="wm-stat-n" id="wmLikes"></span><span class="wm-stat-l">点赞</span></div>
          <div><span class="wm-stat-n" id="wmSold"></span><span class="wm-stat-l">已售</span></div>
        </div>
        <div class="wm-desc" id="wmDesc"></div>
        <div class="wm-specs" id="wmSpecs"></div>
        <span class="sec-label">选择适配机型</span>
        <div class="machine-grid" id="wmMachines"></div>
        <div class="wm-cta">
          <div class="cta-price-row">
            <span class="cta-price" id="ctaPrice">—</span>
            <span class="cta-orig" id="ctaOrig"></span>
          </div>
          <div class="cta-hint" id="ctaHint">请先选择机型</div>
          <div class="cta-btns">
            <button class="btn-buy" onclick="buyNow()">立即购买</button>
            <button class="btn-cart-modal" id="btnCartModal" onclick="doAddToCart()" disabled>加入购物车</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─── DATA ─── */
const MACHINES=[
  {id:'m1',name:'经典圆筒款',icon:'🥫',price:199},
  {id:'m2',name:'扁圆盒款',  icon:'🪀',price:179},
  {id:'m3',name:'木质方框款',icon:'🪵',price:229},
  {id:'m4',name:'迷你随身款',icon:'📦',price:149},
];
const WORKS=[
  {id:'w1',title:'奔跑的橘猫 · 12帧循环',author:'小橘工作室',init:'橘',fans:'1.4万',bg:'#FFF3EC',em:'🐈',sale:true,price:89,orig:129,tags:['可爱','猫咪','循环'],frames:12,style:'手绘',views:'12,041',likes:'2,401',sold:87,desc:'一只永远在奔跑的橘猫。完美12帧循环，经典圆筒款体验最佳。'},
  {id:'w2',title:'夏日海浪 · 8帧',author:'波波动画',init:'波',fans:'892',bg:'#EBF5FF',em:'🌊',sale:true,price:79,orig:null,tags:['夏日','海浪'],frames:8,style:'插画',views:'8,200',likes:'1,103',sold:45,desc:'蓝色的海浪一遍遍涌来，带来夏天的气息。'},
  {id:'w3',title:'像素小人跑步循环',author:'方块人',init:'方',fans:'3,200',bg:'#EDFBEE',em:'🏃',sale:false,price:null,orig:null,tags:['像素','游戏感'],frames:12,style:'像素',views:'5,601',likes:'890',sold:0,desc:'复古像素风格，致敬经典游戏时代。仅供欣赏。'},
  {id:'w4',title:'星空流转 · 24帧',author:'宇宙君',init:'宇',fans:'6,100',bg:'#F0EBFF',em:'✨',sale:true,price:129,orig:169,tags:['星空','梦幻','高帧'],frames:24,style:'手绘',views:'23,000',likes:'5,214',sold:203,desc:'满天星辰缓缓流动，24帧超流畅，观赏效果极佳。'},
  {id:'w5',title:'咖啡泡泡 · 18帧',author:'咖啡猫',init:'咖',fans:'445',bg:'#FFF8ED',em:'☕',sale:true,price:69,orig:null,tags:['生活','咖啡'],frames:18,style:'手绘',views:'3,100',likes:'412',sold:28,desc:'看着咖啡杯里的泡泡一颗颗升起，治愈又解压。'},
  {id:'w6',title:'雨滴落下 · 12帧',author:'雨声工作室',init:'雨',fans:'2,088',bg:'#EBF5FF',em:'🌧️',sale:true,price:89,orig:109,tags:['雨天','治愈'],frames:12,style:'插画',views:'9,800',likes:'1,890',sold:76,desc:'窗外雨滴一滴滴落下，静谧又沉稳的节奏。'},
];

let cartCount=3;
let curWorkId=null;
let selMachine=null;
let following=new Set();

/* ─── RENDER FAVS ─── */
function renderFavs(){
  const grid=document.getElementById('favGrid');
  const empty=document.getElementById('favEmpty');
  if(!WORKS.length){grid.style.display='none';empty.style.display='block';return;}
  grid.style.display='';empty.style.display='none';
  grid.innerHTML=WORKS.map((w,i)=>`
    <div class="fav-card reveal" style="transition-delay:${i*0.05}s" onclick="openModal('${w.id}')">
      <div class="fav-cover" style="background:${w.bg}">
        <div class="fc-inner">${w.em}</div>
        <div class="fc-overlay"></div>
        ${w.sale?'<div class="badge-sale">可购买</div>':''}
        <button class="btn-unfav" onclick="unfav(event,'${w.id}')">✕</button>
      </div>
      <div class="fav-body">
        <div class="fav-meta"><div class="fav-av">${w.init}</div><span class="fav-author">${w.author}</span></div>
        <div class="fav-title">${w.title}</div>
        <div class="fav-foot">
          ${w.sale&&w.price
            ?`<span class="fav-price">¥${w.price}<small> 起</small></span>
              <button class="btn-add-cart" onclick="openModal(event,'${w.id}')">+ 加购</button>`
            :`<span class="fav-price view-only">仅欣赏</span>`}
        </div>
      </div>
    </div>`).join('');
  document.querySelectorAll('.fav-card.reveal').forEach(el=>revObs.observe(el));
}

function unfav(e,id){
  e.stopPropagation();
  const i=WORKS.findIndex(w=>w.id===id);
  if(i>-1){WORKS.splice(i,1);renderFavs();toast('已取消收藏');}
}

/* ─── MODAL ─── */
function openModal(eOrId,id){
  let wid=id||eOrId;
  if(eOrId&&eOrId.stopPropagation){eOrId.stopPropagation();wid=id;}
  const w=WORKS.find(x=>x.id===wid);
  if(!w)return;
  curWorkId=wid; selMachine=null;

  document.getElementById('wmMedia').style.background=w.bg;
  document.getElementById('wmBg').textContent=w.em;
  document.getElementById('wmEmoji').textContent=w.em;
  document.getElementById('wmAv').textContent=w.init;
  document.getElementById('wmAname').textContent=w.author;
  document.getElementById('wmAsub').textContent=`${w.fans} 粉丝`;
  document.getElementById('wmTitle').textContent=w.title;
  document.getElementById('wmViews').textContent=w.views;
  document.getElementById('wmLikes').textContent=w.likes;
  document.getElementById('wmSold').textContent=w.sold;
  document.getElementById('wmDesc').textContent=w.desc;
  document.getElementById('wmTags').innerHTML=(w.tags||[]).map(t=>`<span class="wm-tag">${t}</span>`).join('');
  document.getElementById('wmSpecs').innerHTML=`
    <div class="spec-row"><span class="spec-k">帧数</span><span class="spec-v">${w.frames} 帧</span></div>
    <div class="spec-row"><span class="spec-k">风格</span><span class="spec-v">${w.style}</span></div>
    <div class="spec-row"><span class="spec-k">授权</span><span class="spec-v">个人非商业使用</span></div>`;

  // Follow
  const bf=document.getElementById('btnFollow');
  bf.textContent=following.has(wid)?'✓ 已关注':'+ 关注';
  bf.classList.toggle('on',following.has(wid));

  // Machines
  if(w.sale){
    document.getElementById('wmMachines').innerHTML=MACHINES.map(m=>`
      <div class="m-opt" id="mo-${m.id}" onclick="pickMachine('${m.id}')">
        <div class="m-opt-ic">${m.icon}</div>
        <div class="m-opt-name">${m.name}</div>
        <div class="m-opt-price">+¥${m.price}</div>
      </div>`).join('');
    document.getElementById('ctaPrice').textContent=`¥${w.price}`;
    document.getElementById('ctaOrig').textContent=w.orig?`¥${w.orig}`:'';
    document.getElementById('ctaHint').innerHTML='请先选择机型';
    document.getElementById('btnCartModal').disabled=true;
  } else {
    document.getElementById('wmMachines').innerHTML='<div style="grid-column:1/-1;font-weight:700;font-size:13px;color:var(--gray3);padding:2px 0 8px">此作品仅供欣赏，暂不开放购买</div>';
    document.getElementById('ctaPrice').textContent='仅欣赏';
    document.getElementById('ctaOrig').textContent='';
    document.getElementById('ctaHint').textContent='';
    document.getElementById('btnCartModal').disabled=true;
  }

  document.getElementById('modalBg').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
  document.body.style.overflow='';
  curWorkId=null; selMachine=null;
}

function handleBgClick(e){
  if(e.target.id==='modalBg') closeModal();
}

function pickMachine(mid){
  selMachine=mid;
  const w=WORKS.find(x=>x.id===curWorkId);
  const m=MACHINES.find(x=>x.id===mid);
  document.querySelectorAll('.m-opt').forEach(el=>el.classList.remove('sel'));
  document.getElementById('mo-'+mid).classList.add('sel');
  if(w&&m){
    document.getElementById('ctaPrice').textContent=`¥${w.price+m.price}`;
    document.getElementById('ctaHint').innerHTML=`动画 ¥${w.price} + <span>${m.name}</span> ¥${m.price}`;
    document.getElementById('btnCartModal').disabled=false;
  }
}

function toggleFollow(){
  if(!curWorkId)return;
  if(following.has(curWorkId))following.delete(curWorkId);
  else following.add(curWorkId);
  const bf=document.getElementById('btnFollow');
  bf.textContent=following.has(curWorkId)?'✓ 已关注':'+ 关注';
  bf.classList.toggle('on',following.has(curWorkId));
}

function buyNow(){window.location.href='checkout.html';}

/* ─── ADD TO CART + FLY ─── */
function doAddToCart(){
  if(!selMachine||!curWorkId)return;
  const w=WORKS.find(x=>x.id===curWorkId);
  const m=MACHINES.find(x=>x.id===selMachine);
  if(!w||!m)return;

  // Source: the add-to-cart button inside modal
  const src=document.getElementById('btnCartModal');
  const sr=src.getBoundingClientRect();
  const sx=sr.left+sr.width/2, sy=sr.top+sr.height/2;

  // Target: nav avatar (cart is inside dropdown, so target the nav avatar as visual anchor)
  const tgt=document.getElementById('navAv');
  const tr=tgt.getBoundingClientRect();
  const tx=tr.left+tr.width/2, ty=tr.top+tr.height/2;

  closeModal();
  flyToCart(w.em, w.bg, sx, sy, tx, ty, ()=>{
    cartCount++;
    updateBadge();
    toast(`✓ 已加入购物车 · ${m.name}`);
  });
}

function flyToCart(em, bg, sx, sy, ex, ey, onDone){
  const el=document.createElement('div');
  el.className='fly-dot';
  el.textContent=em;
  el.style.cssText=`width:52px;height:52px;font-size:26px;background:${bg};left:${sx}px;top:${sy}px;`;
  document.body.appendChild(el);

  const dur=680, start=performance.now();
  function step(now){
    const t=Math.min((now-start)/dur,1);
    const e3=1-Math.pow(1-t,3);
    const arc=-200*Math.sin(Math.PI*t); // parabola arc
    const x=sx+(ex-sx)*e3;
    const y=sy+(ey-sy)*e3+arc;
    const s=1-0.7*e3;
    const op=t>0.72?1-(t-0.72)/0.28:1;
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.transform=`translate(-50%,-50%) scale(${s})`;
    el.style.opacity=op;
    if(t<1){requestAnimationFrame(step);}
    else{
      el.remove();
      // bounce nav avatar as cart indicator
      const av=document.getElementById('navAv');
      av.classList.remove('bounce'); void av.offsetWidth; av.classList.add('bounce');
      setTimeout(()=>av.classList.remove('bounce'),400);
      if(onDone)onDone();
    }
  }
  requestAnimationFrame(step);
}

/* ─── BADGE ─── */
function updateBadge(){
  const b=document.getElementById('cartBdg');
  b.textContent=cartCount;
  b.classList.toggle('zero',cartCount===0);
  b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  document.getElementById('cartBarCount').textContent=cartCount;
}

function goCart(){closeDD();window.location.href='cart.html';}

/* ─── DROPDOWN ─── */
function toggleDD(){
  const dd=document.getElementById('userDD'),btn=document.getElementById('navBtn');
  const o=dd.classList.toggle('open');
  btn.classList.toggle('open',o);
  if(o)setTimeout(()=>document.addEventListener('click',outsideDD),0);
}
function closeDD(){
  document.getElementById('userDD').classList.remove('open');
  document.getElementById('navBtn').classList.remove('open');
  document.removeEventListener('click',outsideDD);
}
function outsideDD(e){
  if(!document.getElementById('navBtn').contains(e.target)&&!document.getElementById('userDD').contains(e.target))closeDD();
}

/* ─── TOAST ─── */
let tT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ─── REVEAL ─── */
const revObs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');revObs.unobserve(e.target);}});
},{threshold:0.06});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

/* ─── CURSOR ─── */
if(window.matchMedia('(pointer:fine)').matches){
  const dot=document.createElement('div');dot.id='cdot';
  const ring=document.createElement('div');ring.id='cring';
  document.body.append(dot,ring);
  document.body.style.cursor='none';
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  (function tick(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(tick);})();
  document.querySelectorAll('a,button,.fav-card,.m-opt').forEach(el=>{
    el.addEventListener('mouseenter',()=>{ring.style.width='48px';ring.style.height='48px';});
    el.addEventListener('mouseleave',()=>{ring.style.width='32px';ring.style.height='32px';});
  });
}

/* ─── INIT ─── */
renderFavs();
updateBadge();
</script>
</body>
</html>
