<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>确认订单 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/nav.css">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;
  --red:#E03030;--font:'Nunito','Noto Sans SC',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);-webkit-font-smoothing:antialiased;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}
a{text-decoration:none;}
input,select{font-family:var(--font);}

/* LAYOUT */
.main{max-width:780px;margin:0 auto;padding:28px 20px 40px;}
@media(min-width:1024px){.main{padding:40px 24px 60px;}}

.page-title{font-weight:900;font-size:24px;margin-bottom:24px;display:flex;align-items:center;gap:10px;}
.back-link{color:var(--gray3);font-size:13px;font-weight:800;display:flex;align-items:center;gap:4px;margin-bottom:16px;}
.back-link:hover{color:var(--black);}

/* CARD */
.card{background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);padding:20px 24px;margin-bottom:16px;}
.card-title{font-weight:900;font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title .step-dot{width:22px;height:22px;border-radius:50%;background:var(--black);color:var(--white);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* PRODUCT LIST */
.product-list{display:flex;flex-direction:column;gap:12px;}
.product-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;}
.product-cover{width:64px;height:64px;border-radius:10px;background:var(--gray1);overflow:hidden;}
.product-cover img{width:100%;height:100%;object-fit:cover;}
.product-cover .cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;}
.product-name{font-weight:900;font-size:13px;line-height:1.3;margin-bottom:4px;}
.product-meta{font-size:11px;font-weight:700;color:var(--gray3);}
.product-price{font-weight:900;font-size:15px;text-align:right;}
.product-qty{font-size:11px;font-weight:700;color:var(--gray3);text-align:right;}

/* FORM */
.form-grid{display:grid;gap:12px;}
@media(min-width:600px){.form-grid.cols2{grid-template-columns:1fr 1fr;}}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:12px;font-weight:800;color:var(--gray3);}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--gray1);border-radius:12px;font-size:14px;font-weight:700;background:var(--cream);transition:border-color .2s;}
.form-input:focus{outline:none;border-color:var(--black);}
.form-input.error{border-color:var(--red);}
.error-msg{font-size:11px;font-weight:800;color:var(--red);}

/* COST BREAKDOWN */
.cost-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray1);font-size:13px;font-weight:700;}
.cost-row:last-child{border-bottom:none;}
.cost-row.total{font-size:16px;font-weight:900;padding-top:12px;}
.cost-row.free{color:var(--accent-g);}

/* CUSTOM CONFIRM */

/* PAY BUTTON */
.btn-pay{width:100%;background:var(--black);color:var(--white);font-weight:900;font-size:16px;padding:16px;border-radius:16px;transition:background .2s,transform .1s;}
.btn-pay:hover{background:#333;}
.btn-pay:active{transform:scale(.99);}
.btn-pay:disabled{background:var(--gray2);cursor:not-allowed;}

/* PAYMENT STATUS */
.pay-status-box{text-align:center;padding:40px 24px;}
.pay-status-icon{font-size:56px;margin-bottom:16px;}
.pay-status-title{font-weight:900;font-size:22px;margin-bottom:8px;}
.pay-status-desc{color:var(--gray3);font-size:14px;font-weight:700;margin-bottom:24px;}
.pay-timer{font-size:14px;font-weight:800;color:var(--accent-o);}
.btn-secondary{display:inline-block;background:var(--gray1);color:var(--black);font-weight:900;font-size:14px;padding:12px 28px;border-radius:999px;margin-top:12px;}

/* MOCK PAY BUTTON (dev only) */
.btn-mock-pay{background:#8FD694;color:var(--black);font-weight:900;font-size:14px;padding:12px 24px;border-radius:14px;border:2px dashed #5aaf60;margin-top:12px;width:100%;display:none;}

/* TOAST */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:10px 20px;border-radius:999px;z-index:2000;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ADDRESS SELECTOR */
.addr-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.addr-card-sel{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--gray1);border-radius:14px;cursor:pointer;transition:border-color .2s,background .2s;}
.addr-card-sel:hover{border-color:var(--gray2);}
.addr-card-sel.selected{border-color:var(--black);background:var(--cream);}
.addr-radio{width:18px;height:18px;border:2px solid var(--gray2);border-radius:50%;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:border-color .2s;}
.addr-card-sel.selected .addr-radio{border-color:var(--black);}
.addr-radio-dot{width:8px;height:8px;border-radius:50%;background:var(--black);display:none;}
.addr-card-sel.selected .addr-radio-dot{display:block;}
.addr-info{}
.addr-name{font-weight:900;font-size:14px;}
.addr-phone{font-size:12px;font-weight:700;color:var(--gray3);margin-left:8px;}
.addr-text{font-size:12px;font-weight:700;color:var(--gray3);margin-top:2px;}
.addr-default-tag{background:var(--accent-y);font-size:10px;font-weight:900;padding:1px 6px;border-radius:999px;margin-left:6px;color:var(--black);}
.btn-use-new{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--black);padding:8px 0;border-bottom:1.5px dashed var(--gray1);}
.btn-use-new::before{content:'＋';font-size:16px;}
.new-addr-form{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--gray1);}
.new-addr-form.open{display:block;}
.smart-row{display:flex;gap:8px;margin-bottom:12px;}
.smart-input{flex:1;padding:9px 12px;border:1.5px solid var(--gray1);border-radius:10px;font-size:13px;font-family:var(--font);font-weight:700;background:var(--white);outline:none;transition:border-color .2s;}
.smart-input:focus{border-color:var(--black);}
.btn-smart-parse{padding:9px 14px;border-radius:10px;background:var(--black);color:var(--white);font-weight:900;font-size:12px;white-space:nowrap;flex-shrink:0;}
.save-addr-check{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--gray3);margin-top:8px;cursor:pointer;}
.save-addr-check input{accent-color:var(--black);}
.form-row-addr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
@media(max-width:480px){.form-row-addr{grid-template-columns:1fr;}}
.form-row-addr.full{grid-template-columns:1fr;}
.form-sel{width:100%;padding:9px 12px;border:1.5px solid var(--gray1);border-radius:10px;font-size:13px;font-family:var(--font);font-weight:700;background:var(--white);color:var(--black);outline:none;transition:border-color .2s;}
.form-sel:focus{border-color:var(--black);}
.form-sel:disabled{color:var(--gray2);background:var(--cream);}
</style>
</head>
<body>

<script src="../js/runtime-config.js"></script>
<script src="../js/nav.js"></script>

<main class="main">
  <a href="./cart.html" class="back-link">← 返回购物车</a>
  <h1 class="page-title">确认订单</h1>

  <div id="pageContent">
    <div style="text-align:center;padding:60px 0;color:var(--gray3);font-weight:700;">加载中...</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="../js/auth.js"></script>
<script type="module">
// 地址工具模块（联级下拉 + 智能解析）
import { initCascadeSelects, smartParseAddress, loadRegions } from '../js/address-utils.js'

let _regions = null

// 初始化新地址表单的联级下拉
window._initCheckoutCascade = async function() {
  const provinceEl  = document.getElementById('newProvince')
  const cityEl      = document.getElementById('newCity')
  const districtEl  = document.getElementById('newDistrict')
  if (!provinceEl || !cityEl || !districtEl) return

  if (!_regions) _regions = await loadRegions()
  initCascadeSelects({ provinceEl, cityEl, districtEl, regions: _regions })
}

// 智能解析（在 checkout 页中使用）
window._smartParseCheckout = async function(text) {
  if (!_regions) _regions = await loadRegions()
  const parsed = smartParseAddress(text, _regions)

  if (parsed.name)  { const el = document.getElementById('newName');  if (el) el.value = parsed.name }
  if (parsed.phone) { const el = document.getElementById('newPhone'); if (el) el.value = parsed.phone }
  if (parsed.detail){ const el = document.getElementById('newDetail'); if (el) el.value = parsed.detail }

  if (parsed.province) {
    const pEl = document.getElementById('newProvince')
    const cEl = document.getElementById('newCity')
    const dEl = document.getElementById('newDistrict')
    if (pEl) {
      // 确保联级已初始化
      if (!pEl.options || pEl.options.length <= 1) await window._initCheckoutCascade()
      pEl.value = parsed.province
      pEl.dispatchEvent(new Event('change'))
      setTimeout(() => {
        if (cEl && parsed.city) {
          cEl.value = parsed.city
          cEl.dispatchEvent(new Event('change'))
          setTimeout(() => {
            if (dEl && parsed.district) dEl.value = parsed.district
          }, 0)
        }
      }, 0)
    }
  }

  // 显示置信度提示
  const conf = parsed.confidence
  const smartInput = document.getElementById('smartInput')
  if (smartInput) {
    if (conf === 'high') {
      smartInput.style.borderColor = 'var(--accent-g)'
    } else if (conf === 'medium') {
      smartInput.style.borderColor = '#FFD54F'
    }
  }

}
</script>
<script>
const API = window.MOWO_API_BASE || ''
// Mock 付款只由服务端隔离测试模式开放；普通本机访问不能自动看到伪支付入口。
let showTestMockPayment = false
let cartItemIds = []
let cartItems = []
let preOrderId = null
let pollTimer = null
let savedAddresses = []
let selectedAddressId = null
let checkoutIdempotencyKey = null

document.addEventListener('DOMContentLoaded', async () => {
  const token = localStorage.getItem('mowo_token')
  if (!token) {
    window.location.href = './cart.html'
    return
  }

  // 从 sessionStorage 获取待结算的 CartItem IDs
  try {
    const stored = sessionStorage.getItem('mowo_checkout_items')
    if (stored) cartItemIds = [...new Set(JSON.parse(stored))]
  } catch {}

  if (!cartItemIds.length) {
    window.location.href = './cart.html'
    return
  }

  // 并行加载购物车和地址数据，两者都完成后再统一渲染
  await Promise.all([
    loadFeatureFlags(),
    loadCartItems(token),
    loadSavedAddresses(token)
  ])
  renderCheckoutPage()
})

async function loadFeatureFlags() {
  try {
    const res = await fetch(`${API}/api/config/features`)
    const data = await res.json()
    showTestMockPayment = data.success === true && data.data?.mockPayment === true
  } catch {
    showTestMockPayment = false
  }
}

async function loadCartItems(token) {
  try {
    const res = await fetch(`${API}/api/cart`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    const data = await res.json()
    if (!data.success) throw new Error('加载失败')
    cartItems = (data.data.items || []).filter(i => cartItemIds.includes(i.id))
    // 不在此处渲染，由 DOMContentLoaded 的 Promise.all 之后统一调用 renderCheckoutPage()
  } catch(e) {
    document.getElementById('pageContent').innerHTML = `<div style="text-align:center;padding:60px;color:var(--red);font-weight:700;">加载失败，请返回购物车重试</div>`
  }
}

async function loadSavedAddresses(token) {
  try {
    const res = await fetch(`${API}/api/addresses`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    const data = await res.json()
    if (data.success) {
      savedAddresses = data.data || []
      // 默认选中默认地址
      const def = savedAddresses.find(a => a.isDefault)
      if (def) selectedAddressId = def.id
      else if (savedAddresses.length) selectedAddressId = savedAddresses[0].id
    }
  } catch(e) {
    // 地址加载失败不阻断结算
    savedAddresses = []
  }
}

function renderAddressSelector() {
  if (savedAddresses.length === 0) {
    // 无已保存地址，直接显示新地址表单（展开状态）
    return `<div id="newAddrForm" class="new-addr-form open">${buildNewAddrFormHtml()}</div>`
  }

  // 有已保存地址，渲染卡片列表 + 折叠的新地址表单
  let html = `<div class="addr-cards" id="addrCardList">`
  for (const addr of savedAddresses) {
    const mid = addr.phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2')
    const sel = addr.id === selectedAddressId ? ' selected' : ''
    html += `<div class="addr-card-sel${sel}" onclick="selectAddress('${escHtml(addr.id)}')">
      <div class="addr-radio"><div class="addr-radio-dot"></div></div>
      <div class="addr-info">
        <div><span class="addr-name">${escHtml(addr.name)}</span><span class="addr-phone">${escHtml(mid)}</span>${addr.isDefault ? '<span class="addr-default-tag">默认</span>' : ''}</div>
        <div class="addr-text">${escHtml(addr.province + addr.city + addr.district + ' ' + addr.detail)}</div>
      </div>
    </div>`
  }
  html += `</div>`
  html += `<button class="btn-use-new" onclick="toggleNewAddressForm()">使用新地址</button>`
  html += `<div id="newAddrForm" class="new-addr-form">${buildNewAddrFormHtml()}</div>`
  return html
}

function buildNewAddrFormHtml() {
  return `
    <div class="smart-row">
      <input type="text" class="smart-input" id="smartInput" placeholder="粘贴完整收货地址，一键识别姓名/手机/省市区">
      <button class="btn-smart-parse" onclick="doCheckoutSmartParse()">识别</button>
    </div>
    <div class="form-row-addr">
      <div class="form-field">
        <label class="form-label">收件人</label>
        <input type="text" class="form-input" id="newName" placeholder="姓名">
      </div>
      <div class="form-field">
        <label class="form-label">手机号</label>
        <input type="text" class="form-input" id="newPhone" placeholder="11位手机号" maxlength="11">
      </div>
    </div>
    <div class="form-row-addr" style="grid-template-columns:1fr 1fr 1fr;">
      <div class="form-field">
        <label class="form-label">省/直辖市</label>
        <select class="form-sel" id="newProvince"><option value="">请选择省/直辖市</option></select>
      </div>
      <div class="form-field">
        <label class="form-label">市/州</label>
        <select class="form-sel" id="newCity" disabled><option value="">请选择市/州</option></select>
      </div>
      <div class="form-field">
        <label class="form-label">区/县</label>
        <select class="form-sel" id="newDistrict" disabled><option value="">请选择区/县</option></select>
      </div>
    </div>
    <div class="form-row-addr full">
      <div class="form-field">
        <label class="form-label">详细地址</label>
        <input type="text" class="form-input" id="newDetail" placeholder="街道、楼号、门牌号等">
      </div>
    </div>
    <label class="save-addr-check">
      <input type="checkbox" id="saveAddrCheck" checked>
      保存到地址簿，下次直接使用
    </label>`
}

window.selectAddress = function(id) {
  selectedAddressId = id
  // 更新卡片选中样式
  document.querySelectorAll('.addr-card-sel').forEach(el => el.classList.remove('selected'))
  event.currentTarget.classList.add('selected')
  // 折叠新地址表单
  const newForm = document.getElementById('newAddrForm')
  if (newForm) newForm.classList.remove('open')
}

window.toggleNewAddressForm = function() {
  const newForm = document.getElementById('newAddrForm')
  if (!newForm) return
  const isOpen = newForm.classList.toggle('open')
  if (isOpen) {
    // 展开新地址表单时取消选中已保存地址
    selectedAddressId = null
    document.querySelectorAll('.addr-card-sel').forEach(el => el.classList.remove('selected'))
    // 初始化联级下拉（通知 module script）
    if (window._initCheckoutCascade) window._initCheckoutCascade()
  }
}

window.doCheckoutSmartParse = function() {
  const text = document.getElementById('smartInput')?.value || ''
  if (!text.trim()) return showToast('请先粘贴地址文本')
  if (window._smartParseCheckout) {
    window._smartParseCheckout(text)
  } else {
    showToast('识别模块加载中，请稍后重试')
  }
}

function renderCheckoutPage() {
  const totalAmount = cartItems.reduce((s, i) => {
    const p = i.currentPrice !== null && i.currentPrice !== undefined ? Number(i.currentPrice) : Number(i.snapshotPrice || 0)
    return s + p * i.quantity
  }, 0)

  let html = `
  <!-- 商品列表 -->
  <div class="card">
    <div class="card-title"><span class="step-dot">1</span> 商品确认</div>
    <div class="product-list">`

  for (const item of cartItems) {
    const price = item.currentPrice !== null && item.currentPrice !== undefined
      ? Number(item.currentPrice) : Number(item.snapshotPrice || 0)
    const cover = item.snapshotPreviewUrl || item.coverUrl
    html += `<div class="product-row">
      <div class="product-cover">${cover
        ? `<img src="${escHtml(cover)}" alt="" onerror="this.parentElement.innerHTML='<div class=cover-placeholder>🎨</div>'">`
        : `<div class="cover-placeholder">${item.itemType === 'CUSTOM' ? '🎨' : '🎁'}</div>`}
      </div>
      <div>
        <div class="product-name">${escHtml(item.snapshotTitle)}</div>
        <div class="product-meta">${item.itemType === 'CUSTOM' ? 'DIY 定制款' : '联名成品'} · ×${item.quantity}</div>
      </div>
      <div>
        <div class="product-price">¥${price.toFixed(2)}</div>
        <div class="product-qty">×${item.quantity}</div>
      </div>
    </div>`
  }
  html += `</div></div>`

  // 收货信息（地址选择器）
  html += `
  <div class="card">
    <div class="card-title"><span class="step-dot">2</span> 收货信息</div>
    <div id="addrSelectorArea">${renderAddressSelector()}</div>
  </div>`

  // 费用明细
  html += `
  <div class="card">
    <div class="card-title"><span class="step-dot">3</span> 费用明细</div>
    <div class="cost-row"><span>商品小计</span><span>¥${totalAmount.toFixed(2)}</span></div>
    <div class="cost-row free"><span>运费</span><span>包邮 ¥0</span></div>
    <div class="cost-row total"><span>合计</span><span id="checkoutTotal">¥${totalAmount.toFixed(2)}</span></div>
  </div>`

  // Web 只生成待付款订单，真实付款由微信小程序承接。
  html += `
  <button class="btn-pay" id="btnPay" onclick="submitPayment()">
    提交订单 ¥${totalAmount.toFixed(2)}
  </button>
  <button class="btn-mock-pay" id="btnMockPay" onclick="mockPay()">
    🧪 开发模式：模拟支付成功
  </button>`

  document.getElementById('pageContent').innerHTML = html

  // 仅显式测试会话显示 mock 按钮，不能仅凭 localhost 自动开放。
  if (showTestMockPayment) {
    document.getElementById('btnMockPay').style.display = 'block'
  }

  // 若无已保存地址（新地址表单直接展开），初始化联级下拉
  if (savedAddresses.length === 0 && window._initCheckoutCascade) {
    window._initCheckoutCascade()
  }
}

async function submitPayment() {
  // 获取收货地址
  let receiverName = '', receiverPhone = '', receiverAddress = '', receiverCity = ''

  if (selectedAddressId) {
    // 使用已保存地址
    const addr = savedAddresses.find(a => a.id === selectedAddressId)
    if (!addr) return showToast('请选择收货地址')
    receiverName    = addr.name
    receiverPhone   = addr.phone
    receiverCity    = addr.city
    receiverAddress = addr.province + addr.city + addr.district + ' ' + addr.detail
  } else if (document.getElementById('newAddrForm')?.classList.contains('open')) {
    // 使用新填地址
    receiverName    = (document.getElementById('newName')?.value || '').trim()
    receiverPhone   = (document.getElementById('newPhone')?.value || '').trim()
    const province  = document.getElementById('newProvince')?.value || ''
    const city      = document.getElementById('newCity')?.value || ''
    const district  = document.getElementById('newDistrict')?.value || ''
    const detail    = (document.getElementById('newDetail')?.value || '').trim()
    receiverCity    = city
    receiverAddress = [province, city, district, detail].filter(Boolean).join(' ')

    if (!receiverName) return showToast('请填写收件人姓名')
    if (!/^1[3-9]\d{9}$/.test(receiverPhone)) return showToast('手机号格式不正确')
    if (!province) return showToast('请选择省份')
    if (!city) return showToast('请选择城市')
    if (!detail || detail.length < 5) return showToast('详细地址不少于5个字符')

    // 如果勾选了「保存到地址簿」
    if (document.getElementById('saveAddrCheck')?.checked) {
      const token = localStorage.getItem('mowo_token')
      await fetch(`${API}/api/addresses`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ name: receiverName, phone: receiverPhone, province, city, district, detail })
      }).catch(() => {})
    }
  } else {
    return showToast('请选择或填写收货地址')
  }

  const token = localStorage.getItem('mowo_token')
  const btn = document.getElementById('btnPay')
  btn.disabled = true
  btn.textContent = '提交中...'
  if (!checkoutIdempotencyKey) {
    checkoutIdempotencyKey = window.crypto?.randomUUID?.()
      || `checkout_${Date.now()}_${Math.random().toString(36).slice(2)}`
  }

  try {
    const res = await fetch(`${API}/api/cart/checkout`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({
        cartItemIds,
        receiverName:    receiverName || null,
        receiverPhone:   receiverPhone || null,
        receiverAddress: receiverAddress || null,
        receiverCity:    receiverCity || null,
        idempotencyKey:  checkoutIdempotencyKey
      })
    })
    const data = await res.json()
    if (!data.success) {
      showToast(data.message || '提交失败')
      btn.disabled = false
      btn.textContent = `提交订单`
      return
    }

    preOrderId = data.data.id
    // 跳转到支付等待页面（当前直接渲染 pending 状态）
    renderPaymentPending(data.data)

  } catch(e) {
    showToast('网络错误，请重试')
    btn.disabled = false
  }
}

function renderPaymentPending(preOrder) {
  const totalAmount = preOrder.totalAmount
  const expiresAt = new Date(preOrder.expiresAt)

  document.getElementById('pageContent').innerHTML = `
  <div class="card">
    <div class="pay-status-box">
      <div class="pay-status-icon">⏳</div>
      <div class="pay-status-title">订单已生成</div>
      <div class="pay-status-desc">订单金额 ¥${Number(totalAmount).toFixed(2)}<br>请在 10 分钟内完成付款</div>
      <div class="pay-timer" id="payTimer">剩余时间: 计算中...</div>
      <p style="margin-top:16px;font-size:12px;font-weight:700;color:var(--gray3);">
        微信小程序付款入口将在后续阶段接入
      </p>
      <button class="btn-mock-pay" id="btnMockPay2" onclick="mockPay()" style="${showTestMockPayment ? 'display:block' : 'display:none'}">
        🧪 开发模式：模拟支付成功
      </button>
      <a href="./cart.html" class="btn-secondary">返回购物车</a>
    </div>
  </div>`

  // 倒计时
  const tick = () => {
    const remaining = Math.max(0, expiresAt - new Date())
    const m = Math.floor(remaining / 60000)
    const s = Math.floor((remaining % 60000) / 1000)
    const el = document.getElementById('payTimer')
    if (!el) { clearInterval(pollTimer); return }
    if (remaining <= 0) {
      el.textContent = '订单已超时，请重新结算'
      el.style.color = 'var(--red)'
      clearInterval(pollTimer)
    } else {
      el.textContent = `剩余时间: ${m}:${s.toString().padStart(2,'0')}`
    }
  }
  tick()
  pollTimer = setInterval(tick, 1000)

  // 轮询支付状态
  const pollStatus = async () => {
    if (!preOrderId) return
    const token = localStorage.getItem('mowo_token')
    const res = await fetch(`${API}/api/payment/status/${preOrderId}`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    const data = await res.json()
    if (data.data?.status === 'paid') {
      clearInterval(pollTimer)
      renderPaymentSuccess()
    } else if (data.data?.status === 'expired' || data.data?.expired) {
      clearInterval(pollTimer)
    }
  }
  setInterval(pollStatus, 5000)
}

function renderPaymentSuccess() {
  clearInterval(pollTimer)
  sessionStorage.removeItem('mowo_checkout_items')
  checkoutIdempotencyKey = null
  // 支付完成后清除定制流程临时数据，防止下次进入 confirm 页时复用已 ordered 的 product_map
  localStorage.removeItem('mowo_customize_product_map')
  localStorage.removeItem('mowo_customize_draft_id')
  localStorage.removeItem('mowo_customize_frames')
  localStorage.removeItem('mowo_customize_meta')
  document.getElementById('pageContent').innerHTML = `
  <div class="card">
    <div class="pay-status-box">
      <div class="pay-status-icon">🎉</div>
      <div class="pay-status-title">支付成功！</div>
      <div class="pay-status-desc">付款结果已确认，可在“我的订单”中查看订单和生产进度。</div>
      <a href="/app/customize" class="btn-secondary">继续定制</a>
      <a href="/app/showcase" class="btn-secondary" style="margin-left:8px">看看联名作品</a>
    </div>
  </div>`
}

async function mockPay() {
  if (!preOrderId) {
    showToast('请先提交订单')
    return
  }
  const token = localStorage.getItem('mowo_token')
  const res = await fetch(`${API}/api/payment/mock-pay/${preOrderId}`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}` }
  })
  const data = await res.json()
  if (data.success) {
    renderPaymentSuccess()
  } else {
    showToast(data.message || 'Mock 支付失败')
  }
}

function showToast(msg, duration = 2500) {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('show')
  setTimeout(() => el.classList.remove('show'), duration)
}
function escHtml(s) {
  if (!s) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}
</script>
