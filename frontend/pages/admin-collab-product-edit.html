<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>联名商品编辑 - 哞屋后台</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--white:#fff;--cream:#f5f3ef;--black:#111110;--gray1:#e7e6e2;--gray2:#c4c3bf;--gray3:#777772;--yellow:#f5e642;--green:#d9f3de;--orange:#fff0df;--red:#ffe6e1;--sidebar-w:220px;--sidebar-collapsed:60px;--font:'Nunito','Noto Sans SC',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--black);font-family:var(--font);display:flex}.main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w));min-height:100vh;transition:.3s}.main.expanded{margin-left:var(--sidebar-collapsed);width:calc(100% - var(--sidebar-collapsed))}.topbar{height:64px;padding:0 28px;position:sticky;top:0;z-index:20;background:rgba(245,243,239,.96);border-bottom:1px solid var(--gray1);display:flex;align-items:center;justify-content:space-between}.top-left,.actions,.inline,.filters,.bulk{display:flex;align-items:center;gap:8px}.back{width:38px;height:38px;border:1px solid var(--gray1);background:#fff;border-radius:7px;cursor:pointer;font-size:18px}.title{font-size:18px;font-weight:900}.sub{font-size:11px;color:var(--gray3);font-weight:700;margin-top:2px}.btn{height:38px;border:1px solid var(--gray1);border-radius:7px;background:#fff;padding:0 14px;font:800 13px var(--font);cursor:pointer}.btn.primary{background:var(--black);color:#fff;border-color:var(--black)}.btn.yellow{background:var(--yellow);border-color:var(--yellow)}.btn:disabled{opacity:.45;cursor:not-allowed}.content{padding:24px 28px 60px;max-width:1500px;margin:auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.section,.side-section{background:#fff;border:1px solid var(--gray1);border-radius:8px;margin-bottom:16px}.section-head{padding:16px 18px;border-bottom:1px solid var(--gray1);display:flex;justify-content:space-between;align-items:flex-start}.section-title{font-size:15px;font-weight:900}.section-note{font-size:11px;color:var(--gray3);font-weight:700;margin-top:3px}.section-body{padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.label{display:block;font-size:11px;font-weight:800;color:var(--gray3);margin-bottom:6px}.input,.textarea,.select{width:100%;border:1px solid var(--gray1);border-radius:7px;background:#fff;padding:9px 11px;font:700 13px var(--font);outline:none}.input,.select{height:40px}.textarea{min-height:92px;resize:vertical;line-height:1.65}.input:focus,.textarea:focus,.select:focus{border-color:var(--black)}.counter{text-align:right;font-size:10px;color:var(--gray3);margin-top:3px}.source{padding:10px 12px;background:var(--cream);border-radius:6px;font-size:11px;color:var(--gray3);line-height:1.6}.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.media{border:1px solid var(--gray1);border-radius:7px;overflow:hidden;background:var(--cream)}.media-view{aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden}.media-view img,.media-view video{width:100%;height:100%;object-fit:cover}.media-foot{padding:8px;display:flex;gap:5px;flex-wrap:wrap}.mini{height:28px;padding:0 8px;border:1px solid var(--gray1);border-radius:5px;background:#fff;font:800 10px var(--font);cursor:pointer}.mini.cover{background:var(--yellow)}.upload{border:1px dashed var(--gray2);min-height:190px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:900}.upload small{font-weight:700;color:var(--gray3)}.filters{flex-wrap:wrap;margin-bottom:12px}.filters .input,.filters .select{width:auto;min-width:140px}.sku-list{display:flex;flex-direction:column;gap:8px}.sku-row{border:1px solid var(--gray1);border-radius:7px;padding:10px;display:grid;grid-template-columns:24px 54px minmax(220px,1fr) 112px 130px 90px 76px;gap:9px;align-items:center}.sku-row.incompatible{opacity:.55;background:var(--cream)}.sku-row.off{border-style:dashed}.sku-img{width:54px;height:54px;border-radius:6px;background:var(--cream);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--gray3);font-size:10px}.sku-img img{width:100%;height:100%;object-fit:cover}.sku-name{font-size:12px;font-weight:900;line-height:1.45}.sku-meta,.stock{font-size:10px;color:var(--gray3);font-weight:700;line-height:1.5}.stock.good{color:#19713a}.stock.low{color:#a45a00}.sku-row .input,.sku-row .select{height:34px;padding:0 7px;font-size:11px}.order-btns{display:flex;gap:3px}.order-btns button{width:30px;height:30px;border:1px solid var(--gray1);background:#fff;border-radius:5px;cursor:pointer}.bulk{padding:10px;background:var(--cream);border-radius:7px;margin-bottom:12px;flex-wrap:wrap}.bulk .input,.bulk .select{width:130px;height:34px}.empty{padding:28px;text-align:center;border:1px dashed var(--gray2);border-radius:7px;color:var(--gray3);font-size:12px;font-weight:800}.side-section{padding:16px}.status{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:900;background:var(--orange)}.status.ready{background:var(--green);color:#176431}.check-group{margin-top:14px}.check-title{font-size:11px;font-weight:900;margin-bottom:6px}.check-item{font-size:11px;color:#8a4700;background:var(--orange);padding:7px 9px;border-radius:5px;margin-top:5px;line-height:1.45}.check-ok{font-size:11px;color:#176431;background:var(--green);padding:7px 9px;border-radius:5px}.history{padding:10px 0;border-bottom:1px solid var(--gray1)}.history:last-child{border:0}.history b{font-size:11px}.history div{font-size:10px;color:var(--gray3);margin-top:3px}.preview-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:100;align-items:center;justify-content:center;padding:20px}.preview-overlay.show{display:flex}.preview{width:920px;max-width:96vw;max-height:90vh;overflow:auto;background:#fff;border-radius:8px;padding:22px}.preview-grid{display:grid;grid-template-columns:minmax(280px,1fr) 1fr;gap:24px}.preview-media{aspect-ratio:1;background:var(--cream);border-radius:7px;overflow:hidden}.preview-media img,.preview-media video{width:100%;height:100%;object-fit:contain}.preview h1{font-size:25px;margin:0 0 10px;letter-spacing:0}.preview-price{font-size:25px;font-weight:900;margin:16px 0}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 9px;border:1px solid var(--gray1);border-radius:5px;font-size:11px;font-weight:800}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;background:#111;color:#fff;padding:11px 18px;border-radius:7px;font-size:12px;font-weight:800;transition:.2s;z-index:200}.toast.show{opacity:1;transform:translate(-50%,0)}.menu-btn{display:none}.sidebar-backdrop{display:none}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sku-row{grid-template-columns:24px 48px minmax(180px,1fr);}.sku-controls{grid-column:2/-1;display:grid;grid-template-columns:112px 130px 90px 76px;gap:7px}}
@media(max-width:760px){.main{margin-left:0;width:100%}.topbar{padding:0 12px}.content{padding:14px 12px}.topbar .title-wrap{max-width:150px}.actions .btn:not(.primary){display:none}.layout,.grid2,.preview-grid,.side{grid-template-columns:1fr}.sku-row{grid-template-columns:24px 44px minmax(0,1fr)}.sku-controls{grid-template-columns:1fr 1fr}.menu-btn{display:block}}
.order-btns{flex-wrap:wrap}.order-btns .availability{width:64px}.order-btns .availability.on{background:var(--green);color:#176431}.order-btns .availability.off{background:var(--orange);color:#8a4700}
.input.invalid,.textarea.invalid,.select.invalid{border-color:#d93025;background:#fff8f6}.field-error{display:none;color:#c0320a;font-size:10px;font-weight:800;margin-top:4px}.field-error.show{display:block}.check-item.actionable{cursor:pointer;border:0;width:100%;text-align:left;font-family:var(--font)}.check-item.actionable:hover{filter:brightness(.97)}.section.attention{outline:2px solid #ffb29f;outline-offset:2px}
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div><aside class="sidebar" id="sidebar"></aside>
<main class="main" id="main">
  <header class="topbar"><div class="top-left"><button class="back" onclick="history.back()" title="返回联名作品">&#8592;</button><div class="title-wrap"><div class="title" id="pageTitle">联名商品编辑</div><div class="sub" id="pageSub">读取商品资料中</div></div></div><div class="actions"><button class="btn" onclick="openPreview()">顾客预览</button><button class="btn yellow" id="publishBtn" onclick="publishProduct()">上架</button><button class="btn primary" id="saveBtn" onclick="saveWorkspace()">保存</button></div></header>
  <div class="content"><div class="layout"><div>
    <section class="section" id="section-content"><div class="section-head"><div><div class="section-title">商品资料</div><div class="section-note">顾客会在联名商品详情页看到这些内容</div></div></div><div class="section-body">
      <div class="source" id="sourceInfo"></div><div class="grid2" style="margin-top:14px"><div class="field"><label class="label">商品标题 *</label><input class="input" id="storefrontTitle" maxlength="120"><div class="field-error" id="error-storefrontTitle"></div></div><div class="field"><label class="label">系列名称</label><input class="input" id="storefrontSeries" maxlength="80" placeholder="如：动物日常"></div></div>
      <div class="field"><label class="label">列表卖点简介 *</label><textarea class="textarea" id="storefrontSummary" maxlength="300" style="min-height:72px"></textarea><div class="counter" id="summaryCount">0 / 300</div><div class="field-error" id="error-storefrontSummary"></div></div>
      <div class="field"><label class="label">商品详情 *</label><textarea class="textarea" id="storefrontDescription" maxlength="5000" style="min-height:150px" placeholder="说明动画内容、产品特点与适合场景"></textarea><div class="field-error" id="error-storefrontDescription"></div></div>
      <div class="grid2"><div class="field"><label class="label">顾客可见标签</label><input class="input" id="storefrontTags" placeholder="用逗号分隔，最多 10 个"></div><div class="field"><label class="label">内部搜索词</label><input class="input" id="storefrontKeywords" placeholder="仅后台搜索使用"></div></div>
      <div class="field" style="max-width:220px"><label class="label">推荐顺序</label><input class="input" id="storefrontSortOrder" type="number" min="-10000" max="10000"></div>
    </div></section>
    <section class="section" id="section-media"><div class="section-head"><div><div class="section-title">展示素材与封面</div><div class="section-note">最多 8 个图片或视频；至少需要一个可用商品封面</div></div></div><div class="section-body"><div class="media-grid" id="mediaGrid"></div><input id="mediaInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" multiple hidden></div></section>
    <section class="section" id="section-skus"><div class="section-head"><div><div class="section-title">销售规格</div><div class="section-note" id="frameHint">至少启用一个与核心帧兼容的真实 SKU</div></div></div><div class="section-body">
      <div class="filters"><input class="input" id="skuSearch" placeholder="搜索 SKU、款式或材质" oninput="renderSkus()"><select class="select" id="sizeFilter" onchange="renderSkus()"><option value="">全部尺寸</option></select><select class="select" id="frameFilter" onchange="renderSkus()"><option value="">全部帧数</option></select><label class="inline" style="font-size:11px;font-weight:800"><input type="checkbox" id="showIncompatible" onchange="renderSkus()"> 显示不兼容规格</label></div>
      <div class="bulk"><b style="font-size:11px">批量设置已选规格</b><select class="select" id="bulkMode"><option value="MAKE_TO_ORDER">允许现做</option><option value="STOCK_ONLY">仅限现货</option></select><input class="input" id="bulkDays" type="number" min="1" max="60" value="7" title="发货天数"><input class="input" id="bulkMarkup" type="number" min="0" step="0.01" value="0" title="在基础价上增加"><button class="mini" onclick="applyBulk()">应用</button></div>
      <div class="sku-list" id="skuList"></div>
    </div></section>
  </div><aside class="side">
    <section class="side-section"><div class="section-title">上架检查</div><div style="margin-top:10px"><span class="status" id="readyStatus">检查中</span></div><div id="readiness"></div></section>
    <section class="side-section"><div class="section-title">商品身份</div><div class="source" id="identity" style="margin-top:10px"></div></section>
    <section class="side-section"><div class="section-title">最近修改</div><div id="historyList" style="margin-top:8px"><div class="sub">读取中</div></div></section>
  </aside></div></div>
</main>
<div class="preview-overlay" id="previewOverlay" onclick="if(event.target===this)closePreview()"><div class="preview"><div class="actions" style="justify-content:space-between;margin-bottom:18px"><b>顾客视角预览</b><button class="btn" onclick="closePreview()">关闭</button></div><div id="previewBody"></div></div></div><div class="toast" id="toast"></div>
<script src="../js/private-upload.js"></script><script>
const API=location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001';let token='',workId='',data=null,rows=[],media=[]
addEventListener('DOMContentLoaded',async()=>{token=localStorage.getItem('mowo_token')||'';workId=new URLSearchParams(location.search).get('id')||'';if(!token||!workId){location.href='admin-collab-works.html';return}document.getElementById('storefrontSummary').addEventListener('input',updateCount);document.getElementById('mediaInput').addEventListener('change',uploadMedia);document.querySelector('.content').addEventListener('input',handleLiveInput);document.querySelector('.content').addEventListener('change',handleLiveInput);await loadWorkspace()})
addEventListener('mowoTokenRefreshed',()=>token=localStorage.getItem('mowo_token')||'')
async function api(path,options={}){const res=await fetch(API+path,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),Authorization:`Bearer ${token}`,...(options.headers||{})}});let json={};try{json=await res.json()}catch{}if(!res.ok||!json.success)throw new Error(json.message||'操作失败');return json.data}
async function loadWorkspace(){try{data=await api(`/api/admin/collab/${workId}/product-workspace`);rows=(data.selected||[]).filter(row=>data.candidates.some(s=>s.id===row.skuId&&s.compatible)).sort((a,b)=>a.sortOrder-b.sortOrder);media=(data.storefrontMedia||[]).map(item=>({...item}));fill();await loadHistory()}catch(e){toast(e.message);setTimeout(()=>location.href='admin-collab-works.html',1800)}}
function fill(){document.getElementById('pageTitle').textContent=data.storefrontTitle||data.sourceTitle;document.getElementById('pageSub').textContent=`${data.productNo||'保存后生成商品编号'} · ${shelfText(data.shelfStatus)}`;document.getElementById('sourceInfo').textContent=`原审核作品：${data.sourceTitle}。商品展示资料可独立编辑，不会改变动画资产本身。`;setValue('storefrontTitle',data.storefrontTitle||'');setValue('storefrontSeries',data.storefrontSeries||'');setValue('storefrontSummary',data.storefrontSummary||'');setValue('storefrontDescription',data.storefrontDescription||'');setValue('storefrontTags',(data.storefrontTags||[]).join('，'));setValue('storefrontKeywords',data.storefrontKeywords||'');setValue('storefrontSortOrder',data.storefrontSortOrder||0);document.getElementById('frameHint').textContent=`当前动画有 ${data.baseFrameCount||0} 个核心帧，只能选择帧数为其整数倍的 SKU。`;document.getElementById('identity').innerHTML=`商品编号：<b>${esc(data.productNo||'保存后生成')}</b><br>动画资产：<b>${esc(data.asset?.assetNo||'未关联')}</b><br>资产版本：<b>${data.asset?.versionNo?'V'+data.asset.versionNo:'未关联'}</b>`;buildFilters();renderMedia();renderSkus();renderReadinessLive();updateCount();document.getElementById('publishBtn').textContent=data.isOnShelf?'已上架':'上架';document.getElementById('publishBtn').disabled=data.isOnShelf}
function setValue(id,v){document.getElementById(id).value=v??''}function updateCount(){const el=document.getElementById('storefrontSummary');document.getElementById('summaryCount').textContent=`${el.value.length} / 300`}function handleLiveInput(event){if(event.target.closest('.filters'))return;clearFieldError(event.target.id);renderReadinessLive()}
function buildFilters(){const sizes=[...new Set(data.candidates.map(s=>s.size))];const frames=[...new Set(data.candidates.map(s=>s.frameCount))].sort((a,b)=>a-b);document.getElementById('sizeFilter').innerHTML='<option value="">全部尺寸</option>'+sizes.map(v=>`<option>${esc(v)}</option>`).join('');document.getElementById('frameFilter').innerHTML='<option value="">全部帧数</option>'+frames.map(v=>`<option value="${v}">${v} 帧</option>`).join('')}
function renderMedia(){const grid=document.getElementById('mediaGrid');const items=media.map((item,i)=>`<div class="media"><div class="media-view">${item.kind==='video'?`<video src="${esc(item.url)}" controls muted></video>`:`<img src="${esc(item.url)}" alt="商品展示素材">`}</div><div class="media-foot"><button class="mini ${data.coverKey===item.key?'cover':''}" onclick="setCover(${i})">${data.coverKey===item.key?'当前封面':'设为封面'}</button><button class="mini" onclick="moveMedia(${i},-1)" ${i===0?'disabled':''}>&#8592;</button><button class="mini" onclick="moveMedia(${i},1)" ${i===media.length-1?'disabled':''}>&#8594;</button><button class="mini" onclick="removeMedia(${i})">删除</button></div></div>`).join('');grid.innerHTML=items+`<label class="upload" for="mediaInput"><span style="font-size:28px">+</span><span>上传展示素材</span><small>JPG / PNG / WEBP / GIF / MP4</small></label>`}
async function uploadMedia(e){const files=[...e.target.files];e.target.value='';if(!files.length)return;if(media.length+files.length>8)return toast('展示素材最多 8 个');try{const keys=await MowoPrivateUpload.uploadFiles({files,token,purpose:'COLLAB_STOREFRONT_MEDIA',onProgress:(n,total)=>toast(`正在上传 ${n}/${total}`)});for(let i=0;i<keys.length;i++)media.push({key:keys[i],url:URL.createObjectURL(files[i]),kind:files[i].type.startsWith('video/')?'video':'image'});if((!data.coverKey||isLegacyCover(data.coverKey))&&media[0])data.coverKey=media[0].key;renderMedia();renderReadinessLive();toast('素材上传完成，保存后生效')}catch(err){toast(err.message)}}
function setCover(i){data.coverKey=media[i]?.key||data.coverKey;renderMedia();renderReadinessLive()}function removeMedia(i){const removed=media.splice(i,1)[0];if(removed?.key===data.coverKey)data.coverKey=media[0]?.key||'';renderMedia();renderReadinessLive()}function moveMedia(i,d){const n=i+d;if(n<0||n>=media.length)return;[media[i],media[n]]=[media[n],media[i]];renderMedia()}
function renderSkus(){const q=document.getElementById('skuSearch').value.trim().toLowerCase(),size=document.getElementById('sizeFilter').value,frame=document.getElementById('frameFilter').value,showBad=document.getElementById('showIncompatible').checked,selected=new Map(rows.map(r=>[r.skuId,r]));const map=new Map(data.candidates.map(s=>[s.id,s]));const ordered=[...rows.map(r=>map.get(r.skuId)).filter(Boolean),...data.candidates.filter(s=>!selected.has(s.id))].filter(s=>(showBad||s.compatible||selected.has(s.id))&&(!size||s.size===size)&&(!frame||String(s.frameCount)===frame)&&(!q||`${s.skuCode} ${s.modelName} ${s.material} ${s.colorName}`.toLowerCase().includes(q)));const list=document.getElementById('skuList');if(!ordered.length){list.innerHTML='<div class="empty">没有符合条件的 SKU</div>';return}list.innerHTML=ordered.map(s=>skuHtml(s,selected.get(s.id))).join('')}
function skuHtml(s,row){const on=!!row,pos=rows.findIndex(r=>r.skuId===s.id),st=s.inventory.status,stockClass=st==='ENOUGH'?'good':'low',stockText=st==='NO_RECORD'?'未建库存记录':`可用 ${s.inventory.available} · 总数 ${s.inventory.current} · 已占用 ${s.inventory.reserved}`;return `<div class="sku-row ${s.compatible?'':'incompatible'} ${s.isActive?'':'off'}"><input type="checkbox" ${on?'checked':''} ${s.compatible&&s.isActive?'':'disabled'} onchange="toggleSku('${s.id}',this.checked)" title="纳入或移出商品"><div class="sku-img">${s.previewImage?`<img src="${esc(s.previewImage)}">`:'暂无图'}</div><div><div class="sku-name">${esc(s.modelName)} · ${esc(s.size)} · ${s.frameCount}帧 · ${esc(s.material)} · ${esc(s.colorName)}</div><div class="sku-meta">${esc(s.skuCode||s.id)} · 基础价 ¥${s.basePrice.toFixed(2)}${s.compatible?'':' · 帧数不兼容'}${s.isActive?'':' · 已停用'}</div><div class="stock ${stockClass}">${stockText}</div></div><div class="sku-controls"><input class="input" type="number" min="${s.basePrice}" step="0.01" value="${on?row.finalPrice:s.basePrice}" ${on?'':'disabled'} title="最终售价" onchange="updateRow('${s.id}','finalPrice',this.value)"><select class="select" ${on?'':'disabled'} title="供货方式" onchange="updateRow('${s.id}','fulfillmentMode',this.value)"><option value="MAKE_TO_ORDER" ${!on||row.fulfillmentMode==='MAKE_TO_ORDER'?'selected':''}>允许现做</option><option value="STOCK_ONLY" ${on&&row.fulfillmentMode==='STOCK_ONLY'?'selected':''}>仅限现货</option></select><input class="input" type="number" min="1" max="60" value="${on?row.leadTimeDays:7}" ${on?'':'disabled'} title="发货天数" onchange="updateRow('${s.id}','leadTimeDays',this.value)"><div class="order-btns"><button class="availability ${on&&row.isEnabled?'on':'off'}" ${on&&s.isActive?'':'disabled'} onclick="toggleEnabled('${s.id}')">${on&&row.isEnabled?'在售':'停售'}</button><button ${on&&pos>0?'':'disabled'} onclick="moveSku('${s.id}',-1)">&#8593;</button><button ${on&&pos<rows.length-1?'':'disabled'} onclick="moveSku('${s.id}',1)">&#8595;</button></div></div></div>`}
function toggleSku(id,on){const s=data.candidates.find(x=>x.id===id);if(on&&s?.compatible&&s.isActive&&!rows.some(r=>r.skuId===id))rows.push({skuId:id,finalPrice:s.basePrice,fulfillmentMode:'MAKE_TO_ORDER',leadTimeDays:7,isEnabled:true});if(!on)rows=rows.filter(r=>r.skuId!==id);renderSkus();renderReadinessLive()}function toggleEnabled(id){const r=rows.find(x=>x.skuId===id);if(r)r.isEnabled=!r.isEnabled;renderSkus();renderReadinessLive()}function updateRow(id,k,v){const r=rows.find(x=>x.skuId===id);if(r)r[k]=['finalPrice','leadTimeDays'].includes(k)?Number(v):v;renderReadinessLive()}function moveSku(id,d){const i=rows.findIndex(r=>r.skuId===id),n=i+d;if(i<0||n<0||n>=rows.length)return;[rows[i],rows[n]]=[rows[n],rows[i]];renderSkus()}
function applyBulk(){const mode=document.getElementById('bulkMode').value,days=Number(document.getElementById('bulkDays').value),markup=Number(document.getElementById('bulkMarkup').value);if(!Number.isInteger(days)||days<1||days>60||markup<0)return toast('请填写有效的发货天数和加价金额');const map=new Map(data.candidates.map(s=>[s.id,s]));rows.forEach(r=>{r.fulfillmentMode=mode;r.leadTimeDays=days;r.finalPrice=Number((map.get(r.skuId).basePrice+markup).toFixed(2))});renderSkus();renderReadinessLive();toast('已应用到全部已选规格')}
function payload(){return{storefrontTitle:value('storefrontTitle'),storefrontSummary:value('storefrontSummary'),storefrontDescription:value('storefrontDescription'),storefrontSeries:value('storefrontSeries'),storefrontTags:value('storefrontTags').split(/[,，]/).map(v=>v.trim()).filter(Boolean),storefrontKeywords:value('storefrontKeywords'),storefrontSortOrder:Number(value('storefrontSortOrder')||0),storefrontMedia:media.map(m=>m.key),coverKey:isLegacyCover(data.coverKey)?'':data.coverKey,skus:rows}}
async function saveWorkspace(showMessage=true){const issues=collectIssues(),blocking=issues.filter(issue=>issue.blockSave);if(blocking.length){showIssueFeedback(blocking,'保存');return null}const btn=document.getElementById('saveBtn');btn.disabled=true;try{const result=await api(`/api/admin/collab/${workId}/product-workspace`,{method:'PUT',body:JSON.stringify(payload())});await loadWorkspace();if(showMessage)toast(result.ready?'商品资料已保存':'商品资料已保存，还有上架必填项未完成');return result}catch(e){toast(e.message);return null}finally{btn.disabled=false}}
async function publishProduct(){const issues=collectIssues();if(issues.length){showIssueFeedback(issues,'上架');return}const saved=await saveWorkspace(false);if(!saved)return;if(!saved.ready){renderReadinessLive();toast('服务端检查发现尚未满足上架条件');return}try{await api(`/api/admin/collab/${workId}/relist`,{method:'PUT',body:'{}'});toast('商品已上架');await loadWorkspace()}catch(e){toast(e.message)}}
function collectIssues(){if(!data)return[];const issues=[],add=(group,message,target,blockSave=false)=>issues.push({group,message,target,blockSave});const title=value('storefrontTitle').trim(),summary=value('storefrontSummary').trim(),description=value('storefrontDescription').trim(),series=value('storefrontSeries').trim(),keywords=value('storefrontKeywords').trim(),tags=value('storefrontTags').split(/[,，]/).map(v=>v.trim()).filter(Boolean),sort=Number(value('storefrontSortOrder'));if(title.length<2)add('content','商品标题至少填写 2 个字','storefrontTitle',true);if(title.length>120)add('content','商品标题不能超过 120 个字','storefrontTitle',true);if(!summary)add('content','请填写列表卖点简介','storefrontSummary');if(summary.length>300)add('content','列表卖点简介不能超过 300 个字','storefrontSummary',true);if(!description)add('content','请填写商品详情','storefrontDescription');if(description.length>5000)add('content','商品详情不能超过 5000 个字','storefrontDescription',true);if(series.length>80)add('content','系列名称不能超过 80 个字','storefrontSeries',true);if(keywords.length>300)add('content','内部搜索词不能超过 300 个字','storefrontKeywords',true);if(tags.length>10||tags.some(tag=>tag.length>20))add('content','最多设置 10 个标签，每个不超过 20 个字','storefrontTags',true);if(!Number.isInteger(sort)||sort<-10000||sort>10000)add('content','推荐顺序必须是 -10000 到 10000 的整数','storefrontSortOrder',true);if(!data.coverKey)add('content','请设置一个商品封面','section-media');else if(isLegacyCover(data.coverKey))add('content','旧版封面不能用于正式商品，请重新上传','section-media');const mutableContent=/商品标题|商品卖点|商品详情|商品封面|旧版.*封面/;for(const message of data.readinessGroups?.content||[])if(!mutableContent.test(message))add('content',message,'section-content');for(const message of data.readinessGroups?.asset||[])add('asset',message,'identity');const enabled=rows.filter(row=>row.isEnabled);if(!enabled.length)add('sale','请至少启用一个可售 SKU','section-skus');const map=new Map(data.candidates.map(sku=>[sku.id,sku]));for(const row of enabled){const sku=map.get(row.skuId),label=sku?.skuCode||'所选 SKU';if(!sku?.compatible)add('sale',`${label} 的帧数不兼容`,'section-skus',true);if(!sku?.isActive)add('sale',`${label} 已停用`,'section-skus',true);if(!Number.isFinite(Number(row.finalPrice))||Number(row.finalPrice)<Number(sku?.basePrice)||Number(row.finalPrice)>999999.99)add('sale',`${label} 的售价必须不低于基础价`,'section-skus',true);if(!Number.isInteger(Number(row.leadTimeDays))||Number(row.leadTimeDays)<1||Number(row.leadTimeDays)>60)add('sale',`${label} 的发货天数必须是 1 至 60 天`,'section-skus',true)}return dedupeIssues(issues)}
function dedupeIssues(issues){const seen=new Set;return issues.filter(issue=>{const key=`${issue.group}:${issue.message}`;if(seen.has(key))return false;seen.add(key);return true})}
function renderReadinessLive(){const issues=collectIssues(),groups={content:[],asset:[],sale:[]};issues.forEach(issue=>groups[issue.group].push(issue));const ready=!issues.length;document.getElementById('readyStatus').textContent=ready?'可以上架':`尚缺 ${issues.length} 项`;document.getElementById('readyStatus').className='status'+(ready?' ready':'');document.getElementById('readiness').innerHTML=ready?'<div class="check-group"><div class="check-ok">商品资料、动画资产和销售规格均已通过检查</div></div>':[['商品资料','content'],['动画资产','asset'],['销售规格','sale']].map(([name,key])=>`<div class="check-group"><div class="check-title">${name}</div>${groups[key].length?groups[key].map(issue=>`<button class="check-item actionable" onclick="focusIssue('${esc(issue.target||'')}')">${esc(issue.message)}</button>`).join(''):'<div class="check-ok">已通过</div>'}</div>`).join('');return issues}
function showIssueFeedback(issues,action){clearAllFieldErrors();const first=issues[0];for(const issue of issues){const input=document.getElementById(issue.target),error=document.getElementById(`error-${issue.target}`);if(input?.matches('.input,.textarea,.select'))input.classList.add('invalid');if(error){error.textContent=issue.message;error.classList.add('show')}}toast(`暂不能${action}：${first.message}`);focusIssue(first.target)}
function focusIssue(target){const el=document.getElementById(target);if(!el)return;const section=el.classList.contains('section')?el:el.closest('.section');section?.classList.add('attention');setTimeout(()=>section?.classList.remove('attention'),1600);el.scrollIntoView({behavior:'smooth',block:'center'});if(el.matches('input,textarea,select'))setTimeout(()=>el.focus(),350)}function clearFieldError(id){if(!id)return;document.getElementById(id)?.classList.remove('invalid');document.getElementById(`error-${id}`)?.classList.remove('show')}function clearAllFieldErrors(){document.querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));document.querySelectorAll('.field-error.show').forEach(el=>el.classList.remove('show'))}
async function loadHistory(){try{const list=await api(`/api/admin/collab/${workId}/product-history`);document.getElementById('historyList').innerHTML=list.length?list.map(x=>`<div class="history"><b>${esc(x.action||'商品资料变更')}</b><div>${esc(x.operatorName)} · ${new Date(x.createdAt).toLocaleString('zh-CN')}</div></div>`).join(''):'<div class="sub">暂无修改记录</div>'}catch{document.getElementById('historyList').innerHTML='<div class="sub">记录读取失败</div>'}}
function openPreview(){const issues=collectIssues();if(issues.length){showIssueFeedback(issues,'预览');return}const p=payload(),chosen=rows.filter(r=>r.isEnabled).map(r=>({...r,sku:data.candidates.find(s=>s.id===r.skuId)})),prices=chosen.map(x=>Number(x.finalPrice)).filter(Number.isFinite),selected=media.find(item=>item.key===data.coverKey),m=selected||(data.coverUrl?{url:data.coverUrl,kind:'image'}:media[0]);document.getElementById('previewBody').innerHTML=`<div class="preview-grid"><div class="preview-media">${m?.kind==='video'?`<video src="${esc(m.url)}" controls muted></video>`:`<img src="${esc(m?.url||'')}" alt="">`}</div><div><div class="sub">${esc(p.storefrontSeries||'联名作品')}</div><h1>${esc(p.storefrontTitle)}</h1><p style="line-height:1.7;color:var(--gray3);font-weight:700">${esc(p.storefrontSummary)}</p><div class="preview-price">¥${Math.min(...prices).toFixed(2)} 起</div><div class="label">可选规格</div><div class="chips">${chosen.map(x=>`<span class="chip">${esc(x.sku.size)} · ${x.sku.frameCount}帧 · ${esc(x.sku.material)}</span>`).join('')}</div><div style="margin-top:22px;white-space:pre-wrap;line-height:1.8">${esc(p.storefrontDescription)}</div></div></div>`;document.getElementById('previewOverlay').classList.add('show')}function closePreview(){document.getElementById('previewOverlay').classList.remove('show')}
function value(id){return document.getElementById(id).value}function isLegacyCover(v){return /^data:/i.test(String(v||'').trim())}function shelfText(v){return({on_sale:'销售中',suspended:'暂停销售',pending_delist:'下架申请处理中',off_shelf:'已下架'})[v]||'未上架'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let toastTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
</script><script src="../js/auth.js"></script><script src="../js/admin-sidebar.js?v=20260905-collab-product"></script>
