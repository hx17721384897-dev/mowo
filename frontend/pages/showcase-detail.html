<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>联名商品详情 - 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/nav.css">
<style>
:root{--black:#111110;--white:#fff;--paper:#f7f6f2;--line:#deddd8;--muted:#767570;--yellow:#f5e642;--orange:#ff6b35;--green:#2e8b57;--font:'Nunito','Noto Sans SC',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--black);font-family:var(--font);padding-bottom:88px}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1180px,calc(100% - 40px));margin:0 auto}.crumb{display:flex;gap:8px;align-items:center;padding:20px 0 14px;color:var(--muted);font-size:13px;font-weight:700}.crumb a{color:inherit;text-decoration:none}.crumb a:hover{color:var(--black)}
.loading,.error-state{min-height:55vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}.error-state a{color:var(--black);font-weight:900}.product{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(380px,.92fr);gap:48px;align-items:start}.gallery{position:sticky;top:82px}.stage{position:relative;width:100%;aspect-ratio:1;background:#ecebe7;border:1px solid var(--line);overflow:hidden;border-radius:8px}.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center}.slide.active{display:flex}.slide img,.slide video{width:100%;height:100%;object-fit:contain;background:#ecebe7}.slide video{background:#111}.frame-player{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:#111}.frame-player img{width:100%;height:100%;object-fit:contain}.player-tools{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(17,17,16,.86);color:#fff;border-radius:8px;padding:9px 12px}.player-tools button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:6px;min-width:42px;height:34px;font-weight:900}.player-meta{font-size:12px;font-weight:800}.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#111;font-size:22px}.gallery-arrow.prev{left:12px}.gallery-arrow.next{right:12px}.gallery-arrow[hidden]{display:none}.counter{position:absolute;right:12px;top:12px;background:#111;color:#fff;padding:5px 9px;border-radius:6px;font-size:11px;font-weight:900}.thumbs{display:flex;gap:9px;overflow-x:auto;padding:10px 1px 4px}.thumb{width:68px;height:68px;flex:0 0 68px;border:2px solid transparent;border-radius:6px;background:#e8e7e2;overflow:hidden;padding:0}.thumb.active{border-color:#111}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.thumb span{display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.info{min-width:0}.series{font-size:12px;color:var(--muted);font-weight:900;margin-bottom:8px}.title{font-size:32px;line-height:1.22;margin:0 0 10px;font-weight:900;overflow-wrap:anywhere}.summary{font-size:15px;line-height:1.75;color:#4f4e49;margin:0 0 14px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tag{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:11px;font-weight:800}.creator{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:18px;color:var(--black);text-decoration:none}.creator-avatar{width:38px;height:38px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}.creator-avatar img{width:100%;height:100%;object-fit:cover}.creator-label{font-size:11px;color:var(--muted);font-weight:700}.creator-name{font-size:14px;font-weight:900}.price-line{display:flex;align-items:baseline;gap:8px;margin:14px 0}.price{font-size:30px;color:#d9381e;font-weight:900}.price-note{color:var(--muted);font-size:12px;font-weight:700}.section-label{font-size:13px;font-weight:900;margin:20px 0 9px}.sku-list{display:grid;gap:8px}.sku-card{width:100%;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:10px;background:#fff;border:2px solid transparent;border-radius:8px;color:var(--black)}.sku-card:hover{border-color:#bdbcb6}.sku-card.selected{border-color:#111;background:#fffef0}.sku-image{width:54px;height:54px;border-radius:6px;overflow:hidden;background:#ecebe7;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px}.sku-image img{width:100%;height:100%;object-fit:cover}.sku-name{font-size:13px;font-weight:900;line-height:1.4}.sku-meta,.sku-delivery{font-size:11px;color:var(--muted);font-weight:700;line-height:1.55}.sku-price{font-size:16px;font-weight:900;white-space:nowrap}.swatch{display:inline-block;width:10px;height:10px;border:1px solid #aaa;border-radius:2px;margin-right:4px;vertical-align:-1px}.quantity{display:flex;align-items:center;justify-content:space-between;margin:18px 0}.stepper{display:grid;grid-template-columns:38px 46px 38px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}.stepper button{height:38px;border:0;background:#fff;font-size:18px}.stepper input{width:100%;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{height:50px;border-radius:8px;font-size:14px;font-weight:900}.action.cart{background:#fff;border:2px solid #111;color:#111}.action.buy{background:#111;border:2px solid #111;color:#fff}.action:disabled{opacity:.38;cursor:not-allowed}.selection-hint{min-height:20px;margin-top:8px;color:#c0320a;font-size:11px;font-weight:800}
.detail-band{margin-top:54px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.detail-inner{width:min(940px,calc(100% - 40px));margin:0 auto;padding:42px 0}.detail-title{font-size:21px;font-weight:900;margin:0 0 18px}.detail-copy{white-space:pre-wrap;font-size:15px;line-height:1.9;color:#45443f;overflow-wrap:anywhere}.spec-table{margin-top:30px;border-top:1px solid var(--line)}.spec-row{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.spec-key{color:var(--muted);font-weight:800}.spec-value{font-weight:800}.more{width:min(1180px,calc(100% - 40px));margin:44px auto}.more-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.more-head h2{font-size:20px;margin:0}.more-head a{color:var(--muted);font-size:12px;font-weight:900}.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.more-card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;color:#111}.more-image{aspect-ratio:1;background:#ecebe7}.more-image img{width:100%;height:100%;object-fit:cover}.more-body{padding:10px}.more-title{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more-price{font-size:12px;color:#d9381e;font-weight:900;margin-top:4px}.purchase-bar{position:fixed;left:0;right:0;bottom:0;z-index:500;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.06)}.purchase-inner{width:min(1180px,calc(100% - 28px));height:72px;margin:0 auto;display:flex;align-items:center;gap:16px}.bar-summary{min-width:0;flex:1}.bar-title{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar-choice{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar-price{font-size:19px;color:#d9381e;font-weight:900}.bar-actions{display:flex;gap:8px}.bar-actions button{height:42px;padding:0 22px;border-radius:7px;font-weight:900}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,12px);z-index:3000;background:#111;color:#fff;padding:11px 18px;border-radius:7px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){body{padding-bottom:82px}.shell{width:min(100% - 28px,680px)}.product{grid-template-columns:1fr;gap:24px}.gallery{position:static}.title{font-size:26px}.actions{display:none}.more-grid{grid-template-columns:repeat(2,1fr)}.purchase-inner{height:66px}.bar-summary,.bar-price{display:none}.bar-actions{width:100%}.bar-actions button{flex:1;padding:0 8px}.detail-inner{width:calc(100% - 28px);padding:30px 0}.spec-row{grid-template-columns:100px 1fr}}
@media(max-width:480px){.shell{width:calc(100% - 20px)}.crumb{padding-top:12px}.stage{aspect-ratio:1}.product{gap:18px}.title{font-size:23px}.sku-card{grid-template-columns:46px minmax(0,1fr);padding:8px}.sku-image{width:46px;height:46px}.sku-price{grid-column:2}.more{width:calc(100% - 20px)}.more-grid{gap:9px}.player-meta{display:none}}
</style>
</head>
<body>
<script src="../js/runtime-config.js"></script>
<script src="../js/nav.js"></script>
<div class="shell">
  <div class="crumb"><a href="showcase.html">联名作品</a><span>/</span><span id="crumbTitle">商品详情</span></div>
  <main id="productRoot"><div class="loading">正在读取商品信息...</div></main>
</div>
<section class="detail-band" id="detailBand" hidden><div class="detail-inner"><h2 class="detail-title">商品详情</h2><div class="detail-copy" id="detailCopy"></div><div class="spec-table" id="specTable"></div></div></section>
<section class="more" id="moreSection" hidden><div class="more-head"><h2>更多联名作品</h2><a href="showcase.html">查看全部</a></div><div class="more-grid" id="moreGrid"></div></section>
<div class="purchase-bar" id="purchaseBar" hidden><div class="purchase-inner"><div class="bar-summary"><div class="bar-title" id="barTitle"></div><div class="bar-choice" id="barChoice">请选择规格</div></div><div class="bar-price" id="barPrice"></div><div class="bar-actions"><button class="action cart" onclick="requestPurchase('cart')">加入购物车</button><button class="action buy" onclick="requestPurchase('buy')">立即购买</button></div></div></div>
