<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待生产看板 — 哞屋后台</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --white:    #FFFFFF;
  --cream:    #F5F3EF;
  --black:    #111110;
  --gray1:    #EBEBEA;
  --gray2:    #C4C3BF;
  --gray3:    #787874;
  --accent-y: #F5E642;
  --accent-o: #FF6B35;
  --accent-g: #8FD694;
  --accent-b: #7EC8E3;
  --font:     'Nunito', 'Noto Sans SC', sans-serif;
  --sidebar-w: 220px;
  --sidebar-collapsed: 60px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--cream); color:var(--black); min-height:100vh; display:flex; -webkit-font-smoothing:antialiased; }

/* ══ 侧边栏（复用admin-orders样式）══ */
.sidebar { width:var(--sidebar-w); min-height:100vh; background:var(--black); display:flex; flex-direction:column; position:fixed; left:0; top:0; bottom:0; z-index:100; transition:width .3s cubic-bezier(0.22,1,0.36,1); overflow:hidden; }
.sidebar.collapsed { width:var(--sidebar-collapsed); }
.sidebar-logo { padding:24px 20px 20px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px; white-space:nowrap; overflow:hidden; }
.sidebar-logo-icon { width:32px; height:32px; background:var(--accent-y); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.sidebar-logo-text { font-weight:900; font-size:15px; color:var(--white); letter-spacing:.04em; }
.sidebar-logo-sub  { font-weight:700; font-size:10px; color:var(--gray3); letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:1px; }
.sidebar-toggle { position:absolute; top:26px; right:12px; width:28px; height:28px; background:rgba(255,255,255,.08); border:none; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--gray3); font-size:12px; transition:background .2s; }
.sidebar-toggle:hover { background:rgba(255,255,255,.15); color:var(--white); }
.sidebar-nav { flex:1; padding:16px 0; overflow-y:auto; overflow-x:hidden; }
.nav-section-label { font-weight:800; font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--gray3); padding:12px 20px 6px; white-space:nowrap; overflow:hidden; transition:opacity .2s; }
.sidebar.collapsed .nav-section-label { opacity:0; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 20px; cursor:pointer; transition:background .15s; white-space:nowrap; overflow:hidden; color:var(--gray3); font-weight:800; font-size:13px; text-decoration:none; position:relative; }
.nav-item:hover { background:rgba(255,255,255,.06); color:var(--white); }
.nav-item.active { background:rgba(245,230,66,.12); color:var(--accent-y); }
.nav-item.active::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent-y); border-radius:0 2px 2px 0; }
.nav-icon { font-size:16px; flex-shrink:0; width:20px; text-align:center; }
.nav-label { transition:opacity .2s; }
.sidebar.collapsed .nav-label { opacity:0; }
.sidebar-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,.08); white-space:nowrap; overflow:hidden; }
.sidebar-user { display:flex; align-items:center; gap:10px; }
.sidebar-user-avatar { width:32px; height:32px; border-radius:50%; background:var(--accent-y); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; color:var(--black); flex-shrink:0; }
.sidebar-user-name { font-weight:800; font-size:12px; color:var(--white); }
.sidebar-user-role { font-weight:700; font-size:10px; color:var(--gray3); }
.sidebar.collapsed .sidebar-user-info { display:none; }

/* ══ 主内容 ══ */
.main { margin-left:var(--sidebar-w); flex:1; min-height:100vh; transition:margin-left .3s cubic-bezier(0.22,1,0.36,1); display:flex; flex-direction:column; }
.main.expanded { margin-left:var(--sidebar-collapsed); }
.topbar { position:sticky; top:0; z-index:50; background:rgba(245,243,239,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--gray1); padding:0 32px; height:60px; display:flex; align-items:center; justify-content:space-between; }
.topbar-title { font-weight:900; font-size:18px; letter-spacing:-.01em; }
.topbar-right { display:flex; align-items:center; gap:12px; }
.topbar-time { font-weight:700; font-size:12px; color:var(--gray3); }
.content { padding:28px 32px; flex:1; }

/* ══ 按钮 ══ */
.btn { height:38px; padding:0 16px; border-radius:10px; font-family:var(--font); font-weight:800; font-size:13px; border:none; cursor:pointer; transition:all .15s; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn:active { transform:scale(.96); }
.btn-black  { background:var(--black); color:var(--white); }
.btn-black:hover  { opacity:.85; }
.btn-yellow { background:var(--accent-y); color:var(--black); }
.btn-yellow:hover { opacity:.85; }
.btn-ghost  { background:var(--white); color:var(--black); border:1.5px solid var(--gray1); }
.btn-ghost:hover  { border-color:var(--black); }
.btn-sm { height:32px; padding:0 12px; font-size:12px; border-radius:8px; }
.btn:disabled { opacity:.4; pointer-events:none; }

/* ══ 汇总卡片区 ══ */
.section-title { font-weight:900; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--gray3); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.section-title::after { content:''; flex:1; height:1px; background:var(--gray1); }

.summary-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin-bottom:32px; }
.summary-card {
  background:var(--white);
  border-radius:16px;
  padding:18px 20px;
  border:1.5px solid var(--gray1);
  cursor:pointer;
  transition:all .2s;
  position:relative;
  overflow:hidden;
}
.summary-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.08); border-color:var(--accent-y); }
.summary-card.selected { border-color:var(--black); background:var(--black); }
.summary-card.selected .summary-spec { color:rgba(255,255,255,.7); }
.summary-card.selected .summary-count { color:var(--accent-y); }
.summary-card.selected .summary-label { color:rgba(255,255,255,.5); }

.summary-spec  { font-weight:900; font-size:13px; color:var(--black); margin-bottom:6px; line-height:1.4; }
.summary-count { font-weight:900; font-size:32px; letter-spacing:-.02em; color:var(--black); line-height:1; }
.summary-label { font-weight:700; font-size:11px; color:var(--gray3); margin-top:4px; }
.summary-dot   { position:absolute; right:16px; top:16px; width:8px; height:8px; border-radius:50%; background:var(--accent-y); }

/* ══ 工具栏 ══ */
.toolbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.toolbar-left  { display:flex; align-items:center; gap:8px; flex:1; }
.toolbar-right { display:flex; align-items:center; gap:8px; }

/* 批量操作栏 */
.batch-bar { display:none; align-items:center; gap:10px; background:var(--black); color:var(--white); padding:10px 16px; border-radius:12px; margin-bottom:12px; font-weight:800; font-size:13px; }
.batch-bar.show { display:flex; }
.batch-bar-count { flex:1; }

/* ══ 订单卡片网格 ══ */
.orders-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }

.order-card {
  background:var(--white);
  border-radius:12px;
  border:1.5px solid var(--gray1);
  overflow:hidden;
  transition:all .2s;
  cursor:pointer;
  position:relative;
}
.order-card:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.08); }
.order-card.selected { border-color:var(--black); box-shadow:0 0 0 2px rgba(17,17,16,.2); }
.order-card.selected::after { content:'✓'; position:absolute; top:8px; right:8px; width:20px; height:20px; background:var(--black); color:var(--white); border-radius:50%; font-weight:900; font-size:11px; display:flex; align-items:center; justify-content:center; }

/* 预览图 — 固定高度160px */
.card-preview {
  width:100%;
  height:160px;
  background:var(--gray1);
  overflow:hidden;
  position:relative;
}
.card-preview img { width:100%; height:100%; object-fit:cover; display:block; }
.card-preview-empty { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:28px; opacity:.3; }
.card-preview-badge {
  position:absolute;
  bottom:6px; left:6px;
  background:rgba(17,17,16,.7);
  backdrop-filter:blur(4px);
  color:#fff;
  font-weight:800;
  font-size:10px;
  padding:2px 6px;
  border-radius:5px;
  letter-spacing:.03em;
}

/* 卡片内容 — 更紧凑 */
.card-body { padding:10px 12px 8px; }
.card-order-no { font-weight:800; font-size:10px; color:var(--gray3); letter-spacing:.03em; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-user     { font-weight:800; font-size:12px; color:var(--black); margin-bottom:6px; }
.card-specs    { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
.card-spec-tag { background:var(--cream); border-radius:5px; padding:2px 6px; font-weight:700; font-size:10px; color:var(--gray3); }
.card-time     { font-weight:700; font-size:10px; color:var(--gray2); }
.card-footer   { padding:8px 12px; border-top:1px solid var(--gray1); }

/* 空状态 */
.empty-state { padding:80px 20px; text-align:center; }
.empty-icon  { font-size:56px; margin-bottom:16px; }
.empty-title { font-weight:900; font-size:18px; color:var(--black); margin-bottom:8px; }
.empty-sub   { font-weight:700; font-size:13px; color:var(--gray3); }

/* 加载 */
.loading-state { padding:60px; text-align:center; font-weight:700; font-size:14px; color:var(--gray3); }

/* ══ 下载进度Modal ══ */
.modal-overlay { display:none; position:fixed; inset:0; z-index:300; background:rgba(17,17,16,.5); align-items:center; justify-content:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:var(--white); border-radius:20px; padding:28px; width:100%; max-width:420px; }
.modal-title { font-weight:900; font-size:18px; margin-bottom:6px; }
.modal-sub   { font-weight:700; font-size:13px; color:var(--gray3); margin-bottom:20px; line-height:1.6; }
.modal-progress { background:var(--gray1); border-radius:999px; height:8px; overflow:hidden; margin-bottom:8px; }
.modal-progress-bar { height:100%; background:var(--black); border-radius:999px; width:0%; transition:width .3s; }
.modal-progress-text { font-weight:800; font-size:12px; color:var(--gray3); text-align:right; }
.modal-actions { display:flex; gap:10px; margin-top:20px; }
.modal-actions .btn { flex:1; height:46px; }

/* Toast */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--black); color:var(--white); font-weight:800; font-size:13px; padding:10px 22px; border-radius:999px; opacity:0; pointer-events:none; transition:all .3s; z-index:9999; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); }
  .main { margin-left:0 !important; }
  .content { padding:16px; }
  .topbar { padding:0 16px; }
  .orders-grid { grid-template-columns:1fr 1fr; }
  .summary-grid { grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>

<!-- 侧边栏 -->
<aside class="sidebar" id="sidebar"></aside>

<!-- 主内容 -->
<div class="main" id="main">
  <header class="topbar">
    <span class="topbar-title">待生产看板</span>
    <div class="topbar-right">
      <span class="topbar-time" id="topbarTime"></span>
      <button class="btn btn-ghost btn-sm" onclick="loadAll()">↻ 刷新</button>
    </div>
  </header>

  <div class="content">

    <!-- 汇总区 -->
    <div class="section-title">📊 款式汇总</div>
    <div class="summary-grid" id="summaryGrid">
      <div class="loading-state">加载中…</div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="toolbar-left">
        <span style="font-weight:800;font-size:13px;color:var(--gray3);" id="filterLabel">全部待生产订单</span>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost btn-sm" onclick="clearFilter()">显示全部</button>
        <button class="btn btn-black btn-sm" id="btnBatchDownload" disabled onclick="confirmBatchDownload()">
          ⬇ 批量下载图纸包
        </button>
      </div>
    </div>

    <!-- 批量操作栏 -->
    <div class="batch-bar" id="batchBar">
      <span class="batch-bar-count">已选 <strong id="batchCount">0</strong> 个订单</span>
      <button class="btn btn-yellow btn-sm" onclick="confirmBatchDownload()">⬇ 下载图纸包</button>
      <button class="btn btn-ghost btn-sm" onclick="clearSelection()">取消选择</button>
    </div>

    <!-- 订单卡片 -->
    <div class="section-title">📋 待生产清单</div>
    <div class="orders-grid" id="ordersGrid">
      <div class="loading-state">加载中…</div>
    </div>

  </div>
</div>

<!-- 确认下载Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <p class="modal-title" id="confirmTitle">确认下载</p>
    <p class="modal-sub" id="confirmSub">—</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeConfirm()">取消</button>
      <button class="btn btn-yellow" onclick="startBatchDownload()">确认下载</button>
    </div>
  </div>
</div>

<!-- 下载进度Modal -->
<div class="modal-overlay" id="progressModal">
  <div class="modal">
    <p class="modal-title">正在下载图纸包</p>
    <p class="modal-sub" id="progressSub">准备中…</p>
    <div class="modal-progress">
      <div class="modal-progress-bar" id="progressBar"></div>
    </div>
    <p class="modal-progress-text" id="progressText">0%</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = (location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001');
let _token    = '';
window.addEventListener('mowoTokenRefreshed', () => { _token = localStorage.getItem('mowo_token') || ''; });
let _orders   = [];
let _selected = new Set();
let _filter   = '';

window.addEventListener('DOMContentLoaded', async () => {
  _token = localStorage.getItem('mowo_token') || '';
  if (!_token) { location.href = 'index.html'; return; }

  try {
    const p = JSON.parse(atob(_token.split('.')[1]));
    if ((p.role ?? 0) < 2) { alert('权限不足'); location.href = 'index.html'; return; }
    const roleMap = { 2:'管理员', 3:'超级管理员' };
    document.getElementById('sidebarName').textContent   = p.phone || '管理员';
    document.getElementById('sidebarRole').textContent   = roleMap[p.role] || '管理员';
    document.getElementById('sidebarAvatar').textContent = (p.phone || '管')[0];
  } catch(e) { location.href = 'index.html'; return; }

  updateTime();
  setInterval(updateTime, 1000);
  await loadAll();
});

function updateTime() {
  const now = new Date();
  document.getElementById('topbarTime').textContent =
    now.toLocaleDateString('zh-CN') + ' ' +
    now.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
}

async function loadAll() {
  await Promise.all([loadSummary(), loadOrders()]);
}

// ── 汇总区 ──
async function loadSummary() {
  try {
    const res  = await fetch(`${API}/api/admin/production/summary`, {
      headers: { Authorization: `Bearer ${_token}` }
    });
    const json = await res.json();
    if (!json.success) return;
    renderSummary(json.data);
  } catch(e) {}
}

function renderSummary(data) {
  const grid = document.getElementById('summaryGrid');
  const keys = Object.keys(data);

  if (!keys.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:20px;font-weight:700;font-size:13px;color:var(--gray3);">暂无待生产订单</div>`;
    return;
  }

  grid.innerHTML = keys.map(key => `
    <div class="summary-card ${_filter === key ? 'selected' : ''}" onclick="filterBySpec('${key.replace(/'/g,"\\'")}')">
      <div class="summary-dot"></div>
      <div class="summary-spec">${key}</div>
      <div class="summary-count">${data[key]}</div>
      <div class="summary-label">单待生产</div>
    </div>`).join('');
}

// ── 订单列表 ──
async function loadOrders() {
  document.getElementById('ordersGrid').innerHTML = '<div class="loading-state">加载中…</div>';
  try {
    const res  = await fetch(`${API}/api/admin/production/orders`, {
      headers: { Authorization: `Bearer ${_token}` }
    });
    const json = await res.json();
    if (!json.success) return;
    _orders = json.data;
    renderOrders();
  } catch(e) {
    document.getElementById('ordersGrid').innerHTML = '<div class="loading-state">加载失败，请刷新重试</div>';
  }
}

function renderOrders() {
  const grid = document.getElementById('ordersGrid');
  let list = _orders;

  // 按款式筛选
  if (_filter) {
    list = list.filter(o => {
      const key = `${o.size} · ${o.frameCount}帧 · ${o.material} · ${o.colorName}`;
      return key === _filter;
    });
  }

  if (!list.length) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-icon">${_filter ? '🔍' : '🎉'}</div>
        <div class="empty-title">${_filter ? '该款式暂无待生产订单' : '暂无待生产订单'}</div>
        <div class="empty-sub">${_filter ? '点击「显示全部」查看其他订单' : '所有订单都已安排生产'}</div>
      </div>`;
    return;
  }

  grid.innerHTML = list.map(o => {
    const date = new Date(o.createdAt).toLocaleDateString('zh-CN', { month:'2-digit', day:'2-digit' });
    const time = new Date(o.createdAt).toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
    const sel  = _selected.has(o.orderNo);
    return `
      <div class="order-card ${sel ? 'selected' : ''}" id="card-${o.orderNo}" onclick="toggleCard('${o.orderNo}')">
        <div class="card-preview">
          ${o.previewUrl
            ? `<img src="${o.previewUrl}" alt="预览" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\"card-preview-empty\\">🎞</div>'">`
            : '<div class="card-preview-empty">🎞</div>'}
          <div class="card-preview-badge">${o.frameCount}帧 · ${o.size}</div>
        </div>
        <div class="card-body">
          <div class="card-order-no">${o.orderNo}</div>
          <div class="card-user">👤 ${o.userName}</div>
          <div class="card-specs">
            <span class="card-spec-tag">${o.size}</span>
            <span class="card-spec-tag">${o.frameCount}帧</span>
            <span class="card-spec-tag">${o.material}</span>
            <span class="card-spec-tag">${o.colorName}</span>
          </div>
          <div class="card-time">📅 ${date} ${time}</div>
        </div>
        <div class="card-footer">
          <button class="btn btn-yellow btn-sm" style="flex:1;" onclick="downloadSingle(event,'${o.orderNo}')">⬇ 下载图纸包</button>
        </div>
      </div>`;
  }).join('');
}

// ── 筛选 ──
function filterBySpec(spec) {
  _filter = (_filter === spec) ? '' : spec;
  document.getElementById('filterLabel').textContent = _filter ? `筛选：${_filter}` : '全部待生产订单';
  renderOrders();
  loadSummary(); // 刷新选中状态
}

function clearFilter() {
  _filter = '';
  document.getElementById('filterLabel').textContent = '全部待生产订单';
  renderOrders();
  loadSummary();
}

// ── 选择 ──
function toggleCard(orderNo) {
  if (_selected.has(orderNo)) _selected.delete(orderNo);
  else _selected.add(orderNo);
  const card = document.getElementById(`card-${orderNo}`);
  if (card) card.classList.toggle('selected', _selected.has(orderNo));
  updateBatchBar();
}

function clearSelection() {
  _selected.clear();
  document.querySelectorAll('.order-card').forEach(c => c.classList.remove('selected'));
  updateBatchBar();
}

function updateBatchBar() {
  const n   = _selected.size;
  const bar = document.getElementById('batchBar');
  bar.classList.toggle('show', n > 0);
  document.getElementById('batchCount').textContent = n;
  document.getElementById('btnBatchDownload').disabled = n === 0;
}

// ── 单个下载 ──
async function downloadSingle(event, orderNo) {
  event.stopPropagation();
  showToast('正在准备下载…');
  await doDownload(orderNo);
  await loadAll();
}

// ── 批量下载确认 ──
function confirmBatchDownload() {
  if (!_selected.size) return;
  const list = [..._selected];
  document.getElementById('confirmTitle').textContent = `下载 ${list.length} 个订单图纸包`;
  document.getElementById('confirmSub').textContent =
    `将下载所选 ${list.length} 个订单的完整图纸包（含原始帧、条形码、处理说明），\n并自动将订单状态标记为「生产中」。`;
  document.getElementById('confirmModal').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('show');
}

async function startBatchDownload() {
  closeConfirm();
  const list = [..._selected];
  document.getElementById('progressModal').classList.add('show');

  for (let i = 0; i < list.length; i++) {
    const orderNo = list[i];
    const pct = Math.round(((i) / list.length) * 100);
    document.getElementById('progressSub').textContent  = `正在下载第 ${i+1} / ${list.length} 个：${orderNo}`;
    document.getElementById('progressBar').style.width  = pct + '%';
    document.getElementById('progressText').textContent = pct + '%';
    await doDownload(orderNo);
  }

  document.getElementById('progressBar').style.width  = '100%';
  document.getElementById('progressText').textContent = '100%';
  document.getElementById('progressSub').textContent  = '全部下载完成！';

  await new Promise(r => setTimeout(r, 800));
  document.getElementById('progressModal').classList.remove('show');

  clearSelection();
  showToast(`✓ 已下载 ${list.length} 个图纸包，订单已标记为生产中`);
  await loadAll();
}

// ── 实际下载函数 ──
async function doDownload(orderNo) {
  const url = `${API}/api/admin/orders/${orderNo}/download-zip`;
  try {
    const res  = await fetch(url, { headers: { Authorization: `Bearer ${_token}` } });
    const blob = await res.blob();
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = `${orderNo}_package.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  } catch(e) {
    showToast(`下载失败：${orderNo}`);
  }
}

;

// ── Toast ──
let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
