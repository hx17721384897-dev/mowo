<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联名作品管理 — 哞屋后台</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;--accent-b:#7EC8E3;
  --red:#E03030;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --sidebar-w:220px;--sidebar-collapsed:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}

.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--black);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:width .3s cubic-bezier(0.22,1,0.36,1);overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-collapsed);}

.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;transition:margin-left .3s cubic-bezier(0.22,1,0.36,1);display:flex;flex-direction:column;}
.main.expanded{margin-left:var(--sidebar-collapsed);}
.topbar{position:sticky;top:0;z-index:50;background:rgba(245,243,239,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray1);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-weight:900;font-size:18px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.content{padding:28px 32px;flex:1;}

.btn{height:38px;padding:0 16px;border-radius:10px;font-family:var(--font);font-weight:800;font-size:13px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn-black{background:var(--black);color:var(--white);}
.btn-black:hover{opacity:.85;}
.btn-yellow{background:var(--accent-y);color:var(--black);}
.btn-yellow:hover{opacity:.85;}
.btn-green{background:#D6F5DC;color:#1B6B2F;}
.btn-green:hover{background:#B8ECC2;}
.btn-ghost{background:var(--white);color:var(--black);border:1.5px solid var(--gray1);}
.btn-ghost:hover{border-color:var(--black);}
.btn-red{background:#FFE8E3;color:#C0320A;border:1.5px solid #FFCFC4;}
.btn-red:hover{background:#FFCFC4;}
.btn-orange{background:#FFF3E0;color:#B94A00;border:1.5px solid #FFD9B0;}
.btn-orange:hover{background:#FFD9B0;}
.btn-sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.4;pointer-events:none;}

/* 统计卡片 */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--white);border-radius:14px;padding:16px 18px;border:1.5px solid var(--gray1);cursor:pointer;transition:all .15s;}
.stat-card:hover{border-color:var(--black);}
.stat-card.active{border-color:var(--black);background:var(--black);}
.stat-card.active .stat-label{color:rgba(255,255,255,.6);}
.stat-card.active .stat-num{color:var(--white);}
.stat-label{font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray3);margin-bottom:6px;}
.stat-num{font-weight:900;font-size:28px;line-height:1;}
.stat-sub{font-weight:700;font-size:11px;color:var(--gray3);margin-top:3px;}

/* 搜索栏 */
.search-bar{display:flex;gap:10px;margin-bottom:20px;}
.search-input{flex:1;height:38px;border:1.5px solid var(--gray1);border-radius:10px;padding:0 14px;font-family:var(--font);font-weight:700;font-size:13px;outline:none;transition:border-color .2s;background:var(--white);}
.search-input:focus{border-color:var(--black);}

/* 作品网格 */
.works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.work-card{background:var(--white);border-radius:16px;border:1.5px solid var(--gray1);overflow:hidden;transition:all .2s;}
.work-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08);}

.work-cover{width:100%;aspect-ratio:1;background:var(--gray1);position:relative;overflow:hidden;}
.work-cover img{width:100%;height:100%;object-fit:cover;}
.work-cover-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--gray2);}

/* 状态角标 */
.shelf-badge{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:11px;}
.badge-on-sale{background:#D6F5DC;color:#1B6B2F;}
.badge-suspended{background:#FFF3E0;color:#B94A00;}
.badge-pending{background:#E3F2FD;color:#1565C0;}
.badge-off-shelf{background:var(--gray1);color:var(--gray3);}
.badge-off-platform{background:#FFE8E3;color:#C0320A;}

/* 版本角标 */
.revision-badge{position:absolute;top:10px;right:10px;background:var(--accent-y);color:var(--black);padding:3px 8px;border-radius:6px;font-weight:900;font-size:10px;}

/* 暂停天数警告 */
.suspend-days{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-weight:800;font-size:11px;background:#FFF3E0;color:#B94A00;}
.suspend-days.warn{background:#FFE8E3;color:#C0320A;}

.work-body{padding:16px;}
.work-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.work-cover-thumb{width:40px;height:40px;border-radius:8px;background:var(--gray1);overflow:hidden;flex-shrink:0;}
.work-cover-thumb img{width:100%;height:100%;object-fit:cover;}
.work-title{font-weight:900;font-size:14px;line-height:1.3;margin-bottom:2px;}
.work-creator{font-weight:700;font-size:11px;color:var(--gray3);display:flex;align-items:center;gap:4px;}
.work-id{font-weight:700;font-size:10px;color:var(--gray2);font-family:monospace;margin-top:2px;}
.work-meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
.work-tag{padding:2px 8px;border-radius:999px;font-weight:800;font-size:10px;background:var(--cream);color:var(--gray3);}
.work-notice{background:#FFF8E6;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:700;color:#7A5F00;margin-bottom:10px;line-height:1.5;}
.work-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* 空态 */
.empty-state{grid-column:1/-1;padding:60px 20px;text-align:center;}
.empty-icon{font-size:40px;margin-bottom:10px;}
.empty-text{font-weight:800;font-size:14px;color:var(--gray3);}
.loading-row{grid-column:1/-1;padding:32px;text-align:center;font-weight:700;font-size:13px;color:var(--gray3);}

/* 抽屉 */
.drawer-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(17,17,16,.4);}
.drawer-overlay.show{display:block;}
.drawer{position:fixed;top:0;right:-580px;bottom:0;width:580px;max-width:100vw;background:var(--white);z-index:201;display:flex;flex-direction:column;transition:right .35s cubic-bezier(0.22,1,0.36,1);box-shadow:-8px 0 40px rgba(0,0,0,.12);}
.drawer.open{right:0;}
.drawer-header{padding:20px 24px;border-bottom:1.5px solid var(--gray1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.drawer-title{font-weight:900;font-size:16px;}
.drawer-close{width:36px;height:36px;border-radius:10px;background:var(--gray1);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.drawer-close:hover{background:var(--gray2);}
.drawer-body{flex:1;overflow-y:auto;padding:24px;}
.drawer-footer{padding:16px 24px;border-top:1.5px solid var(--gray1);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}
.detail-section{margin-bottom:24px;}
.detail-section-title{font-weight:900;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray3);margin-bottom:10px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.detail-item-label{font-weight:700;font-size:11px;color:var(--gray3);margin-bottom:3px;}
.detail-item-val{font-weight:800;font-size:13px;}
.frames-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.frame-thumb{aspect-ratio:1;background:var(--gray1);border-radius:6px;overflow:hidden;}
.frame-thumb img{width:100%;height:100%;object-fit:cover;}
.pack-table{width:100%;border-collapse:collapse;}
.pack-table th,.pack-table td{padding:10px 12px;text-align:left;font-size:12px;font-weight:700;border-bottom:1px solid var(--gray1);}
.pack-table th{font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);}
.pack-table tr:last-child td{border-bottom:none;}
.stock-stocked{background:#D6F5DC;color:#1B6B2F;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;}
.stock-on-demand{background:#FFF3E0;color:#B94A00;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;}
.sale-status{padding:10px 12px;border-radius:8px;font-size:12px;font-weight:800;line-height:1.6;margin-bottom:10px;}
.sale-status.ready{background:#E8F7EB;color:#1B6B2F;}
.sale-status.blocked{background:#FFF3E0;color:#8A4700;}
.sale-status ul{margin:5px 0 0 18px;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(17,17,16,.5);align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--white);border-radius:20px;padding:28px;width:460px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15);}
.modal-title{font-weight:900;font-size:17px;margin-bottom:4px;}
.modal-sub{font-weight:700;font-size:12px;color:var(--gray3);margin-bottom:20px;line-height:1.6;}
.modal-warn{background:#FFE8E3;border-radius:10px;padding:10px 14px;font-weight:700;font-size:12px;color:#C0320A;margin-bottom:16px;line-height:1.6;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.form-field{margin-bottom:14px;}
.form-label{font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);display:block;margin-bottom:6px;}
.form-input,.form-textarea,.form-select{width:100%;border:1.5px solid var(--gray1);border-radius:10px;padding:10px 12px;font-family:var(--font);font-weight:700;font-size:13px;color:var(--black);background:var(--white);outline:none;transition:border-color .2s;}
.form-input{height:40px;padding:0 12px;}
.form-textarea{min-height:90px;resize:vertical;line-height:1.6;}
.form-select{height:40px;}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--black);}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--white);padding:12px 22px;border-radius:12px;font-weight:800;font-size:13px;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.menu-btn{width:36px;height:36px;border-radius:10px;background:var(--gray1);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-right:4px;}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:190;display:none;}
.sidebar-backdrop.show{display:block;}
@media(max-width:1023px){
  .sidebar{transform:translateX(-100%);z-index:200;}
  .sidebar.open{transform:none;}
  .main{margin-left:0!important;}
  .topbar,.content{padding-left:16px;padding-right:16px;}
  .menu-btn{display:flex;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main" id="main">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn">&#9776;</button>
    <span class="topbar-title">🎨 联名作品管理</span>
    <div class="topbar-right">
      <button class="btn btn-ghost btn-sm" onclick="loadWorks()">↻ 刷新</button>
    </div>
  </header>

  <div class="content">

    <!-- 统计卡片（点击即筛选） -->
    <div class="stats-grid">
      <div class="stat-card active" id="tab-on_sale" onclick="setFilter('on_sale')">
        <div class="stat-label">在售</div>
        <div class="stat-num" id="cnt-on_sale">—</div>
        <div class="stat-sub">正常销售中</div>
      </div>
      <div class="stat-card" id="tab-suspended" onclick="setFilter('suspended')">
        <div class="stat-label">暂停中</div>
        <div class="stat-num" id="cnt-suspended">—</div>
        <div class="stat-sub">管理员暂停</div>
      </div>
      <div class="stat-card" id="tab-pending_delist" onclick="setFilter('pending_delist')">
        <div class="stat-label">申请处理中</div>
        <div class="stat-num" id="cnt-pending_delist">—</div>
        <div class="stat-sub">创作者申请下架</div>
      </div>
      <div class="stat-card" id="tab-off_shelf" onclick="setFilter('off_shelf')">
        <div class="stat-label">已下架</div>
        <div class="stat-num" id="cnt-off_shelf">—</div>
        <div class="stat-sub">永久停售</div>
      </div>
    </div>

    <!-- 搜索 -->
    <div class="search-bar">
      <input class="search-input" id="searchInput" type="text" placeholder="搜索作品标题或创作者名称…" oninput="renderWorks()">
    </div>

    <!-- 作品网格 -->
    <div class="works-grid" id="worksGrid">
      <div class="loading-row">正在加载…</div>
    </div>
  </div>
</div>

<!-- 作品详情抽屉 -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title" id="drawerTitle">作品详情</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer" id="drawerFooter"></div>
</div>

<!-- 强制下架 Modal -->
<div class="modal-overlay" id="delistModal">
  <div class="modal">
    <p class="modal-title">⚠️ 强制下架</p>
    <p class="modal-sub" id="delistModalSub">请填写下架原因和发给创作者的通知。</p>
    <div class="modal-warn">下架后作品立即从 showcase 移除，创作者可根据通知内容修改后重新提交。</div>
    <div class="form-field">
      <label class="form-label">内部备注（仅管理员可见）</label>
      <input class="form-input" id="delistReason" placeholder="如：动画内容违规 / 质量问题">
    </div>
    <div class="form-field">
      <label class="form-label">发给创作者的通知</label>
      <textarea class="form-textarea" id="delistNotice" placeholder="描述具体问题，告知创作者可修改后重新提交…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('delistModal')">取消</button>
      <button class="btn btn-red" onclick="submitForceDelist()">确认强制下架</button>
    </div>
  </div>
</div>

<!-- 恢复上架确认 Modal -->
<div class="modal-overlay" id="relistModal">
  <div class="modal">
    <p class="modal-title">重新上架</p>
    <p class="modal-sub" id="relistModalSub">确认将此作品重新上架？无需重新审核，上架后立即在 showcase 可见。</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('relistModal')">取消</button>
      <button class="btn btn-green" onclick="submitRelist()">确认上架</button>
    </div>
  </div>
</div>

<!-- 审批下架申请 Modal -->
<div class="modal-overlay" id="delistApproveModal">
  <div class="modal">
    <p class="modal-title">处理下架申请</p>
    <p class="modal-sub" id="delistApproveModalSub">—</p>
    <div class="form-field">
      <label class="form-label">备注（可选，将通知创作者）</label>
      <input class="form-input" id="delistApproveNote" placeholder="如：同意，库存将由平台处理">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('delistApproveModal')">取消</button>
      <button class="btn btn-ghost" onclick="submitDelistDecision(false)">拒绝申请（恢复上架）</button>
      <button class="btn btn-black" onclick="submitDelistDecision(true)">同意下架</button>
    </div>
  </div>
</div>

<!-- 库存调整 Modal -->
<div class="modal-overlay" id="stockModal">
  <div class="modal">
    <p class="modal-title">调整帧素材包库存</p>
    <p class="modal-sub" id="stockModalSub">—</p>
    <div class="form-field">
      <label class="form-label">库存类型</label>
      <select class="form-select" id="stockType">
        <option value="on_demand">按需生产（不备货）</option>
        <option value="stocked">有备货（管理库存）</option>
      </select>
    </div>
    <div class="form-field">
      <label class="form-label">调整数量（正数入库，负数扣减）</label>
      <input class="form-input" type="number" id="stockQty" placeholder="如：10 或 -3">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('stockModal')">取消</button>
      <button class="btn btn-yellow" onclick="submitStock()">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = location.hostname === '127.0.0.1' ? 'http://127.0.0.1:3001' : 'http://localhost:3001'
let _token = ''
let _works = []
let _filter = 'on_sale'
let _activeWorkId = ''
let _curSize = ''

window.addEventListener('DOMContentLoaded', async () => {
  _token = localStorage.getItem('mowo_token') || ''
  if (!_token) { location.href = 'index.html'; return }
  try {
    const p = JSON.parse(atob(_token.split('.')[1]))
    if ((p.role ?? 0) < 2) { alert('权限不足'); location.href = 'index.html'; return }
  } catch { location.href = 'index.html'; return }
  loadWorks()
})
window.addEventListener('mowoTokenRefreshed', () => { _token = localStorage.getItem('mowo_token') || '' })

// ── 加载 ──
async function loadWorks() {
  document.getElementById('worksGrid').innerHTML = '<div class="loading-row">正在加载…</div>'
  try {
    const res  = await fetch(`${API}/api/admin/collab/works?limit=200`, { headers: { Authorization: `Bearer ${_token}` } })
    const json = await res.json()
    if (!json.success) { showToast('加载失败'); return }
    _works = json.data.works.filter(w => w.status === 'approved')
    updateStats()
    renderWorks()
  } catch { showToast('网络错误') }
}

function updateStats() {
  ;['on_sale','suspended','pending_delist','off_shelf'].forEach(s => {
    document.getElementById(`cnt-${s}`).textContent = _works.filter(w => w.shelfStatus === s).length
  })
}

function setFilter(f) {
  _filter = f
  document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'))
  document.getElementById(`tab-${f}`).classList.add('active')
  renderWorks()
}

function renderWorks() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase()
  let list = _works.filter(w => w.shelfStatus === _filter)
  if (q) list = list.filter(w =>
    w.title.toLowerCase().includes(q) ||
    (w.creator?.nickname || '').toLowerCase().includes(q)
  )

  const grid = document.getElementById('worksGrid')
  if (!list.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无作品</div></div>'
    return
  }
  grid.innerHTML = list.map(w => workCard(w)).join('')
}

function shelfBadgeHtml(w) {
  const daysSinceSuspend = w.suspendedAt
    ? Math.floor((Date.now() - new Date(w.suspendedAt)) / 86400000) : 0
  const map = {
    on_sale:       '<span class="shelf-badge badge-on-sale">在售</span>',
    suspended:     `<span class="shelf-badge badge-suspended">暂停中</span>`,
    pending_delist:'<span class="shelf-badge badge-pending">申请处理中 🔒</span>',
    off_shelf:     w.offShelfType === 'platform_force'
                    ? '<span class="shelf-badge badge-off-platform">平台下架</span>'
                    : '<span class="shelf-badge badge-off-shelf">已下架</span>',
  }
  return map[w.shelfStatus] || ''
}

function suspendDaysHtml(w) {
  if (w.shelfStatus !== 'suspended' || !w.suspendedAt) return ''
  const days = Math.floor((Date.now() - new Date(w.suspendedAt)) / 86400000)
  const warn = days >= 75
  return `<span class="suspend-days${warn ? ' warn' : ''}">⏱ 已暂停 ${days} 天</span>`
}

function workCard(w) {
  const cover = w.coverUrl
    ? `<img src="${w.coverUrl}" alt="封面" onerror="this.style.display='none'">`
    : `<div class="work-cover-empty">🎨</div>`
  const revision = w.isRevision ? '<span class="revision-badge">修改版</span>' : ''
  const sizes = safeJson(w.sizes)

  let noticeHtml = ''
  if (w.shelfStatus === 'off_shelf' && w.offShelfNotice) {
    noticeHtml = `<div class="work-notice">📢 通知创作者：${w.offShelfNotice}</div>`
  }
  if (w.shelfStatus === 'pending_delist' && w.delistReason) {
    noticeHtml = `<div class="work-notice">📋 申请原因：${w.delistReason}</div>`
  }

  const actions = buildActions(w)

  return `<div class="work-card">
    <div class="work-cover">
      ${cover}
      ${shelfBadgeHtml(w)}
      ${revision}
    </div>
    <div class="work-body">
      <div class="work-header">
        <div style="flex:1;min-width:0;">
          <div class="work-title">${w.title}</div>
          <div class="work-creator">👤 ${w.creator?.nickname || '未知创作者'}</div>
          <div class="work-id">#${w.id.slice(-6).toUpperCase()}</div>
        </div>
      </div>
      <div class="work-meta">
        ${suspendDaysHtml(w)}
        ${sizes.map(s => `<span class="work-tag">${s}</span>`).join('')}
        <span class="work-tag">${w.saleConfigCount || 0} 个可售 SKU</span>
        <span class="work-tag">分红 ${Math.round((w.revenueRate || 0) * 100)}%</span>
        ${w.isExclusiveWork ? '<span class="work-tag">独家</span>' : ''}
      </div>
      ${noticeHtml}
      <div class="work-actions">
        <button class="btn btn-ghost btn-sm" onclick="openDrawer('${w.id}')">详情</button>
        <button class="btn btn-yellow btn-sm" onclick="openProductWorkspace('${w.id}')">编辑商品</button>
        ${actions}
      </div>
    </div>
  </div>`
}

function buildActions(w) {
  const id = w.id
  switch (w.shelfStatus) {
    case 'on_sale':
      return `<button class="btn btn-orange btn-sm" onclick="doSuspend('${id}')">暂停销售</button>
              <button class="btn btn-red btn-sm" onclick="openDelistModal('${id}')">强制下架</button>`
    case 'suspended':
      return `<button class="btn btn-green btn-sm" onclick="doResume('${id}')">恢复上架</button>
              <button class="btn btn-red btn-sm" onclick="openDelistModal('${id}')">强制下架</button>`
    case 'pending_delist':
      return `<button class="btn btn-black btn-sm" onclick="openDelistApproveModal('${id}')">处理申请</button>`
    case 'off_shelf':
      return `<button class="btn btn-green btn-sm" onclick="openRelistModal('${id}')">重新上架</button>`
    default:
      return ''
  }
}

// ── 操作：暂停 / 恢复 ──
async function doSuspend(id) {
  const w = _works.find(x => x.id === id)
  if (!confirm(`确认暂停《${w?.title}》的销售？\n暂停后不接受新订单，创作者可申请恢复。`)) return
  await callApi('PUT', `/api/admin/collab/${id}/suspend`, {}, '已暂停销售')
}

async function doResume(id) {
  const w = _works.find(x => x.id === id)
  if (!confirm(`确认恢复《${w?.title}》上架？`)) return
  await callApi('PUT', `/api/admin/collab/${id}/resume`, {}, '已恢复上架')
}

// ── 强制下架 Modal ──
function openDelistModal(id) {
  _activeWorkId = id
  const w = _works.find(x => x.id === id)
  document.getElementById('delistModalSub').textContent = `作品：《${w?.title}》 · ${w?.creator?.nickname || ''} · #${id.slice(-6).toUpperCase()}`
  document.getElementById('delistReason').value = ''
  document.getElementById('delistNotice').value = ''
  document.getElementById('delistModal').classList.add('show')
}

async function submitForceDelist() {
  const reason = document.getElementById('delistReason').value.trim()
  const notice = document.getElementById('delistNotice').value.trim()
  if (!reason) { showToast('请填写内部备注'); return }
  if (!notice) { showToast('请填写给创作者的通知'); return }
  closeModal('delistModal')
  await callApi('PUT', `/api/admin/collab/${_activeWorkId}/force-delist`, { reason, notice }, '已强制下架并通知创作者')
}

// ── 重新上架 Modal ──
function openRelistModal(id) {
  _activeWorkId = id
  const w = _works.find(x => x.id === id)
  document.getElementById('relistModalSub').textContent = `作品：《${w?.title}》 · ${w?.creator?.nickname || ''} · #${id.slice(-6).toUpperCase()}`
  document.getElementById('relistModal').classList.add('show')
}

async function submitRelist() {
  closeModal('relistModal')
  await callApi('PUT', `/api/admin/collab/${_activeWorkId}/relist`, {}, '已重新上架')
}

// ── 审批申请 Modal ──
function openDelistApproveModal(id) {
  _activeWorkId = id
  const w = _works.find(x => x.id === id)
  document.getElementById('delistApproveModalSub').textContent =
    `《${w?.title}》 · ${w?.creator?.nickname || ''}` +
    (w?.delistReason ? `\n申请原因：${w.delistReason}` : '')
  document.getElementById('delistApproveNote').value = ''
  document.getElementById('delistApproveModal').classList.add('show')
}

async function submitDelistDecision(approve) {
  const adminNote = document.getElementById('delistApproveNote').value.trim()
  closeModal('delistApproveModal')
  await callApi('PUT', `/api/admin/collab/${_activeWorkId}/approve-delist`,
    { approve, adminNote },
    approve ? '已同意下架' : '已拒绝申请，作品恢复上架')
}

// ── 通用 API 调用 ──
async function callApi(method, path, body, successMsg) {
  try {
    const res  = await fetch(`${API}${path}`, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
      body: JSON.stringify(body),
    })
    const json = await res.json()
    if (json.success) { showToast('✓ ' + successMsg); await loadWorks() }
    else showToast('操作失败：' + json.message)
  } catch { showToast('网络错误') }
}

// ── 详情抽屉 ──
async function openDrawer(workId) {
  _activeWorkId = workId
  document.getElementById('drawerBody').innerHTML = '<div style="padding:20px;color:var(--gray3);font-weight:700;">加载中…</div>'
  document.getElementById('drawerFooter').innerHTML = ''
  document.getElementById('drawer').classList.add('open')
  document.getElementById('drawerOverlay').classList.add('show')
  document.body.style.overflow = 'hidden'

  try {
    const [workRes, packsRes] = await Promise.all([
      fetch(`${API}/api/admin/collab/works/${workId}`, { headers: { Authorization: `Bearer ${_token}` } }),
      fetch(`${API}/api/admin/collab/${workId}/frame-packs`, { headers: { Authorization: `Bearer ${_token}` } }),
    ])
    const work  = (await workRes.json()).data
    const packs = (await packsRes.json()).data || []
    document.getElementById('drawerTitle').textContent = work.title
    renderDrawer(work, packs)
  } catch {
    document.getElementById('drawerBody').innerHTML = '<div style="padding:20px;color:var(--gray3);">加载失败</div>'
  }
}

function renderDrawer(w, packs) {
  const frames   = Array.isArray(w.animationFrames) ? w.animationFrames : []
  const workSizes = safeJson(w.sizes)
  const packSizes = packs.map(p => p.size)
  const missing  = workSizes.filter(s => !packSizes.includes(s))

  const statusLabel = {
    on_sale:       '✅ 在售',
    suspended:     '⏸ 暂停中',
    pending_delist:'🔒 申请处理中',
    off_shelf:     '📦 已下架',
  }[w.shelfStatus] || '—'

  const offShelfTypeLabel = {
    platform_force:   '平台强制下架',
    creator_request:  '创作者申请',
  }[w.offShelfType] || ''

  document.getElementById('drawerBody').innerHTML = `
    <div class="detail-section">
      <div class="detail-section-title">基本信息</div>
      <div class="detail-grid">
        <div><div class="detail-item-label">创作者</div><div class="detail-item-val">${w.creator?.nickname || '—'}</div></div>
        <div><div class="detail-item-label">货架状态</div><div class="detail-item-val">${statusLabel}</div></div>
        <div><div class="detail-item-label">分红率</div><div class="detail-item-val">${Math.round((w.revenueRate || 0) * 100)}%</div></div>
        <div><div class="detail-item-label">审核时间</div><div class="detail-item-val" style="font-size:11px;">${w.approvedAt ? new Date(w.approvedAt).toLocaleDateString('zh-CN') : '—'}</div></div>
        ${w.shelfStatus === 'suspended' ? `<div><div class="detail-item-label">暂停时间</div><div class="detail-item-val" style="font-size:11px;">${w.suspendedAt ? new Date(w.suspendedAt).toLocaleDateString('zh-CN') : '—'}</div></div>` : ''}
        ${w.shelfStatus === 'off_shelf' ? `<div><div class="detail-item-label">下架方式</div><div class="detail-item-val">${offShelfTypeLabel}</div></div>` : ''}
        ${w.offShelfReason ? `<div style="grid-column:1/-1;"><div class="detail-item-label">内部备注</div><div class="detail-item-val" style="font-size:12px;">${w.offShelfReason}</div></div>` : ''}
        ${w.offShelfNotice ? `<div style="grid-column:1/-1;"><div class="detail-item-label">创作者通知</div><div class="detail-item-val" style="font-size:12px;color:#7A5F00;">${w.offShelfNotice}</div></div>` : ''}
        ${w.delistReason   ? `<div style="grid-column:1/-1;"><div class="detail-item-label">创作者申请原因</div><div class="detail-item-val" style="font-size:12px;">${w.delistReason}</div></div>` : ''}
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">商品上架准备</div>
      <div class="sale-status ${w.saleReadiness?.ready ? 'ready' : 'blocked'}">
        ${w.saleReadiness?.ready
          ? `已满足上架条件 · ${w.saleSkus?.length || 0} 个可售 SKU`
          : `尚未满足上架条件${w.saleReadiness?.blockers?.length ? `<ul>${w.saleReadiness.blockers.map(item => `<li>${esc(item)}</li>`).join('')}</ul>` : ''}`}
      </div>
      <button class="btn btn-yellow btn-sm" onclick="openProductWorkspace('${w.id}')">进入商品工作区</button>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">帧图预览（前10帧）</div>
      ${frames.length
        ? `<div class="frames-grid">${frames.slice(0,10).map(url =>
            `<div class="frame-thumb"><img src="${url}" loading="lazy" onerror="this.style.display='none'"></div>`
          ).join('')}</div>`
        : '<div style="font-size:12px;color:var(--gray3);">暂无帧图</div>'}
    </div>
    <div class="detail-section">
      <div class="detail-section-title">帧素材包库存</div>
      ${packs.length
        ? `<table class="pack-table">
            <thead><tr><th>尺寸</th><th>库存类型</th><th>当前库存</th><th>锁定</th><th>操作</th></tr></thead>
            <tbody>${packs.map(p => `<tr>
              <td><strong>${p.size}</strong></td>
              <td><span class="${p.stockType === 'stocked' ? 'stock-stocked' : 'stock-on-demand'}">${p.stockType === 'stocked' ? '有备货' : '按需'}</span></td>
              <td>${p.currentStock}</td>
              <td>${p.reservedStock}</td>
              <td><button class="btn btn-ghost btn-sm" onclick="openStockModal('${w.id}','${p.size}','${p.stockType}')">调整</button></td>
            </tr>`).join('')}</tbody>
          </table>`
        : '<div style="font-size:12px;color:var(--gray3);">暂无帧素材包记录</div>'}
      ${missing.length ? `<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">${missing.map(s =>
        `<button class="btn btn-ghost btn-sm" onclick="openStockModal('${w.id}','${s}','on_demand')">+ 添加 ${s}</button>`).join('')}</div>` : ''}
    </div>`

  // 抽屉底部操作按钮（和卡片一致）
  document.getElementById('drawerFooter').innerHTML = buildActions(w)
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open')
  document.getElementById('drawerOverlay').classList.remove('show')
  document.body.style.overflow = ''
}

function openProductWorkspace(workId) {
  location.href = `admin-collab-product-edit.html?id=${encodeURIComponent(workId)}`
}

// ── 库存调整 ──
function openStockModal(workId, size, currentType) {
  _activeWorkId = workId; _curSize = size
  document.getElementById('stockModalSub').textContent = `#${workId.slice(-6).toUpperCase()} · 尺寸：${size}`
  document.getElementById('stockType').value = currentType || 'on_demand'
  document.getElementById('stockQty').value  = ''
  document.getElementById('stockModal').classList.add('show')
}

async function submitStock() {
  const stockType = document.getElementById('stockType').value
  const qty = document.getElementById('stockQty').value
  try {
    await fetch(`${API}/api/admin/collab/${_activeWorkId}/frame-packs/${encodeURIComponent(_curSize)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
      body: JSON.stringify({ stockType }),
    })
    if (qty && parseInt(qty) !== 0) {
      const res  = await fetch(`${API}/api/admin/collab/${_activeWorkId}/frame-packs/${encodeURIComponent(_curSize)}/restock`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
        body: JSON.stringify({ quantity: parseInt(qty) }),
      })
      const json = await res.json()
      if (!json.success) { showToast('库存调整失败：' + json.message); return }
    }
    showToast('✓ 已更新')
    closeModal('stockModal')
    openDrawer(_activeWorkId)
  } catch { showToast('网络错误') }
}

// ── 工具 ──
function closeModal(id) { document.getElementById(id).classList.remove('show') }
function safeJson(s) { try { return Array.isArray(s) ? s : JSON.parse(s || '[]') } catch { return [] } }
function esc(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])) }

let _toastTimer
function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  clearTimeout(_toastTimer)
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2800)
}

document.getElementById('menuBtn').onclick = () => {
  document.getElementById('sidebar').classList.add('open')
  document.getElementById('sidebarBackdrop').classList.add('show')
}
document.getElementById('sidebarBackdrop').onclick = () => {
  document.getElementById('sidebar').classList.remove('open')
  document.getElementById('sidebarBackdrop').classList.remove('show')
}
</script>
<script src="../js/auth.js"></script>
<script src="../js/admin-sidebar.js?v=20260813-shell-init"></script>
