<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联名作品管理 — 哞屋后台</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --white:#FFFFFF; --cream:#F5F3EF; --black:#111110;
  --gray1:#EBEBEA; --gray2:#C4C3BF; --gray3:#787874;
  --accent-y:#F5E642; --accent-o:#FF6B35; --accent-g:#8FD694; --accent-b:#7EC8E3;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --sidebar-w:220px; --sidebar-collapsed:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}

/* 侧边栏 */
.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--black);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:width .3s cubic-bezier(0.22,1,0.36,1);overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;}
.sidebar-logo-icon{width:32px;height:32px;background:var(--accent-y);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sidebar-logo-text{font-weight:900;font-size:15px;color:var(--white);letter-spacing:.04em;}
.sidebar-logo-sub{font-weight:700;font-size:10px;color:var(--gray3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:1px;}
.sidebar-toggle{position:absolute;top:26px;right:12px;width:28px;height:28px;background:rgba(255,255,255,.08);border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray3);font-size:12px;transition:background .2s;}
.sidebar-toggle:hover{background:rgba(255,255,255,.15);color:var(--white);}
.sidebar-nav{flex:1;padding:16px 0;overflow-y:auto;overflow-x:hidden;}
.nav-section-label{font-weight:800;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gray3);padding:12px 20px 6px;white-space:nowrap;overflow:hidden;transition:opacity .2s;}
.sidebar.collapsed .nav-section-label{opacity:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;color:var(--gray3);font-weight:800;font-size:13px;text-decoration:none;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--white);}
.nav-item.active{background:rgba(245,230,66,.12);color:var(--accent-y);}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-y);border-radius:0 2px 2px 0;}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.nav-label{transition:opacity .2s;}
.sidebar.collapsed .nav-label{opacity:0;}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap;overflow:hidden;}
.sidebar-user{display:flex;align-items:center;gap:10px;}
.sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);flex-shrink:0;}
.sidebar-user-name{font-weight:800;font-size:12px;color:var(--white);}
.sidebar-user-role{font-weight:700;font-size:10px;color:var(--gray3);}
.sidebar.collapsed .sidebar-user-info{display:none;}

/* 主区 */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;transition:margin-left .3s cubic-bezier(0.22,1,0.36,1);display:flex;flex-direction:column;}
.main.expanded{margin-left:var(--sidebar-collapsed);}
.topbar{position:sticky;top:0;z-index:50;background:rgba(245,243,239,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray1);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-weight:900;font-size:18px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.topbar-time{font-weight:700;font-size:12px;color:var(--gray3);}
.content{padding:28px 32px;flex:1;}

/* 按钮 */
.btn{height:38px;padding:0 16px;border-radius:10px;font-family:var(--font);font-weight:800;font-size:13px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn-black{background:var(--black);color:var(--white);}
.btn-black:hover{opacity:.85;}
.btn-yellow{background:var(--accent-y);color:var(--black);}
.btn-yellow:hover{opacity:.85;}
.btn-ghost{background:var(--white);color:var(--black);border:1.5px solid var(--gray1);}
.btn-ghost:hover{border-color:var(--black);}
.btn-red{background:#FFE8E3;color:#C0320A;border:1.5px solid #FFCFC4;}
.btn-red:hover{background:#FFCFC4;}
.btn-sm{height:32px;padding:0 12px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.4;pointer-events:none;}

/* 统计卡片 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
.stat-card{background:var(--white);border-radius:14px;padding:16px 18px;border:1.5px solid var(--gray1);}
.stat-label{font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray3);margin-bottom:6px;}
.stat-num{font-weight:900;font-size:26px;color:var(--black);line-height:1;}

/* 筛选Tab */
.filter-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.filter-tab{height:32px;padding:0 14px;border-radius:8px;font-family:var(--font);font-weight:800;font-size:12px;border:1.5px solid var(--gray1);background:var(--white);color:var(--gray3);cursor:pointer;transition:all .15s;}
.filter-tab:hover{border-color:var(--black);color:var(--black);}
.filter-tab.active{background:var(--black);color:var(--white);border-color:var(--black);}

/* 作品卡片网格 */
.works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.work-card{background:var(--white);border-radius:16px;border:1.5px solid var(--gray1);overflow:hidden;transition:all .2s;}
.work-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08);}

.work-cover{width:100%;aspect-ratio:1;background:var(--gray1);position:relative;overflow:hidden;}
.work-cover img{width:100%;height:100%;object-fit:cover;}
.work-cover-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--gray2);}

.work-shelf-badge{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:999px;font-weight:800;font-size:11px;}
.shelf-on{background:#E8F5E9;color:#2E7D32;}
.shelf-off{background:var(--gray1);color:var(--gray3);}

.work-body{padding:16px;}
.work-title{font-weight:900;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.work-creator{font-weight:700;font-size:11px;color:var(--gray3);margin-bottom:10px;}
.work-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.work-tag{padding:2px 8px;border-radius:999px;font-weight:800;font-size:10px;background:var(--cream);color:var(--gray3);}

.work-sizes{margin-bottom:12px;}
.work-sizes-label{font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);margin-bottom:6px;}
.work-size-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--gray1);font-size:12px;font-weight:700;}
.work-size-row:last-child{border-bottom:none;}
.size-stock-badge{padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;}
.stock-stocked{background:#E8F5E9;color:#2E7D32;}
.stock-on-demand{background:#FFF3E0;color:#E65100;}

.work-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* 状态标签 */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-weight:800;font-size:11px;}
.status-pending{background:#FFF8E1;color:#B8860B;}
.status-approved{background:#E3F2FD;color:#1565C0;}
.status-rejected{background:#FFE8E3;color:#C0320A;}

/* 空状态/加载 */
.empty-state{grid-column:1/-1;padding:48px 20px;text-align:center;}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-text{font-weight:800;font-size:14px;color:var(--gray3);}
.loading-row{grid-column:1/-1;padding:32px 20px;text-align:center;font-weight:700;font-size:13px;color:var(--gray3);}

/* 抽屉 */
.drawer-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(17,17,16,.4);}
.drawer-overlay.show{display:block;}
.drawer{position:fixed;top:0;right:-560px;bottom:0;width:560px;max-width:100vw;background:var(--white);z-index:201;display:flex;flex-direction:column;transition:right .35s cubic-bezier(0.22,1,0.36,1);box-shadow:-8px 0 40px rgba(0,0,0,.12);}
.drawer.open{right:0;}
.drawer-header{padding:20px 24px;border-bottom:1.5px solid var(--gray1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.drawer-title{font-weight:900;font-size:16px;}
.drawer-close{width:36px;height:36px;border-radius:10px;background:var(--gray1);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.drawer-close:hover{background:var(--gray2);}
.drawer-body{flex:1;overflow-y:auto;padding:24px;}
.drawer-footer{padding:16px 24px;border-top:1.5px solid var(--gray1);display:flex;flex-direction:column;gap:10px;flex-shrink:0;}

.detail-section{margin-bottom:24px;}
.detail-section-title{font-weight:900;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray3);margin-bottom:12px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.detail-item-label{font-weight:700;font-size:11px;color:var(--gray3);margin-bottom:3px;}
.detail-item-val{font-weight:800;font-size:13px;color:var(--black);}

.frames-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;}
.frame-thumb{aspect-ratio:1;background:var(--gray1);border-radius:6px;overflow:hidden;}
.frame-thumb img{width:100%;height:100%;object-fit:cover;}

/* 帧素材包管理表格 */
.pack-table{width:100%;border-collapse:collapse;}
.pack-table th,.pack-table td{padding:10px 12px;text-align:left;font-size:12px;font-weight:700;border-bottom:1px solid var(--gray1);}
.pack-table th{font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);}
.pack-table tr:last-child td{border-bottom:none;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(17,17,16,.5);align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--white);border-radius:20px;padding:28px;width:400px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15);}
.modal-title{font-weight:900;font-size:17px;margin-bottom:6px;}
.modal-sub{font-weight:700;font-size:12px;color:var(--gray3);margin-bottom:20px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.form-field{margin-bottom:14px;}
.form-label{font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);display:block;margin-bottom:6px;}
.form-select,.form-input{width:100%;height:40px;border:1.5px solid var(--gray1);border-radius:10px;padding:0 12px;font-family:var(--font);font-weight:700;font-size:13px;color:var(--black);background:var(--white);outline:none;transition:border-color .2s;}
.form-select:focus,.form-input:focus{border-color:var(--black);}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--white);padding:12px 22px;border-radius:12px;font-weight:800;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<div class="main" id="main">
  <header class="topbar">
    <span class="topbar-title">联名作品管理</span>
    <div class="topbar-right">
      <span class="topbar-time" id="topbarTime"></span>
      <button class="btn btn-ghost btn-sm" onclick="loadWorks()">↻ 刷新</button>
    </div>
  </header>

  <div class="content">

    <!-- 统计卡片 -->
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">全部作品</div><div class="stat-num" id="statTotal">—</div></div>
      <div class="stat-card"><div class="stat-label">已上架</div><div class="stat-num" id="statOnShelf">—</div></div>
      <div class="stat-card"><div class="stat-label">待审核</div><div class="stat-num" id="statPending">—</div></div>
      <div class="stat-card"><div class="stat-label">已下架</div><div class="stat-num" id="statOffShelf">—</div></div>
    </div>

    <!-- 状态筛选 -->
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('')">全部</button>
      <button class="filter-tab" onclick="setFilter('approved_on')">已上架</button>
      <button class="filter-tab" onclick="setFilter('approved_off')">已审核未上架</button>
      <button class="filter-tab" onclick="setFilter('pending')">待审核</button>
      <button class="filter-tab" onclick="setFilter('rejected')">已拒绝</button>
    </div>

    <!-- 作品卡片 -->
    <div class="works-grid" id="worksGrid">
      <div class="loading-row">正在加载…</div>
    </div>

  </div>
</div>

<!-- 作品详情抽屉 -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title" id="drawerTitle">作品详情</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"><div style="padding:20px;color:var(--gray3);font-weight:700;">加载中…</div></div>
  <div class="drawer-footer" id="drawerFooter"></div>
</div>

<!-- 库存调整Modal -->
<div class="modal-overlay" id="stockModal">
  <div class="modal">
    <p class="modal-title">调整帧素材包库存</p>
    <p class="modal-sub" id="stockModalSub">—</p>
    <div class="form-field">
      <label class="form-label">库存类型</label>
      <select class="form-select" id="stockType">
        <option value="on_demand">按需生产（不备货）</option>
        <option value="stocked">有备货（管理库存）</option>
      </select>
    </div>
    <div class="form-field" id="stockQtyField">
      <label class="form-label">调整数量（正数入库，负数扣减）</label>
      <input class="form-input" type="number" id="stockQty" placeholder="如：10 或 -3">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeStockModal()">取消</button>
      <button class="btn btn-yellow" onclick="submitStock()">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = (location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001');
let _token    = '';
window.addEventListener('mowoTokenRefreshed', () => { _token = localStorage.getItem('mowo_token') || ''; });
let _works    = [];
let _filter   = '';
let _curWorkId = '';
let _curSize   = '';

// ── 初始化 ──
window.addEventListener('DOMContentLoaded', async () => {
  _token = localStorage.getItem('mowo_token') || '';
  if (!_token) { location.href = 'index.html'; return; }
  try {
    const p = JSON.parse(atob(_token.split('.')[1]));
    if ((p.role ?? 0) < 2) { alert('权限不足'); location.href = 'index.html'; return; }
    const roleMap = { 2:'管理员', 3:'超级管理员' };
    document.getElementById('sidebarName').textContent   = p.phone || '管理员';
    document.getElementById('sidebarRole').textContent   = roleMap[p.role] || '管理员';
    document.getElementById('sidebarAvatar').textContent = (p.phone || '管')[0];
  } catch(e) { location.href = 'index.html'; return; }

  updateTime();
  setInterval(updateTime, 1000);
  await loadWorks();
});

function updateTime() {
  const now = new Date();
  document.getElementById('topbarTime').textContent =
    now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
}

// ── 加载作品 ──
async function loadWorks() {
  document.getElementById('worksGrid').innerHTML = '<div class="loading-row">正在加载…</div>';
  try {
    const res  = await fetch(`${API}/api/admin/collab/works?limit=100`, { headers: { Authorization: `Bearer ${_token}` } });
    const json = await res.json();
    if (!json.success) { showToast('加载失败'); return; }
    _works = json.data.works;
    updateStats();
    renderWorks();
  } catch(e) { showToast('网络错误'); }
}

function updateStats() {
  document.getElementById('statTotal').textContent    = _works.length;
  document.getElementById('statOnShelf').textContent  = _works.filter(w => w.status === 'approved' && w.isOnShelf).length;
  document.getElementById('statPending').textContent  = _works.filter(w => w.status === 'pending').length;
  document.getElementById('statOffShelf').textContent = _works.filter(w => w.status === 'approved' && !w.isOnShelf).length;
}

function setFilter(f) {
  _filter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderWorks();
}

function renderWorks() {
  const grid = document.getElementById('worksGrid');
  let filtered = _works;
  if (_filter === 'approved_on')  filtered = _works.filter(w => w.status === 'approved' && w.isOnShelf);
  if (_filter === 'approved_off') filtered = _works.filter(w => w.status === 'approved' && !w.isOnShelf);
  if (_filter === 'pending')      filtered = _works.filter(w => w.status === 'pending');
  if (_filter === 'rejected')     filtered = _works.filter(w => w.status === 'rejected');

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无作品</div></div>';
    return;
  }

  grid.innerHTML = filtered.map(w => {
    const coverUrl   = w.coverUrl || '';
    const sizes      = Array.isArray(w.sizes) ? w.sizes : (w.sizes ? JSON.parse(w.sizes) : []);
    const statusBadge = {
      pending:  '<span class="status-badge status-pending">待审核</span>',
      approved: '<span class="status-badge status-approved">已审核</span>',
      rejected: '<span class="status-badge status-rejected">已拒绝</span>',
    }[w.status] || '';
    const shelfBadge = w.status === 'approved'
      ? (w.isOnShelf
          ? '<span class="work-shelf-badge shelf-on">已上架</span>'
          : '<span class="work-shelf-badge shelf-off">未上架</span>')
      : '';
    const coverHtml = coverUrl
      ? `<img src="${coverUrl}" alt="封面" onerror="this.style.display='none'">`
      : `<div class="work-cover-empty">🎨</div>`;
    const sizesHtml = sizes.length
      ? sizes.map(s => `<span class="work-tag">${s}</span>`).join('')
      : '<span style="font-size:11px;color:var(--gray3);">暂无尺寸</span>';

    return `
      <div class="work-card">
        <div class="work-cover">
          ${coverHtml}
          ${shelfBadge}
        </div>
        <div class="work-body">
          <div class="work-title">${w.title}</div>
          <div class="work-creator">👤 ${w.creator?.nickname || '未知创作者'}</div>
          <div class="work-meta">
            ${statusBadge}
            <span class="work-tag">分红 ${Math.round((w.revenueRate || 0) * 100)}%</span>
          </div>
          <div class="work-meta">${sizesHtml}</div>
          <div class="work-actions">
            <button class="btn btn-ghost btn-sm" onclick="openDrawer('${w.id}')">详情</button>
            ${w.status === 'approved' ? (w.isOnShelf
              ? `<button class="btn btn-red btn-sm" onclick="toggleShelf('${w.id}','off')">下架</button>`
              : `<button class="btn btn-yellow btn-sm" onclick="toggleShelf('${w.id}','on')">上架</button>`)
              : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

// ── 上下架 ──
async function toggleShelf(workId, action) {
  try {
    const res  = await fetch(`${API}/api/admin/collab/${workId}/shelf`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
      body: JSON.stringify({ action })
    });
    const json = await res.json();
    if (json.success) {
      showToast(`✓ ${json.message}`);
      await loadWorks();
    } else { showToast('操作失败：' + json.message); }
  } catch(e) { showToast('网络错误'); }
}

// ── 抽屉详情 ──
async function openDrawer(workId) {
  _curWorkId = workId;
  document.getElementById('drawerBody').innerHTML = '<div style="padding:20px;color:var(--gray3);font-weight:700;">加载中…</div>';
  document.getElementById('drawerFooter').innerHTML = '';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';

  try {
    const [workRes, packsRes] = await Promise.all([
      fetch(`${API}/api/admin/collab/works/${workId}`, { headers: { Authorization: `Bearer ${_token}` } }),
      fetch(`${API}/api/admin/collab/${workId}/frame-packs`, { headers: { Authorization: `Bearer ${_token}` } }),
    ]);
    const work  = (await workRes.json()).data;
    const packs = (await packsRes.json()).data || [];
    document.getElementById('drawerTitle').textContent = work.title;
    renderDrawer(work, packs);
  } catch(e) {
    document.getElementById('drawerBody').innerHTML = '<div style="padding:20px;color:var(--gray3);">加载失败</div>';
  }
}

function renderDrawer(w, packs) {
  const frames = Array.isArray(w.animationFrames) ? w.animationFrames : [];
  const sizes  = Array.isArray(w.supportedSkus) ? w.supportedSkus : [];

  const framesHtml = frames.length
    ? `<div class="frames-grid">${frames.slice(0,10).map(url =>
        `<div class="frame-thumb"><img src="${url}" loading="lazy" onerror="this.style.display='none'"></div>`
      ).join('')}</div>`
    : '<div style="font-size:12px;color:var(--gray3);">暂无帧图片</div>';

  const packsHtml = packs.length
    ? `<table class="pack-table">
        <thead><tr><th>尺寸</th><th>库存类型</th><th>当前库存</th><th>锁定</th><th>操作</th></tr></thead>
        <tbody>${packs.map(p => `
          <tr>
            <td><strong>${p.size}</strong></td>
            <td><span class="size-stock-badge ${p.stockType === 'stocked' ? 'stock-stocked' : 'stock-on-demand'}">${p.stockType === 'stocked' ? '有备货' : '按需生产'}</span></td>
            <td>${p.currentStock}</td>
            <td>${p.reservedStock}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="openStockModal('${w.id}','${p.size}','${p.stockType}')">调整</button></td>
          </tr>`).join('')}
        </tbody>
      </table>`
    : '<div style="font-size:12px;color:var(--gray3);">暂无帧素材包记录</div>';

  // 从 sizes 字段里找还没有 pack 记录的尺寸
  const workSizes  = Array.isArray(w.sizes) ? w.sizes : (w.sizes ? JSON.parse(w.sizes || '[]') : []);
  const packSizes  = packs.map(p => p.size);
  const missingSizes = workSizes.filter(s => !packSizes.includes(s));
  const addSizeHtml = missingSizes.length
    ? missingSizes.map(s => `<button class="btn btn-ghost btn-sm" onclick="openStockModal('${w.id}','${s}','on_demand')">+ 添加 ${s}</button>`).join(' ')
    : '';

  document.getElementById('drawerBody').innerHTML = `
    <div class="detail-section">
      <div class="detail-section-title">基本信息</div>
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-item-label">创作者</div><div class="detail-item-val">${w.creator?.nickname || '—'}</div></div>
        <div class="detail-item"><div class="detail-item-label">状态</div><div class="detail-item-val">${w.isOnShelf ? '✅ 已上架' : (w.status === 'approved' ? '⏸ 未上架' : '—')}</div></div>
        <div class="detail-item"><div class="detail-item-label">分红率</div><div class="detail-item-val">${Math.round((w.revenueRate || 0) * 100)}%</div></div>
        <div class="detail-item"><div class="detail-item-label">审核时间</div><div class="detail-item-val" style="font-size:11px;">${w.approvedAt ? new Date(w.approvedAt).toLocaleDateString('zh-CN') : '—'}</div></div>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">帧图预览（前10帧）</div>
      ${framesHtml}
    </div>
    <div class="detail-section">
      <div class="detail-section-title">帧素材包库存</div>
      ${packsHtml}
      ${addSizeHtml ? `<div style="margin-top:10px;">${addSizeHtml}</div>` : ''}
    </div>`;

  document.getElementById('drawerFooter').innerHTML = `
    ${w.status === 'approved' ? (w.isOnShelf
      ? `<button class="btn btn-red" onclick="toggleShelf('${w.id}','off');closeDrawer()">下架</button>`
      : `<button class="btn btn-yellow" onclick="toggleShelf('${w.id}','on');closeDrawer()">上架</button>`)
      : ''}`;
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// ── 库存调整Modal ──
function openStockModal(workId, size, currentType) {
  _curWorkId = workId;
  _curSize   = size;
  document.getElementById('stockModalSub').textContent = `作品ID: …${workId.slice(-6)}  尺寸: ${size}`;
  document.getElementById('stockType').value = currentType || 'on_demand';
  document.getElementById('stockQty').value  = '';
  document.getElementById('stockModal').classList.add('show');
}
function closeStockModal() { document.getElementById('stockModal').classList.remove('show'); }

async function submitStock() {
  const stockType = document.getElementById('stockType').value;
  const qty       = document.getElementById('stockQty').value;

  try {
    // 1. 更新库存类型
    await fetch(`${API}/api/admin/collab/${_curWorkId}/frame-packs/${encodeURIComponent(_curSize)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
      body: JSON.stringify({ stockType })
    });

    // 2. 如果填了数量，调整库存
    if (qty && parseInt(qty) !== 0) {
      const res  = await fetch(`${API}/api/admin/collab/${_curWorkId}/frame-packs/${encodeURIComponent(_curSize)}/restock`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
        body: JSON.stringify({ quantity: parseInt(qty) })
      });
      const json = await res.json();
      if (!json.success) { showToast('库存调整失败：' + json.message); return; }
    }

    showToast('✓ 已更新');
    closeStockModal();
    // 刷新抽屉
    if (_curWorkId) openDrawer(_curWorkId);
    await loadWorks();
  } catch(e) { showToast('网络错误'); }
}

;

// ── Toast ──
let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
<script src="../js/auth.js"></script>
<script src="../js/admin-sidebar.js"></script>
</body>
