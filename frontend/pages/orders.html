<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的订单 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto Sans SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/nav.css">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;--accent-b:#7EC8E3;
  --red:#E03030;--font:'Nunito','Noto Sans SC',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}
a{text-decoration:none;}


/* ── PAGE ── */
.page{max-width:800px;margin:0 auto;padding:52px 24px 100px;}
@media(min-width:1024px){.page{padding:64px 48px 100px;}}

.page-header{margin-bottom:32px;}
.page-title{font-weight:900;font-size:clamp(26px,5vw,42px);letter-spacing:-.03em;line-height:1.1;margin-bottom:6px;}
.page-title em{font-style:normal;background:var(--accent-g);padding:1px 10px;border-radius:8px;}
.page-sub{font-weight:700;font-size:14px;color:var(--gray3);}

/* ── TABS ── */
.tab-bar{display:flex;gap:4px;background:var(--white);border:1.5px solid var(--gray1);border-radius:16px;padding:5px;width:fit-content;margin-bottom:28px;}
.tab-btn{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:11px;font-weight:800;font-size:13px;color:var(--gray3);transition:all .2s var(--ease);min-height:40px;}
.tab-btn.active{background:var(--black);color:var(--white);}
.tab-btn:not(.active):hover{background:var(--cream);color:var(--black);}
.tab-badge{font-size:11px;font-weight:900;padding:2px 6px;border-radius:999px;background:var(--gray1);color:var(--gray3);transition:all .2s;}
.tab-btn.active .tab-badge{background:rgba(255,255,255,.18);color:var(--white);}
.tab-btn.active.has-active .tab-badge{background:var(--accent-o);color:var(--white);}

/* ── ORDER LIST ── */
.order-list{display:flex;flex-direction:column;gap:14px;}

/* ── ORDER CARD ── */
.order-card{
  background:var(--white);border-radius:22px;border:1.5px solid var(--gray1);
  overflow:hidden;cursor:pointer;
  transition:border-color .22s,box-shadow .22s,transform .22s var(--ease);
}
.order-card:hover{border-color:var(--gray2);box-shadow:0 6px 28px rgba(0,0,0,.08);transform:translateY(-2px);}

/* Card header */
.card-head{display:flex;align-items:center;gap:8px;padding:14px 18px 12px;border-bottom:1px solid var(--gray1);}
.order-no{font-weight:800;font-size:11px;color:var(--gray3);letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.order-date{font-weight:700;font-size:11px;color:var(--gray3);flex-shrink:0;}
.status-pill{
  padding:4px 12px;border-radius:999px;font-weight:900;font-size:11px;
  flex-shrink:0;
}
.status-pending{background:#FFF8E6;color:#C47F00;}
.status-making{background:#EBF5FF;color:#2266CC;}
.status-shipped{background:#EDFBEE;color:#1A8A2C;}
.status-done{background:var(--gray1);color:var(--gray3);}
.status-cancelled{background:#FFF5F5;color:var(--red);}

/* Card body */
.card-body{padding:16px 18px;}

/* Progress bar (for active orders) */
.progress-wrap{margin-bottom:16px;}
.progress-steps{display:flex;align-items:center;position:relative;margin-bottom:8px;}
.progress-line{
  position:absolute;top:14px;left:14px;right:14px;height:2px;
  background:var(--gray1);z-index:0;
}
.progress-line-fill{
  position:absolute;top:14px;left:14px;height:2px;
  background:var(--black);z-index:1;
  transition:width .6s var(--ease);
}
.p-step{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  position:relative;z-index:2;
}
.p-dot{
  width:28px;height:28px;border-radius:50%;
  background:var(--gray1);border:2px solid var(--gray1);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;transition:all .3s var(--ease);
}
.p-dot.done{background:var(--black);border-color:var(--black);}
.p-dot.done::after{content:'✓';font-size:11px;font-weight:900;color:var(--white);}
.p-dot.current{background:var(--white);border-color:var(--black);border-width:2.5px;}
.p-dot.current .p-dot-inner{width:10px;height:10px;border-radius:50%;background:var(--black);}
.p-label{font-weight:800;font-size:10px;color:var(--gray3);text-align:center;line-height:1.3;}
.p-label.active-label{color:var(--black);font-weight:900;}

.eta-row{
  display:flex;align-items:center;gap:8px;
  background:var(--cream);border-radius:10px;padding:9px 14px;cursor:pointer;
  transition:background .18s;
}
.eta-row:hover{background:var(--gray1);}
.eta-icon{font-size:16px;flex-shrink:0;}
.eta-text{font-weight:800;font-size:12px;color:var(--black);flex:1;}
.eta-text span{color:var(--accent-o);}
.eta-copy{font-weight:700;font-size:11px;color:var(--gray3);}

/* Items row */
.items-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;}
.item-thumb{
  width:62px;height:62px;border-radius:12px;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  background:var(--cream);
}
.item-thumb img{width:100%;height:100%;object-fit:cover;}
.item-info-col{flex:1;min-width:0;}
.item-title-sm{font-weight:900;font-size:13px;color:var(--black);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-machine-sm{font-weight:700;font-size:11px;color:var(--gray3);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-total{font-weight:900;font-size:16px;color:var(--black);flex-shrink:0;}

/* Card actions */
.card-actions{display:flex;gap:8px;justify-content:flex-end;}
.btn-action{padding:8px 16px;border-radius:999px;font-weight:900;font-size:12px;transition:all .18s;min-height:36px;}
.btn-action.primary{background:var(--black);color:var(--white);}
.btn-action.primary:hover{opacity:.82;}
.btn-action.outline{border:2px solid var(--gray1);color:var(--black);}
.btn-action.outline:hover{border-color:var(--black);}
.btn-action.yellow{background:var(--accent-y);color:var(--black);}
.btn-action.yellow:hover{opacity:.85;}

/* ── SKELETON ── */
.skeleton-card{background:var(--white);border-radius:22px;border:1.5px solid var(--gray1);overflow:hidden;margin-bottom:14px;}
.sk-head{padding:14px 18px 12px;border-bottom:1px solid var(--gray1);display:flex;gap:8px;align-items:center;}
.sk-body{padding:16px 18px;}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--gray1) 25%,var(--cream) 50%,var(--gray1) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── ERROR STATE ── */
.error-state{text-align:center;padding:64px 24px;}
.error-icon{font-size:48px;margin-bottom:12px;}
.error-title{font-weight:900;font-size:17px;margin-bottom:8px;}
.error-desc{font-weight:700;font-size:13px;color:var(--gray3);margin-bottom:20px;}
.btn-retry{display:inline-flex;align-items:center;gap:7px;padding:11px 24px;border-radius:999px;font-weight:900;font-size:13px;background:var(--black);color:var(--white);transition:opacity .2s;}
.btn-retry:hover{opacity:.82;}

/* ── EMPTY ── */
.empty{text-align:center;padding:80px 24px;}
.empty-icon{font-size:58px;margin-bottom:16px;opacity:.4;}
.empty-title{font-weight:900;font-size:19px;margin-bottom:8px;}
.empty-desc{font-weight:700;font-size:14px;color:var(--gray3);line-height:1.9;margin-bottom:24px;}
.btn-go{display:inline-flex;align-items:center;gap:7px;padding:13px 26px;border-radius:999px;font-weight:900;font-size:13px;background:var(--black);color:var(--white);transition:opacity .2s;}
.btn-go:hover{opacity:.82;}

/* ── NOT LOGGED IN ── */
.login-gate{text-align:center;padding:80px 24px;}
.login-gate-icon{font-size:52px;margin-bottom:16px;}
.login-gate-title{font-weight:900;font-size:19px;margin-bottom:8px;}
.login-gate-desc{font-weight:700;font-size:14px;color:var(--gray3);margin-bottom:24px;}
.btn-login-gate{display:inline-flex;align-items:center;gap:7px;padding:13px 26px;border-radius:999px;font-weight:900;font-size:13px;background:var(--black);color:var(--white);transition:opacity .2s;}
.btn-login-gate:hover{opacity:.82;}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease),transform .55s var(--ease);}
.reveal.on{opacity:1;transform:none;}
.d1{transition-delay:.05s}.d2{transition-delay:.1s}.d3{transition-delay:.15s}.d4{transition-delay:.2s}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);z-index:9500;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── CURSOR ── */
#cdot,#cring{position:fixed;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
#cdot{width:8px;height:8px;background:var(--black);}
#cring{width:32px;height:32px;border:1.5px solid rgba(17,17,16,.25);transition:width .3s,height .3s;}
</style>
</head>
<body>

<!-- Mobile overlay menu -->
<script src="../js/nav.js"></script>

<!-- PAGE -->
<main class="page">
  <div class="page-header reveal">
    <h1 class="page-title">我的订单 <em>📦</em></h1>
    <p class="page-sub">查看购买记录、物流状态与售后</p>
  </div>

  <div class="tab-bar reveal d1">
    <button class="tab-btn active has-active" id="tabActive" onclick="switchTab('active')">
      进行中 <span class="tab-badge" id="badgeActive">—</span>
    </button>
    <button class="tab-btn" id="tabAll" onclick="switchTab('all')">
      全部订单 <span class="tab-badge" id="badgeAll">—</span>
    </button>
  </div>

  <div id="listWrap">
    <!-- 内容由 JS 渲染 -->
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const CAPI = 'http://localhost:3001'

const STATUS_STEPS = ['待付款','制作中','运输中','已完成']
const STATUS_IDX = {
  pending:0, paid:1, locked:1, processing:1, producing:1,
  shipped:2, received:3, cancelled:-1, aftersale:-1
}
const STATUS_LABEL = {
  pending:'待付款', paid:'制作中', locked:'制作中',
  processing:'制作中', producing:'制作中',
  shipped:'运输中', received:'已完成',
  cancelled:'已取消', aftersale:'售后中'
}
const STATUS_CLASS = {
  pending:'status-pending',
  paid:'status-making', locked:'status-making',
  processing:'status-making', producing:'status-making',
  shipped:'status-shipped',
  received:'status-done', cancelled:'status-cancelled', aftersale:'status-done'
}

let curTab = 'active'
let orders = []

/* ─── LOAD ─── */
async function loadOrders(tab) {
  showSkeleton()
  const token = localStorage.getItem('mowo_token')
  if (!token) { showLoginGate(); return }

  try {
    const res = await fetch(`${CAPI}/api/orders/mine?tab=${tab}`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    if (res.status === 401) { showLoginGate(); return }
    const json = await res.json()
    if (!json.success) throw new Error(json.message)

    orders = json.data.orders || []
    document.getElementById('badgeActive').textContent = json.data.activeCount ?? 0
    document.getElementById('badgeAll').textContent    = json.data.totalCount  ?? 0

    // 更新 tab badge 高亮
    const tabActiveBtn = document.getElementById('tabActive')
    if (json.data.activeCount > 0) {
      tabActiveBtn.classList.add('has-active')
    } else {
      tabActiveBtn.classList.remove('has-active')
    }

    renderOrders()
  } catch (e) {
    showError(e.message)
  }
}

/* ─── RENDER ─── */
function renderOrders() {
  const wrap = document.getElementById('listWrap')
  if (!orders.length) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <div class="empty-title">这里还没有订单</div>
        <div class="empty-desc">去联名作品看看喜欢的动画<br>选好款式后即可加入购物车</div>
        <a href="showcase.html" class="btn-go">浏览联名作品 →</a>
      </div>`
    return
  }

  wrap.innerHTML = `<div class="order-list">${orders.map((o, i) => buildCard(o, i)).join('')}</div>`
  wrap.querySelectorAll('.order-card').forEach(el => revObs.observe(el))
  addCursorListeners(wrap.querySelectorAll('.order-card'))
}

function buildCard(o, i) {
  const stepIdx = STATUS_IDX[o.status] ?? -1
  const isActive = stepIdx >= 0 && stepIdx <= 2  // 待付款/制作中/运输中
  const isDone   = o.status === 'received'

  // 缩略图
  const thumbHtml = o.coverUrl
    ? `<img src="${o.coverUrl}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : (o.sourceType === 'collab' ? '🎬' : '🎨')

  // 机型规格
  const specParts = [o.modelName, o.size, o.frameCount ? o.frameCount + '帧' : null, o.material, o.colorName].filter(Boolean)
  const specText  = specParts.join(' · ') || '—'

  // 进度条
  let progressHtml = ''
  if (isActive || isDone) {
    const lineFillPct = stepIdx === 0 ? '0%' : stepIdx === 1 ? '33%' : stepIdx === 2 ? '66%' : '100%'
    const stepsHtml = STATUS_STEPS.map((s, si) => {
      const dotClass = si < stepIdx ? 'done' : si === stepIdx ? 'current' : ''
      const inner    = si === stepIdx ? '<div class="p-dot-inner"></div>' : ''
      return `<div class="p-step">
        <div class="p-dot ${dotClass}">${inner}</div>
        <span class="p-label${si === stepIdx ? ' active-label' : ''}">${s}</span>
      </div>`
    }).join('')

    // ETA / 物流信息行
    let etaHtml = ''
    if (o.status === 'shipped' && o.trackingNo) {
      const company = o.trackingCompany || '快递'
      etaHtml = `<div class="eta-row" onclick="copyTracking(event,'${o.trackingNo}')">
        <span class="eta-icon">📦</span>
        <span class="eta-text"><span>${company}</span> ${o.trackingNo}</span>
        <span class="eta-copy">复制</span>
      </div>`
    } else if (o.status === 'shipped') {
      etaHtml = `<div class="eta-row" style="cursor:default">
        <span class="eta-icon">🚚</span>
        <span class="eta-text">已发货，请留意快递通知</span>
      </div>`
    } else if (isActive) {
      etaHtml = `<div class="eta-row" style="cursor:default">
        <span class="eta-icon">🔧</span>
        <span class="eta-text">生产周期约 <span>7–14 个工作日</span></span>
      </div>`
    }

    progressHtml = `<div class="progress-wrap">
      <div class="progress-steps">
        <div class="progress-line"></div>
        <div class="progress-line-fill" style="width:${lineFillPct}"></div>
        ${stepsHtml}
      </div>
      ${etaHtml}
    </div>`
  }

  // 操作按钮
  let actions = ''
  if (o.status === 'pending') {
    actions = `<button class="btn-action outline" onclick="goDetail(event,'${o.id}')">查看详情</button>`
  } else if (o.status === 'shipped') {
    actions = `
      <button class="btn-action yellow" onclick="confirmReceipt(event,'${o.id}')">确认收货</button>
      <button class="btn-action primary" onclick="goDetail(event,'${o.id}')">查看详情</button>`
  } else if (isDone || o.status === 'cancelled' || o.status === 'aftersale') {
    actions = `<button class="btn-action primary" onclick="goDetail(event,'${o.id}')">查看详情</button>`
  } else {
    // paid/locked/processing/producing
    actions = `<button class="btn-action primary" onclick="goDetail(event,'${o.id}')">查看详情</button>`
  }

  // 格式化日期
  const dateStr = o.createdAt ? new Date(o.createdAt).toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' }) : ''

  return `
    <div class="order-card reveal" style="transition-delay:${i * 0.06}s" onclick="goDetail(null,'${o.id}')">
      <div class="card-head">
        <span class="order-no">NO. ${o.orderNo || o.id}</span>
        <span class="order-date">${dateStr}</span>
        <span class="status-pill ${STATUS_CLASS[o.status] || 'status-done'}">${STATUS_LABEL[o.status] || o.status}</span>
      </div>
      <div class="card-body">
        ${progressHtml}
        <div class="items-row">
          <div class="item-thumb">${thumbHtml}</div>
          <div class="item-info-col">
            <div class="item-title-sm">${escHtml(o.productTitle || '—')}</div>
            <div class="item-machine-sm">⚙ ${escHtml(specText)}</div>
          </div>
          <div class="item-total">¥${Number(o.totalAmount || 0).toFixed(2)}</div>
        </div>
        <div class="card-actions">${actions}</div>
      </div>
    </div>`
}

/* ─── ACTIONS ─── */
async function confirmReceipt(e, id) {
  e.stopPropagation()
  if (!confirm('确认已收到商品？\n\n确认后将正式结束订单，并触发售后保护期计算。')) return
  const token = localStorage.getItem('mowo_token')
  try {
    const res  = await fetch(`${CAPI}/api/orders/${id}/confirm-receipt`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` }
    })
    const json = await res.json()
    if (json.success) {
      toast('✓ 已确认收货，感谢您的支持！')
      setTimeout(() => loadOrders(curTab), 800)
    } else {
      toast('❌ ' + (json.message || '操作失败'))
    }
  } catch(err) {
    toast('❌ 网络异常，请稍后重试')
  }
}

function copyTracking(e, no) {
  e.stopPropagation()
  navigator.clipboard.writeText(no).then(() => {
    toast('✓ 快递单号已复制：' + no)
  }).catch(() => {
    toast('快递单号：' + no)
  })
}

function switchTab(tab) {
  curTab = tab
  document.getElementById('tabActive').classList.toggle('active', tab === 'active')
  document.getElementById('tabActive').classList.toggle('has-active', tab === 'active')
  document.getElementById('tabAll').classList.toggle('active', tab === 'all')
  loadOrders(tab)
}

function goDetail(e, id) {
  if (e) e.stopPropagation()
  window.location.href = `order-detail.html?id=${encodeURIComponent(id)}`
}

/* ─── SKELETON ─── */
function showSkeleton() {
  const wrap = document.getElementById('listWrap')
  wrap.innerHTML = Array.from({ length: 3 }, () => `
    <div class="skeleton-card">
      <div class="sk-head">
        <div class="sk" style="width:160px;height:14px"></div>
        <div class="sk" style="width:80px;height:14px;margin-left:auto"></div>
        <div class="sk" style="width:56px;height:22px;border-radius:999px"></div>
      </div>
      <div class="sk-body">
        <div class="sk" style="width:100%;height:52px;border-radius:10px;margin-bottom:14px"></div>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
          <div class="sk" style="width:62px;height:62px;border-radius:12px;flex-shrink:0"></div>
          <div style="flex:1">
            <div class="sk" style="width:70%;height:14px;margin-bottom:8px"></div>
            <div class="sk" style="width:50%;height:12px"></div>
          </div>
          <div class="sk" style="width:60px;height:18px;border-radius:8px"></div>
        </div>
        <div style="display:flex;justify-content:flex-end">
          <div class="sk" style="width:88px;height:34px;border-radius:999px"></div>
        </div>
      </div>
    </div>`).join('')
}

function showError(msg) {
  document.getElementById('listWrap').innerHTML = `
    <div class="error-state">
      <div class="error-icon">😔</div>
      <div class="error-title">加载失败</div>
      <div class="error-desc">${escHtml(msg || '网络异常')}</div>
      <button class="btn-retry" onclick="loadOrders(curTab)">重新加载</button>
    </div>`
}

function showLoginGate() {
  document.getElementById('listWrap').innerHTML = `
    <div class="login-gate">
      <div class="login-gate-icon">🔑</div>
      <div class="login-gate-title">请先登录</div>
      <div class="login-gate-desc">登录后即可查看您的所有订单记录</div>
      <button class="btn-login-gate" onclick="document.querySelector('.nav-login-btn').click()">立即登录</button>
    </div>`
}

/* ─── UTILS ─── */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

/* ─── NAV ─── */
function nav(url) { closeDD(); window.location.href = url; }
function toggleDD() {
  const dd = document.getElementById('userDD'), btn = document.getElementById('navBtn');
  const o = dd.classList.toggle('open');
  btn.classList.toggle('open', o);
  if (o) setTimeout(() => document.addEventListener('click', outsideDD), 0);
}
function closeDD() {
  const dd = document.getElementById('userDD'), btn = document.getElementById('navBtn');
  if (dd) dd.classList.remove('open');
  if (btn) btn.classList.remove('open');
  document.removeEventListener('click', outsideDD);
}
function outsideDD(e) {
  const btn = document.getElementById('navBtn'), dd = document.getElementById('userDD');
  if (btn && dd && !btn.contains(e.target) && !dd.contains(e.target)) closeDD();
}

/* ─── TOAST ─── */
let tT
function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2800)
}

/* ─── REVEAL ─── */
const revObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); revObs.unobserve(e.target) } })
}, { threshold: 0.05 })
document.querySelectorAll('.reveal').forEach(el => revObs.observe(el))

/* ─── CURSOR ─── */
let dot, ring
if (window.matchMedia('(pointer:fine)').matches) {
  dot = document.createElement('div'); dot.id = 'cdot'
  ring = document.createElement('div'); ring.id = 'cring'
  document.body.append(dot, ring)
  document.body.style.cursor = 'none'
  let mx=0,my=0,rx=0,ry=0
  document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; dot.style.left=mx+'px'; dot.style.top=my+'px' })
  ;(function tick() { rx+=(mx-rx)*.12; ry+=(my-ry)*.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(tick) })()
  addCursorListeners(document.querySelectorAll('a,button'))
}

function addCursorListeners(els) {
  if (!ring) return
  els.forEach(el => {
    el.addEventListener('mouseenter', () => { ring.style.width='48px'; ring.style.height='48px' })
    el.addEventListener('mouseleave', () => { ring.style.width='32px'; ring.style.height='32px' })
  })
}

/* ─── INIT ─── */
loadOrders('active')
</script>
