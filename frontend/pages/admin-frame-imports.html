<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/runtime-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帧图批量导入 - 哞屋后台</title>
<script src="../js/auth.js"></script>
<style>
:root{--black:#111110;--paper:#f5f3ef;--white:#fff;--line:#deddd8;--muted:#777773;--yellow:#f5e642;--green:#267a43;--orange:#b45b14;--red:#c93333;--blue:#176f9c;--sidebar-w:220px;--sidebar-collapsed:60px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--black);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;letter-spacing:0}.main{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .25s}.main.expanded{margin-left:var(--sidebar-collapsed)}button,input,select,textarea{font:inherit}.topbar{height:62px;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(245,243,239,.96);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}.topbar h1{font-size:19px;margin:0}.top-actions,.inline-actions,.bulk-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{height:36px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 13px;font-size:12px;font-weight:800;cursor:pointer}.btn:hover{border-color:#888}.btn-black{background:var(--black);border-color:var(--black);color:#fff}.btn-danger{color:var(--red);border-color:#efb1b1}.btn:disabled{opacity:.45;cursor:not-allowed}.menu-btn{display:none;width:38px;padding:0}.content{max-width:1660px;margin:auto;padding:20px 24px 44px}.steps{display:flex;align-items:center;gap:8px;margin-bottom:16px}.step{display:flex;align-items:center;gap:7px;color:#9a9995;font-size:12px;font-weight:900}.step i{font-style:normal;width:25px;height:25px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center}.step.active,.step.done{color:var(--black)}.step.active i{background:var(--black);color:#fff;border-color:var(--black)}.step-line{width:44px;height:2px;background:#d8d7d2}.panel{background:#fff;border:1px solid var(--line);border-radius:8px}.setup{padding:18px;margin-bottom:14px}.setup-grid{display:grid;grid-template-columns:150px repeat(4,minmax(145px,1fr));gap:12px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input,.field select,.field textarea,.bulk-actions input,.bulk-actions select{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 9px;font-size:12px}.field textarea{height:76px;padding:9px;resize:vertical}.wide{grid-column:span 2}.folder-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:15px;margin-top:15px;border-top:1px solid #ecebe7}.folder-summary{font-size:12px;color:var(--muted);font-weight:800}.work-layout{display:grid;grid-template-columns:minmax(640px,1fr) 300px;gap:14px;align-items:start}.table-panel{overflow:hidden}.table-tools{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.bulk-actions input{width:150px}.bulk-actions select{width:135px}.table-scroll{overflow:auto;max-height:calc(100vh - 320px)}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:9px 8px;border-bottom:1px solid #ecebe7;text-align:left;font-size:11px;vertical-align:middle}th{position:sticky;top:0;background:#faf9f6;z-index:2;color:var(--muted);font-weight:900}td input,td select{height:32px;width:100%;border:1px solid var(--line);border-radius:5px;padding:0 7px;background:#fff;font-size:11px}.thumb{width:54px;height:54px;border-radius:5px;overflow:hidden;background:#ecebe7;display:grid;place-items:center;color:var(--muted);font-size:9px}.thumb img{width:100%;height:100%;object-fit:cover}.row-title{min-width:150px}.row-tags{min-width:170px}.row-holder{min-width:120px}.status{display:inline-flex;align-items:center;min-height:22px;border-radius:4px;padding:3px 7px;font-size:10px;font-weight:900;background:#efefec}.status-ready,.status-imported{background:#dcefe2;color:#176832}.status-warning{background:#fff0dc;color:#98460d}.status-blocked,.status-failed{background:#ffe1e1;color:#a21d1d}.status-uploading{background:#dcecff;color:#174e7c}.status-skipped_duplicate{background:#eee;color:#555}.issues{margin-top:5px;font-size:9px;color:var(--orange);line-height:1.45;max-width:190px}.issues.error{color:var(--red)}.side{display:grid;gap:14px}.side-section{padding:15px}.side-title{font-size:13px;font-weight:900;margin-bottom:10px}.history-row{padding:10px 0;border-bottom:1px solid #ecebe7;cursor:pointer}.history-row:last-child{border-bottom:0}.history-row:hover strong{color:var(--blue)}.history-meta{font-size:10px;color:var(--muted);margin-top:4px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.summary-item{background:#f7f6f2;padding:9px}.summary-item b{display:block;font-size:18px}.summary-item span{font-size:9px;color:var(--muted);font-weight:800}.progress{margin-top:12px}.progress-track{height:8px;background:#e7e5df;border-radius:4px;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--yellow)}.progress-text{font-size:10px;color:var(--muted);margin-top:6px}.empty{padding:55px 20px;text-align:center;color:var(--muted);font-size:12px;font-weight:800}.drop{border:2px dashed #aaa;border-radius:7px;padding:22px;text-align:center;background:#faf9f6;cursor:pointer}.drop strong{display:block;font-size:15px}.drop span{font-size:10px;color:var(--muted);display:block;margin-top:5px}.notice{font-size:10px;line-height:1.6;color:var(--muted);margin-top:9px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:7px;font-size:12px;font-weight:800;z-index:500;display:none}.backdrop{display:none}@media(max-width:1150px){.setup-grid{grid-template-columns:repeat(3,1fr)}.work-layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.table-scroll{max-height:none}}@media(max-width:760px){.main{margin-left:0!important}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90}.menu-btn{display:inline-block}.content{padding:12px}.topbar{padding:0 12px}.setup-grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.folder-bar{align-items:stretch;flex-direction:column}.side{grid-template-columns:1fr}.steps{overflow:auto}.step span{white-space:nowrap}.table-tools{align-items:stretch}.bulk-actions{width:100%}}
</style>
</head>
<body>
<div class="backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div><aside class="sidebar" id="sidebar"></aside>
<main class="main" id="main">
  <header class="topbar"><div class="inline-actions"><button class="btn menu-btn" onclick="openSidebar()">☰</button><h1>帧图批量导入</h1></div><div class="top-actions"><button class="btn" onclick="startNewBatch()">新建批次</button><button class="btn" onclick="loadHistory()">刷新</button></div></header>
  <div class="content">
    <nav class="steps"><div class="step active" data-step="1"><i>1</i><span>选择文件夹</span></div><div class="step-line"></div><div class="step" data-step="2"><i>2</i><span>填写资料</span></div><div class="step-line"></div><div class="step" data-step="3"><i>3</i><span>上传预检</span></div><div class="step-line"></div><div class="step" data-step="4"><i>4</i><span>确认入库</span></div></nav>
    <section class="panel setup" id="setupPanel">
      <div class="setup-grid">
        <div class="field"><label>素材批次类型</label><select id="batchType" onchange="applyTypeDefaults()"><option value="COMPANY">公司素材</option><option value="CUSTOMER">客户私人素材</option></select></div>
        <div class="field"><label>默认用途</label><select id="defaultUsage"><option value="INTERNAL_TEST">内部测试</option><option value="UNDECIDED">暂未确定</option><option value="COMPANY_PRODUCT">公司自营商品</option><option value="PRIVATE_CUSTOM">私人定制</option></select></div>
        <div class="field"><label>授权状态</label><select id="defaultAuth"><option value="PRIVATE_ONLY">仅限内部或私人使用</option><option value="PENDING">授权确认中</option><option value="AUTHORIZED">已明确授权</option></select></div>
        <div class="field"><label>权利人名称</label><input id="defaultHolder" maxlength="120"></div>
        <div class="field"><label>联系方式</label><input id="defaultContact" maxlength="200"></div>
        <div class="field wide"><label>共同标签</label><input id="defaultTags" maxlength="300" placeholder="多个标签用逗号分隔"></div>
        <div class="field wide"><label>共同内部备注</label><input id="defaultNotes" maxlength="500"></div>
      </div>
      <div class="folder-bar"><div class="folder-summary" id="folderSummary">尚未选择文件夹</div><div class="inline-actions"><input id="folderInput" type="file" webkitdirectory multiple accept="image/png,image/jpeg" hidden><button class="btn" id="chooseFolderBtn" onclick="folderInput.click()">选择总文件夹</button><button class="btn btn-black" id="applyDefaultsBtn" onclick="applyDefaultsToGroups()" disabled>将共同资料应用到全部</button></div></div>
    </section>
    <div class="work-layout">
      <section class="panel table-panel">
        <div class="table-tools"><label style="font-size:11px;font-weight:900"><input type="checkbox" id="selectAll" onchange="toggleAll(this.checked)"> 全选当前项目</label><div class="bulk-actions"><input id="bulkTags" placeholder="标签"><button class="btn" onclick="bulkTags('add')">添加标签</button><button class="btn" onclick="bulkTags('remove')">移除标签</button><select id="bulkUsage"><option value="">选择用途</option><option value="INTERNAL_TEST">内部测试</option><option value="UNDECIDED">暂未确定</option><option value="COMPANY_PRODUCT">公司自营商品</option><option value="PRIVATE_CUSTOM">私人定制</option></select><button class="btn" onclick="bulkSetUsage()">应用用途</button></div></div>
        <div class="table-scroll"><table><thead><tr><th style="width:36px"></th><th style="width:64px">预览</th><th>动画名称</th><th style="width:54px">帧数</th><th>标签</th><th style="width:125px">用途</th><th>权利人</th><th style="width:205px">检查结果</th></tr></thead><tbody id="itemRows"><tr><td colspan="8"><div class="empty">请选择包含动画子文件夹的总文件夹</div></td></tr></tbody></table></div>
      </section>
      <aside class="side">
        <section class="panel side-section"><div class="side-title">当前批次</div><div class="summary-grid"><div class="summary-item"><b id="sumItems">0</b><span>动画组</span></div><div class="summary-item"><b id="sumFiles">0</b><span>图片</span></div><div class="summary-item"><b id="sumReady">0</b><span id="sumReadyLabel">可入库</span></div><div class="summary-item"><b id="sumProblems">0</b><span>需处理</span></div></div><div class="progress" id="progress" hidden><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div class="progress-text" id="progressText"></div></div><div class="inline-actions" style="margin-top:13px"><button class="btn btn-black" id="uploadBtn" onclick="createAndUpload()" disabled>上传并预检</button><button class="btn" id="preflightBtn" onclick="rerunPreflight()" hidden>重新检查</button><button class="btn btn-black" id="commitBtn" onclick="commitItems()" hidden>确认入库</button></div><div class="notice">每批最多100套、2000张、500MB；每套2至50张，单张不超过20MB。</div></section>
        <section class="panel side-section"><div class="side-title">导入批次记录</div><div id="history"><div class="empty">正在加载...</div></div></section>
      </aside>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="../js/admin-sidebar.js"></script><script src="../js/admin-frame-imports.js?v=20260904"></script>
</body>
</html>
