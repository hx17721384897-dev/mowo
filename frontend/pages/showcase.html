<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创意社区 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/nav.css">
<style>
:root {
  --white:    #FFFFFF;
  --cream:    #F5F3EF;
  --black:    #111110;
  --gray1:    #EBEBEA;
  --gray2:    #C4C3BF;
  --gray3:    #787874;
  --accent-y: #F5E642;
  --accent-o: #FF6B35;
  --font:     'Nunito', 'Noto Sans SC', sans-serif;
  --ease:     cubic-bezier(0.22, 1, 0.36, 1);
  --pad-mob:  20px;
  --pad-desk: 72px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--cream);color:var(--black);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}

/* ── PAGE HEADER（标题区，滚动后消失） ── */
.page-header{
  background:var(--cream);
  padding:28px var(--pad-mob) 20px;
}
@media(min-width:1024px){.page-header{padding:36px var(--pad-desk) 24px;}}
.ph-inner{max-width:1600px;margin:0 auto;}
.ph-title{
  font-size:clamp(26px,4vw,42px);font-weight:900;letter-spacing:-.02em;
  margin-bottom:6px;display:flex;align-items:center;gap:10px;
}
.ph-spark{color:#c8965a;font-size:.75em;}
.ph-sub{font-size:14px;font-weight:700;color:var(--gray3);}

/* ── CONTROL BAR（搜索+标签+排序，sticky） ── */
.control-bar{
  position:sticky;top:64px;z-index:700;
  background:rgba(245,243,239,.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--gray1);
  transition:box-shadow .25s;
}
.control-bar.pinned{box-shadow:0 4px 24px rgba(0,0,0,.07);}
.control-inner{max-width:1600px;margin:0 auto;padding:10px var(--pad-mob) 0;}
@media(min-width:1024px){.control-inner{padding:12px var(--pad-desk) 0;}}

/* 第一行：搜索框 + 标签横排 */
.control-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.search-wrap{flex-shrink:0;width:240px;position:relative;}
@media(max-width:640px){.control-top{flex-wrap:wrap;}.search-wrap{width:100%;}}
.search-svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--gray3);fill:none;stroke-width:2;pointer-events:none;}
.search-input{
  width:100%;height:38px;padding:0 14px 0 36px;
  font-family:var(--font);font-weight:700;font-size:13px;color:var(--black);
  background:var(--white);border:1.5px solid var(--gray1);border-radius:999px;
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.search-input::placeholder{color:var(--gray2);}
.search-input:focus{border-color:var(--black);box-shadow:0 0 0 3px rgba(17,17,16,.06);}
.tags-row{flex:1;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tags-row::-webkit-scrollbar{display:none;}
.tag-pill{
  flex-shrink:0;font-weight:800;font-size:12px;letter-spacing:.03em;
  padding:5px 14px;border-radius:999px;height:32px;
  background:var(--white);color:var(--gray3);border:1.5px solid var(--gray1);
  transition:all .18s;display:flex;align-items:center;white-space:nowrap;
}
.tag-pill:hover{border-color:var(--gray2);color:var(--black);}
.tag-pill.active{background:var(--black);color:var(--white);border-color:var(--black);}

/* 第二行：排序 + 激励入口 */
.control-sort{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:10px;gap:12px;
}
.sort-tabs{display:flex;gap:3px;}
.sort-tab{
  font-weight:800;font-size:13px;padding:5px 14px;border-radius:999px;
  color:var(--gray3);transition:all .18s;height:30px;display:flex;align-items:center;
}
.sort-tab.active{background:var(--black);color:var(--white);}
.sort-tab:hover:not(.active){color:var(--black);background:var(--gray1);}
.incentive-link{
  flex-shrink:0;font-weight:800;font-size:12px;color:var(--gray3);
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:999px;border:1.5px solid var(--gray1);
  background:var(--white);transition:all .18s;height:30px;white-space:nowrap;
}
.incentive-link:hover{border-color:#c8965a;color:#c8965a;}
@media(max-width:760px){.incentive-link{display:none;}}

/* ── MAIN ── */
.main{padding:28px var(--pad-mob) 60px;max-width:1600px;margin:0 auto;}
@media(min-width:1024px){.main{padding:32px var(--pad-desk) 80px;}}
.result-info{font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);margin-bottom:16px;}

/* ── MASONRY ── */
.masonry{columns:2;column-gap:12px;}
@media(min-width:640px){.masonry{columns:3;column-gap:14px;}}
@media(min-width:1024px){.masonry{columns:4;column-gap:16px;}}
@media(min-width:1400px){.masonry{columns:5;column-gap:18px;}}

/* ── WORK CARD ── */
.work-card{break-inside:avoid;margin-bottom:12px;background:var(--white);border-radius:20px;overflow:hidden;border:1.5px solid var(--gray1);cursor:pointer;position:relative;transition:transform .3s var(--ease),box-shadow .3s;}
@media(min-width:1024px){.work-card{margin-bottom:16px;}}
.work-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.1);border-color:var(--gray2);}
.card-media{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;background:var(--cream);}
.card-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease);}
.work-card:hover .card-media img{transform:scale(1.04);}
.card-media-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--gray1);opacity:.4;}

/* ── 帧动画叠层 ── */
.card-anim-wrap{position:absolute;inset:0;z-index:2;pointer-events:none;}
.card-anim-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;will-change:opacity;transition:none !important;transform:none !important;}
.card-anim-wrap img.af{opacity:1;}
.card-badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;}
.badge-exclusive{font-weight:900;font-size:10px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--accent-y);color:var(--black);}
.badge-new{font-weight:900;font-size:10px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--accent-o);color:var(--white);}
.card-body{padding:12px 14px 14px;}
.card-title{font-weight:900;font-size:13px;letter-spacing:-.01em;color:var(--black);margin-bottom:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-footer{display:flex;align-items:center;justify-content:space-between;}
.card-author{display:flex;align-items:center;gap:7px;cursor:pointer;flex:1;min-width:0;}
.card-author:hover .author-name{color:var(--black);}
.author-avatar{width:24px;height:24px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;overflow:hidden;border:1.5px solid var(--gray1);}
.author-avatar img{width:100%;height:100%;object-fit:cover;}
.author-name{font-weight:800;font-size:11px;color:var(--gray3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;transition:color .2s;}
.card-like{display:flex;align-items:center;gap:5px;font-weight:800;font-size:11px;color:var(--gray3);padding:4px 8px;border-radius:999px;transition:all .2s;min-height:28px;flex-shrink:0;}
.card-like:hover{background:var(--cream);color:#C03030;}
.card-like.liked{color:#C03030;}
.like-icon{font-size:12px;transition:transform .2s var(--ease);}
.card-like:hover .like-icon,.card-like.liked .like-icon{transform:scale(1.25);}

/* ── SKELETON ── */
.skeleton{background:linear-gradient(90deg,var(--gray1) 25%,#e8e7e3 50%,var(--gray1) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-card{break-inside:avoid;margin-bottom:12px;background:var(--white);border-radius:20px;overflow:hidden;border:1.5px solid var(--gray1);}
@media(min-width:1024px){.skeleton-card{margin-bottom:16px;}}
.skeleton-media{aspect-ratio:1/1;}
.skeleton-body{padding:12px 14px 14px;}
.skeleton-title{height:14px;border-radius:4px;margin-bottom:8px;}
.skeleton-title-short{height:14px;border-radius:4px;width:60%;margin-bottom:10px;}
.skeleton-footer{display:flex;align-items:center;justify-content:space-between;}
.skeleton-avatar{width:24px;height:24px;border-radius:50%;}
.skeleton-name{height:10px;border-radius:4px;width:60px;}

/* ── LOAD MORE ── */
.load-more-wrap{display:flex;justify-content:center;padding:40px 0 20px;}
.load-more-btn{font-weight:900;font-size:14px;letter-spacing:.04em;padding:14px 40px;border-radius:999px;min-height:48px;background:var(--white);color:var(--black);border:2px solid var(--gray1);transition:all .25s var(--ease);display:flex;align-items:center;gap:10px;}
.load-more-btn:hover{border-color:var(--black);box-shadow:0 4px 0 var(--gray1);}
.load-more-btn.loading .load-spinner{animation:spin-slow .8s linear infinite;}
.load-more-btn:disabled{opacity:.4;cursor:not-allowed;}
@keyframes spin-slow{to{transform:rotate(360deg);}}

/* ── EMPTY STATE ── */
.empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;gap:12px;}
.empty-state.show{display:flex;}
.empty-icon{font-size:52px;opacity:.4;}
.empty-title{font-weight:900;font-size:20px;}
.empty-desc{font-weight:700;font-size:14px;color:var(--gray3);}

/* REVEAL */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
.reveal.on{opacity:1;transform:none;}

/* FOOTER */
footer{background:var(--black);color:rgba(255,255,255,.4);padding:48px var(--pad-mob) 36px;}
@media(min-width:1024px){footer{padding:48px var(--pad-desk) 36px;}}
.foot-row{display:flex;flex-direction:column;gap:16px;}
@media(min-width:640px){.foot-row{flex-direction:row;align-items:center;justify-content:space-between;}}
.foot-logo{font-weight:900;font-size:20px;color:var(--white);}
.foot-links{display:flex;gap:24px;flex-wrap:wrap;}
.foot-links a{font-weight:700;font-size:13px;color:rgba(255,255,255,.35);transition:color .2s;}
.foot-links a:hover{color:var(--white);}
.foot-copy{font-weight:700;font-size:12px;margin-top:24px;}
</style>
</head>
<body>

<!-- 共享导航栏 -->
<script src="../js/nav.js"></script>

<!-- 页面标题区（滚动后消失） -->
<div class="page-header" id="pageHeader">
  <div class="ph-inner">
    <h1 class="ph-title">创意社区 <span class="ph-spark">✦</span></h1>
    <p class="ph-sub">发现灵感，分享创意，让每一帧画面动起来</p>
  </div>
</div>

<!-- 控制栏（sticky，搜索+标签同行） -->
<div class="control-bar" id="controlBar">
  <div class="control-inner">
    <!-- 第一行：搜索 + 创作者标签 -->
    <div class="control-top">
      <div class="search-wrap">
        <svg class="search-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search-input" type="text" placeholder="搜索作品或创作者…" id="searchInput" oninput="handleSearch()">
      </div>
      <div class="tags-row" id="tagsRow">
        <button class="tag-pill active" onclick="setCreator('',this)">全部</button>
      </div>
    </div>
    <!-- 第二行：排序 + 激励入口 -->
    <div class="control-sort">
      <div class="sort-tabs">
        <button class="sort-tab active" onclick="setSort('latest',this)">最新</button>
        <button class="sort-tab" onclick="setSort('popular',this)">热门</button>
      </div>
      <a href="customize-start.html" class="incentive-link">
        📦 上传作品，有机会获官方推荐并销售赚收益 →
      </a>
    </div>
  </div>
</div>

<!-- 主内容区 -->
<main class="main">
  <p class="result-info" id="resultInfo">加载中…</p>
  <div class="masonry" id="masonryGrid"></div>
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">🎨</div>
    <p class="empty-title">暂无匹配作品</p>
    <p class="empty-desc">换个搜索词或创作者试试</p>
  </div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">
      <span class="load-spinner">↻</span>
      <span>加载更多</span>
    </button>
  </div>
</main>

<footer>
  <div class="foot-row">
    <span class="foot-logo">哞屋 MOWO</span>
    <div class="foot-links">
      <a href="about.html">关于我们</a>
      <a href="products.html">产品介绍</a>
      <a href="showcase.html">画师联名</a>
      <a href="customize-start.html">创作中心</a>
      <a href="contact.html">联络我们</a>
    </div>
  </div>
  <p class="foot-copy">© 2025 哞屋 MOWO. All rights reserved.</p>
</footer>

<script src="../js/auth.js"></script>
<script>
const API = (location.hostname === '127.0.0.1' ? 'http://127.0.0.1:3001' : 'http://localhost:3001')

let allWorks = []
let filteredWorks = []
let currentCreatorId = ''
let currentSort = 'latest'
let searchQuery = ''
let displayCount = 12
const PAGE_SIZE = 12

/* ── 滚动 sticky 增强（标题离屏后 control-bar 加阴影） ── */
const _cbObs = new IntersectionObserver(([e]) => {
  document.getElementById('controlBar').classList.toggle('pinned', !e.isIntersecting)
}, { threshold: 0, rootMargin: '-1px 0px 0px 0px' })
document.addEventListener('DOMContentLoaded', () => {
  const ph = document.getElementById('pageHeader')
  if (ph) _cbObs.observe(ph)
})

/* ── 骨架屏 ── */
function renderSkeletons(n = 8) {
  const grid = document.getElementById('masonryGrid')
  grid.innerHTML = ''
  for (let i = 0; i < n; i++) {
    grid.innerHTML += `<div class="skeleton-card">
      <div class="skeleton skeleton-media"></div>
      <div class="skeleton-body">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-title-short"></div>
        <div class="skeleton-footer">
          <div style="display:flex;align-items:center;gap:7px;">
            <div class="skeleton skeleton-avatar"></div>
            <div class="skeleton skeleton-name"></div>
          </div>
        </div>
      </div>
    </div>`
  }
}

/* ── 加载数据 ── */
async function loadWorks() {
  renderSkeletons()
  try {
    const token = localStorage.getItem('mowo_token') || ''
    const headers = token ? { Authorization: `Bearer ${token}` } : {}
    const res = await fetch(`${API}/api/collab/works?status=approved&limit=200`, { headers })
    const data = await res.json()
    if (!data.success) throw new Error()
    allWorks = data.data?.works || []
    buildCreatorTags()
    applyFilters()
  } catch {
    document.getElementById('masonryGrid').innerHTML =
      '<p style="color:var(--gray3);font-weight:700;padding:40px;text-align:center;grid-column:1/-1">加载失败，请刷新重试</p>'
    document.getElementById('resultInfo').textContent = ''
  }
}

/* ── 创作者标签 ── */
function buildCreatorTags() {
  const seen = new Map()
  allWorks.forEach(w => {
    if (!seen.has(w.creatorId)) seen.set(w.creatorId, w.creator?.nickname || w.creatorId.slice(0, 6))
  })
  const row = document.getElementById('tagsRow')
  seen.forEach((name, id) => {
    const btn = document.createElement('button')
    btn.className = 'tag-pill'
    btn.dataset.creatorId = id
    btn.textContent = `@ ${name}`
    btn.onclick = () => setCreator(id, btn)
    row.appendChild(btn)
  })
}

/* ── 筛选 + 排序 ── */
function applyFilters() {
  let list = allWorks
  if (currentCreatorId) list = list.filter(w => w.creatorId === currentCreatorId)
  if (searchQuery) {
    const q = searchQuery.toLowerCase()
    list = list.filter(w =>
      (w.title || '').toLowerCase().includes(q) ||
      (w.creator?.nickname || '').toLowerCase().includes(q)
    )
  }
  if (currentSort === 'popular') {
    list = [...list].sort((a, b) => (b.likeCount || 0) - (a.likeCount || 0))
  }
  filteredWorks = list
  displayCount = PAGE_SIZE
  renderWorks(true)
}

/* ── 渲染卡片 ── */
function renderWorks(reset = false) {
  const grid = document.getElementById('masonryGrid')
  const slice = filteredWorks.slice(0, displayCount)

  if (filteredWorks.length === 0) {
    grid.innerHTML = ''
    document.getElementById('emptyState').classList.add('show')
    document.getElementById('resultInfo').textContent = '共 0 件作品'
    document.getElementById('loadMoreWrap').style.display = 'none'
    return
  }

  document.getElementById('emptyState').classList.remove('show')
  document.getElementById('resultInfo').textContent = ''

  if (reset) grid.innerHTML = ''

  const startIdx = reset ? 0 : grid.querySelectorAll('.work-card').length
  slice.slice(startIdx).forEach(work => {
    const div = document.createElement('div')
    div.innerHTML = buildCard(work).trim()
    const card = div.firstChild
    grid.appendChild(card)
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('on')))
  })

  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); obs.unobserve(e.target) } })
  }, { threshold: .08, rootMargin: '0px 0px -20px 0px' })
  grid.querySelectorAll('.reveal:not(.on)').forEach(el => obs.observe(el))

  const wrap = document.getElementById('loadMoreWrap')
  wrap.style.display = displayCount < filteredWorks.length ? 'flex' : 'none'
}

function buildCard(w) {
  const cover = w.coverUrl || ''
  const name = esc(w.creator?.nickname || '创作者')
  const initial = name.charAt(0)
  const avatarUrl = w.creator?.avatarUrl || ''
  const avatarHtml = avatarUrl
    ? `<img src="${esc(avatarUrl)}" alt="avatar">`
    : initial

  const liked = w.isLiked ? 'liked' : ''
  const likeIcon = w.isLiked ? '♥' : '♡'
  const likeCount = fmtCount(w.likeCount || 0)

  const mediaCover = cover
    ? `<img class="card-cover-img" src="${esc(cover)}" alt="${esc(w.title || '')}">`
    : `<div class="card-media-placeholder">🎨</div>`

  return `<div class="work-card reveal" data-id="${esc(w.id)}" onclick="goDetail('${esc(w.id)}')">
    <div class="card-media"
      data-work-id="${esc(w.id)}"
      onmouseenter="cardHoverStart(this)"
      onmouseleave="cardHoverEnd(this)">
      ${mediaCover}
    </div>
    <div class="card-body">
      <p class="card-title">${esc(w.title || '未命名作品')}</p>
      <div class="card-footer">
        <div class="card-author" onclick="event.stopPropagation();goCreator('${esc(w.creatorId)}')">
          <div class="author-avatar">${avatarHtml}</div>
          <span class="author-name">@${name}</span>
        </div>
        <button class="card-like ${liked}" onclick="event.stopPropagation();toggleLike(this,'${esc(w.id)}')">
          <span class="like-icon">${likeIcon}</span>
          <span class="like-count">${likeCount}</span>
        </button>
      </div>
    </div>
  </div>`
}

/* ── 点赞 ── */
async function toggleLike(btn, workId) {
  const token = localStorage.getItem('mowo_token')
  if (!token) { if (typeof openAuthModal === 'function') openAuthModal(); return }
  const liked = btn.classList.toggle('liked')
  const icon = btn.querySelector('.like-icon')
  const countEl = btn.querySelector('.like-count')
  icon.textContent = liked ? '♥' : '♡'
  let n = parseCount(countEl.textContent)
  n = liked ? n + 1 : Math.max(0, n - 1)
  countEl.textContent = fmtCount(n)
  try {
    await fetch(`${API}/api/collab/works/${workId}/like`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` }
    })
  } catch {
    btn.classList.toggle('liked')
    icon.textContent = liked ? '♡' : '♥'
  }
}

function parseCount(s) {
  if (!s) return 0
  return s.includes('k') ? parseFloat(s) * 1000 : parseInt(s) || 0
}
function fmtCount(n) {
  if (!n) return '0'
  return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n)
}

/* ── 帧动画叠层 ── */
const _animState = new Map()
let _curHoverId  = null
const FPS        = 8
const FRAME_DELAY = Math.round(1000 / FPS)

async function cardHoverStart(mediaDiv) {
  const workId = mediaDiv.dataset.workId
  if (!workId) return
  _curHoverId = workId
  const state = _animState.get(workId)
  if (state && state !== 'loading') { mediaDiv.appendChild(state.wrap); _startCycle(state); return }
  if (state === 'loading') return
  _animState.set(workId, 'loading')
  try {
    const token   = localStorage.getItem('mowo_token') || ''
    const headers = token ? { Authorization: `Bearer ${token}` } : {}
    const res     = await fetch(`${API}/api/collab/works/${workId}`, { headers })
    const json    = await res.json()
    const urls    = (json.data?.animationFrames || []).filter(Boolean)
    if (!urls.length) { _animState.delete(workId); return }
    const wrap = document.createElement('div')
    wrap.className = 'card-anim-wrap'
    const imgs = urls.map((url, i) => {
      const img = document.createElement('img')
      img.src = url; img.decoding = 'async'
      if (i === 0) img.className = 'af'
      wrap.appendChild(img)
      return img
    })
    const newState = { wrap, imgs, timer: null, idx: 0 }
    _animState.set(workId, newState)
    await new Promise(resolve => {
      if (imgs[0].complete && imgs[0].naturalWidth) return resolve()
      imgs[0].onload = imgs[0].onerror = resolve
      setTimeout(resolve, 1500)
    })
    if (_curHoverId !== workId) return
    mediaDiv.appendChild(wrap)
    _startCycle(newState)
  } catch { _animState.delete(workId) }
}

function cardHoverEnd(mediaDiv) {
  _curHoverId = null
  const workId = mediaDiv.dataset.workId
  const state  = _animState.get(workId)
  if (!state || state === 'loading') return
  _stopCycle(state)
  state.wrap.remove()
  state.idx = 0
}

function _startCycle(state) {
  _stopCycle(state)
  const { imgs } = state
  imgs.forEach((img, i) => img.className = i === 0 ? 'af' : '')
  state.idx = 0
  state.timer = setInterval(() => {
    imgs[state.idx].className = ''
    state.idx = (state.idx + 1) % imgs.length
    imgs[state.idx].className = 'af'
  }, FRAME_DELAY)
}
function _stopCycle(state) {
  if (state.timer) { clearInterval(state.timer); state.timer = null }
}

/* ── 跳转 ── */
function goDetail(id) {
  window.location.href = `./showcase-confirm.html?workId=${encodeURIComponent(id)}`
}
function goCreator(userId) {
  if (!userId) return
  window.location.href = `./creator-profile.html?id=${encodeURIComponent(userId)}`
}

/* ── 控件 ── */
function setSort(sort, btn) {
  currentSort = sort
  document.querySelectorAll('.sort-tab').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  applyFilters()
}
function setCreator(creatorId, btn) {
  currentCreatorId = creatorId
  document.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('active'))
  btn.classList.add('active')
  applyFilters()
}
function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase().trim()
  applyFilters()
}
function loadMore() {
  const btn = document.getElementById('loadMoreBtn')
  btn.classList.add('loading')
  btn.querySelector('span:last-child').textContent = '加载中…'
  displayCount += PAGE_SIZE
  renderWorks(false)
  btn.classList.remove('loading')
  btn.querySelector('span:last-child').textContent = '加载更多'
}
function esc(s) {
  if (!s) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

/* ── Init ── */
loadWorks()

/* ── 桌面自定义光标 ── */
if (window.matchMedia('(pointer:fine)').matches) {
  const c = document.createElement('div'), r = document.createElement('div')
  const cs = 'position:fixed;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)'
  c.style.cssText = cs + ';width:8px;height:8px;background:#111'
  r.style.cssText = cs + ';width:32px;height:32px;border:1.5px solid rgba(17,17,16,.3)'
  document.body.append(c, r)
  document.body.style.cursor = 'none'
  let mx = 0, my = 0, rx = 0, ry = 0
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; c.style.left = mx + 'px'; c.style.top = my + 'px' })
  ;(function tick() { rx += (mx - rx) * .12; ry += (my - ry) * .12; r.style.left = rx + 'px'; r.style.top = ry + 'px'; requestAnimationFrame(tick) })()
}
</script>
