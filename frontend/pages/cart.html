<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购物车 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;
  --red:#E03030;--font:'Nunito','Noto Sans SC',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);--nav-h:65px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}
a{text-decoration:none;}

/* NAV — same as favorites */
.nav{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:var(--nav-h);background:rgba(245,243,239,.96);backdrop-filter:blur(20px);border-bottom:1.5px solid var(--gray1);}
@media(min-width:1024px){.nav{padding:0 48px;}}
.nav-logo{line-height:1;}
.nav-logo-cn{font-weight:900;font-size:22px;color:var(--black);display:block;}
.nav-logo-en{font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray3);display:block;margin-top:1px;}
.nav-links{display:none;list-style:none;gap:32px;}
@media(min-width:1024px){.nav-links{display:flex;}}
.nav-links a{font-weight:800;font-size:14px;color:var(--gray3);transition:color .2s;}
.nav-links a:hover{color:var(--black);}
.nav-right{display:flex;align-items:center;gap:8px;}
.nav-user{position:relative;}
.nav-avatar-btn{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:2px solid transparent;transition:border-color .2s,background .2s;min-height:44px;}
.nav-avatar-btn:hover,.nav-avatar-btn.open{border-color:var(--gray1);background:var(--white);}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);border:1.5px solid rgba(0,0,0,.08);flex-shrink:0;}
.nav-uname{font-weight:800;font-size:13px;display:none;}
@media(min-width:640px){.nav-uname{display:block;}}
.nav-chevron{font-size:10px;color:var(--gray3);transition:transform .25s var(--ease);}
.nav-avatar-btn.open .nav-chevron{transform:rotate(180deg);}
.user-dropdown{position:absolute;top:calc(100% + 10px);right:0;width:232px;background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);box-shadow:0 8px 40px rgba(0,0,0,.12);padding:8px;opacity:0;pointer-events:none;transform:translateY(-8px) scale(.97);transform-origin:top right;transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:100;}
.user-dropdown.open{opacity:1;pointer-events:all;transform:none;}
.dropdown-head{padding:12px 14px 14px;border-bottom:1px solid var(--gray1);margin-bottom:6px;display:flex;align-items:center;gap:12px;}
.dh-av{width:38px;height:38px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:var(--black);border:2px solid var(--gray1);}
.dh-name{font-weight:900;font-size:14px;}
.dh-role{font-size:11px;font-weight:700;color:var(--gray3);margin-top:2px;}
.di{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:12px;font-weight:800;font-size:13px;color:var(--black);transition:background .15s;width:100%;text-align:left;}
.di:hover{background:var(--cream);}
.di-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.di.cart .di-ic{background:#FFF3EC;}
.di.fav .di-ic{background:#FFFBE6;}
.di.orders .di-ic{background:#EDFBEE;}
.di.works .di-ic{background:#EBF5FF;}
.di.dashboard .di-ic{background:#F0EBFF;}
.di.settings .di-ic,.di.help .di-ic{background:var(--gray1);}
.di.danger{color:var(--red);}
.di.danger:hover{background:#FFF5F5;}
.di.danger .di-ic{background:#FFF5F5;}
.dd-divider{height:1px;background:var(--gray1);margin:6px 0;}
.cart-bdg{margin-left:auto;background:var(--accent-o);color:var(--white);font-weight:900;font-size:10px;padding:2px 7px;border-radius:999px;min-width:20px;text-align:center;}
.cart-bdg.zero{display:none;}

/* PAGE */
.page{max-width:1100px;margin:0 auto;padding:calc(var(--nav-h) + 52px) 24px 120px;}
@media(min-width:1024px){.page{padding:calc(var(--nav-h) + 64px) 48px 120px;}}

.page-header{margin-bottom:36px;}
.page-title{font-weight:900;font-size:clamp(26px,5vw,42px);letter-spacing:-.03em;line-height:1.1;margin-bottom:6px;}
.page-title em{font-style:normal;background:var(--accent-o);color:var(--white);padding:1px 10px;border-radius:8px;}
.page-sub{font-weight:700;font-size:14px;color:var(--gray3);}

/* LAYOUT */
.cart-layout{display:grid;gap:24px;align-items:start;}
@media(min-width:1024px){.cart-layout{grid-template-columns:1fr 340px;}}

/* TABS */
.cart-tabs{display:flex;gap:6px;margin-bottom:20px;}
.tab-btn{padding:8px 20px;border-radius:999px;border:2px solid var(--gray1);font-weight:800;font-size:13px;color:var(--gray3);transition:all .18s;background:var(--white);cursor:pointer;}
.tab-btn:hover{border-color:var(--gray2);color:var(--black);}
.tab-btn.active{background:var(--black);color:var(--white);border-color:var(--black);}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:14px;padding:0 0 16px;border-bottom:1.5px solid var(--gray1);margin-bottom:16px;}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--gray2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .18s;}
.chk.on{background:var(--black);border-color:var(--black);}
.chk.on::after{content:'✓';font-size:12px;font-weight:900;color:var(--white);}
.chk.partial::after{content:'–';font-size:14px;font-weight:900;color:var(--white);}
.chk.partial{background:var(--black);border-color:var(--black);}
.sel-all-label{font-weight:800;font-size:14px;cursor:pointer;}
.sel-info{font-weight:700;font-size:13px;color:var(--gray3);margin-left:auto;}
.btn-batch-del{font-weight:800;font-size:13px;color:var(--gray3);padding:6px 0;transition:color .18s;}
.btn-batch-del:hover{color:var(--red);}
.btn-batch-del:disabled{opacity:.3;cursor:not-allowed;}

/* CART LIST */
.cart-list{display:flex;flex-direction:column;gap:16px;}

/* GROUP CARD */
.cart-group{background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);overflow:hidden;transition:border-color .2s,box-shadow .2s;}
.cart-group.has-sel{border-color:var(--black);box-shadow:0 0 0 1px var(--black);}

.group-header{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;}
.group-thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;}
.group-thumb img{width:100%;height:100%;object-fit:cover;}
.diy-badge{position:absolute;bottom:3px;right:3px;background:var(--accent-y);color:var(--black);font-weight:900;font-size:9px;padding:1px 5px;border-radius:4px;line-height:1.5;letter-spacing:.04em;}
.creator-av{width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:var(--black);}
.creator-av img{width:100%;height:100%;object-fit:cover;}
.group-label{flex:1;min-width:0;}
.group-label-main{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.group-label-sub{font-size:11px;font-weight:700;color:var(--gray3);margin-top:3px;}
.group-chk-wrap{flex-shrink:0;}
.group-divider{height:1px;background:var(--gray1);margin:0;}

/* CHILD ITEMS */
.child-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--gray1);transition:background .15s;}
.child-item.sel{background:#FAFAFA;}
.child-item.invalid{opacity:.45;}
.child-chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--gray2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .18s;}
.child-chk.on{background:var(--black);border-color:var(--black);}
.child-chk.on::after{content:'✓';font-size:10px;font-weight:900;color:var(--white);}
.child-cover{width:44px;height:44px;border-radius:9px;overflow:hidden;background:var(--cream);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
.child-cover img{width:100%;height:100%;object-fit:cover;}
.child-info{flex:1;min-width:0;}
.child-title{font-weight:800;font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.child-tag{display:inline-flex;align-items:center;background:var(--cream);border:1px solid var(--gray1);border-radius:999px;padding:2px 8px;font-weight:800;font-size:10px;color:var(--gray3);}
.child-tag.warn{background:#FFF3F3;border-color:#FFCECE;color:var(--red);}
.child-tag.price{background:#FFF8EC;border-color:#FFE0A0;color:#A06000;}
.child-prices{display:flex;align-items:baseline;gap:8px;margin-top:5px;}
.child-unit{font-weight:700;font-size:11px;color:var(--gray3);}
.child-sub{font-weight:900;font-size:14px;}
.child-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.qty-row{display:flex;align-items:center;gap:8px;}
.qty-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gray1);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;transition:border-color .18s;cursor:pointer;}
.qty-btn:hover{border-color:var(--black);}
.qty-btn:disabled{opacity:.3;cursor:not-allowed;}
.qty-n{font-weight:900;font-size:14px;min-width:20px;text-align:center;}
.btn-del{font-weight:800;font-size:11px;color:var(--gray3);transition:color .18s;cursor:pointer;}
.btn-del:hover{color:var(--red);}

/* SUMMARY (sticky) */
.summary{background:var(--white);border-radius:24px;border:1.5px solid var(--gray1);padding:24px;position:sticky;top:calc(var(--nav-h)+20px);}
.sum-title{font-weight:900;font-size:16px;margin-bottom:20px;}
.sum-items{max-height:180px;overflow-y:auto;margin-bottom:18px;}
.sum-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray1);}
.sum-item:last-child{border-bottom:none;}
.sum-ic{width:38px;height:38px;border-radius:10px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
.sum-name{font-weight:800;font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sum-price{font-weight:900;font-size:12px;flex-shrink:0;}
.sum-hint{font-weight:700;font-size:13px;color:var(--gray3);text-align:center;padding:16px 0;}
.sum-row{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;color:var(--gray3);margin-bottom:10px;}
.sum-row.total{border-top:1.5px solid var(--gray1);padding-top:14px;margin-top:4px;font-weight:900;font-size:20px;color:var(--black);margin-bottom:0;}
.sum-row.total span:last-child{color:var(--accent-o);}

.btn-checkout{width:100%;height:56px;border-radius:16px;font-weight:900;font-size:15px;background:var(--black);color:var(--white);margin-top:18px;transition:opacity .2s,transform .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-checkout:hover{opacity:.86;}
.btn-checkout:active{transform:scale(.98);}
.btn-checkout:disabled{opacity:.3;cursor:not-allowed;}
.btn-back-fav{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;font-weight:800;font-size:13px;color:var(--gray3);padding:8px;border-radius:12px;transition:background .18s,color .18s;}
.btn-back-fav:hover{background:var(--cream);color:var(--black);}

/* CHECKOUT CONFIRM MODAL */
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(17,17,16,.55);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);}
.modal-bg.open{opacity:1;pointer-events:all;}
.confirm-box{width:100%;max-width:400px;background:var(--white);border-radius:28px;padding:32px;border:1.5px solid var(--gray1);box-shadow:0 24px 80px rgba(0,0,0,.18);transform:translateY(16px) scale(.97);transition:transform .38s var(--ease);}
.modal-bg.open .confirm-box{transform:none;}
.cfm-icon{font-size:42px;margin-bottom:16px;}
.cfm-title{font-weight:900;font-size:21px;letter-spacing:-.02em;margin-bottom:8px;}
.cfm-desc{font-weight:700;font-size:14px;color:var(--gray3);line-height:1.8;margin-bottom:20px;}
.cfm-sum{background:var(--cream);border-radius:16px;padding:16px;margin-bottom:24px;}
.cfm-row{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:var(--gray3);margin-bottom:9px;}
.cfm-row:last-child{margin-bottom:0;padding-top:11px;border-top:1px solid var(--gray2);font-weight:900;font-size:17px;color:var(--black);}
.cfm-btns{display:flex;gap:10px;}
.btn-cfm-cancel{flex:1;height:52px;border-radius:14px;border:2px solid var(--gray1);font-weight:800;font-size:14px;color:var(--gray3);transition:all .18s;}
.btn-cfm-cancel:hover{border-color:var(--black);color:var(--black);}
.btn-cfm-go{flex:2;height:52px;border-radius:14px;background:var(--black);color:var(--white);font-weight:900;font-size:14px;transition:opacity .18s;}
.btn-cfm-go:hover{opacity:.85;}

/* EMPTY */
.empty-state{text-align:center;padding:88px 24px;}
.empty-icon{font-size:64px;margin-bottom:18px;opacity:.4;}
.empty-title{font-weight:900;font-size:20px;margin-bottom:8px;}
.empty-desc{font-weight:700;font-size:14px;color:var(--gray3);line-height:1.9;margin-bottom:26px;}
.btn-go{display:inline-flex;align-items:center;gap:7px;padding:13px 26px;border-radius:999px;font-weight:900;font-size:13px;background:var(--black);color:var(--white);transition:opacity .2s;}
.btn-go:hover{opacity:.82;}

/* REVEAL */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease),transform .55s var(--ease);}
.reveal.on{opacity:1;transform:none;}
.d1{transition-delay:.06s}.d2{transition-delay:.12s}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);z-index:9500;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* CURSOR */
#cdot,#cring{position:fixed;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
#cdot{width:8px;height:8px;background:var(--black);}
#cring{width:32px;height:32px;border:1.5px solid rgba(17,17,16,.25);transition:width .3s,height .3s;}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo-cn">哞屋</span>
    <span class="nav-logo-en">MOWO</span>
  </a>
  <ul class="nav-links">
    <li><a href="about.html">关于我们</a></li>
    <li><a href="products.html">产品介绍</a></li>
    <li><a href="showcase.html">画师联名</a></li>
    <li><a href="customize-start.html">创作中心</a></li>
    <li><a href="contact.html">联络我们</a></li>
  </ul>
  <div class="nav-right">
    <button class="nav-login nav-login-btn" id="navLoginBtn">登录</button>
    <div class="burger" id="burger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<!-- PAGE -->
<main class="page">
  <div class="page-header reveal">
    <h1 class="page-title">购物车 <em>🛒</em></h1>
    <p class="page-sub">勾选商品，确认机型，随时结算</p>
  </div>

  <!-- Cart content (shown when non-empty) -->
  <div id="cartContent">
    <!-- Tabs -->
    <div class="cart-tabs reveal d1">
      <button class="tab-btn active" id="tabAll"    onclick="setTab('all')">全部</button>
      <button class="tab-btn"        id="tabCustom" onclick="setTab('custom')">✏️ 定制款</button>
      <button class="tab-btn"        id="tabMarket" onclick="setTab('market')">🎨 联名款</button>
    </div>

    <div class="cart-layout">
      <!-- Left: items -->
      <div>
        <div class="toolbar reveal d1">
          <div class="chk" id="selectAllChk" onclick="toggleSelectAll()"></div>
          <span class="sel-all-label" onclick="toggleSelectAll()">全选</span>
          <span class="sel-info" id="selInfo">已选 0 件</span>
          <button class="btn-batch-del" id="batchDelBtn" onclick="batchDelete()" disabled>删除所选</button>
        </div>
        <div class="cart-list reveal d2" id="cartList"></div>
      </div>
      <!-- Right: summary -->
      <div class="summary reveal d1">
        <div class="sum-title">订单摘要</div>
        <div class="sum-items" id="sumItems"></div>
        <div class="sum-row"><span>商品合计</span><span id="sumSubtotal">¥0</span></div>
        <div class="sum-row"><span>件数</span><span id="sumQty">0 件</span></div>
        <div class="sum-row total"><span>总计</span><span id="sumTotal">¥0</span></div>
        <button class="btn-checkout" id="checkoutBtn" onclick="openConfirm()" disabled>去结算</button>
        <button class="btn-back-fav" onclick="goFav()">← 继续定制</button>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="cartEmpty" style="display:none">
    <div class="empty-icon">🛒</div>
    <div class="empty-title">购物车还是空的</div>
    <div class="empty-desc">在定制流程选配好框架后加入购物车<br>或在联名展示页选喜欢的作品</div>
    <a href="customize-start.html" class="btn-go">去定制 →</a>
  </div>
</main>

<!-- CHECKOUT CONFIRM MODAL -->
<div class="modal-bg" id="confirmBg" onclick="handleConfirmBg(event)">
  <div class="confirm-box" onclick="event.stopPropagation()">
    <div class="cfm-icon">🛍️</div>
    <div class="cfm-title">确认前往结算</div>
    <div class="cfm-desc">以下商品即将进入结算流程，<br>请确认数量和机型无误。</div>
    <div class="cfm-sum" id="cfmSumBox"></div>
    <div class="cfm-btns">
      <button class="btn-cfm-cancel" onclick="closeConfirm()">再想想</button>
      <button class="btn-cfm-go" onclick="goCheckout()">确认结算 →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MOWO_API = location.hostname === '127.0.0.1' ? 'http://127.0.0.1:3001' : 'http://localhost:3001';

/* ─── STATE ─── */
let groups = [];        // [{groupId, type, previewUrl, label, subLabel, creatorAvatar, items:[...]}]
let allFlatItems = [];  // flat list of all CartItems
let selected = new Set();
let activeTab = 'all'; // 'all' | 'custom' | 'market'

/* ─── LOAD FROM API ─── */
async function loadCart() {
  const token = localStorage.getItem('mowo_token');
  if (!token) { showEmpty(); return; }

  try {
    const res = await fetch(`${MOWO_API}/api/cart`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const json = await res.json();
    if (!json.success) { showEmpty(); return; }

    const rawItems = json.data.items || [];
    const creatorProfiles = json.data.creatorProfiles || {};

    // Map raw API items → internal flat items
    allFlatItems = rawItems.map(item => ({
      id: item.id,
      itemType: item.itemType,      // 'CUSTOM' | 'MARKET'
      title: item.snapshotTitle || (item.itemType === 'CUSTOM' ? '定制款' : '联名款'),
      machine: buildMachineLabel(item),
      unitPrice: item.currentPrice != null ? Number(item.currentPrice) : Number(item.snapshotPrice || 0),
      qty: item.quantity,
      coverUrl: item.coverUrl || item.snapshotPreviewUrl || null,
      status: item.status,
      contentId: item.contentId,
      customProductId: item.customProductId || null,
      sessionGroupId: item.sessionGroupId || null,
      creatorId: item.creatorId || null,
      isSelected: item.selected,
      configJson: item.configSnapshotJson || null,
    }));

    // Restore selected state
    selected = new Set(allFlatItems.filter(c => c.isSelected).map(c => c.id));

    // Build groups
    const groupMap = new Map(); // groupKey → group object
    for (const item of allFlatItems) {
      let gKey, gType;
      if (item.itemType === 'CUSTOM') {
        gKey = 'c_' + (item.sessionGroupId || item.customProductId || item.id);
        gType = 'CUSTOM';
      } else {
        gKey = 'm_' + (item.creatorId || item.contentId || item.id);
        gType = 'MARKET';
      }

      if (!groupMap.has(gKey)) {
        const cp = item.creatorId ? (creatorProfiles[item.creatorId] || null) : null;
        groupMap.set(gKey, {
          groupId: gKey,
          type: gType,
          previewUrl: item.coverUrl,
          label: gType === 'CUSTOM'
            ? ('我的定制' + (item.machine ? ' · ' + (item.machine.split(' · ')[0] || '') : ''))
            : (cp ? cp.nickname : '未知创作者'),
          subLabel: null,
          creatorAvatar: cp ? cp.avatarUrl : null,
          items: [],
        });
      }
      groupMap.get(gKey).items.push(item);
    }

    // Finalize groups: update subLabels, sort
    groups = [...groupMap.values()];
    groups.forEach(g => {
      if (g.type === 'CUSTOM') {
        g.subLabel = g.items.length + ' 款配置';
        // Use first item's cover as group preview
        if (!g.previewUrl) g.previewUrl = g.items[0]?.coverUrl || null;
      }
    });
    // Sort: CUSTOM first, then by newest item
    groups.sort((a, b) => {
      if (a.type !== b.type) return a.type === 'CUSTOM' ? -1 : 1;
      return 0;
    });

    render();
  } catch(e) {
    console.error('购物车加载失败', e);
    showEmpty();
  }
}

function buildMachineLabel(item) {
  if (item.configSnapshotJson) {
    try {
      const cfg = JSON.parse(item.configSnapshotJson);
      const parts = [];
      if (cfg.frameCount) parts.push(cfg.frameCount + '帧');
      if (cfg.size) parts.push(cfg.size);
      if (cfg.material) parts.push(cfg.material);
      if (cfg.colorName) parts.push(cfg.colorName);
      if (parts.length) return parts.join(' · ');
    } catch(e) {}
  }
  return item.hardwareSkuCode || '';
}

function showEmpty() {
  document.getElementById('cartContent').style.display = 'none';
  document.getElementById('cartEmpty').style.display = 'block';
}

/* ─── TAB ─── */
function setTab(tab) {
  activeTab = tab;
  ['All','Custom','Market'].forEach(t => {
    const btn = document.getElementById('tab' + t);
    if (btn) btn.classList.toggle('active', tab === t.toLowerCase());
  });
  render();
}

/* ─── RENDER ─── */
function render() {
  const list = document.getElementById('cartList');
  const empty = document.getElementById('cartEmpty');
  const content = document.getElementById('cartContent');
  const badge = document.getElementById('cartBdg');
  const totalQty = allFlatItems.reduce((s, c) => s + c.qty, 0);
  if (badge) { badge.textContent = totalQty; badge.classList.toggle('zero', totalQty === 0); }

  if (!allFlatItems.length) { content.style.display = 'none'; empty.style.display = 'block'; return; }
  content.style.display = ''; empty.style.display = 'none';

  // Filter groups by tab
  const visibleGroups = groups.filter(g => {
    if (activeTab === 'custom') return g.type === 'CUSTOM';
    if (activeTab === 'market') return g.type === 'MARKET';
    return true;
  });

  list.innerHTML = visibleGroups.map(g => renderGroup(g)).join('');
  updateSummary();
}

function renderGroup(g) {
  const groupSel = g.items.every(i => selected.has(i.id));
  const groupPartSel = !groupSel && g.items.some(i => selected.has(i.id));
  const hasSel = g.items.some(i => selected.has(i.id));
  const chkCls = 'chk' + (groupSel ? ' on' : groupPartSel ? ' partial' : '');

  // Group thumb
  let thumbHtml;
  if (g.type === 'CUSTOM') {
    const imgSrc = g.previewUrl;
    thumbHtml = `<div class="group-thumb">
      ${imgSrc ? `<img src="${imgSrc}" onerror="this.style.display='none'">` : '<span style="font-size:24px">✏️</span>'}
      <span class="diy-badge">DIY</span>
    </div>`;
  } else {
    // MARKET: creator avatar
    const av = g.creatorAvatar;
    thumbHtml = `<div class="creator-av">
      ${av ? `<img src="${av}" onerror="this.parentElement.textContent='🎨'">` : '🎨'}
    </div>`;
  }

  const childrenHtml = g.items.map(item => renderChildItem(item, g.groupId)).join('');

  return `<div class="cart-group${hasSel ? ' has-sel' : ''}" id="group-${g.groupId.replace(/[^a-zA-Z0-9_]/g,'-')}">
  <div class="group-header">
    ${thumbHtml}
    <div class="group-label">
      <div class="group-label-main">${g.label}</div>
      ${g.subLabel ? `<div class="group-label-sub">${g.subLabel}</div>` : ''}
    </div>
    <div class="group-chk-wrap">
      <div class="${chkCls}" onclick="toggleGroupAll('${g.groupId}')"></div>
    </div>
  </div>
  ${childrenHtml}
</div>`;
}

function buildChildDisplayTitle(item) {
  if (item.itemType === 'CUSTOM') {
    // 尝试从 configSnapshotJson 拼出完整规格标题
    if (item.configJson) {
      try {
        const cfg = JSON.parse(item.configJson);
        const spec = [
          cfg.modelName || null,
          cfg.size     || null,
          cfg.frameCount ? cfg.frameCount + '帧' : null,
          cfg.material  || null,
          cfg.colorName || null,
        ].filter(Boolean);
        if (spec.length) {
          // 格式：定制款 · 标准款 8x8cm 12帧椴木板原色
          // modelName 和 size 之间加空格，size 和 frameCount 之间加空格，其余紧连
          const [model, size, frame, material, color] = [
            cfg.modelName, cfg.size,
            cfg.frameCount ? cfg.frameCount + '帧' : null,
            cfg.material, cfg.colorName
          ];
          let specStr = [model, size].filter(Boolean).join(' ');
          if (frame)    specStr += (specStr ? ' ' : '') + frame;
          if (material) specStr += material;
          if (color)    specStr += color;
          return '定制款' + (specStr ? ' · ' + specStr : '');
        }
      } catch(e) {}
    }
    // 回退到 snapshotTitle
    return item.title || '定制款';
  }
  return item.title;
}

function renderChildItem(item, groupId) {
  const isSel = selected.has(item.id);
  const isInvalid = item.status === 'invalid' || item.status === 'stock_out';
  const priceChanged = item.status === 'price_changed';

  const displayTitle = buildChildDisplayTitle(item);

  let tagHtml = '';
  if (isInvalid) tagHtml = `<span class="child-tag warn">已失效</span>`;
  else if (priceChanged) tagHtml = `<span class="child-tag price">价格已变动</span>`;

  const escapedGroupId = groupId.replace(/'/g, "\\'");

  return `<div class="child-item${isSel ? ' sel' : ''}${isInvalid ? ' invalid' : ''}" id="child-${item.id}">
  <div class="child-chk${isSel ? ' on' : ''}" onclick="toggleChild('${item.id}','${escapedGroupId}')"></div>
  <div class="child-info">
    <div class="child-title">${displayTitle}</div>
    ${tagHtml}
    <div class="child-prices">
      <span class="child-unit">¥${item.unitPrice}/件</span>
      <span class="child-sub" style="font-weight:900;font-size:13px;margin-left:6px;">¥${(item.unitPrice * item.qty).toFixed(0)}</span>
    </div>
  </div>
  <div class="child-right">
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty('${item.id}',-1)" ${item.qty<=1?'disabled':''}>−</button>
      <span class="qty-n">${item.qty}</span>
      <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
    </div>
    <button class="btn-del" onclick="deleteItem('${item.id}')">删除</button>
  </div>
</div>`;
}

/* ─── SELECTION ─── */
function toggleChild(id, groupId) {
  const nowSelected = !selected.has(id);
  if (nowSelected) selected.add(id); else selected.delete(id);
  render();
  const token = localStorage.getItem('mowo_token');
  if (token) {
    fetch(`${MOWO_API}/api/cart/item/${id}/update`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ selected: nowSelected })
    }).catch(() => {});
  }
}

function toggleGroupAll(groupId) {
  const g = groups.find(g => g.groupId === groupId);
  if (!g) return;
  const allSel = g.items.every(i => selected.has(i.id));
  const token = localStorage.getItem('mowo_token');
  g.items.forEach(i => {
    if (allSel) selected.delete(i.id); else selected.add(i.id);
    if (token) {
      fetch(`${MOWO_API}/api/cart/item/${i.id}/update`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ selected: !allSel })
      }).catch(() => {});
    }
  });
  render();
}

function toggleSelectAll() {
  const allIds = allFlatItems.map(c => c.id);
  const allSel = allIds.length > 0 && allIds.every(id => selected.has(id));
  const token = localStorage.getItem('mowo_token');
  if (allSel) selected.clear(); else allIds.forEach(id => selected.add(id));
  render();
  if (token) {
    allIds.forEach(id => {
      fetch(`${MOWO_API}/api/cart/item/${id}/update`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ selected: !allSel })
      }).catch(() => {});
    });
  }
}

/* ─── DELETE / QTY ─── */
function _removeItemsLocally(ids) {
  const idSet = new Set(ids);
  allFlatItems = allFlatItems.filter(c => !idSet.has(c.id));
  ids.forEach(id => selected.delete(id));
  // Remove from group items; prune empty groups
  groups.forEach(g => { g.items = g.items.filter(i => !idSet.has(i.id)); });
  groups = groups.filter(g => g.items.length > 0);
  // Update subLabels
  groups.forEach(g => {
    if (g.type === 'CUSTOM') g.subLabel = g.items.length + ' 款配置';
  });
}

async function batchDelete() {
  const token = localStorage.getItem('mowo_token');
  const toDelete = [...selected];
  if (!toDelete.length) return;
  await Promise.all(toDelete.map(id =>
    token ? fetch(`${MOWO_API}/api/cart/item/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    }).catch(() => {}) : Promise.resolve()
  ));
  _removeItemsLocally(toDelete);
  render(); toast('已删除所选商品');
}

async function deleteItem(id) {
  const token = localStorage.getItem('mowo_token');
  if (token) {
    await fetch(`${MOWO_API}/api/cart/item/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    }).catch(() => {});
  }
  _removeItemsLocally([id]);
  render(); toast('已移除');
}

async function changeQty(id, d) {
  const item = allFlatItems.find(c => c.id === id);
  if (!item) return;
  const newQty = Math.max(1, item.qty + d);
  if (newQty === item.qty) return;
  item.qty = newQty;
  render();
  const token = localStorage.getItem('mowo_token');
  if (token) {
    fetch(`${MOWO_API}/api/cart/item/${id}/update`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ quantity: newQty })
    }).catch(() => {});
  }
}

/* ─── SUMMARY ─── */
function updateSummary() {
  const sel = allFlatItems.filter(c => selected.has(c.id) && c.status !== 'invalid' && c.status !== 'stock_out');
  const total = sel.reduce((s, c) => s + c.unitPrice * c.qty, 0);
  const qty = sel.reduce((s, c) => s + c.qty, 0);
  const allIds = allFlatItems.map(c => c.id);
  const allOn = allIds.length > 0 && allIds.every(id => selected.has(id));
  const partOn = allIds.some(id => selected.has(id)) && !allOn;

  const sac = document.getElementById('selectAllChk');
  sac.className = 'chk' + (allOn ? ' on' : partOn ? ' partial' : '');

  document.getElementById('selInfo').textContent = `已选 ${selected.size} 件`;
  document.getElementById('batchDelBtn').disabled = selected.size === 0;
  document.getElementById('sumSubtotal').textContent = `¥${total.toFixed(0)}`;
  document.getElementById('sumQty').textContent = `${qty} 件`;
  document.getElementById('sumTotal').textContent = `¥${total.toFixed(0)}`;
  document.getElementById('checkoutBtn').disabled = sel.length === 0;

  document.getElementById('sumItems').innerHTML = sel.length
    ? sel.map(c => `
        <div class="sum-item">
          <div class="sum-ic" style="background:#F5F3EF">${c.itemType==='CUSTOM'?'✏️':'🎨'}</div>
          <span class="sum-name">${buildChildDisplayTitle(c)} ×${c.qty}</span>
          <span class="sum-price">¥${(c.unitPrice * c.qty).toFixed(0)}</span>
        </div>`).join('')
    : '<div class="sum-hint">勾选左侧商品后显示</div>';
}

/* ─── CHECKOUT CONFIRM ─── */
function openConfirm() {
  const sel = allFlatItems.filter(c => selected.has(c.id) && c.status !== 'invalid' && c.status !== 'stock_out');
  const total = sel.reduce((s, c) => s + c.unitPrice * c.qty, 0);
  const qty = sel.reduce((s, c) => s + c.qty, 0);
  document.getElementById('cfmSumBox').innerHTML = `
    <div class="cfm-row"><span>商品件数</span><span>${qty} 件</span></div>
    <div class="cfm-row"><span>配送方式</span><span>快递包邮</span></div>
    <div class="cfm-row"><span>应付总额</span><span>¥${total.toFixed(0)}</span></div>`;
  document.getElementById('confirmBg').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeConfirm() {
  document.getElementById('confirmBg').classList.remove('open');
  document.body.style.overflow = '';
}
function handleConfirmBg(e) { if (e.target.id === 'confirmBg') closeConfirm(); }
function goCheckout() {
  closeConfirm();
  const selIds = allFlatItems.filter(c => selected.has(c.id) && c.status !== 'invalid').map(c => c.id);
  sessionStorage.setItem('mowo_checkout_items', JSON.stringify(selIds));
  window.location.href = 'checkout.html';
}

/* ─── NAV ─── */
function goFav() { window.location.href = 'customize-start.html'; }

/* ─── TOAST ─── */
let tT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ─── REVEAL ─── */
const revObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); revObs.unobserve(e.target); } });
}, { threshold: 0.06 });
document.querySelectorAll('.reveal').forEach(el => revObs.observe(el));

/* ─── CURSOR ─── */
if (window.matchMedia('(pointer:fine)').matches) {
  const dot = document.createElement('div'); dot.id = 'cdot';
  const ring = document.createElement('div'); ring.id = 'cring';
  document.body.append(dot, ring);
  document.body.style.cursor = 'none';
  window._ring = ring;
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; dot.style.left=mx+'px'; dot.style.top=my+'px'; });
  (function tick() { rx+=(mx-rx)*.12; ry+=(my-ry)*.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(tick); })();
  document.querySelectorAll('a,button,.child-cover,.child-title').forEach(el => {
    el.addEventListener('mouseenter', () => { ring.style.width='48px'; ring.style.height='48px'; });
    el.addEventListener('mouseleave', () => { ring.style.width='32px'; ring.style.height='32px'; });
  });
}

/* ─── INIT ─── */
loadCart();
</script>
<script src="../js/auth.js"></script>
