<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码查询 — 哞屋生产端</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --white:#FFFFFF; --cream:#F5F3EF; --black:#111110;
  --gray1:#EBEBEA; --gray2:#C4C3BF; --gray3:#787874;
  --accent-y:#F5E642; --accent-o:#FF6B35; --accent-g:#8FD694; --accent-b:#7EC8E3;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --sidebar-w:220px; --sidebar-collapsed:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}

/* 侧边栏 */
.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--black);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:width .3s cubic-bezier(0.22,1,0.36,1);overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;}
.sidebar-logo-icon{width:32px;height:32px;background:var(--accent-y);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sidebar-logo-text{font-weight:900;font-size:15px;color:var(--white);}
.sidebar-logo-sub{font-weight:700;font-size:10px;color:var(--gray3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:1px;}
.sidebar-toggle{position:absolute;top:26px;right:12px;width:28px;height:28px;background:rgba(255,255,255,.08);border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray3);font-size:12px;transition:background .2s;}
.sidebar-toggle:hover{background:rgba(255,255,255,.15);color:var(--white);}
.sidebar-nav{flex:1;padding:16px 0;overflow-y:auto;overflow-x:hidden;}
.nav-section-label{font-weight:800;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gray3);padding:12px 20px 6px;white-space:nowrap;transition:opacity .2s;}
.sidebar.collapsed .nav-section-label{opacity:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;color:var(--gray3);font-weight:800;font-size:13px;text-decoration:none;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--white);}
.nav-item.active{background:rgba(245,230,66,.12);color:var(--accent-y);}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-y);border-radius:0 2px 2px 0;}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.nav-label{transition:opacity .2s;}
.sidebar.collapsed .nav-label{opacity:0;}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap;overflow:hidden;}
.sidebar-user{display:flex;align-items:center;gap:10px;}
.sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);flex-shrink:0;}
.sidebar-user-name{font-weight:800;font-size:12px;color:var(--white);}
.sidebar-user-role{font-weight:700;font-size:10px;color:var(--gray3);}
.sidebar.collapsed .sidebar-user-info{display:none;}

/* 主区 */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;transition:margin-left .3s cubic-bezier(0.22,1,0.36,1);display:flex;flex-direction:column;}
.main.expanded{margin-left:var(--sidebar-collapsed);}
.topbar{position:sticky;top:0;z-index:50;background:rgba(245,243,239,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray1);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-weight:900;font-size:18px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.tab-btn{height:32px;padding:0 14px;border-radius:8px;font-family:var(--font);font-weight:800;font-size:12px;border:none;cursor:pointer;transition:all .15s;}
.tab-btn.active{background:var(--black);color:var(--white);}
.tab-btn.inactive{background:var(--white);color:var(--gray3);border:1.5px solid var(--gray1);}
.tab-btn.inactive:hover{border-color:var(--black);color:var(--black);}

.content{padding:28px 32px;flex:1;max-width:720px;}

.scan-box{background:var(--white);border-radius:16px;border:1.5px solid var(--gray1);padding:20px;margin-bottom:16px;}
.scan-label{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray3);margin-bottom:8px;display:block;}
.scan-input-row{display:flex;gap:8px;}
.scan-input{flex:1;height:48px;border:2px solid var(--gray1);border-radius:12px;padding:0 16px;font-family:var(--font);font-weight:800;font-size:15px;color:var(--black);outline:none;transition:border-color .2s;background:var(--white);}
.scan-input:focus{border-color:var(--black);}
.scan-input::placeholder{color:var(--gray2);font-weight:700;}
.scan-btn{height:48px;padding:0 20px;border-radius:12px;background:var(--black);color:var(--white);font-family:var(--font);font-weight:900;font-size:14px;border:none;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.scan-btn:hover{opacity:.85;}
.scan-hint{margin-top:8px;font-weight:700;font-size:11px;color:var(--gray3);}

.result-area{display:none;}
.result-area.show{display:block;}

.result-card{background:var(--white);border-radius:16px;border:1.5px solid var(--gray1);overflow:hidden;margin-bottom:12px;}
.result-card-head{padding:14px 18px;border-bottom:1px solid var(--gray1);display:flex;align-items:center;justify-content:space-between;}
.result-type-badge{padding:3px 10px;border-radius:999px;font-weight:800;font-size:11px;}
.type-sku{background:#E3F2FD;color:#1565C0;}
.type-order{background:#E8F5E9;color:#2E7D32;}
.type-tracking{background:#FFF3E0;color:#E65100;}
.result-card-body{padding:16px 18px;}
.result-card-title{font-weight:900;font-size:16px;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.info-item-label{font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);margin-bottom:3px;}
.info-item-val{font-weight:800;font-size:13px;color:var(--black);}
.info-item-val.mono{font-family:monospace;font-size:12px;}

.color-chip{display:inline-flex;align-items:center;gap:6px;}
.color-dot{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.1);flex-shrink:0;}

.complete-banner{padding:12px 16px;border-radius:10px;font-weight:800;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.complete-banner.ok{background:#E8F5E9;color:#2E7D32;}
.complete-banner.pending{background:#FFF3E0;color:#E65100;}
.complete-banner.partial{background:#FFF8E1;color:#B8860B;}

.order-list{display:flex;flex-direction:column;gap:6px;}
.order-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;}
.order-item.done{background:#F1F8E9;}
.order-item.todo{background:#FFF8F0;}
.order-item-seq{width:28px;height:28px;border-radius:8px;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.order-item.done .order-item-seq{background:#C8E6C9;color:#2E7D32;}
.order-item.todo .order-item-seq{background:#FFE0B2;color:#E65100;}
.order-item-info{flex:1;min-width:0;}
.order-item-sku{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.order-item-no{font-weight:700;font-size:10px;color:var(--gray3);margin-top:2px;font-family:monospace;}
.order-item-status{font-weight:800;font-size:11px;padding:2px 8px;border-radius:999px;flex-shrink:0;}
.status-producing{background:#E8F5E9;color:#2E7D32;}
.status-processing{background:#FFF3E0;color:#E65100;}
.status-shipped{background:#E3F2FD;color:#1565C0;}
.status-other{background:var(--gray1);color:var(--gray3);}

.barcode-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--cream);border-radius:8px;border:1px solid var(--gray1);font-family:monospace;font-weight:800;font-size:13px;}

.empty-hint{text-align:center;padding:40px 20px;}
.empty-icon{font-size:40px;margin-bottom:10px;}
.empty-text{font-weight:700;font-size:13px;color:var(--gray3);}

.error-card{background:#FFE8E3;border:1.5px solid #FFCFC4;border-radius:16px;padding:16px 18px;margin-bottom:12px;}
.error-title{font-weight:900;font-size:14px;color:#C0320A;margin-bottom:4px;}
.error-sub{font-weight:700;font-size:12px;color:#C0320A;}

.loading-card{background:var(--white);border-radius:16px;border:1.5px solid var(--gray1);padding:24px;text-align:center;font-weight:700;font-size:13px;color:var(--gray3);}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--white);padding:12px 22px;border-radius:12px;font-weight:800;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ══ 发货模式 ══ */
.ship-panel { display:none; }
.ship-panel.show { display:block; }

.ship-step { margin-bottom:16px; }
.ship-step-label { font-weight:800; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--gray3); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.ship-step-num { width:20px; height:20px; border-radius:50%; background:var(--black); color:var(--white); font-weight:900; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ship-step-num.done { background:var(--accent-g); color:var(--black); }

.current-tracking-card { background:var(--white); border-radius:16px; border:2px solid var(--black); padding:16px 18px; margin-bottom:12px; }
.current-tracking-title { font-weight:900; font-size:15px; margin-bottom:4px; }
.current-tracking-sub { font-weight:700; font-size:12px; color:var(--gray3); margin-bottom:12px; }

.order-confirm-list { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.order-confirm-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--gray1); background:var(--white); transition:all .2s; }
.order-confirm-item.confirmed { border-color:#A5D6A7; background:#F1F8E9; }
.order-confirm-item.waiting { border-color:var(--gray1); background:var(--cream); }
.order-confirm-seq { width:28px; height:28px; border-radius:8px; font-weight:900; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--gray1); color:var(--gray3); }
.order-confirm-item.confirmed .order-confirm-seq { background:#C8E6C9; color:#2E7D32; }
.order-confirm-info { flex:1; min-width:0; }
.order-confirm-sku { font-weight:800; font-size:12px; }
.order-confirm-no { font-weight:700; font-size:10px; color:var(--gray3); font-family:monospace; margin-top:2px; }
.order-confirm-badge { font-weight:800; font-size:11px; padding:3px 8px; border-radius:999px; flex-shrink:0; }
.badge-confirmed { background:#E8F5E9; color:#2E7D32; }
.badge-waiting { background:var(--gray1); color:var(--gray3); }

.ship-action-row { display:flex; gap:8px; }
.btn { height:40px; padding:0 18px; border-radius:10px; font-family:var(--font); font-weight:800; font-size:13px; border:none; cursor:pointer; transition:all .15s; display:inline-flex; align-items:center; gap:6px; }
.btn:active { transform:scale(.96); }
.btn-black { background:var(--black); color:var(--white); }
.btn-black:hover { opacity:.85; }
.btn-yellow { background:var(--accent-y); color:var(--black); }
.btn-yellow:hover { opacity:.85; }
.btn-ghost { background:var(--white); color:var(--black); border:1.5px solid var(--gray1); }
.btn-ghost:hover { border-color:var(--black); }
.btn-green { background:#4CAF50; color:var(--white); }
.btn-green:hover { opacity:.85; }
.btn-red { background:#FFE8E3; color:#C0320A; border:1.5px solid #FFCFC4; }

/* 等候区 */
.pending-bar { background:var(--white); border-radius:14px; border:1.5px solid var(--gray1); padding:14px 16px; margin-bottom:12px; }
.pending-bar-head { display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
.pending-bar-title { font-weight:800; font-size:13px; display:flex; align-items:center; gap:8px; }
.pending-dot { width:8px; height:8px; border-radius:50%; background:#FF6B35; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.2)} }
.pending-count-badge { background:#FF6B35; color:var(--white); font-weight:900; font-size:11px; padding:2px 8px; border-radius:999px; }
.pending-list { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
.pending-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:var(--cream); }
.pending-item-info { flex:1; min-width:0; }
.pending-item-name { font-weight:800; font-size:12px; }
.pending-item-sub { font-weight:700; font-size:10px; color:var(--gray3); font-family:monospace; }

/* 已完成区 */
.done-section { margin-top:16px; }
.done-section-title { font-weight:800; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gray3); margin-bottom:8px; }
.done-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; background:#F1F8E9; margin-bottom:6px; }
.done-item-check { font-size:14px; }
.done-item-info { flex:1; }
.done-item-name { font-weight:800; font-size:12px; color:#2E7D32; }
.done-item-sub { font-weight:700; font-size:10px; color:#4CAF50; font-family:monospace; }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; z-index:300; background:rgba(17,17,16,.5); align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--white); border-radius:20px; padding:24px; width:360px; max-width:90vw; box-shadow:0 20px 60px rgba(0,0,0,.15); }
.modal-title { font-weight:900; font-size:16px; margin-bottom:6px; }
.modal-sub { font-weight:700; font-size:12px; color:var(--gray3); margin-bottom:20px; line-height:1.6; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; }
.modal-warn { background:#FFF3E0; border-radius:10px; padding:10px 12px; margin-bottom:16px; font-weight:700; font-size:12px; color:#E65100; }

/* 等候区弹出 */
.intercept-card { background:var(--white); border-radius:16px; border:2px solid var(--accent-o); padding:16px 18px; margin-bottom:12px; }
.intercept-title { font-weight:900; font-size:14px; color:var(--accent-o); margin-bottom:6px; }
.intercept-sub { font-weight:700; font-size:12px; color:var(--gray3); margin-bottom:12px; }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">🐄</div>
    <div>
      <div class="sidebar-logo-text">哞屋生产端</div>
      <span class="sidebar-logo-sub">MOWO Production</span>
    </div>
  </div>
  <button class="sidebar-toggle" id="sidebarToggle">◀</button>
  <nav class="sidebar-nav">
    <div class="nav-section-label">查询</div>
    <a class="nav-item active" id="navQuery" href="#" onclick="setTab('query');return false;">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">扫码查询</span>
    </a>
    <div class="nav-section-label">发货</div>
    <a class="nav-item" id="navShip" href="#" onclick="setTab('ship');return false;">
      <span class="nav-icon">📬</span>
      <span class="nav-label">扫码发货</span>
    </a>
    <div class="nav-section-label">库存</div>
    <a class="nav-item" href="#">
      <span class="nav-icon">📊</span>
      <span class="nav-label">库存入库</span>
    </a>
    <div class="nav-section-label">系统</div>
    <a class="nav-item" href="admin-orders.html">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">管理后台</span>
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="sidebar-user-avatar" id="sidebarAvatar">生</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebarName">加载中…</div>
        <div class="sidebar-user-role" id="sidebarRole">生产端</div>
      </div>
    </div>
  </div>
</aside>

<div class="main" id="main">
  <header class="topbar">
    <span class="topbar-title" id="topbarTitle">扫码查询</span>
  </header>

<div class="content">

  <div class="scan-box">
    <span class="scan-label">扫描或输入条码</span>
    <div class="scan-input-row">
      <input class="scan-input" id="scanInput" type="text"
        placeholder="订单码 / 材料包码 / 快递单号"
        autocomplete="off"
        onkeydown="if(event.key==='Enter') doScan()">
      <button class="scan-btn" onclick="doScan()">查询</button>
    </div>
    <div class="scan-hint">
      订单码（ORD...）· 材料包码（MOWO-SKU-...）· 快递单号（SF... 等）
    </div>
  </div>

  <div class="result-area" id="resultArea"></div>

  <div class="empty-hint" id="emptyHint">
    <div class="empty-icon">🔍</div>
    <div class="empty-text">扫描条码或输入编号后显示结果</div>
  </div>

</div>

<!-- 发货模式面板 -->
<div class="ship-panel" id="shipPanel">

  <!-- 等候区 -->
  <div class="pending-bar" id="pendingBar" style="display:none;">
    <div class="pending-bar-head" onclick="togglePendingList()">
      <div class="pending-bar-title">
        <span class="pending-dot"></span>
        等候区
        <span class="pending-count-badge" id="pendingCount">0</span>
      </div>
      <span style="font-weight:700;font-size:12px;color:var(--gray3);" id="pendingToggleIcon">▾ 展开</span>
    </div>
    <div class="pending-list" id="pendingList" style="display:none;"></div>
  </div>

  <!-- 当前快递单工作区 -->
  <div id="shipWorkArea">
    <div class="scan-box">
      <span class="scan-label">第一步：扫快递面单</span>
      <div class="scan-input-row">
        <input class="scan-input" id="shipTrackingInput" type="text"
          placeholder="扫描或输入快递单号"
          autocomplete="off"
          onkeydown="if(event.key==='Enter') scanTracking()">
        <button class="scan-btn" onclick="scanTracking()">确认</button>
      </div>
    </div>
    <div id="shipTrackingResult"></div>
  </div>

  <!-- 已完成区 -->
  <div class="done-section" id="doneSection" style="display:none;">
    <div class="done-section-title">✅ 本次已发货</div>
    <div id="doneList"></div>
  </div>

</div>

<!-- Modal：跳过当前未完成订单 -->
<div class="modal-overlay" id="skipModal">
  <div class="modal">
    <div class="modal-title">⚠️ 当前订单未完成</div>
    <div class="modal-sub" id="skipModalSub">还有订单未扫码确认，是否先放入等候区？</div>
    <div class="modal-warn">放入等候区后，等候区会有红点提示，随时可以继续处理。</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeSkipModal()">继续当前订单</button>
      <button class="btn btn-yellow" onclick="confirmSkip()">放入等候区</button>
    </div>
  </div>
</div>

<!-- Modal：等候区订单弹出，要求确认快递单 -->
<div class="modal-overlay" id="interceptModal">
  <div class="modal">
    <div class="modal-title">📦 这是等候区的件</div>
    <div class="modal-sub" id="interceptModalSub">请扫该订单的快递面单确认归属</div>
    <div class="scan-input-row" style="margin-bottom:8px;">
      <input class="scan-input" id="interceptTrackingInput" type="text"
        placeholder="扫描快递单号确认"
        autocomplete="off"
        onkeydown="if(event.key==='Enter') confirmIntercept()">
      <button class="scan-btn" onclick="confirmIntercept()">确认</button>
    </div>
    <div id="interceptResult" style="margin-bottom:12px;font-weight:700;font-size:12px;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeInterceptModal()">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

</div><!-- /main -->

<script>
const API = (location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001')
let _token = ''

window.addEventListener('DOMContentLoaded', () => {
  _token = localStorage.getItem('mowo_token') || ''
  if (!_token) { location.href = 'index.html'; return }
  try {
    const p = JSON.parse(atob(_token.split('.')[1]))
    if ((p.role ?? 0) < 1) { alert('权限不足'); location.href = 'index.html'; return }
    const roleMap = {0:'用户',1:'生产端',2:'管理员',3:'超级管理员'}
    document.getElementById('sidebarName').textContent   = p.phone || '生产端'
    document.getElementById('sidebarRole').textContent   = roleMap[p.role] || '生产端'
    document.getElementById('sidebarAvatar').textContent = (p.phone || '生')[0]
  } catch(e) { location.href = 'index.html'; return }
  document.getElementById('scanInput').focus()

  // 侧边栏折叠
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    const sb   = document.getElementById('sidebar')
    const main = document.getElementById('main')
    const btn  = document.getElementById('sidebarToggle')
    sb.classList.toggle('collapsed')
    main.classList.toggle('expanded')
    btn.textContent = sb.classList.contains('collapsed') ? '▶' : '◀'
  })
})

function setTab(tab) {
  _currentTab = tab
  document.getElementById('navQuery').className = tab === 'query' ? 'nav-item active' : 'nav-item'
  document.getElementById('navShip').className  = tab === 'ship'  ? 'nav-item active' : 'nav-item'
  document.getElementById('topbarTitle').textContent = tab === 'query' ? '扫码查询' : '扫码发货'

  // 切换面板
  const queryEls = ['scanInput', 'resultArea', 'emptyHint'].map(id => document.getElementById(id))
  const shipPanel = document.getElementById('shipPanel')

  if (tab === 'query') {
    document.querySelector('.scan-box').style.display = ''
    document.getElementById('emptyHint').style.display = ''
    document.getElementById('resultArea').style.display = ''
    shipPanel.classList.remove('show')
    clearResult()
  } else {
    document.querySelector('.scan-box').style.display = 'none'
    document.getElementById('emptyHint').style.display = 'none'
    document.getElementById('resultArea').style.display = 'none'
    shipPanel.classList.add('show')
    document.getElementById('shipTrackingInput').focus()
  }
}

async function doScan() {
  const raw = document.getElementById('scanInput').value.trim()
  if (!raw) { document.getElementById('scanInput').focus(); return }

  showLoading()

  try {
    let url
    const upper = raw.toUpperCase()
    if (upper.startsWith('MOWO-SKU-')) {
      url = `${API}/api/admin/scan/sku/${encodeURIComponent(raw)}`
    } else if (upper.startsWith('ORD')) {
      url = `${API}/api/admin/scan/order/${encodeURIComponent(raw)}`
    } else {
      url = `${API}/api/admin/scan/tracking/${encodeURIComponent(raw)}`
    }

    const res  = await fetch(url, { headers: { Authorization: `Bearer ${_token}` } })
    const json = await res.json()

    if (!json.success) { showError(json.message); return }
    renderResult(json)
  } catch(e) {
    showError('网络错误，请检查连接')
  }
}

function renderResult(json) {
  document.getElementById('emptyHint').style.display = 'none'
  const area = document.getElementById('resultArea')
  area.classList.add('show')
  if (json.type === 'sku')           area.innerHTML = renderSku(json.data)
  else if (json.type === 'order')    area.innerHTML = renderOrder(json.data)
  else if (json.type === 'tracking') area.innerHTML = renderTracking(json.data)
}

  return 'status-other'
}

function esc(str) {
  if (str === null || str === undefined) return ''
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// ══════════════════════════════
// 发货模式
// ══════════════════════════════
let _currentTracking  = null   // 当前快递单信息 { trackingNo, orders:[], receiverName... }
let _confirmedOrders  = new Set() // 当前快递单已扫码确认的订单号
let _pendingList      = []     // 等候区 [{ trackingNo, receiverName, orders:[], confirmedOrders:Set }]
let _doneList         = []     // 本次已发货 [{ trackingNo, receiverName }]
let _pendingExpanded  = false
let _interceptOrder   = null   // 等候区弹出时，当前被拦截的订单信息

// 第一步：扫快递面单
async function scanTracking() {
  const raw = document.getElementById('shipTrackingInput').value.trim()
  if (!raw) return

  // 如果当前有未完成的快递单，先提示是否放入等候区
  if (_currentTracking && _confirmedOrders.size < _currentTracking.orders.length) {
    const unconfirmedCount = _currentTracking.orders.length - _confirmedOrders.size
    document.getElementById('skipModalSub').textContent =
      `快递单 ${_currentTracking.trackingNo}（${_currentTracking.receiverName}）还有 ${unconfirmedCount} 件未确认，是否先放入等候区？`
    document.getElementById('skipModal').classList.add('show')
    // 暂存新扫入的快递单号，等用户确认后再处理
    _pendingNewTrackingNo = raw
    return
  }

  await loadTracking(raw)
}

async function loadTracking(trackingNo) {
  document.getElementById('shipTrackingInput').value = trackingNo
  document.getElementById('shipTrackingResult').innerHTML = '<div class="loading-card" style="margin-top:8px;">查询中…</div>'

  try {
    const res  = await fetch(`${API}/api/admin/scan/tracking/${encodeURIComponent(trackingNo)}`, {
      headers: { Authorization: `Bearer ${_token}` }
    })
    const json = await res.json()

    if (!json.success) {
      document.getElementById('shipTrackingResult').innerHTML =
        `<div class="error-card"><div class="error-title">未找到快递单</div><div class="error-sub">${esc(json.message)}</div></div>`
      return
    }

    const d = json.data
    // 检查该快递单是否已在等候区
    const pendingIdx = _pendingList.findIndex(p => p.trackingNo === trackingNo)
    if (pendingIdx >= 0) {
      // 从等候区恢复
      _currentTracking  = { ...d }
      _confirmedOrders  = new Set(_pendingList[pendingIdx].confirmedOrders)
      _pendingList.splice(pendingIdx, 1)
      updatePendingBar()
      showToast('从等候区恢复')
    } else {
      _currentTracking = { ...d }
      _confirmedOrders = new Set()
      // 不自动确认，所有订单都需要手动扫码
    }

    renderShipWork()
  } catch(e) {
    document.getElementById('shipTrackingResult').innerHTML =
      '<div class="error-card"><div class="error-title">网络错误</div><div class="error-sub">请检查连接后重试</div></div>'
  }
}

function renderShipWork() {
  if (!_currentTracking) return
  const d = _currentTracking
  const allConfirmed = d.orders.every(o => _confirmedOrders.has(o.orderNo))

  const ordersHtml = d.orders.map(o => {
    const confirmed = _confirmedOrders.has(o.orderNo)
    return `
      <div class="order-confirm-item ${confirmed ? 'confirmed' : 'waiting'}" id="confirm-item-${o.orderNo}">
        <div class="order-confirm-seq">${o.seqNo || '—'}</div>
        <div class="order-confirm-info">
          <div class="order-confirm-sku">${esc(o.skuDesc)}</div>
          <div class="order-confirm-no">${esc(o.orderNo)}</div>
        </div>
        <span class="order-confirm-badge ${confirmed ? 'badge-confirmed' : 'badge-waiting'}">
          ${confirmed ? '✅ 已确认' : '⏳ 待扫码'}
        </span>
      </div>`
  }).join('')

  const actionHtml = allConfirmed
    ? `<button class="btn btn-green" onclick="doShip()" style="width:100%;justify-content:center;height:44px;">🚚 确认发货</button>`
    : `<div style="font-weight:700;font-size:12px;color:var(--gray3);padding:8px 0;">
        已确认 ${_confirmedOrders.size} / ${d.orders.length} 件，扫帧素材包上的订单码继续
       </div>`

  document.getElementById('shipTrackingResult').innerHTML = `
    <div class="current-tracking-card">
      <div class="current-tracking-title">${esc(d.receiverName || '—')}</div>
      <div class="current-tracking-sub">
        ${esc(d.trackingCompany || '')} ${esc(d.trackingNo)} · ${d.totalCount} 单
      </div>
      <div style="font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);margin-bottom:8px;">
        第二步：逐件扫帧素材包订单码
      </div>
      <div class="scan-input-row" style="margin-bottom:10px;">
        <input class="scan-input" id="shipOrderInput" type="text"
          placeholder="扫描帧素材包上的订单码"
          autocomplete="off"
          onkeydown="if(event.key==='Enter') scanOrderCode()">
        <button class="scan-btn" onclick="scanOrderCode()">确认</button>
      </div>
      <div class="order-confirm-list">${ordersHtml}</div>
      ${actionHtml}
    </div>`

  // 自动聚焦到订单码输入框
  setTimeout(() => document.getElementById('shipOrderInput')?.focus(), 100)
}

// 第二步：扫帧素材包订单码
async function scanOrderCode() {
  const raw = document.getElementById('shipOrderInput')?.value.trim()
  if (!raw || !_currentTracking) return

  try {
    const res  = await fetch(`${API}/api/admin/scan/confirm-order`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
      body: JSON.stringify({ orderNo: raw, trackingNo: _currentTracking.trackingNo })
    })
    const json = await res.json()

    if (!json.success) { showToast('❌ ' + json.message); return }

    if (json.matched) {
      // 属于当前快递单 → 标记已确认
      _confirmedOrders.add(raw)
      if (document.getElementById('shipOrderInput'))
        document.getElementById('shipOrderInput').value = ''
      renderShipWork()
      showToast('✅ 已确认')
    } else {
      // 属于等候区的订单 → 触发拦截弹窗
      _interceptOrder = json.data
      document.getElementById('interceptModalSub').innerHTML =
        `这是 <strong>${esc(json.data.receiverName)}</strong> 的件（快递单：${esc(json.data.belongsTo)}）<br>
        请扫该收件人的快递面单确认归属，防止误打包`
      document.getElementById('interceptTrackingInput').value = ''
      document.getElementById('interceptResult').textContent = ''
      document.getElementById('interceptModal').classList.add('show')
      setTimeout(() => document.getElementById('interceptTrackingInput')?.focus(), 100)
    }
  } catch(e) { showToast('网络错误') }
}

// 等候区订单拦截：确认快递单归属
async function confirmIntercept() {
  const trackingNo = document.getElementById('interceptTrackingInput').value.trim()
  if (!trackingNo || !_interceptOrder) return

  if (trackingNo !== _interceptOrder.belongsTo) {
    document.getElementById('interceptResult').innerHTML =
      `<span style="color:#C0320A;font-weight:800;">❌ 面单不匹配！应该扫 ${esc(_interceptOrder.belongsTo)}</span>`
    return
  }

  // 面单匹配，从等候区取出该快递单
  const pendingIdx = _pendingList.findIndex(p => p.trackingNo === trackingNo)
  let pendingEntry
  if (pendingIdx >= 0) {
    pendingEntry = _pendingList[pendingIdx]
  } else {
    // 该快递单不在等候区，重新查询
    try {
      const res  = await fetch(`${API}/api/admin/scan/tracking/${encodeURIComponent(trackingNo)}`, {
        headers: { Authorization: `Bearer ${_token}` }
      })
      const json = await res.json()
      if (!json.success) {
        document.getElementById('interceptResult').innerHTML =
          `<span style="color:#C0320A;font-weight:800;">查询失败：${esc(json.message)}</span>`
        return
      }
      pendingEntry = { trackingNo, receiverName: json.data.receiverName, data: json.data, confirmedOrders: new Set() }
      // 不自动确认，所有订单都需要手动扫码
    } catch(e) {
      document.getElementById('interceptResult').textContent = '网络错误'
      return
    }
  }

  // 标记该件已确认
  pendingEntry.confirmedOrders = pendingEntry.confirmedOrders || new Set()
  pendingEntry.confirmedOrders.add(_interceptOrder.orderNo)

  // 判断是否配齐
  const totalCount = pendingEntry.data?.orders?.length || 0
  const isComplete = pendingEntry.confirmedOrders.size >= totalCount

  closeInterceptModal()

  if (isComplete) {
    // 配齐了，直接发货
    await shipTracking(trackingNo, pendingEntry.confirmedOrders)
    if (pendingIdx >= 0) _pendingList.splice(pendingIdx, 1)
    updatePendingBar()
    showToast(`✅ ${pendingEntry.receiverName} 的订单已配齐并发货`)
  } else {
    // 还没配齐，更新等候区
    if (pendingIdx >= 0) {
      _pendingList[pendingIdx] = pendingEntry
    } else {
      _pendingList.push(pendingEntry)
    }
    updatePendingBar()
    showToast(`已确认1件，${pendingEntry.receiverName} 的订单回到等候区`)
  }

  // 返回当前快递单继续（_currentTracking 在 shipTracking 里不会被清空，这里确保恢复正确）
  if (_currentTracking) {
    renderShipWork()
    setTimeout(() => document.getElementById('shipOrderInput')?.focus(), 200)
  }
}

function closeInterceptModal() {
  document.getElementById('interceptModal').classList.remove('show')
  _interceptOrder = null
}

// 确认发货
async function doShip() {
  if (!_currentTracking) return
  const allConfirmed = _currentTracking.orders.every(o => _confirmedOrders.has(o.orderNo))
  if (!allConfirmed) { showToast('还有订单未确认'); return }

  await shipTracking(_currentTracking.trackingNo, _confirmedOrders)
}

async function shipTracking(trackingNo, confirmedSet) {
  try {
    const res  = await fetch(`${API}/api/admin/scan/ship-tracking`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
      body: JSON.stringify({ trackingNo, confirmedOrderNos: [...confirmedSet] })
    })
    const json = await res.json()

    if (!json.success) { showToast('发货失败：' + json.message); return }

    // 加入已完成区
    const name = _currentTracking?.receiverName || trackingNo
    _doneList.push({ trackingNo, receiverName: name, count: json.shippedCount })
    updateDoneSection()

    showToast(`🚚 发货成功！${json.shippedCount} 单已发货`)

    // 只有当前快递单发货时才重置工作区
    if (trackingNo === _currentTracking?.trackingNo) {
      _currentTracking = null
      _confirmedOrders = new Set()
      document.getElementById('shipTrackingInput').value = ''
      document.getElementById('shipTrackingResult').innerHTML = ''
      document.getElementById('shipTrackingInput').focus()
    }
  } catch(e) { showToast('网络错误') }
}

// 跳过当前快递单放入等候区
let _pendingNewTrackingNo = ''
function confirmSkip() {
  if (_currentTracking) {
    _pendingList.push({
      trackingNo:       _currentTracking.trackingNo,
      receiverName:     _currentTracking.receiverName,
      data:             _currentTracking,
      confirmedOrders:  new Set(_confirmedOrders)
    })
    updatePendingBar()
  }
  closeSkipModal()
  _currentTracking = null
  _confirmedOrders = new Set()
  if (_pendingNewTrackingNo) {
    loadTracking(_pendingNewTrackingNo)
    _pendingNewTrackingNo = ''
  }
}
function closeSkipModal() { document.getElementById('skipModal').classList.remove('show') }

// 等候区UI
function updatePendingBar() {
  const bar = document.getElementById('pendingBar')
  if (!_pendingList.length) { bar.style.display = 'none'; return }
  bar.style.display = ''
  document.getElementById('pendingCount').textContent = _pendingList.length
  document.getElementById('pendingList').innerHTML = _pendingList.map((p, i) => `
    <div class="pending-item">
      <div class="pending-item-info">
        <div class="pending-item-name">${esc(p.receiverName)}</div>
        <div class="pending-item-sub">${esc(p.trackingNo)} · 已确认 ${p.confirmedOrders?.size||0}/${p.data?.orders?.length||'?'} 件</div>
      </div>
      <button class="btn btn-ghost" style="height:30px;padding:0 10px;font-size:11px;"
        onclick="resumePending(${i})">恢复处理</button>
    </div>`).join('')
}

function togglePendingList() {
  _pendingExpanded = !_pendingExpanded
  document.getElementById('pendingList').style.display = _pendingExpanded ? '' : 'none'
  document.getElementById('pendingToggleIcon').textContent = _pendingExpanded ? '▴ 收起' : '▾ 展开'
}

function resumePending(idx) {
  const p = _pendingList[idx]
  if (!p) return
  // 如果当前有未完成订单，先放入等候区
  if (_currentTracking && _confirmedOrders.size < _currentTracking.orders.length) {
    _pendingList.push({
      trackingNo: _currentTracking.trackingNo,
      receiverName: _currentTracking.receiverName,
      data: _currentTracking,
      confirmedOrders: new Set(_confirmedOrders)
    })
  }
  _currentTracking  = p.data
  _confirmedOrders  = new Set(p.confirmedOrders)
  _pendingList.splice(idx, 1)
  updatePendingBar()
  document.getElementById('shipTrackingInput').value = p.trackingNo
  renderShipWork()
  if (_pendingExpanded) togglePendingList()
}

// 已完成区UI
function updateDoneSection() {
  if (!_doneList.length) { document.getElementById('doneSection').style.display = 'none'; return }
  document.getElementById('doneSection').style.display = ''
  document.getElementById('doneList').innerHTML = _doneList.map(d => `
    <div class="done-item">
      <span class="done-item-check">✅</span>
      <div class="done-item-info">
        <div class="done-item-name">${esc(d.receiverName)} · ${d.count} 单已发货</div>
        <div class="done-item-sub">${esc(d.trackingNo)}</div>
      </div>
    </div>`).join('')
}

let _toastTimer
function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  clearTimeout(_toastTimer)
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2800)
}
</script>
</body>
</html>
