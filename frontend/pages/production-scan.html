<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫码作业总览 - 哞屋后台</title><script src="../js/auth.js"></script><link rel="stylesheet" href="../css/production-scan.css"></head>
<body><aside class="sidebar" id="sidebar"></aside><main class="main" id="main">
<header class="topbar"><div><h1>扫码作业总览</h1><div class="topbar-meta">查看四条生产进度，具体扫码请进入对应岗位页面</div></div><button class="btn" onclick="loadOverview()">刷新</button></header>
<div class="content">
<div class="station-links"><a class="station-link" href="production-scan-frame.html">帧包完成<small>打印、裁切、装袋并贴 FP 后登记</small></a><a class="station-link" href="production-scan-material.html">材料领用<small>按生产批次扫描 KB/BX 并预留数量</small></a><a class="station-link" href="production-scan-pairing.html">单件配对<small>选择材料来源后连续扫描 FP</small></a><a class="station-link" href="production-scan-packing.html">装箱发货<small>扫描面单，再逐件扫描 FP</small></a></div>
<div class="cards"><div class="card"><span>帧包完成</span><strong id="frameTotal">0</strong></div><div class="card"><span>材料已领</span><strong id="materialTotal">0</strong></div><div class="card"><span>已经配对</span><strong id="pairedTotal">0</strong></div><div class="card"><span>完成装箱</span><strong id="packedTotal">0</strong></div></div>
<div class="grid"><section class="panel"><h2>活动生产批次</h2><p class="sub">每项数字都来自独立作业记录，不再由配对一次性代填。</p><div id="batches"><div class="empty">正在加载...</div></div></section><section class="panel"><h2>最近扫码记录</h2><p class="sub">记录操作人、时间和生产对象，纠错不能覆盖原记录。</p><div id="recent"><div class="empty">正在加载...</div></div></section></div>
</div></main><div class="toast" id="toast"></div><script src="../js/admin-sidebar.js"></script><script src="../js/production-scan-common.js"></script>
<script>
const S=MowoScan
async function loadOverview(){try{const d=await S.request('/api/admin/production-workflow/scan-overview'),sum=k=>d.batches.reduce((n,b)=>n+b[k],0);frameTotal.textContent=sum('frameCompleted');materialTotal.textContent=sum('materialPicked');pairedTotal.textContent=sum('paired');packedTotal.textContent=sum('packaged');batches.innerHTML=d.batches.length?d.batches.map(b=>`<div class="row"><div><div class="row-title">${S.esc(b.id)}</div><div class="row-meta">共 ${b.total} 件 · 帧包 ${b.frameCompleted} · 领料 ${b.materialPicked} · 配对 ${b.paired} · 装箱 ${b.packaged}${b.exceptions?` · 异常 ${b.exceptions}`:''}</div></div><a class="btn" href="admin-production-batches.html?batchId=${encodeURIComponent(b.id)}">查看</a></div>`).join(''):'<div class="empty">当前没有活动生产批次</div>';recent.innerHTML=d.recent.length?d.recent.map(r=>`<div class="row"><div><div class="row-title">${S.esc(r.action)}</div><div class="row-meta">${S.formatTime(r.createdAt)} · ${S.esc(r.targetId||'')}</div></div></div>`).join(''):'<div class="empty">还没有扫码记录</div>'}catch(e){S.toast(e.message,true)}}
document.addEventListener('DOMContentLoaded',async()=>{if(await S.ensureStaff())loadOverview()})
</script></body></html>
