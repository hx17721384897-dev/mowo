<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/runtime-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审计日志 — 哞屋后台</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --white:#FFFFFF; --cream:#F5F3EF; --black:#111110;
  --gray1:#EBEBEA; --gray2:#C4C3BF; --gray3:#787874;
  --accent-y:#F5E642; --accent-o:#FF6B35; --accent-g:#8FD694; --accent-b:#7EC8E3;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --sidebar-w:220px; --sidebar-collapsed:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}

.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--black);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:width .3s cubic-bezier(0.22,1,0.36,1);overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;}
.sidebar-logo-icon{width:32px;height:32px;background:var(--accent-y);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sidebar-logo-text{font-weight:900;font-size:15px;color:var(--white);}
.sidebar-logo-sub{font-weight:700;font-size:10px;color:var(--gray3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:1px;}
.sidebar-toggle{position:absolute;top:26px;right:12px;width:28px;height:28px;background:rgba(255,255,255,.08);border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray3);font-size:12px;transition:background .2s;}
.sidebar-toggle:hover{background:rgba(255,255,255,.15);color:var(--white);}
.sidebar-nav{flex:1;padding:16px 0;overflow-y:auto;overflow-x:hidden;}
.nav-section-label{font-weight:800;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gray3);padding:12px 20px 6px;white-space:nowrap;transition:opacity .2s;}
.sidebar.collapsed .nav-section-label{opacity:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;color:var(--gray3);font-weight:800;font-size:13px;text-decoration:none;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--white);}
.nav-item.active{background:rgba(245,230,66,.12);color:var(--accent-y);}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-y);border-radius:0 2px 2px 0;}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.nav-label{transition:opacity .2s;}
.sidebar.collapsed .nav-label{opacity:0;}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap;overflow:hidden;}
.sidebar-user{display:flex;align-items:center;gap:10px;}
.sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);flex-shrink:0;}
.sidebar-user-name{font-weight:800;font-size:12px;color:var(--white);}
.sidebar-user-role{font-weight:700;font-size:10px;color:var(--gray3);}
.sidebar.collapsed .sidebar-user-info{display:none;}

.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;transition:margin-left .3s cubic-bezier(0.22,1,0.36,1);display:flex;flex-direction:column;}
.main.expanded{margin-left:var(--sidebar-collapsed);}
.topbar{position:sticky;top:0;z-index:50;background:rgba(245,243,239,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray1);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-weight:900;font-size:18px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.content{padding:28px 32px;flex:1;}

.btn{height:38px;padding:0 16px;border-radius:10px;font-family:var(--font);font-weight:800;font-size:13px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-ghost{background:var(--white);color:var(--black);border:1.5px solid var(--gray1);}
.btn-ghost:hover{border-color:var(--black);}
.btn-sm{height:32px;padding:0 12px;font-size:12px;border-radius:8px;}

/* 筛选栏 */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.filter-select{height:36px;border:1.5px solid var(--gray1);border-radius:8px;padding:0 12px;font-family:var(--font);font-weight:700;font-size:12px;color:var(--black);background:var(--white);outline:none;cursor:pointer;}
.search-input{height:36px;border:1.5px solid var(--gray1);border-radius:8px;padding:0 12px;font-family:var(--font);font-weight:700;font-size:12px;color:var(--black);background:var(--white);outline:none;width:220px;transition:border-color .2s;}
.search-input:focus{border-color:var(--black);}

/* 日志列表 */
.log-list{display:flex;flex-direction:column;gap:0;background:var(--white);border-radius:16px;border:1.5px solid var(--gray1);overflow:hidden;}

.log-item{padding:14px 20px;border-bottom:1px solid var(--gray1);display:grid;grid-template-columns:120px 1fr 80px;gap:12px;align-items:start;transition:background .15s;}
.log-item:last-child{border-bottom:none;}
.log-item:hover{background:var(--cream);}

.log-time{font-weight:700;font-size:11px;color:var(--gray3);line-height:1.5;white-space:nowrap;}
.log-time-date{font-weight:800;font-size:12px;color:var(--black);}

.log-content{}
.log-action{font-weight:800;font-size:13px;color:var(--black);margin-bottom:4px;line-height:1.5;}
.log-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.log-path{font-weight:700;font-size:11px;color:var(--gray3);font-family:monospace;}
.log-ip{font-weight:700;font-size:11px;color:var(--gray3);}

/* 方法标签 */
.method-badge{display:inline-flex;padding:2px 7px;border-radius:5px;font-weight:900;font-size:10px;letter-spacing:.06em;}
.method-GET   {background:#E8F5E9;color:#2E7D32;}
.method-POST  {background:#E3F2FD;color:#1565C0;}
.method-PUT   {background:#FFF8E1;color:#B8860B;}
.method-DELETE{background:#FFE8E3;color:#C0320A;}

/* 角色标签 */
.role-chip{display:inline-flex;padding:2px 7px;border-radius:5px;font-weight:800;font-size:10px;}
.role-chip-0{background:var(--gray1);color:var(--gray3);}
.role-chip-1{background:#E3F2FD;color:#1565C0;}
.role-chip-2{background:#FFF8E1;color:#B8860B;}
.role-chip-3{background:#FCE4EC;color:#C62828;}

/* 详情展开 */
.log-detail{margin-top:8px;display:none;}
.log-detail.show{display:block;}
.log-detail pre{background:var(--cream);border-radius:8px;padding:10px 12px;font-size:11px;font-family:monospace;color:var(--gray3);overflow-x:auto;white-space:pre-wrap;word-break:break-all;}
.log-toggle{font-weight:700;font-size:11px;color:var(--accent-b);cursor:pointer;background:none;border:none;font-family:var(--font);padding:0;}
.log-toggle:hover{text-decoration:underline;}

/* 分页 */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1.5px solid var(--gray1);background:var(--cream);}
.pagination-info{font-weight:700;font-size:12px;color:var(--gray3);}
.pagination-btns{display:flex;gap:6px;}
.page-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--gray1);background:var(--white);cursor:pointer;font-family:var(--font);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.page-btn:hover{border-color:var(--black);}
.page-btn.active{background:var(--black);color:var(--white);border-color:var(--black);}

.empty-state{padding:60px 20px;text-align:center;}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-weight:800;font-size:15px;color:var(--gray3);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .main{margin-left:0 !important;}
  .content{padding:16px;}
  .topbar{padding:0 16px;}
  .log-item{grid-template-columns:1fr;gap:6px;}
}

/* ── 移动端侧边栏开关 ── */
.menu-btn{width:36px;height:36px;border-radius:10px;background:var(--gray1);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-right:4px;}
.menu-btn:hover{background:var(--gray2);}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:190;display:none;}
.sidebar-backdrop.show{display:block;}
@media(max-width:1023px){
  .sidebar{transform:translateX(-100%);z-index:200;}
  .sidebar.open{transform:none;}
  .main{margin-left:0!important;}
  .topbar{padding:0 16px;}
  .menu-btn{display:flex;}
}
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main" id="main">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" onclick="openSidebar()">&#9776;</button>
    <span class="topbar-title">审计日志</span>
    <div class="topbar-right">
      <span style="font-weight:700;font-size:12px;color:var(--gray3);">仅超级管理员可查看</span>
      <button class="btn btn-ghost btn-sm" onclick="loadLogs()">↻ 刷新</button>
    </div>
  </header>

  <div class="content">

    <!-- 筛选栏 -->
    <div class="filter-bar">
      <select class="filter-select" id="methodFilter" onchange="loadLogs(1)">
        <option value="">全部操作</option>
        <option value="POST">POST — 新增</option>
        <option value="PUT">PUT — 修改</option>
        <option value="DELETE">DELETE — 删除</option>
        <option value="GET">GET — 查询</option>
      </select>
      <select class="filter-select" id="outcomeFilter" onchange="loadLogs(1)">
        <option value="">全部结果</option>
        <option value="SUCCESS">成功</option>
        <option value="FAILED">失败</option>
        <option value="DENIED">已拒绝</option>
      </select>
      <input class="search-input" type="text" id="searchInput" placeholder="搜索操作内容…" oninput="onSearch()">
      <span style="font-weight:700;font-size:12px;color:var(--gray3);" id="logCount">—</span>
    </div>

    <!-- 日志列表 -->
    <div id="logWrap">
      <div class="log-list" id="logList">
        <div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">加载中…</div></div>
      </div>
      <div class="pagination" id="pagination" style="display:none;"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.MOWO_API_BASE || '';
const STAFF_LABEL = { OWNER:'负责人', CUSTOMER_SERVICE:'运营客服', PRODUCTION:'生产人员', COLLAB_OPS:'合作运营' };
const OUTCOME_LABEL = { SUCCESS:'成功', FAILED:'失败', DENIED:'已拒绝' };

let _token    = '';
window.addEventListener('mowoTokenRefreshed', () => { _token = localStorage.getItem('mowo_token') || ''; });
let _logs     = [];
let _curPage  = 1;
let _searchTimer = null;

window.addEventListener('DOMContentLoaded', async () => {
  _token = localStorage.getItem('mowo_token') || '';
  if (!_token) { location.href = 'index.html'; return; }
  try {
    const user = await window.fetchCurrentUser();
    if (!user || user.staffRole !== 'OWNER') {
      alert('安全记录仅负责人可查看');
      location.href = 'admin-orders.html';
      return;
    }
    document.getElementById('sidebarRole').textContent = '负责人';
  } catch(e) { location.href = 'index.html'; return; }
  await loadLogs();
});

async function loadLogs(page = 1) {
  _curPage = page;
  const params = new URLSearchParams({ page, limit: 50 });
  const method = document.getElementById('methodFilter').value;
  const outcome = document.getElementById('outcomeFilter').value;
  if (method) params.set('method', method);
  if (outcome) params.set('outcome', outcome);

  try {
    const res  = await fetch(`${API}/api/admin/logs?${params}`, {
      headers: { Authorization: `Bearer ${_token}` }
    });
    const json = await res.json();
    if (!json.success) return;
    _logs = json.data.logs;
    document.getElementById('logCount').textContent = `共 ${json.data.pagination.total} 条记录`;
    renderLogs(_logs);
    renderPagination(json.data.pagination);
  } catch(e) {
    document.getElementById('logList').innerHTML =
      '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">加载失败</div></div>';
  }
}

function renderLogs(logs) {
  const list = document.getElementById('logList');
  if (!logs.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无日志记录</div></div>';
    return;
  }

  list.innerHTML = logs.map((log, idx) => {
    const dt   = new Date(log.createdAt);
    const date = dt.toLocaleDateString('zh-CN', { month:'2-digit', day:'2-digit' });
    const time = dt.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const hasDetail = log.before || log.after;
    const detailHtml = hasDetail ? `
      <div class="log-detail" id="detail-${idx}">
        <pre>${[
          log.before ? `修改前：${escapeHtml(log.before)}` : '',
          log.after  ? `修改后：${escapeHtml(log.after)}`  : ''
        ].filter(Boolean).join('\n')}</pre>
      </div>` : '';
    const actorName = log.actor?.name || (log.userId === 'system' ? '系统' : '未知员工');
    const staffLabel = STAFF_LABEL[log.actor?.staffRole] || '系统';
    const outcomeLabel = OUTCOME_LABEL[log.outcome] || log.outcome || '成功';

    return `
      <div class="log-item">
        <div class="log-time">
          <div class="log-time-date">${date}</div>
          <div>${time}</div>
          ${log.ip ? `<div style="margin-top:2px;font-size:10px;">${escapeHtml(log.ip)}</div>` : ''}
        </div>
        <div class="log-content">
          <div class="log-action">${escapeHtml(log.action || log.path)}</div>
          <div class="log-meta">
            <span class="method-badge method-${log.method}">${log.method}</span>
            <span class="role-chip role-chip-${log.userRole}">${escapeHtml(staffLabel)}</span>
            <span class="log-path">${escapeHtml(log.path)}</span>
            <span class="log-ip">结果：${escapeHtml(outcomeLabel)}${log.statusCode ? ` (${log.statusCode})` : ''}</span>
            ${log.targetId ? `<span class="log-ip">对象：${escapeHtml(log.targetId.slice(0,20))}${log.targetId.length > 20 ? '…' : ''}</span>` : ''}
          </div>
          ${hasDetail ? `<button class="log-toggle" onclick="toggleDetail(${idx})">展开详情 ▾</button>` : ''}
          ${detailHtml}
        </div>
        <div style="font-size:11px;font-weight:700;color:var(--gray3);text-align:right;white-space:nowrap;">
          ${escapeHtml(actorName)}<br>${escapeHtml(log.actor?.maskedPhone || '')}
        </div>
      </div>`;
  }).join('');
}

function toggleDetail(idx) {
  const el  = document.getElementById(`detail-${idx}`);
  const btn = el?.previousElementSibling;
  if (!el) return;
  el.classList.toggle('show');
  if (btn) btn.textContent = el.classList.contains('show') ? '收起详情 ▴' : '展开详情 ▾';
}

function renderPagination(pg) {
  const el = document.getElementById('pagination');
  if (pg.total <= 50) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const pages = Math.ceil(pg.total / pg.limit);
  let btns = '';
  for (let i = 1; i <= Math.min(pages, 10); i++) {
    btns += `<button class="page-btn ${i === _curPage ? 'active' : ''}" onclick="loadLogs(${i})">${i}</button>`;
  }
  el.innerHTML = `
    <span class="pagination-info">共 ${pg.total} 条 / 第 ${_curPage} 页</span>
    <div class="pagination-btns">${btns}</div>`;
}

function onSearch() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) { renderLogs(_logs); return; }
    const filtered = _logs.filter(l =>
      (l.action || '').toLowerCase().includes(q) ||
      (l.path   || '').toLowerCase().includes(q) ||
      (l.targetId || '').toLowerCase().includes(q)
    );
    renderLogs(filtered);
  }, 300);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
}

;

let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
<script>
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
  document.body.style.overflow = '';
}
</script>
<script src="../js/auth.js"></script>
<script src="../js/admin-sidebar.js?v=20260813-shell-init"></script>
</body>
</html>
