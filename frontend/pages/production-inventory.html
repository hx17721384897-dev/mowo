<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>库存管理 — 哞屋生产端</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;--accent-b:#7EC8E3;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --sidebar-w:200px;--sidebar-collapsed:56px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}

/* ── 侧边栏 ── */
.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--black);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:width .3s cubic-bezier(0.22,1,0.36,1);overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;}
.sidebar-logo-icon{width:32px;height:32px;background:var(--accent-g);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sidebar-logo-text{font-weight:900;font-size:14px;color:var(--white);}
.sidebar-logo-sub{font-weight:700;font-size:10px;color:var(--gray3);letter-spacing:.1em;display:block;margin-top:1px;}
.sidebar-toggle{position:absolute;top:22px;right:10px;width:26px;height:26px;background:rgba(255,255,255,.08);border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray3);font-size:11px;transition:background .2s;}
.sidebar-toggle:hover{background:rgba(255,255,255,.15);color:var(--white);}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;overflow-x:hidden;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;color:var(--gray3);font-weight:800;font-size:13px;text-decoration:none;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--white);}
.nav-item.active{background:rgba(143,214,148,.15);color:var(--accent-g);}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-g);border-radius:0 2px 2px 0;}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.nav-label{transition:opacity .2s;}
.sidebar.collapsed .nav-label{opacity:0;}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap;overflow:hidden;}
.sidebar-user{display:flex;align-items:center;gap:10px;}
.sidebar-user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-g);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:var(--black);flex-shrink:0;}
.sidebar-user-name{font-weight:800;font-size:12px;color:var(--white);}
.sidebar-user-role{font-weight:700;font-size:10px;color:var(--gray3);}
.sidebar.collapsed .sidebar-user-info{display:none;}

/* ── 主区域 ── */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;transition:margin-left .3s;display:flex;flex-direction:column;}
.main.expanded{margin-left:var(--sidebar-collapsed);}
.topbar{position:sticky;top:0;z-index:50;background:rgba(245,243,239,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray1);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-weight:900;font-size:17px;}
.content{padding:24px 28px;flex:1;}

/* ── 通用 ── */
.btn{height:36px;padding:0 14px;border-radius:10px;font-family:var(--font);font-weight:800;font-size:13px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn-black{background:var(--black);color:var(--white);}
.btn-black:hover{opacity:.85;}
.btn-yellow{background:var(--accent-y);color:var(--black);}
.btn-yellow:hover{opacity:.85;}
.btn-ghost{background:var(--white);color:var(--black);border:1.5px solid var(--gray1);}
.btn-ghost:hover{border-color:var(--black);}
.btn-green{background:#E6F7E9;color:#1A7A2E;border:1.5px solid #B6E8BF;}
.btn-green:hover{background:#B6E8BF;}
.btn-sm{height:30px;padding:0 12px;font-size:12px;border-radius:8px;}
.btn-xs{height:26px;padding:0 10px;font-size:11px;border-radius:7px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* Tab */
.tabs{display:flex;gap:2px;background:var(--gray1);border-radius:12px;padding:3px;margin-bottom:24px;width:fit-content;}
.tab{padding:7px 20px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s;color:var(--gray3);}
.tab.active{background:var(--white);color:var(--black);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* 卡片 */
.card{background:var(--white);border-radius:16px;padding:20px 24px;border:1px solid var(--gray1);}
.card-title{font-weight:900;font-size:15px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.card + .card{margin-top:16px;}

/* 库存网格 */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.inv-card{background:var(--white);border:1.5px solid var(--gray1);border-radius:14px;padding:18px;transition:border-color .2s;position:relative;overflow:hidden;}
.inv-card:hover{border-color:var(--black);}
.inv-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.inv-card-name{font-weight:900;font-size:14px;line-height:1.3;}
.inv-card-sku{font-size:11px;color:var(--gray3);font-weight:700;font-family:monospace;margin-top:2px;}
.inv-card-alert{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.alert-ok{background:#8FD694;}
.alert-suggest{background:#7EC8E3;}
.alert-warning{background:#F5E642;}
.alert-critical{background:#FF6B35;}

/* 四态数字 */
.inv-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat-item{background:var(--cream);border-radius:10px;padding:10px 12px;}
.stat-num{font-weight:900;font-size:22px;}
.stat-label{font-size:10px;color:var(--gray3);font-weight:700;margin-top:1px;}
.stat-item.avail .stat-num{color:#1A7A2E;}
.stat-item.locked .stat-num{color:#C07800;}
.stat-item.wip-frame .stat-num{color:#0A6090;}
.stat-item.wip-kit .stat-num{color:#6A0AC0;}

/* 进度条 */
.inv-bar{height:6px;border-radius:3px;background:var(--gray1);overflow:hidden;margin-bottom:12px;display:flex;gap:1px;}
.inv-bar-seg{height:100%;border-radius:3px;}

/* 预警条幅 */
.alert-banner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:800;margin-bottom:14px;}
.banner-critical{background:#FFF0E8;color:#C05A00;border:1px solid #FFCFC5;}
.banner-warning{background:#FFFBE6;color:#A07800;border:1px solid #FFE68A;}
.banner-suggest{background:#E6F3FA;color:#0A6090;border:1px solid #B6DFF5;}

/* 表格 */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--gray1);}
table{width:100%;border-collapse:collapse;}
thead th{background:var(--cream);font-weight:800;font-size:11px;letter-spacing:.05em;color:var(--gray3);padding:10px 14px;text-align:left;white-space:nowrap;}
tbody tr{border-top:1px solid var(--gray1);}
tbody tr:hover{background:var(--cream);}
tbody td{padding:10px 14px;font-size:13px;font-weight:700;vertical-align:middle;}
tbody td.mono{font-family:monospace;font-size:12px;}

/* 批次看板 */
.batch-progress{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.batch-sku-card{background:var(--white);border:1.5px solid var(--gray1);border-radius:14px;padding:16px;}
.bsc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.bsc-name{font-weight:900;font-size:13px;}
.bsc-sku{font-size:11px;color:var(--gray3);font-family:monospace;margin-top:2px;}
.progress-rows{display:flex;flex-direction:column;gap:7px;}
.progress-row{display:flex;align-items:center;gap:8px;}
.progress-label{font-size:11px;font-weight:800;color:var(--gray3);width:36px;text-align:right;}
.progress-bar-bg{flex:1;height:8px;background:var(--gray1);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;transition:width .4s;}
.fill-planned{background:var(--gray2);}
.fill-actual{background:var(--accent-g);}
.fill-defect{background:var(--accent-o);}
.progress-val{font-size:11px;font-weight:900;width:28px;text-align:right;}
.remaining-chip{background:var(--cream);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:800;color:var(--gray3);margin-top:10px;text-align:center;}
.remaining-chip.done{background:#E6F7E9;color:#1A7A2E;}
.remaining-chip.overdue{background:#FFE8E3;color:#C0320A;}

/* 入库表单 */
.restock-form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group label{font-weight:800;font-size:12px;color:var(--gray3);}
.form-control{height:38px;border:1.5px solid var(--gray1);border-radius:10px;padding:0 12px;font-family:var(--font);font-size:13px;font-weight:700;background:var(--white);outline:none;transition:border-color .15s;}
.form-control:focus{border-color:var(--black);}
select.form-control{cursor:pointer;}
textarea.form-control{height:72px;padding:10px 12px;resize:none;}

/* 过滤栏 */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.filter-bar .form-control{height:34px;font-size:12px;}
.filter-bar select{width:130px;}
.filter-bar input{width:160px;}

/* 空状态 */
.empty-state{text-align:center;padding:48px 24px;color:var(--gray3);}
.empty-state .icon{font-size:36px;margin-bottom:10px;}
.empty-state p{font-weight:800;font-size:14px;}

/* toast */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--black);color:var(--white);padding:10px 20px;border-radius:10px;font-weight:800;font-size:13px;animation:toastIn .25s ease;pointer-events:none;}
.toast.success{background:#1A7A2E;}
.toast.error{background:#C0320A;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 批次选择器 */
.batch-selector{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.batch-selector label{font-weight:800;font-size:13px;white-space:nowrap;}
.batch-selector select{height:36px;border:1.5px solid var(--gray1);border-radius:10px;padding:0 12px;font-family:var(--font);font-size:13px;font-weight:700;outline:none;cursor:pointer;}

/* 弹窗 */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--white);border-radius:20px;padding:28px;width:460px;max-width:90vw;}
.modal-title{font-weight:900;font-size:17px;margin-bottom:20px;}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:16px;border-top:1px solid var(--gray1);}
</style>
</head>
<body>

<!-- ─── 侧边栏（生产端导航）─── -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">🏭</div>
    <div>
      <div class="sidebar-logo-text">MOWO</div>
      <span class="sidebar-logo-sub">生产端</span>
    </div>
  </div>
  <button class="sidebar-toggle" onclick="toggleSidebar()">◀</button>
  <nav class="sidebar-nav">
    <a class="nav-item" href="production-scan.html"><span class="nav-icon">📷</span><span class="nav-label">扫码作业总览</span></a>
    <a class="nav-item active" href="production-inventory.html"><span class="nav-icon">🗃️</span><span class="nav-label">库存管理</span></a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="sidebar-user-avatar" id="sidebarAvatar">P</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebarName">生产员</div>
        <div class="sidebar-user-role" id="sidebarRole">Production</div>
      </div>
    </div>
  </div>
</nav>

<!-- ─── 主区域 ─── -->
<div class="main" id="main">
  <div class="topbar">
    <div class="topbar-title">库存管理</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="topbarTime" style="font-size:12px;color:var(--gray3);font-weight:700;"></span>
    </div>
  </div>
  <div class="content">

    <!-- Tab 切换 -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('overview')">库存总览</div>
      <div class="tab" onclick="switchTab('restock')">入库操作</div>
      <div class="tab" onclick="switchTab('batch')">批次看板</div>
      <div class="tab" onclick="switchTab('logs')">操作日志</div>
    </div>

    <!-- ══════════════════════════════════
         Tab 1: 库存总览
    ══════════════════════════════════ -->
    <div class="tab-panel active" id="tab-overview">
      <!-- 预警汇总 -->
      <div id="alertSummary"></div>

      <!-- 过滤栏 -->
      <div class="filter-bar">
        <select class="form-control" id="alertFilter" onchange="loadInventory()">
          <option value="">全部预警状态</option>
          <option value="CRITICAL">🔴 紧急不足</option>
          <option value="WARNING">🟡 库存偏低</option>
          <option value="SUGGEST">🔵 建议补货</option>
          <option value="OK">🟢 库存充足</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="loadInventory()">刷新</button>
        <span id="invCount" style="font-size:12px;color:var(--gray3);font-weight:700;margin-left:auto;"></span>
      </div>

      <!-- 库存卡片网格 -->
      <div class="inv-grid" id="invGrid">
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray3);font-weight:700;">加载中…</div>
      </div>
    </div>

    <!-- ══════════════════════════════════
         Tab 2: 入库操作
    ══════════════════════════════════ -->
    <div class="tab-panel" id="tab-restock">
      <div class="card">
        <div class="card-title">录入到货入库</div>
        <div class="restock-form">
          <div class="form-group">
            <label>SKU</label>
            <select class="form-control" id="restockSkuId" onchange="updateRestockPreview()">
              <option value="">— 请选择 —</option>
            </select>
          </div>
          <div class="form-group">
            <label>入库数量</label>
            <input class="form-control" type="number" id="restockQty" min="1" max="9999" value="1" oninput="updateRestockPreview()">
          </div>
          <button class="btn btn-yellow" onclick="doRestock()" id="restockBtn">确认入库</button>
        </div>
        <div style="margin-top:12px;" id="restockPreview" style="display:none;"></div>
        <div class="form-group" style="margin-top:12px;">
          <label>备注（选填）</label>
          <textarea class="form-control" id="restockReason" placeholder="如：2024-01批次到货 50件" style="height:60px;"></textarea>
        </div>
      </div>

      <!-- 近期入库记录 -->
      <div class="card" style="margin-top:16px;">
        <div class="card-title">近期入库记录</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>SKU</th>
                <th>操作</th>
                <th>数量变化</th>
                <th>操作前</th>
                <th>操作后</th>
                <th>备注</th>
                <th>时间</th>
              </tr>
            </thead>
            <tbody id="restockLogTbody">
              <tr><td colspan="7" style="text-align:center;padding:24px;color:var(--gray3);font-weight:700;">加载中…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════
         Tab 3: 批次看板
    ══════════════════════════════════ -->
    <div class="tab-panel" id="tab-batch">
      <div class="batch-selector">
        <label>选择批次：</label>
        <select id="batchSelect" onchange="loadBatchProgress()">
          <option value="">— 请选择 —</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="loadBatchList()">刷新批次</button>
      </div>

      <div id="batchProgressArea">
        <div class="empty-state"><div class="icon">📊</div><p>请选择批次查看生产进度</p></div>
      </div>
    </div>

    <!-- ══════════════════════════════════
         Tab 4: 操作日志
    ══════════════════════════════════ -->
    <div class="tab-panel" id="tab-logs">
      <div class="card">
        <div class="filter-bar">
          <select class="form-control" id="logSkuFilter" onchange="loadLogs(1)">
            <option value="">全部SKU</option>
          </select>
          <select class="form-control" id="logTypeFilter" onchange="loadLogs(1)">
            <option value="">全部类型</option>
            <option value="in">入库</option>
            <option value="reserved">锁定</option>
            <option value="released">解锁</option>
            <option value="wip_frame_start">帧图在制</option>
            <option value="wip_kit_start">材料包在制</option>
            <option value="wip_kit_rollback">材料包回滚</option>
            <option value="wip_deduct">完成核销</option>
            <option value="manual_adjustment">手动盘点</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="loadLogs(1)">刷新</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>SKU</th>
                <th>操作类型</th>
                <th>数量</th>
                <th>操作前可用</th>
                <th>操作后可用</th>
                <th>备注</th>
              </tr>
            </thead>
            <tbody id="logTbody">
              <tr><td colspan="7" style="text-align:center;padding:24px;color:var(--gray3);font-weight:700;">加载中…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="logPagination" style="display:flex;align-items:center;gap:8px;margin-top:16px;justify-content:flex-end;"></div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /main -->

<!-- 弹窗：手动盘点 -->
<div class="modal-backdrop" id="adjustModal">
  <div class="modal">
    <div class="modal-title">手动库存盘点</div>
    <input type="hidden" id="adjustSkuId">
    <div class="form-group" style="margin-bottom:12px;">
      <label>调整数量（正数=增加，负数=减少）</label>
      <input class="form-control" type="number" id="adjustDelta" placeholder="如：-3 或 +10">
    </div>
    <div class="form-group">
      <label>盘点原因（必填）</label>
      <textarea class="form-control" id="adjustReason" placeholder="如：发现报废品3件，手工核减"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('adjustModal').classList.remove('show')">取消</button>
      <button class="btn btn-yellow" onclick="doAdjust()">确认盘点</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="../js/auth.js"></script>
<script>
const API = (location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001')
let token = ''
let skuList = []
let currentTab = 'overview'

document.addEventListener('DOMContentLoaded', async () => {
  token = localStorage.getItem('mowo_token') || ''
  if (!token) { location.href = '../index.html'; return }
  try {
    const me = JSON.parse(localStorage.getItem('mowo_user') || '{}')
    if (!me.role || me.role < 1) { location.href = '../index.html'; return }
    document.getElementById('sidebarName').textContent = me.phone ? `*${me.phone.slice(-4)}` : '生产员'
    document.getElementById('sidebarRole').textContent = me.role >= 2 ? 'Admin' : 'Production'
    document.getElementById('sidebarAvatar').textContent = me.role >= 2 ? 'A' : 'P'
  } catch{}

  setInterval(() => {
    document.getElementById('topbarTime').textContent = new Date().toLocaleString('zh-CN', {hour12:false})
  }, 1000)

  await loadSkuOptions()
  loadInventory()
})

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed')
  document.getElementById('main').classList.toggle('expanded')
}

function switchTab(tab) {
  const ids = ['overview','restock','batch','logs']
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ids[i] === tab))
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'))
  document.getElementById(`tab-${tab}`).classList.add('active')
  currentTab = tab
  if (tab === 'restock')  { populateRestockSelect(); loadRestockLogs() }
  if (tab === 'batch')    loadBatchList()
  if (tab === 'logs')     { populateLogSkuFilter(); loadLogs(1) }
}

// ── 加载SKU选项 ──
async function loadSkuOptions() {
  try {
    const data = await apiGet('/api/inventory?limit=200')
    skuList = data.inventories || data
    return skuList
  } catch{ return [] }
}

function populateRestockSelect() {
  const sel = document.getElementById('restockSkuId')
  sel.innerHTML = '<option value="">— 请选择 —</option>' +
    skuList.map(s => `<option value="${s.skuId}">${escHtml(s.skuName || s.skuId)} (当前:${calcAvail(s)})</option>`).join('')
}

function populateLogSkuFilter() {
  const sel = document.getElementById('logSkuFilter')
  sel.innerHTML = '<option value="">全部SKU</option>' +
    skuList.map(s => `<option value="${s.skuId}">${escHtml(s.skuName || s.skuId)}</option>`).join('')
}

// ── 库存总览 ──
async function loadInventory() {
  const alertFilter = document.getElementById('alertFilter').value
  document.getElementById('invGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray3);font-weight:700;">加载中…</div>'

  try {
    const data = await apiGet('/api/inventory?limit=200')
    let list = data.inventories || data

    // 前端过滤
    if (alertFilter) list = list.filter(i => i.alertLevel === alertFilter)

    document.getElementById('invCount').textContent = `共 ${list.length} 个SKU`
    renderAlertSummary(data.inventories || data)
    renderInvGrid(list)
    skuList = data.inventories || data
  } catch(e) {
    toast(e.message, 'error')
  }
}

function calcAvail(inv) {
  return Math.max(0, (inv.currentStock||0) - (inv.reservedStock||0) - (inv.wipFrameQty||0) - (inv.wipKitQty||0))
}

function renderAlertSummary(list) {
  const counts = { CRITICAL:0, WARNING:0, SUGGEST:0, OK:0 }
  list.forEach(i => { if (counts[i.alertLevel] !== undefined) counts[i.alertLevel]++ })

  const banners = []
  if (counts.CRITICAL) banners.push(`<div class="alert-banner banner-critical">🔴 ${counts.CRITICAL} 个SKU库存紧急不足，请立即补货</div>`)
  if (counts.WARNING)  banners.push(`<div class="alert-banner banner-warning">🟡 ${counts.WARNING} 个SKU库存偏低（7-14天），请核查原材料</div>`)
  if (counts.SUGGEST)  banners.push(`<div class="alert-banner banner-suggest">🔵 ${counts.SUGGEST} 个SKU建议纳入补货计划（15-30天）</div>`)
  document.getElementById('alertSummary').innerHTML = banners.join('')
}

function renderInvGrid(list) {
  const grid = document.getElementById('invGrid')
  if (!list.length) {
    grid.innerHTML = '<div style="grid-column:1/-1"><div class="empty-state"><div class="icon">📦</div><p>暂无库存记录</p></div></div>'
    return
  }

  grid.innerHTML = list.map(inv => {
    const avail   = calcAvail(inv)
    const total   = inv.currentStock || 0
    const locked  = inv.reservedStock || 0
    const frame   = inv.wipFrameQty || 0
    const kit     = inv.wipKitQty || 0
    const alertDot = { OK:'alert-ok', SUGGEST:'alert-suggest', WARNING:'alert-warning', CRITICAL:'alert-critical' }[inv.alertLevel] || 'alert-ok'

    // 进度条各段宽度
    const pct = total > 0 ? (v) => `${Math.round(v/total*100)}%` : () => '0%'

    return `
    <div class="inv-card">
      <div class="inv-card-header">
        <div>
          <div class="inv-card-name">${escHtml(inv.skuName || inv.skuId)}</div>
          <div class="inv-card-sku">${inv.skuCode || ''}</div>
        </div>
        <div class="inv-card-alert ${alertDot}" title="预警：${inv.alertLevel}"></div>
      </div>

      <div class="inv-stats">
        <div class="stat-item avail"><div class="stat-num">${avail}</div><div class="stat-label">可用</div></div>
        <div class="stat-item locked"><div class="stat-num">${locked}</div><div class="stat-label">已锁定</div></div>
        <div class="stat-item wip-frame"><div class="stat-num">${frame}</div><div class="stat-label">帧图在制</div></div>
        <div class="stat-item wip-kit"><div class="stat-num">${kit}</div><div class="stat-label">材料包在制</div></div>
      </div>

      <div style="font-size:11px;color:var(--gray3);font-weight:700;margin-bottom:6px;">总库存：${total}</div>
      <div class="inv-bar">
        <div class="inv-bar-seg" style="width:${pct(avail)};background:#8FD694;"></div>
        <div class="inv-bar-seg" style="width:${pct(locked)};background:#F5E642;"></div>
        <div class="inv-bar-seg" style="width:${pct(frame)};background:#7EC8E3;"></div>
        <div class="inv-bar-seg" style="width:${pct(kit)};background:#C4A0E8;"></div>
      </div>
      <div style="display:flex;gap:12px;font-size:10px;font-weight:700;color:var(--gray3);">
        <span style="color:#8FD694;">■ 可用</span>
        <span style="color:#F5E642;">■ 锁定</span>
        <span style="color:#7EC8E3;">■ 帧制</span>
        <span style="color:#C4A0E8;">■ 料制</span>
      </div>

      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-ghost btn-xs" onclick="openAdjust('${inv.skuId}')">盘点调整</button>
      </div>
    </div>`
  }).join('')
}

// ── 入库 ──
function updateRestockPreview() {
  const skuId = document.getElementById('restockSkuId').value
  const qty   = parseInt(document.getElementById('restockQty').value) || 0
  const prev  = document.getElementById('restockPreview')
  if (!skuId || qty <= 0) { prev.style.display = 'none'; return }
  const inv = skuList.find(s => s.skuId === skuId)
  if (!inv) return
  const before = inv.currentStock || 0
  const after  = before + qty
  prev.style.display = 'block'
  prev.innerHTML = `<div style="background:var(--cream);border-radius:10px;padding:12px 14px;font-size:12px;font-weight:700;color:var(--gray3);">
    总库存：<b style="color:var(--black)">${before}</b> → <b style="color:#1A7A2E">${after}</b>（+${qty}）
  </div>`
}

async function doRestock() {
  const skuId  = document.getElementById('restockSkuId').value
  const qty    = parseInt(document.getElementById('restockQty').value)
  const reason = document.getElementById('restockReason').value.trim()
  if (!skuId) { toast('请选择SKU', 'error'); return }
  if (!qty || qty < 1) { toast('请填写有效数量', 'error'); return }

  const btn = document.getElementById('restockBtn')
  btn.disabled = true
  try {
    await apiPost(`/api/inventory/${skuId}/restock`, { qty, reason: reason || undefined })
    toast(`入库成功：+${qty}`, 'success')
    document.getElementById('restockQty').value = 1
    document.getElementById('restockReason').value = ''
    document.getElementById('restockPreview').style.display = 'none'
    await loadSkuOptions()
    populateRestockSelect()
    loadRestockLogs()
  } catch(e) { toast(e.message, 'error') }
  finally { btn.disabled = false }
}

async function loadRestockLogs() {
  try {
    const data = await apiGet('/api/inventory/logs?limit=30&type=in,manual_adjustment')
    renderLogTable('restockLogTbody', data.logs || data, false)
  } catch(e) { console.warn(e) }
}

// ── 手动盘点 ──
function openAdjust(skuId) {
  document.getElementById('adjustSkuId').value = skuId
  document.getElementById('adjustDelta').value = ''
  document.getElementById('adjustReason').value = ''
  document.getElementById('adjustModal').classList.add('show')
}

async function doAdjust() {
  const skuId  = document.getElementById('adjustSkuId').value
  const delta  = parseInt(document.getElementById('adjustDelta').value)
  const reason = document.getElementById('adjustReason').value.trim()
  if (!delta || delta === 0) { toast('请填写调整数量', 'error'); return }
  if (!reason) { toast('盘点原因为必填', 'error'); return }

  try {
    await apiPost(`/api/inventory/${skuId}/adjust`, { delta, reason })
    toast('盘点调整已保存', 'success')
    document.getElementById('adjustModal').classList.remove('show')
    loadInventory()
  } catch(e) { toast(e.message, 'error') }
}

// ── 批次看板 ──
async function loadBatchList() {
  try {
    const data = await apiGet('/api/admin/batches?limit=30')
    const batches = data.batches || data
    const sel = document.getElementById('batchSelect')
    sel.innerHTML = '<option value="">— 请选择 —</option>' +
      batches.map(b => `<option value="${b.id}">${b.id} (${b.status})</option>`).join('')
  } catch(e) { toast(e.message, 'error') }
}

async function loadBatchProgress() {
  const batchId = document.getElementById('batchSelect').value
  const area = document.getElementById('batchProgressArea')
  if (!batchId) { area.innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>请选择批次查看生产进度</p></div>'; return }
  area.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray3);font-weight:700;">加载中…</div>'

  try {
    const data = await apiGet(`/api/admin/batches/${batchId}/progress`)
    renderBatchProgress(data, batchId)
  } catch(e) {
    area.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${e.message}</p></div>`
  }
}

function renderBatchProgress(items, batchId) {
  const area = document.getElementById('batchProgressArea')
  if (!items.length) {
    area.innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>该批次暂无SKU数据</p></div>'
    return
  }

  // 汇总
  const totalPlanned = items.reduce((s,i) => s+i.plannedQty, 0)
  const totalActual  = items.reduce((s,i) => s+i.actualQty, 0)
  const totalDefect  = items.reduce((s,i) => s+i.defectQty, 0)

  let html = `
  <div class="card" style="margin-bottom:16px;">
    <div class="card-title">批次 ${batchId} 总进度</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
      <div style="background:var(--cream);border-radius:10px;padding:14px;text-align:center;">
        <div style="font-weight:900;font-size:26px;">${totalPlanned}</div>
        <div style="font-size:11px;color:var(--gray3);font-weight:700;margin-top:2px;">计划总量</div>
      </div>
      <div style="background:#E6F7E9;border-radius:10px;padding:14px;text-align:center;">
        <div style="font-weight:900;font-size:26px;color:#1A7A2E;">${totalActual}</div>
        <div style="font-size:11px;color:var(--gray3);font-weight:700;margin-top:2px;">实产</div>
      </div>
      <div style="background:#FFF0E8;border-radius:10px;padding:14px;text-align:center;">
        <div style="font-weight:900;font-size:26px;color:#C05A00;">${totalDefect}</div>
        <div style="font-size:11px;color:var(--gray3);font-weight:700;margin-top:2px;">报废</div>
      </div>
      <div style="background:var(--cream);border-radius:10px;padding:14px;text-align:center;">
        <div style="font-weight:900;font-size:26px;">${Math.max(0,totalPlanned-totalActual-totalDefect)}</div>
        <div style="font-size:11px;color:var(--gray3);font-weight:700;margin-top:2px;">剩余</div>
      </div>
    </div>
  </div>
  <div class="batch-progress">`

  for (const item of items) {
    const remaining = Math.max(0, item.plannedQty - item.actualQty - item.defectQty)
    const maxBar    = item.plannedQty || 1
    const pctA = Math.min(100, Math.round(item.actualQty/maxBar*100))
    const pctD = Math.min(100, Math.round(item.defectQty/maxBar*100))
    const chipClass = remaining === 0 ? 'done' : (item.defectQty > 0 && remaining > 0 ? 'overdue' : '')
    const chipText  = remaining === 0 ? '✓ 完成' : `剩余 ${remaining} 件`

    html += `
    <div class="batch-sku-card">
      <div class="bsc-top">
        <div>
          <div class="bsc-name">${escHtml(item.skuName || item.skuId)}</div>
          <div class="bsc-sku">${item.skuCode || ''}</div>
        </div>
        <span style="font-weight:900;font-size:13px;color:var(--gray3);">${item.plannedQty}</span>
      </div>
      <div class="progress-rows">
        <div class="progress-row">
          <span class="progress-label">计划</span>
          <div class="progress-bar-bg"><div class="progress-fill fill-planned" style="width:100%"></div></div>
          <span class="progress-val">${item.plannedQty}</span>
        </div>
        <div class="progress-row">
          <span class="progress-label">实产</span>
          <div class="progress-bar-bg"><div class="progress-fill fill-actual" style="width:${pctA}%"></div></div>
          <span class="progress-val" style="color:#1A7A2E;">${item.actualQty}</span>
        </div>
        <div class="progress-row">
          <span class="progress-label">报废</span>
          <div class="progress-bar-bg"><div class="progress-fill fill-defect" style="width:${pctD}%"></div></div>
          <span class="progress-val" style="color:#C05A00;">${item.defectQty}</span>
        </div>
      </div>
      <div class="remaining-chip ${chipClass}">${chipText}</div>
    </div>`
  }

  html += '</div>'
  area.innerHTML = html
}

// ── 操作日志 ──
let logPage = 1
async function loadLogs(page=1) {
  logPage = page
  const skuId = document.getElementById('logSkuFilter').value
  const type  = document.getElementById('logTypeFilter').value
  const url   = `/api/inventory/logs?page=${page}&limit=30${skuId?`&skuId=${skuId}`:''}${type?`&type=${type}`:''}`
  try {
    const data = await apiGet(url)
    renderLogTable('logTbody', data.logs || data, true)
    renderPagination('logPagination', page, Math.ceil((data.total||0)/30), loadLogs)
  } catch(e) { toast(e.message,'error') }
}

function renderLogTable(tbodyId, logs, showSku=true) {
  const tb = document.getElementById(tbodyId)
  if (!logs || !logs.length) {
    tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--gray3);font-weight:700;">暂无记录</td></tr>'
    return
  }
  tb.innerHTML = logs.map(l => `
    <tr>
      <td style="white-space:nowrap;font-size:12px;">${fmtDate(l.createdAt)}</td>
      ${showSku ? `<td style="font-size:12px;font-family:monospace;">${escHtml(l.skuId||'')}</td>` : ''}
      <td>${logTypeBadge(l.type)}</td>
      <td style="font-weight:900;">${l.qty > 0 ? '+' : ''}${l.qty}</td>
      <td>${l.beforeQty ?? '-'}</td>
      <td>${l.afterQty ?? '-'}</td>
      <td style="font-size:12px;color:var(--gray3);">${escHtml(l.reason || l.orderId || '-')}</td>
    </tr>
  `).join('')
}

const logTypeMap = {
  in: ['入库','badge-green'], out: ['出库','badge-red'],
  reserved: ['锁定','badge-orange'], released: ['解锁','badge-blue'],
  wip_frame_start: ['帧制开始','badge-blue'], wip_kit_start: ['料制开始','badge-blue'],
  wip_kit_rollback: ['料制回滚','badge-orange'], wip_deduct: ['核销完成','badge-green'],
  wip_defect_frame: ['帧图报废','badge-red'], manual_adjustment: ['手动盘点','badge-gray']
}

function logTypeBadge(type) {
  const [label,cls] = logTypeMap[type] || [type,'badge-gray']
  return `<span class="badge ${cls}" style="font-size:10px;height:20px;">${label}</span>`
}

// ── 分页 ──
function renderPagination(id, current, total, fn) {
  const c = document.getElementById(id)
  if (total <= 1) { c.innerHTML = ''; return }
  let html = `<span style="font-size:12px;color:var(--gray3);font-weight:700;margin-right:4px;">第${current}/${total}页</span>`
  html += `<button style="width:32px;height:32px;border:1.5px solid var(--gray1);border-radius:8px;background:var(--white);font-family:var(--font);font-weight:800;cursor:pointer;" ${current===1?'disabled':''} onclick="${fn.name}(${current-1})">‹</button>`
  for (let i=1;i<=total;i++) {
    if (i===1||i===total||Math.abs(i-current)<=1) {
      html += `<button style="width:32px;height:32px;border:1.5px solid ${i===current?'var(--black)':'var(--gray1)'};border-radius:8px;background:${i===current?'var(--black)':'var(--white)'};color:${i===current?'var(--white)':'var(--black)'};font-family:var(--font);font-weight:800;cursor:pointer;" onclick="${fn.name}(${i})">${i}</button>`
    } else if (Math.abs(i-current)===2) {
      html += `<button style="width:32px;height:32px;border:1.5px solid var(--gray1);border-radius:8px;background:var(--white);font-family:var(--font);font-weight:800;cursor:not-allowed;opacity:.4;" disabled>…</button>`
    }
  }
  html += `<button style="width:32px;height:32px;border:1.5px solid var(--gray1);border-radius:8px;background:var(--white);font-family:var(--font);font-weight:800;cursor:pointer;" ${current===total?'disabled':''} onclick="${fn.name}(${current+1})">›</button>`
  c.innerHTML = html
}

// ── 工具 ──
async function apiGet(path) {
  const res = await fetch(API + path, { headers: { Authorization: `Bearer ${token}` } })
  const json = await res.json()
  if (!json.success) throw new Error(json.message || '请求失败')
  return json.data
}
async function apiPost(path, body) {
  const res = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
    body: JSON.stringify(body)
  })
  const json = await res.json()
  if (!json.success) throw new Error(json.message || '请求失败')
  return json.data
}

function fmtDate(d) {
  if (!d) return '-'
  return new Date(d).toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function toast(msg, type='') {
  const w = document.getElementById('toastWrap')
  const t = document.createElement('div')
  t.className = `toast ${type}`
  t.textContent = msg
  w.appendChild(t)
  setTimeout(() => t.remove(), 2800)
}

// badge 样式（内联）
const badgeStyle = `display:inline-flex;align-items:center;padding:0 8px;border-radius:6px;font-weight:800;`
function badge(cls, text) {
  const colors = { 'badge-green':'background:#E6F7E9;color:#1A7A2E','badge-red':'background:#FFE8E3;color:#C0320A',
    'badge-orange':'background:#FFF0E8;color:#C05A00','badge-blue':'background:#E6F3FA;color:#0A6090',
    'badge-gray':'background:var(--gray1);color:var(--gray3)' }
  return `<span style="${badgeStyle}${colors[cls]||''};font-size:10px;height:20px;">${text}</span>`
}
</script>
