<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创作者主页 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;--accent-b:#7EC8E3;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --nav-h:65px;
  --pad-mob:20px;--pad-desk:48px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--cream);color:var(--black);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}

/* ══ NAV（与主站一致） ══ */
.nav{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad-mob);background:rgba(245,243,239,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.06);height:var(--nav-h);}
@media(min-width:1024px){.nav{padding:0 var(--pad-desk);}}
.nav-logo-cn{font-weight:900;font-size:22px;letter-spacing:-.01em;color:var(--black);}
.nav-logo-en{font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray3);display:block;margin-top:1px;}
.nav-links{display:none;list-style:none;gap:36px;}
@media(min-width:1024px){.nav-links{display:flex;}}
.nav-links a{font-weight:800;font-size:14px;color:var(--gray3);transition:color .2s;position:relative;padding-bottom:3px;}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent-y);transform:scaleX(0);transition:transform .25s var(--ease);}
.nav-links a:hover{color:var(--black);}
.nav-links a.active::after,.nav-links a:hover::after{transform:scaleX(1);}
.nav-right{display:flex;align-items:center;gap:12px;}
.nav-btn{font-weight:800;font-size:13px;padding:10px 22px;border-radius:999px;min-height:44px;display:flex;align-items:center;transition:all .2s;}
.nav-btn.black{background:var(--black);color:var(--white);}
.nav-btn.black:hover{opacity:.8;}
.nav-btn.ghost{border:1.5px solid var(--gray1);color:var(--gray3);}
.nav-btn.ghost:hover{border-color:var(--black);color:var(--black);}
.nav-login,.nav-login-btn{font-weight:800;font-size:13px;padding:10px 22px;background:var(--black);color:var(--white);border-radius:999px;min-height:44px;display:flex;align-items:center;transition:opacity .2s;cursor:pointer;}
.nav-login:hover,.nav-login-btn:hover{opacity:.8;}
.burger{display:flex;flex-direction:column;gap:5px;padding:8px;min-width:44px;min-height:44px;justify-content:center;align-items:center;}
@media(min-width:1024px){.burger{display:none;}}
.burger span{display:block;width:22px;height:2px;background:var(--black);border-radius:2px;transition:transform .3s,opacity .3s;}
.mobile-menu{position:fixed;inset:0;background:var(--black);z-index:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);}
.mobile-menu.open{opacity:1;pointer-events:all;}
.mobile-menu a{font-weight:900;font-size:clamp(28px,8vw,48px);color:var(--white);transition:color .2s;}
.mobile-menu a:hover{color:var(--accent-y);}

/* ══ HERO ══ */
.hero{padding:calc(var(--nav-h) + 32px) var(--pad-mob) 0;max-width:1100px;margin:0 auto;}
@media(min-width:1024px){
  .hero{
    padding:calc(var(--nav-h) + 40px) var(--pad-desk) 0;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:start;
    gap:32px;
  }
}

/* 顶部：头像 + 信息 + 关注 */
.hero-top{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
@media(min-width:640px){.hero-top{flex-wrap:nowrap;}}
@media(min-width:1024px){.hero-top{margin-bottom:0;}}
.hero-avatar-wrap{flex-shrink:0;position:relative;}
.hero-avatar{width:80px;height:80px;border-radius:24px;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid var(--white);box-shadow:0 6px 24px rgba(0,0,0,.1);}
@media(min-width:640px){.hero-avatar{width:96px;height:96px;border-radius:28px;font-size:44px;}}
.cert-badge{position:absolute;bottom:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--accent-y);border:2.5px solid var(--white);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:var(--black);}
.hero-meta{flex:1;min-width:0;}
.hero-name{font-weight:900;font-size:clamp(20px,3vw,28px);letter-spacing:-.02em;margin-bottom:3px;}
.hero-handle{font-weight:700;font-size:13px;color:var(--gray3);margin-bottom:8px;}
.hero-cert-row{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:rgba(143,214,148,.15);border:1px solid rgba(143,214,148,.3);margin-bottom:12px;}
.hero-cert-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-g);}
.hero-cert-text{font-weight:800;font-size:11px;color:#287030;letter-spacing:.04em;}
.hero-bio{font-weight:700;font-size:13px;color:var(--gray3);line-height:1.8;max-width:520px;margin-bottom:12px;}
.hero-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.hero-tag{font-weight:800;font-size:11px;padding:4px 12px;border-radius:999px;background:var(--white);border:1.5px solid var(--gray1);color:var(--gray3);}
.hero-socials{display:flex;gap:8px;flex-wrap:wrap;}
.social-link{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12px;color:var(--gray3);padding:5px 10px;border-radius:999px;border:1.5px solid var(--gray1);background:var(--white);transition:all .2s;}
.social-link:hover{border-color:var(--black);color:var(--black);}
.hero-actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0;padding-top:4px;}
@media(max-width:639px){.hero-actions{flex-direction:row;width:100%;}}
.follow-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:14px;padding:12px 28px;border-radius:999px;min-height:48px;transition:all .25s var(--ease);white-space:nowrap;}
.follow-btn.unfollow{background:var(--black);color:var(--white);border:2px solid var(--black);}
.follow-btn.unfollow:hover{background:transparent;color:var(--black);}
.follow-btn.following{background:var(--white);color:var(--gray3);border:2px solid var(--gray1);}
.follow-btn.following:hover{border-color:var(--black);color:var(--black);}
@media(max-width:639px){.follow-btn{flex:1;}}
.share-btn-hero{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gray1);background:var(--white);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;}
.share-btn-hero:hover{border-color:var(--black);}

/* 数据栏 */
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--gray1);border-radius:20px;overflow:hidden;border:1.5px solid var(--gray1);margin-bottom:0;}
@media(min-width:1024px){
  .hero-stats{
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(2,1fr);
    width:220px;
    flex-shrink:0;
    align-self:start;
  }
}
.stat-cell{background:var(--white);padding:16px 12px;text-align:center;}
.stat-val{font-weight:900;font-size:clamp(18px,2.5vw,24px);letter-spacing:-.02em;margin-bottom:3px;}
.stat-val.yellow{color:#8A7200;}
.stat-label{font-weight:700;font-size:11px;color:var(--gray3);}
@media(max-width:480px){.hero-stats{grid-template-columns:repeat(2,1fr);}}

/* ══ STICKY TABS ══ */
.tabs-wrap{position:sticky;top:var(--nav-h);z-index:500;background:rgba(245,243,239,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--gray1);}
.tabs-inner{max-width:1100px;margin:0 auto;padding:0 var(--pad-mob);display:flex;gap:0;}
@media(min-width:1024px){.tabs-inner{padding:0 var(--pad-desk);}}
.tab-btn{font-weight:800;font-size:14px;padding:16px 24px;color:var(--gray3);position:relative;transition:color .2s;white-space:nowrap;}
.tab-btn::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:2.5px;background:var(--black);border-radius:2px;transform:scaleX(0);transition:transform .3s var(--ease);}
.tab-btn:hover{color:var(--black);}
.tab-btn.active{color:var(--black);}
.tab-btn.active::after{transform:scaleX(1);}
.tab-count{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--gray1);color:var(--gray3);margin-left:6px;transition:background .2s,color .2s;}
.tab-btn.active .tab-count{background:var(--black);color:var(--white);}

/* ══ 内容区 ══ */
.content-wrap{max-width:1100px;margin:0 auto;padding:32px var(--pad-mob) 100px;}
@media(min-width:1024px){.content-wrap{padding:32px var(--pad-desk) 100px;}}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── 作品 Tab ── */
.works-filter{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.works-filter-btn{font-weight:800;font-size:12px;padding:7px 16px;border-radius:999px;border:1.5px solid var(--gray1);background:var(--white);color:var(--gray3);transition:all .2s;cursor:pointer;}
.works-filter-btn:hover{border-color:var(--gray2);color:var(--black);}
.works-filter-btn.active{background:var(--black);border-color:var(--black);color:var(--white);}

.works-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(min-width:640px){.works-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.works-grid{grid-template-columns:repeat(4,1fr);}}

.work-card{background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);overflow:hidden;cursor:pointer;transition:all .3s var(--ease);}
.work-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.09);border-color:var(--gray2);}
.work-card-media{aspect-ratio:1;position:relative;overflow:hidden;}
.work-card-img{width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:32px;}
.work-card-type{position:absolute;top:8px;left:8px;font-weight:900;font-size:9px;letter-spacing:.12em;padding:3px 8px;border-radius:999px;}
.work-card-type.article{background:rgba(17,17,16,.6);color:rgba(255,255,255,.9);backdrop-filter:blur(8px);}
.work-card-type.animation{background:var(--accent-y);color:var(--black);}
.work-card-body{padding:12px 14px;}
.work-card-title{font-weight:900;font-size:13px;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.work-card-meta{display:flex;align-items:center;justify-content:space-between;}
.work-card-date{font-weight:700;font-size:11px;color:var(--gray3);}
.work-card-likes{font-weight:800;font-size:11px;color:var(--gray3);display:flex;align-items:center;gap:3px;}

/* 动画机卡片（作品Tab里的） */
.anim-card{background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);overflow:hidden;cursor:pointer;transition:all .3s var(--ease);}
.anim-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.09);border-color:var(--gray2);}
.anim-preview{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
@keyframes spin{to{transform:rotate(360deg);}}
.anim-ring{border-radius:50%;border:4px solid;border-top-color:transparent;animation:spin 2s steps(12) infinite;}
.anim-body{padding:12px 14px;}
.anim-name{font-weight:900;font-size:13px;margin-bottom:3px;}
.anim-spec{font-weight:700;font-size:11px;color:var(--gray3);}

/* ── 在售商品 Tab ── */
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:40px;}
@media(min-width:640px){.products-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.products-grid{grid-template-columns:repeat(4,1fr);}}

.product-card{background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);overflow:hidden;cursor:pointer;transition:all .3s var(--ease);}
.product-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.09);border-color:var(--gray2);}
.product-card-media{aspect-ratio:1;position:relative;overflow:hidden;}
.product-badge{position:absolute;top:8px;right:8px;font-weight:900;font-size:10px;padding:3px 10px;border-radius:999px;}
.product-badge.sale{background:var(--accent-y);color:var(--black);}
.product-badge.bundle{background:rgba(127,200,227,.9);color:#0A3A6B;}
.product-badge.blindbox{background:rgba(255,107,53,.9);color:var(--white);}
.product-card-body{padding:12px 14px;}
.product-card-name{font-weight:900;font-size:13px;margin-bottom:6px;}
.product-card-bottom{display:flex;align-items:center;justify-content:space-between;}
.product-price{font-weight:900;font-size:16px;color:var(--black);}
.product-sold{font-weight:700;font-size:11px;color:var(--gray3);}
.product-card-add{width:32px;height:32px;border-radius:50%;background:var(--black);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .2s;flex-shrink:0;}
.product-card:hover .product-card-add{transform:scale(1.1);}

/* ── 买家评价区 ── */
.reviews-section{margin-top:8px;}
.reviews-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.reviews-title{font-weight:900;font-size:20px;letter-spacing:-.01em;}
.reviews-summary{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.rating-big{font-weight:900;font-size:48px;letter-spacing:-.04em;color:var(--black);line-height:1;}
.rating-stars{display:flex;gap:3px;margin-bottom:4px;}
.star{font-size:16px;}
.rating-count{font-weight:700;font-size:12px;color:var(--gray3);}
.rating-bars{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px;}
.rbar-row{display:flex;align-items:center;gap:8px;}
.rbar-label{font-weight:800;font-size:11px;color:var(--gray3);width:16px;text-align:right;flex-shrink:0;}
.rbar-track{flex:1;height:6px;background:var(--gray1);border-radius:3px;overflow:hidden;}
.rbar-fill{height:100%;background:var(--accent-y);border-radius:3px;transition:width .6s var(--ease);}
.rbar-pct{font-weight:700;font-size:11px;color:var(--gray3);width:32px;flex-shrink:0;}

.review-list{display:flex;flex-direction:column;gap:0;margin-top:24px;}
.review-item{padding:20px 0;border-bottom:1px solid var(--gray1);}
.review-item:last-child{border-bottom:none;}
.review-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.review-av{width:36px;height:36px;border-radius:50%;background:var(--gray1);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.review-user{font-weight:800;font-size:13px;color:var(--black);}
.review-date{font-weight:700;font-size:11px;color:var(--gray3);margin-left:auto;}
.review-stars{display:flex;gap:2px;margin-bottom:6px;}
.review-stars .star{font-size:12px;}
.review-product{font-weight:800;font-size:11px;color:var(--gray3);margin-bottom:8px;}
.review-product span{color:var(--black);}
.review-text{font-weight:700;font-size:14px;color:var(--gray3);line-height:1.8;}
.review-imgs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.review-img{width:72px;height:72px;border-radius:10px;background:var(--gray1);border:1.5px solid var(--gray1);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:opacity .2s;}
.review-img:hover{opacity:.8;}

/* 分页 */
.load-more-btn{display:block;width:100%;padding:14px;border-radius:16px;border:1.5px solid var(--gray1);background:var(--white);font-family:var(--font);font-weight:800;font-size:13px;color:var(--gray3);text-align:center;cursor:pointer;transition:all .2s;margin-top:24px;}
.load-more-btn:hover{border-color:var(--black);color:var(--black);}

/* ── 空状态 ── */
.empty-state{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center;gap:12px;}
.empty-icon{font-size:48px;opacity:.2;}
.empty-title{font-weight:900;font-size:17px;}
.empty-desc{font-weight:700;font-size:13px;color:var(--gray3);}

/* ── footer ── */
footer{background:var(--black);color:rgba(255,255,255,.4);padding:48px var(--pad-mob) 36px;}
@media(min-width:1024px){footer{padding:48px var(--pad-desk) 36px;}}
.foot-row{display:flex;flex-direction:column;gap:16px;}
@media(min-width:640px){.foot-row{flex-direction:row;align-items:center;justify-content:space-between;}}
.foot-logo{font-weight:900;font-size:20px;color:var(--white);}
.foot-links{display:flex;gap:24px;flex-wrap:wrap;}
.foot-links a{font-weight:700;font-size:13px;color:rgba(255,255,255,.35);transition:color .2s;}
.foot-links a:hover{color:var(--white);}
.foot-copy{font-weight:700;font-size:12px;color:rgba(255,255,255,.18);margin-top:24px;}

/* toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:9000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* reveal */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease),transform .55s var(--ease);}
.reveal.on{opacity:1;transform:none;}
.d1{transition-delay:.06s}.d2{transition-delay:.12s}.d3{transition-delay:.18s}.d4{transition-delay:.24s}
</style>
</head>
<body>

<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">关于我们</a>
  <a href="products.html">产品介绍</a>
  <a href="showcase.html" class="active">画师联名</a>
  <a href="customize-start.html">创作中心</a>
  <a href="contact.html">联络我们</a>
</div>

<!-- ══ NAV ══ -->
<nav class="nav">
  <a href="index.html" style="line-height:1.2;">
    <span class="nav-logo-cn">哞屋</span>
    <span class="nav-logo-en">MOWO</span>
  </a>
  <ul class="nav-links">
    <li><a href="about.html">关于我们</a></li>
    <li><a href="products.html">产品介绍</a></li>
    <li><a href="showcase.html" class="active">画师联名</a></li>
    <li><a href="customize-start.html">创作中心</a></li>
    <li><a href="contact.html">联络我们</a></li>
  </ul>
  <div class="nav-right">
    <button class="nav-login nav-login-btn" id="navLoginBtn">登录</button>
    <div class="burger" id="burger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<!-- ══ HERO ══ -->
<div class="hero">

  <!-- 左侧：头像 + 信息 + 按钮 -->
  <div class="hero-top reveal">
    <div class="hero-avatar-wrap">
      <div class="hero-avatar" id="heroAvatar">🐱</div>
      <div class="cert-badge" title="认证创作者">✦</div>
    </div>
    <div class="hero-meta">
      <h1 class="hero-name" id="heroName">小橘工作室</h1>
      <p class="hero-handle" id="heroHandle">@xiao_ju_studio</p>
      <div class="hero-cert-row">
        <div class="hero-cert-dot"></div>
        <span class="hero-cert-text">认证创作者 · 哞屋平台</span>
      </div>
      <p class="hero-bio" id="heroBio">热爱手绘动画的独立创作者，专注于日常生活中可爱的瞬间。每一帧都认真画，希望你看了也会微笑。</p>
      <div class="hero-tags" id="heroTags"></div>
      <div class="hero-socials" id="heroSocials"></div>
    </div>
    <div class="hero-actions">
      <button class="follow-btn unfollow" id="followBtn" onclick="toggleFollow()">
        <span id="followBtnText">+ 关注</span>
      </button>
      <button class="share-btn-hero" onclick="shareProfile()" title="分享主页">🔗</button>
    </div>
  </div>

  <!-- 右侧（桌面）/ 底部（移动）：数据栏 -->
  <div class="hero-stats reveal d1" id="heroStats">
    <div class="stat-cell">
      <p class="stat-val" id="statWorks">—</p>
      <p class="stat-label">作品</p>
    </div>
    <div class="stat-cell">
      <p class="stat-val" id="statFollowers">—</p>
      <p class="stat-label">粉丝</p>
    </div>
    <div class="stat-cell">
      <p class="stat-val" id="statSales">—</p>
      <p class="stat-label">累计销量</p>
    </div>
    <div class="stat-cell">
      <p class="stat-val yellow" id="statLikes">—</p>
      <p class="stat-label">获赞数</p>
    </div>
  </div>

</div>

<!-- ══ STICKY TABS ══ -->
<div class="tabs-wrap" style="margin-top:24px;">
  <div class="tabs-inner">
    <button class="tab-btn active" onclick="switchTab(0,this)">
      作品 <span class="tab-count" id="tabCount0">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab(1,this)">
      在售商品 <span class="tab-count" id="tabCount1">0</span>
    </button>
  </div>
</div>

<!-- ══ 内容区 ══ -->
<div class="content-wrap">

  <!-- ── Tab 0：作品 ── -->
  <div class="tab-panel active" id="tabPanel0">
    <div class="works-filter" id="worksFilter">
      <button class="works-filter-btn active" onclick="filterWorks('all',this)">全部</button>
      <button class="works-filter-btn" onclick="filterWorks('animation',this)">动画机</button>
      <button class="works-filter-btn" onclick="filterWorks('article',this)">文章</button>
    </div>
    <div class="works-grid" id="worksGrid"></div>
  </div>

  <!-- ── Tab 1：在售商品 ── -->
  <div class="tab-panel" id="tabPanel1">
    <div class="products-grid" id="productsGrid"></div>

    <!-- 买家评价 -->
    <div class="reviews-section reveal">
      <div class="reviews-header">
        <h2 class="reviews-title">买家评价</h2>
      </div>

      <!-- 评分总览 -->
      <div style="display:flex;align-items:flex-start;gap:32px;padding:24px;background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);margin-bottom:0;flex-wrap:wrap;">
        <div style="text-align:center;flex-shrink:0;">
          <p class="rating-big" id="ratingBig">—</p>
          <div class="rating-stars" id="ratingStars"></div>
          <p class="rating-count" id="ratingCount">— 条评价</p>
        </div>
        <div class="rating-bars" id="ratingBars"></div>
      </div>

      <!-- 评价列表 -->
      <div class="review-list" id="reviewList"></div>
      <button class="load-more-btn" onclick="showToast('更多评价加载中…')">加载更多评价</button>

  </div>

</div>

<footer>
  <div class="foot-row">
    <span class="foot-logo">哞屋 MOWO</span>
    <div class="foot-links">
      <a href="about.html">关于我们</a>
      <a href="products.html">产品介绍</a>
      <a href="showcase.html">画师联名</a>
      <a href="customize-start.html">创作中心</a>
      <a href="contact.html">联络我们</a>
    </div>
  </div>
  <p class="foot-copy">© 2025 哞屋 MOWO. All rights reserved.</p>
</footer>

<div class="toast" id="toast"></div>

<script>
const MOWO_API = (location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001');

/* ══════════════════════════════
   工具函数
══════════════════════════════ */
function fmtNum(n) {
  if (!n && n !== 0) return '0';
  return n >= 10000 ? (n/10000).toFixed(1).replace(/\.0$/,'') + '万' :
         n >= 1000  ? (n/1000).toFixed(1).replace(/\.0$/,'') + 'k' : String(n);
}

const MACHINE_NAMES = { cylinder:'圆筒款', lantern:'灯笼款', hexagon:'六棱柱款', 'flat-round':'扁圆款', mini:'迷你款' };

/* ══════════════════════════════
   运行时状态
══════════════════════════════ */
let creatorId   = null;
let isFollowing = false;
let worksFilter = 'all';
let currentTab  = 0;
let _articlesData  = [];
let _productsData  = [];

/* ══════════════════════════════
   初始化：从API加载数据
══════════════════════════════ */
(async function init() {
  const params = new URLSearchParams(location.search);
  creatorId = params.get('id');

  if (!creatorId) {
    showError('创作者不存在');
    return;
  }

  try {
    // 同时加载用户信息、文章列表、商品列表
    const [userRes, articlesRes, productsRes] = await Promise.all([
      fetch(`${MOWO_API}/api/users/${creatorId}`),
      fetch(`${MOWO_API}/api/users/${creatorId}/articles`),
      fetch(`${MOWO_API}/api/products?creatorId=${creatorId}`)
    ]);

    const [userData, articlesData, productsData] = await Promise.all([
      userRes.json(), articlesRes.json(), productsRes.json()
    ]);

    if (!userData.success) { showError('创作者不存在'); return; }

    const user = userData.data;
    _articlesData = articlesData.success ? articlesData.data.articles : [];
    _productsData = productsData.success ? productsData.data.products : [];

    renderHero(user);
    renderWorks();
    renderProducts();

    // 检查当前登录用户是否已关注
    checkFollowStatus();

  } catch(e) {
    showError('加载失败，请刷新重试');
    console.error(e);
  }
})();

function showError(msg) {
  document.getElementById('heroName').textContent = msg;
}

/* ══════════════════════════════
   渲染 Hero
══════════════════════════════ */
function renderHero(user) {
  const profile  = user.profile || {};
  const creator  = user.creatorProfile || {};

  document.title = `${profile.nickname || '创作者'} — 哞屋 MOWO`;

  // 头像
  const avEl = document.getElementById('heroAvatar');
  if (profile.avatarUrl) {
    avEl.innerHTML = `<img src="${profile.avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:28px;">`;
  } else {
    avEl.textContent = (profile.nickname || '创')[0];
  }

  // 基本信息
  document.getElementById('heroName').textContent   = profile.nickname || '未知创作者';
  document.getElementById('heroHandle').textContent = `@${profile.nickname || ''}`;
  document.getElementById('heroBio').textContent    = profile.bio || '这个创作者还没有填写简介';

  // 标签
  const tagsEl = document.getElementById('heroTags');
  if (creator.styleTags) {
    try {
      const tags = JSON.parse(creator.styleTags);
      tagsEl.innerHTML = tags.map(t => `<span class="hero-tag">${t}</span>`).join('');
    } catch(e) { tagsEl.innerHTML = ''; }
  }

  // 社交链接
  const socialsEl = document.getElementById('heroSocials');
  const socials = [];
  if (creator.weiboUrl)      socials.push({ icon:'🐦', label:'微博',    url:creator.weiboUrl });
  if (creator.xiaohongshuUrl) socials.push({ icon:'📕', label:'小红书',  url:creator.xiaohongshuUrl });
  if (creator.bilibiliUrl)   socials.push({ icon:'🎨', label:'Bilibili', url:creator.bilibiliUrl });
  socialsEl.innerHTML = socials.map(s =>
    `<a class="social-link" href="${s.url}" target="_blank">${s.icon} ${s.label}</a>`
  ).join('');

  // 数据统计
  animateNum('statWorks',     _articlesData.length + _productsData.length);
  animateNum('statFollowers', profile.followerCount || 0,
    v => v >= 10000 ? (v/10000).toFixed(1)+'万' : Math.round(v).toLocaleString());
  animateNum('statSales',     creator.totalSales || 0);
  animateNum('statLikes',     profile.likedCount || 0,
    v => v >= 10000 ? (v/10000).toFixed(1)+'万' : Math.round(v).toLocaleString());

  // Tab 计数
  document.getElementById('tabCount0').textContent = _articlesData.length + _productsData.length;
  document.getElementById('tabCount1').textContent = _productsData.length;
}

function animateNum(elId, target, format) {
  const el  = document.getElementById(elId); if (!el) return;
  const dur = 1000, interval = 16;
  let elapsed = 0;
  const fmt = format || (v => Math.round(v).toLocaleString());
  const ticker = setInterval(() => {
    elapsed += interval;
    const prog = Math.min(elapsed / dur, 1);
    const ease = 1 - Math.pow(1 - prog, 3);
    el.textContent = fmt(target * ease);
    if (prog >= 1) { clearInterval(ticker); el.textContent = fmt(target); }
  }, interval);
}

/* ══════════════════════════════
   渲染作品列表（文章+商品混合）
══════════════════════════════ */
function renderWorks() {
  // 合并文章和商品，按时间排序
  const articles = _articlesData.map(a => ({ ...a, _kind:'article' }));
  const products = _productsData.map(p => ({ ...p, _kind:'product' }));
  let data = [...articles, ...products].sort((a,b) =>
    new Date(b.createdAt) - new Date(a.createdAt)
  );

  // 筛选
  if (worksFilter === 'article') data = articles;
  if (worksFilter === 'product') data = products;

  const grid = document.getElementById('worksGrid');

  if (!data.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <span class="empty-icon">📭</span>
      <p class="empty-title">暂无作品</p>
      <p class="empty-desc">该创作者还没有发布内容</p>
    </div>`;
    return;
  }

  grid.innerHTML = data.map(item => {
    if (item._kind === 'product') {
      const previewUrl = item.animation?.previewUrl;
      return `<div class="product-card reveal" onclick="location.href='work-detail.html?type=product&id=${item.id}'">
        <div class="product-card-media" style="background:#F5F3EF;">
          <span class="product-badge sale">在售</span>
          <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
            ${previewUrl
              ? `<img src="${previewUrl}" style="width:100%;height:100%;object-fit:cover;">`
              : `<div class="anim-ring" style="width:60px;height:60px;border-color:#F5E642;"></div>`}
          </div>
        </div>
        <div class="product-card-body">
          <p class="product-card-name">${item.title}</p>
          <div class="product-card-bottom">
            <span class="product-price">¥${Number(item.finalPrice).toFixed(2)}</span>
            <span class="product-sold">${item.salesCount || 0} 人购买</span>
          </div>
        </div>
      </div>`;
    } else {
      const coverUrl = item.coverUrl;
      return `<div class="work-card reveal" onclick="location.href='work-detail.html?type=article&id=${item.id}'">
        <div class="work-card-media" style="background:#F0EDE8;display:flex;align-items:center;justify-content:center;overflow:hidden;">
          <span class="work-card-type article">文章</span>
          ${coverUrl
            ? `<img src="${coverUrl}" style="width:100%;height:100%;object-fit:cover;">`
            : `<span style="font-size:32px;opacity:.18;">✏️</span>`}
        </div>
        <div class="work-card-body">
          <p class="work-card-title">${item.title}</p>
          <div class="work-card-meta">
            <span class="work-card-date">${new Date(item.createdAt).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})}</span>
            <span class="work-card-likes">♥ ${fmtNum(item.likeCount || 0)}</span>
          </div>
        </div>
      </div>`;
    }
  }).join('');

  requestAnimationFrame(() => {
    document.querySelectorAll('.reveal:not(.on)').forEach(el => rObs.observe(el));
  });
}

/* ══════════════════════════════
   渲染在售商品
══════════════════════════════ */
function renderProducts() {
  const grid = document.getElementById('productsGrid');

  if (!_productsData.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <span class="empty-icon">🛍</span>
      <p class="empty-title">暂无在售商品</p>
      <p class="empty-desc">该创作者还没有上架商品</p>
    </div>`;
    return;
  }

  grid.innerHTML = _productsData.map(p => {
    const previewUrl = p.animation?.previewUrl;
    return `<div class="product-card reveal" onclick="location.href='work-detail.html?type=product&id=${p.id}'">
      <div class="product-card-media" style="background:#F5F3EF;">
        <span class="product-badge sale">在售</span>
        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
          ${previewUrl
            ? `<img src="${previewUrl}" style="width:100%;height:100%;object-fit:cover;">`
            : `<div class="anim-ring" style="width:60px;height:60px;border-color:#F5E642;"></div>`}
        </div>
      </div>
      <div class="product-card-body">
        <p class="product-card-name">${p.title}</p>
        <div class="product-card-bottom">
          <span class="product-price">¥${Number(p.finalPrice).toFixed(2)}</span>
          <span class="product-sold">${p.salesCount || 0} 人购买</span>
          <div class="product-card-add">+</div>
        </div>
      </div>
    </div>`;
  }).join('');

  requestAnimationFrame(() => {
    document.querySelectorAll('.reveal:not(.on)').forEach(el => rObs.observe(el));
  });
}

/* ══════════════════════════════
   关注/取消关注
══════════════════════════════ */
async function checkFollowStatus() {
  const token = typeof getToken === 'function' ? getToken() : localStorage.getItem('mowo_token');
  if (!token || !creatorId) return;
  try {
    const res  = await fetch(`${MOWO_API}/api/users/${creatorId}/follow-status`, {
      headers: { Authorization:`Bearer ${token}` }
    });
    const json = await res.json();
    if (json.success) {
      isFollowing = json.data.following;
      updateFollowBtn();
    }
  } catch(e) {}
}

function updateFollowBtn() {
  const btn  = document.getElementById('followBtn');
  const text = document.getElementById('followBtnText');
  if (!btn || !text) return;
  btn.className = 'follow-btn ' + (isFollowing ? 'following' : 'unfollow');
  text.textContent = isFollowing ? '已关注' : '+ 关注';
}

async function toggleFollow() {
  const token = typeof getToken === 'function' ? getToken() : localStorage.getItem('mowo_token');
  if (!token) { showToast('请先登录'); if(typeof openAuthModal==='function') openAuthModal(); return; }

  try {
    const res  = await fetch(`${MOWO_API}/api/users/${creatorId}/follow`, {
      method: 'POST',
      headers: { Authorization:`Bearer ${token}` }
    });
    const json = await res.json();
    if (json.success) {
      isFollowing = json.data.following;
      updateFollowBtn();
      showToast(isFollowing ? '已关注，有新作品会通知你' : '已取消关注');
      // 更新粉丝数显示
      const el = document.getElementById('statFollowers');
      if (el) {
        const cur = parseInt(el.textContent.replace(/[^0-9]/g,'')) || 0;
        const n = isFollowing ? cur+1 : cur-1;
        el.textContent = n >= 10000 ? (n/10000).toFixed(1)+'万' : n.toLocaleString();
      }
    }
  } catch(e) { showToast('操作失败，请重试'); }
}

/* ══════════════════════════════
   交互逻辑
══════════════════════════════ */
function switchTab(idx, btn) {
  currentTab = idx;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  requestAnimationFrame(() => {
    document.querySelectorAll('.reveal:not(.on)').forEach(el => rObs.observe(el));
  });
}

function filterWorks(type, btn) {
  worksFilter = type;
  document.querySelectorAll('.works-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderWorks();
}

function shareProfile() {
  try {
    navigator.clipboard.writeText(location.href);
    showToast('主页链接已复制');
  } catch(e) { showToast('复制失败，请手动复制地址栏链接'); }
}

function toggleMenu() {
  document.getElementById('mobileMenu').classList.toggle('open');
}

/* ══════════════════════════════
   Toast / Reveal
══════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

const rObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); rObs.unobserve(e.target); }});
}, { threshold: 0.05 });
document.querySelectorAll('.reveal').forEach(el => rObs.observe(el));

/* 自定义光标 */
if (window.matchMedia('(pointer:fine)').matches) {
  const c = document.createElement('div'), r = document.createElement('div');
  const cs = 'position:fixed;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)';
  c.style.cssText = cs + ';width:8px;height:8px;background:#111';
  r.style.cssText = cs + ';width:32px;height:32px;border:1.5px solid rgba(17,17,16,.3);transition:width .3s,height .3s,opacity .3s';
  document.body.append(c, r);
  document.body.style.cursor = 'none';
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; c.style.left=mx+'px'; c.style.top=my+'px'; });
  (function tick(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;r.style.left=rx+'px';r.style.top=ry+'px';requestAnimationFrame(tick);})();
  document.querySelectorAll('a,button,.work-card,.anim-card,.product-card,.review-img').forEach(el => {
    el.addEventListener('mouseenter', () => { r.style.width='44px';r.style.height='44px';r.style.opacity='.4'; });
    el.addEventListener('mouseleave', () => { r.style.width='32px';r.style.height='32px';r.style.opacity='1'; });
  });
}
</script>
