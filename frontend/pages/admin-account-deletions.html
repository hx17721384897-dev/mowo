<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注销任务 - 哞屋后台</title>
<style>
:root{--white:#fff;--cream:#f5f3ef;--black:#111110;--gray1:#ebebea;--gray2:#c4c3bf;--gray3:#787874;--yellow:#f5e642;--red:#c0320a;--green:#26734d;--blue:#1565c0;--font:'Noto Sans SC','Microsoft YaHei',sans-serif;--sidebar-w:220px;--sidebar-collapsed:60px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);background:var(--cream);color:var(--black);min-height:100vh}.main{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .3s}.main.expanded{margin-left:var(--sidebar-collapsed)}
.topbar{height:60px;padding:0 32px;border-bottom:1px solid var(--gray1);display:flex;align-items:center;justify-content:space-between;background:rgba(245,243,239,.95);position:sticky;top:0;z-index:50}.topbar-title{font-size:18px;font-weight:900}.content{padding:26px 32px}.note{font-size:12px;color:var(--gray3);font-weight:700}
.summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));border:1px solid var(--gray1);background:var(--white);margin-bottom:18px}.metric{padding:16px 18px;border-right:1px solid var(--gray1)}.metric:last-child{border-right:0}.metric strong{display:block;font-size:24px;margin-bottom:3px}.metric span{font-size:11px;color:var(--gray3);font-weight:800}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.input,.select{height:38px;border:1px solid var(--gray2);background:var(--white);padding:0 12px;font:700 12px var(--font);outline:none}.input{width:270px}.input:focus,.select:focus{border-color:var(--black)}.btn{height:36px;border:1px solid var(--gray2);background:var(--white);padding:0 13px;font:800 12px var(--font);cursor:pointer}.btn:hover{border-color:var(--black)}.btn-dark{background:var(--black);color:var(--white);border-color:var(--black)}.btn-danger{color:var(--red);border-color:#efb2a3}.btn:disabled{opacity:.45;cursor:not-allowed}
.table-wrap{background:var(--white);border:1px solid var(--gray1);overflow:auto}.row{display:grid;grid-template-columns:minmax(190px,1.4fr) 115px 120px 85px minmax(180px,1.4fr) 180px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--gray1);min-width:970px}.row:last-child{border-bottom:0}.head{background:#fafafa;font-size:11px;font-weight:900;color:var(--gray3);padding-top:11px;padding-bottom:11px}.name{font-size:13px;font-weight:900}.sub{font-size:11px;color:var(--gray3);font-weight:700;margin-top:3px;line-height:1.4}.badge{display:inline-flex;padding:4px 7px;border-radius:4px;font-size:10px;font-weight:900}.s-REQUESTED{background:#fff3cd;color:#7a5900}.s-PROCESSING{background:#e3f2fd;color:#1565c0}.s-FAILED,.s-MANUAL_REVIEW{background:#ffe8e3;color:#c0320a}.s-PAUSED{background:#eee;color:#444}.s-COMPLETED{background:#e8f5e9;color:#26734d}.s-CANCELLED,.s-BLOCKED{background:#eee;color:#666}.alert{font-size:10px;font-weight:900;color:var(--red);display:block;margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.error{font-size:11px;color:var(--red);font-weight:700;word-break:break-word}.empty{padding:50px;text-align:center;color:var(--gray3);font-weight:800}.pagination{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;background:var(--white);border:1px solid var(--gray1);border-top:0;font-size:12px;color:var(--gray3);font-weight:700}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:500}.modal-backdrop.show{display:flex}.modal{width:min(460px,calc(100vw - 32px));background:var(--white);padding:24px;border:1px solid var(--gray1)}.modal h2{font-size:18px;margin-bottom:8px}.modal p{font-size:12px;color:var(--gray3);line-height:1.6;margin-bottom:14px}.modal label{display:block;font-size:12px;font-weight:900;margin:13px 0 6px}.modal textarea{width:100%;height:88px;resize:vertical;border:1px solid var(--gray2);padding:10px;font:700 13px var(--font);outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:var(--black);color:#fff;padding:10px 18px;font-size:12px;font-weight:800;opacity:0;transition:.2s;z-index:700}.toast.show{opacity:1;transform:translate(-50%,0)}.menu-btn{display:none;width:36px;height:36px;border:0;background:var(--gray1);font-size:18px}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:190;display:none}.sidebar-backdrop.show{display:block}
@media(max-width:1100px){.summary{grid-template-columns:repeat(2,1fr)}.metric{border-bottom:1px solid var(--gray1)}}@media(max-width:1023px){.main{margin-left:0!important}.content{padding:16px}.topbar{padding:0 16px}.menu-btn{display:block}.sidebar{transform:translateX(-100%);z-index:200}.sidebar.open{transform:none}}
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div><aside class="sidebar" id="sidebar"></aside>
<main class="main" id="main">
  <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="menu-btn" onclick="openSidebar()">&#9776;</button><span class="topbar-title">注销任务管理</span></div><span class="note" id="accessNote">客服可查看，负责人可处理异常</span></header>
  <div class="content">
    <section class="summary" aria-label="注销任务概览">
      <div class="metric"><strong id="mProtection">0</strong><span>保护期内</span></div><div class="metric"><strong id="mRunning">0</strong><span>等待或清理中</span></div><div class="metric"><strong id="mRetry">0</strong><span>自动重试</span></div><div class="metric"><strong id="mAttention">0</strong><span>需要关注或暂停</span></div><div class="metric"><strong id="mDone">0</strong><span>已完成</span></div>
    </section>
    <div class="toolbar"><select class="select" id="statusFilter" onchange="loadTasks(1)"><option value="">全部状态</option><option value="REQUESTED">保护期/待执行</option><option value="PROCESSING">清理中</option><option value="FAILED">自动重试</option><option value="MANUAL_REVIEW">待人工关注</option><option value="PAUSED">已暂停</option><option value="BLOCKED">存在未结事项</option><option value="COMPLETED">已完成</option><option value="CANCELLED">已撤销</option></select><input class="input" id="searchInput" placeholder="输入完整手机号、昵称或任务编号"><button class="btn btn-dark" onclick="loadTasks(1)">查询</button><button class="btn" title="刷新任务列表" onclick="loadTasks(currentPage)">&#8635; 刷新</button></div>
    <div class="table-wrap"><div class="row head"><div>账号</div><div>任务状态</div><div>申请时间</div><div>已用时间</div><div>异常/暂停原因</div><div>操作</div></div><div id="taskRows"><div class="empty">正在加载...</div></div></div>
    <div class="pagination" id="pagination" style="display:none"></div>
  </div>
</main>
<div class="modal-backdrop" id="pauseModal"><div class="modal"><h2>暂停注销任务</h2><p>仅在争议处理、依法保全或确有必要时暂停。内部原因不会展示给用户，用户说明请使用清楚、克制的表达。</p><label for="pauseReason">内部处理原因</label><textarea id="pauseReason" maxlength="500" placeholder="记录事实、处理依据和下一步，至少5个字"></textarea><label for="pauseUserMessage">给用户看的说明</label><textarea id="pauseUserMessage" maxlength="300" placeholder="例如：您有一项订单售后正在处理中，完成后将继续处理注销申请"></textarea><div class="modal-actions"><button class="btn" onclick="closePauseModal()">取消</button><button class="btn btn-danger" onclick="submitPause()">确认暂停</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="../js/auth.js"></script><script src="../js/admin-sidebar.js?v=20260813-shell-init"></script>
<script>
const API=location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001';
const labels={REQUESTED:'保护期/待执行',PROCESSING:'清理中',FAILED:'自动重试',MANUAL_REVIEW:'待人工关注',PAUSED:'已暂停',BLOCKED:'存在未结事项',CANCELLED:'已撤销',COMPLETED:'已完成'};
let token='',canManage=false,currentPage=1,pauseTaskId='';
document.addEventListener('DOMContentLoaded',async()=>{token=localStorage.getItem('mowo_token')||'';if(!token){location.href='index.html';return}const u=await window.fetchCurrentUser?.();if(!u?.staffRole||!['OWNER','CUSTOMER_SERVICE'].includes(u.staffRole)){alert('当前岗位无权查看注销任务');location.href='index.html';return}await loadTasks(1)});
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function dt(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'-'}function showToast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2800)}
async function loadTasks(page=1){currentPage=page;const q=new URLSearchParams({page,limit:20});const status=document.getElementById('statusFilter').value,search=document.getElementById('searchInput').value.trim();if(status)q.set('status',status);if(search)q.set('search',search);try{const r=await fetch(`${API}/api/admin/account-deletions?${q}`,{headers:{Authorization:`Bearer ${token}`}}),j=await r.json();if(!j.success)throw new Error(j.message);canManage=j.data.canManage;document.getElementById('accessNote').textContent=canManage?'负责人：可查看并处理异常任务':'运营客服：仅可查看脱敏状态';renderSummary(j.data.summary,j.data.items);renderRows(j.data.items);renderPagination(j.data.pagination)}catch(e){document.getElementById('taskRows').innerHTML=`<div class="empty">${esc(e.message||'加载失败')}</div>`}}
function renderSummary(s){document.getElementById('mProtection').textContent=s.PROTECTION||0;document.getElementById('mRunning').textContent=Math.max(0,(s.REQUESTED||0)-(s.PROTECTION||0))+(s.PROCESSING||0);document.getElementById('mRetry').textContent=s.FAILED||0;document.getElementById('mAttention').textContent=(s.MANUAL_REVIEW||0)+(s.PAUSED||0);document.getElementById('mDone').textContent=s.COMPLETED||0}
function reason(t){if(t.status==='PAUSED')return `内部：${t.pauseReason||'未填写'}\n用户：${t.pauseUserMessage||'通用提示'}`;if(t.lastError)return t.lastError;if(Array.isArray(t.blockers)&&t.blockers.length)return t.blockers.map(x=>x.message).join('；');return '-'}
function actions(t){if(!canManage)return '<span class="sub">只读</span>';const a=[];if(['FAILED','MANUAL_REVIEW'].includes(t.status))a.push(`<button class="btn" onclick="retryTask('${t.id}')">重试</button>`);if(['REQUESTED','FAILED','MANUAL_REVIEW'].includes(t.status))a.push(`<button class="btn btn-danger" onclick="openPauseModal('${t.id}')">暂停</button>`);if(t.status==='PAUSED')a.push(`<button class="btn btn-dark" onclick="resumeTask('${t.id}')">恢复</button>`);return a.join('')||'<span class="sub">无需操作</span>'}
function renderRows(items){const e=document.getElementById('taskRows');if(!items.length){e.innerHTML='<div class="empty">没有符合条件的注销任务</div>';return}e.innerHTML=items.map(t=>{const alert=t.alertLevel==='OVERDUE'?'超过48小时处理目标':t.alertLevel==='URGENT'?'已超过24小时，请优先处理':t.alertLevel==='ATTENTION'?'需要负责人关注':'';let phase=t.status==='REQUESTED'&&t.protectionMinutesLeft>0?`剩${t.protectionMinutesLeft}分钟可撤销`:labels[t.status]||t.status;if(t.status==='PAUSED')phase=t.canUserCancel?'已暂停，可撤销':'已暂停，不可撤销';return `<div class="row"><div><div class="name">${esc(t.user?.nickname||'未设置昵称')}</div><div class="sub">${esc(t.user?.phone||'手机号已清除')}<br>${esc(t.userId)}</div></div><div><span class="badge s-${t.status}">${esc(phase)}</span>${alert?`<span class="alert">${alert}</span>`:''}</div><div><div class="sub">${dt(t.requestedAt)}</div></div><div><div class="name">${t.elapsedHours} 小时</div><div class="sub">尝试 ${t.attemptCount} 次</div></div><div class="error" style="white-space:pre-line">${esc(reason(t))}</div><div class="actions">${actions(t)}</div></div>`}).join('')}
function renderPagination(p){const e=document.getElementById('pagination');if(p.total<=p.limit){e.style.display='none';return}e.style.display='flex';const pages=Math.ceil(p.total/p.limit);e.innerHTML=`<span>共 ${p.total} 条，第 ${p.page}/${pages} 页</span><div><button class="btn" ${p.page<=1?'disabled':''} onclick="loadTasks(${p.page-1})">上一页</button> <button class="btn" ${p.page>=pages?'disabled':''} onclick="loadTasks(${p.page+1})">下一页</button></div>`}
async function act(id,name,body){const hasBody=body!==undefined;const r=await fetch(`${API}/api/admin/account-deletions/${id}/${name}`,{method:'POST',headers:{Authorization:`Bearer ${token}`,...(hasBody?{'Content-Type':'application/json'}:{})},...(hasBody?{body:JSON.stringify(body)}:{})}),j=await r.json();if(!j.success)throw new Error(j.message);showToast(j.message);await loadTasks(currentPage)}
async function retryTask(id){if(!confirm('确认重新执行这项注销清理？'))return;try{await act(id,'retry')}catch(e){showToast(e.message)}}async function resumeTask(id){if(!confirm('确认恢复这项注销任务？'))return;try{await act(id,'resume')}catch(e){showToast(e.message)}}function openPauseModal(id){pauseTaskId=id;document.getElementById('pauseReason').value='';document.getElementById('pauseUserMessage').value='';document.getElementById('pauseModal').classList.add('show')}function closePauseModal(){document.getElementById('pauseModal').classList.remove('show')}async function submitPause(){const reason=document.getElementById('pauseReason').value.trim(),userMessage=document.getElementById('pauseUserMessage').value.trim();if(reason.length<5){showToast('内部原因请填写至少5个字');return}if(userMessage.length<5){showToast('给用户看的说明请填写至少5个字');return}try{await act(pauseTaskId,'pause',{reason,userMessage});closePauseModal()}catch(e){showToast(e.message)}}
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarBackdrop').classList.add('show')}function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarBackdrop').classList.remove('show')}
</script>
</body></html>
