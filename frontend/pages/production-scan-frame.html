<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帧包完成 - 哞屋后台</title><script src="../js/auth.js"></script><link rel="stylesheet" href="../css/production-scan.css"></head>
<body><aside class="sidebar" id="sidebar"></aside><main class="main" id="main">
<header class="topbar"><div><h1>帧包完成</h1><div class="topbar-meta">只登记已经打印、裁切、装袋并贴好标签的 FP</div></div><div class="scan-ready"><span class="scan-dot"></span>扫码枪已就绪</div></header>
<div class="content"><div class="grid"><section class="panel"><h2>扫描帧素材包</h2><p class="sub">无需点击输入框，直接扫描 FP。重复扫描不会重复推进。</p><div class="field"><label>手工输入备用</label><div class="scan-row"><input class="input code" id="manualCode" placeholder="FP-..."><button class="btn btn-black" id="manualBtn">登记完成</button></div></div><div class="result" id="result">等待扫描帧素材包。</div></section><section class="panel"><h2>本机最近完成</h2><p class="sub">正式记录已经保存在服务器。</p><div id="recent"><div class="empty">暂无记录</div></div></section></div></div>
</main><div class="toast" id="toast"></div><script src="../js/admin-sidebar.js"></script><script src="../js/production-scan-common.js"></script>
<script>
const S=MowoScan,history=[]
async function scan(code,type){code=code.trim().toUpperCase();if(type!=='FRAME')throw new Error('当前是帧包完成工作台，只能扫描 FP');const info=await S.request(`/api/admin/production-workflow/pairing/lookup/${encodeURIComponent(code)}`),data=await S.request(`/api/admin/production-workflow/frame-packs/${encodeURIComponent(code)}/complete`,{method:'POST'});result.className='result ok flash';result.innerHTML=`<span class="code-big">${S.esc(code)}</span><br>${S.esc(info.productionNo||'')} · ${S.esc(info.specification||'')}<br>${data.reused?'此前已经登记完成':'本次登记成功'}`;history.unshift({code,info,time:new Date()});recent.innerHTML=history.slice(0,12).map(x=>`<div class="row"><div><div class="row-title">${S.esc(x.code)}</div><div class="row-meta">${S.esc(x.info.specification||'')} · ${S.formatTime(x.time)}</div></div><span class="badge ok">已完成</span></div>`).join('');S.beep(true);S.toast(data.reused?'此前已经完成':'帧包已完成')}
document.addEventListener('DOMContentLoaded',async()=>{if(!await S.ensureStaff())return;S.installScanner(scan);const run=S.manual('manualCode',scan);manualBtn.onclick=run})
</script></body></html>
