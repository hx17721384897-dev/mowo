<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帧包完成 - 哞屋后台</title><script src="../js/auth.js"></script><link rel="stylesheet" href="../css/production-scan.css"><style>.queue-panel{margin-bottom:16px}.queue-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.queue-head .sub{margin-bottom:0}.queue-tools{display:flex;gap:8px;min-width:min(420px,100%)}.queue-tools .select{height:40px}.queue-current{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;padding:14px;border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:7px;background:#faf9f6;font-size:12px;font-weight:800}.queue-current.active{border-left-color:var(--station);background:var(--station-soft)}.queue-current span,.queue-current small{display:block;color:var(--muted);font-size:10px}.queue-current strong{display:block;margin:4px 0;font-size:14px}.queue-list{max-height:390px;overflow:auto;margin-top:10px;border-top:1px solid var(--line)}.queue-item{display:grid;grid-template-columns:58px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}.queue-item.current{background:var(--station-soft)}.queue-item.done{opacity:.62}.queue-seq{font:900 14px Consolas,monospace;color:var(--station)}@media(max-width:820px){.queue-head{display:block}.queue-tools{margin-top:12px;min-width:0}.queue-item{grid-template-columns:48px minmax(0,1fr) auto}.queue-item .btn{grid-column:2/-1}.queue-current{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.queue-tools{display:grid;grid-template-columns:1fr}.queue-current .btn{width:100%}.queue-item{grid-template-columns:42px minmax(0,1fr)}.queue-item .badge{justify-self:start}.queue-item .btn{grid-column:1/-1}}</style></head>
<body><aside class="sidebar" id="sidebar"></aside><main class="main" id="main">
<header class="topbar"><div><h1>帧包完成</h1><div class="topbar-meta">按冻结顺序逐件打印；每个 PU 文件只打印 1 份，完成裁切、装袋和贴标后扫描 FP</div></div><div class="scan-ready"><span class="scan-dot"></span>扫码枪已就绪</div></header>
<div class="content"><section class="panel queue-panel"><div class="queue-head"><div><h2>批次打印队列</h2><p class="sub">文件已经按裁切组和生产顺序排列，相同商品购买两份也会显示为两个独立任务。</p></div><div class="queue-tools"><select class="select" id="batchSelect" aria-label="选择生产批次"></select><button class="btn" id="refreshQueue">刷新</button></div></div><div class="queue-current" id="queueCurrent">正在读取打印队列...</div><div class="queue-list" id="queueList"></div></section><div class="grid"><section class="panel"><h2>扫描帧素材包</h2><p class="sub">无需点击输入框，直接扫描 FP。重复扫描不会重复推进。</p><div class="field"><label>手工输入备用</label><div class="scan-row"><input class="input code" id="manualCode" placeholder="FP-..."><button class="btn btn-black" id="manualBtn">登记完成</button></div></div><div class="result" id="result">等待扫描帧素材包。</div></section><section class="panel"><h2>本机最近完成</h2><p class="sub">正式记录已经保存在服务器。</p><div id="recent"><div class="empty">暂无记录</div></div></section></div></div>
</main><div class="toast" id="toast"></div><script src="../js/admin-sidebar.js?v=20260829-2"></script><script src="../js/production-scan-common.js?v=20260829-3"></script>
<script>
const S=MowoScan,history=[];let queueData=null
function queueStatus(item){return item.frameStatus==='COMPLETED'?'已完成':item.downloadUrl?'待打印':'待导出资料'}
function renderQueue(){const list=queueData?.queue||[],current=list.find(item=>item.frameStatus!=='COMPLETED');queueCurrent.className=`queue-current${current?' active':''}`;queueCurrent.innerHTML=current?`<div><span>当前任务 ${String(current.sequence).padStart(4,'0')}</span><strong>${S.esc(current.productionNo)} · ${S.esc(current.specification)}</strong><small>${S.esc(current.framePackCode||'尚未生成 FP')} · ${current.pageCount||'?'} 页 · 打印 1 份</small></div>${current.downloadUrl?`<button class="btn btn-black" onclick="downloadPrint('${S.esc(current.productionUnitId)}')">下载当前 Word</button>`:''}`:'当前批次的帧包任务已经全部完成';queueList.innerHTML=list.length?list.map(item=>`<div class="queue-item ${item.frameStatus==='COMPLETED'?'done':''} ${current?.productionUnitId===item.productionUnitId?'current':''}"><div class="queue-seq">${String(item.sequence).padStart(4,'0')}</div><div><div class="row-title">${S.esc(item.productionNo)} · ${S.esc(item.framePackCode||'尚未生成 FP')}</div><div class="row-meta">${S.esc(item.groupName)} · ${S.esc(item.specification)}<br>${item.pageCount||'?'} 页 · 打印 1 份</div></div><span class="badge ${item.frameStatus==='COMPLETED'?'ok':'warn'}">${queueStatus(item)}</span>${item.downloadUrl?`<button class="btn" onclick="downloadPrint('${S.esc(item.productionUnitId)}')">下载</button>`:''}</div>`).join(''):'<div class="empty">当前没有可显示的打印任务</div>'}
async function loadQueue(batchId=''){const data=await S.request(`/api/admin/production-workflow/frame-print-queue${batchId?`?batchId=${encodeURIComponent(batchId)}`:''}`);queueData=data;batchSelect.innerHTML=data.batches.length?data.batches.map(batch=>`<option value="${S.esc(batch.id)}" ${data.batch?.id===batch.id?'selected':''}>${S.esc(batch.id)} · ${batch.completed}/${batch.total} 完成</option>`).join(''):'<option value="">暂无生产批次</option>';renderQueue()}
async function downloadPrint(productionUnitId){try{const item=queueData?.queue?.find(row=>row.productionUnitId===productionUnitId);if(!item?.downloadUrl)throw new Error('该任务尚未导出生产资料');const response=await fetch(item.downloadUrl);if(!response.ok)throw new Error('Word 下载失败，请刷新队列后重试');const a=document.createElement('a');a.href=URL.createObjectURL(await response.blob());a.download=item.fileName;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(error){S.toast(error.message||'Word 下载失败',true)}}
async function scan(code,type){code=code.trim().toUpperCase();if(type!=='FRAME')throw new Error('当前是帧包完成工作台，只能扫描 FP');const info=await S.request(`/api/admin/production-workflow/pairing/lookup/${encodeURIComponent(code)}`),data=await S.request(`/api/admin/production-workflow/frame-packs/${encodeURIComponent(code)}/complete`,{method:'POST'});result.className='result ok flash';result.innerHTML=`<span class="code-big">${S.esc(code)}</span><br>${S.esc(info.productionNo||'')} · ${S.esc(info.specification||'')}<br>${data.reused?'此前已经登记完成':'本次登记成功'}`;history.unshift({code,info,time:new Date()});recent.innerHTML=history.slice(0,12).map(x=>`<div class="row"><div><div class="row-title">${S.esc(x.code)}</div><div class="row-meta">${S.esc(x.info.specification||'')} · ${S.formatTime(x.time)}</div></div><span class="badge ok">已完成</span></div>`).join('');await loadQueue(batchSelect.value);S.beep(true);S.toast(data.reused?'此前已经完成':'帧包已完成')}
document.addEventListener('DOMContentLoaded',async()=>{if(!await S.ensureStaff())return;S.installScanner(scan);const run=S.manual('manualCode',scan);manualBtn.onclick=run;batchSelect.onchange=()=>loadQueue(batchSelect.value).catch(error=>S.toast(error.message,true));refreshQueue.onclick=()=>loadQueue(batchSelect.value).catch(error=>S.toast(error.message,true));await loadQueue().catch(error=>S.toast(error.message,true))})
</script></body></html>
