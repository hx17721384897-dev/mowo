<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社区分享 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --white:    #FFFFFF;
  --cream:    #F5F3EF;
  --black:    #111110;
  --gray1:    #EBEBEA;
  --gray2:    #C4C3BF;
  --gray3:    #787874;
  --accent-y: #F5E642;
  --accent-o: #FF6B35;
  --accent-g: #8FD694;
  --accent-b: #7EC8E3;
  --font:     'Nunito', 'Noto Sans SC', sans-serif;
  --ease:     cubic-bezier(0.22, 1, 0.36, 1);
  --pad-mob:  16px;
  --pad-desk: 48px;
  --nav-h:    65px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--cream);color:var(--black);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}

/* ── NAV ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;align-items:center;justify-content:space-between;padding:14px var(--pad-mob);background:rgba(245,243,239,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.06);height:var(--nav-h);}
@media(min-width:1024px){.nav{padding:0 var(--pad-desk);}}
.nav-logo{line-height:1;}
.nav-logo-cn{font-weight:900;font-size:22px;letter-spacing:-.01em;color:var(--black);display:block;}
.nav-logo-en{font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray3);display:block;margin-top:1px;}
.nav-links{display:none;list-style:none;gap:36px;}
@media(min-width:1024px){.nav-links{display:flex;}}
.nav-links a{font-weight:800;font-size:14px;color:var(--gray3);transition:color .2s;position:relative;padding-bottom:3px;}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent-y);border-radius:2px;transform:scaleX(0);transition:transform .25s var(--ease);}
.nav-links a:hover{color:var(--black);}
.nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);}
.nav-links a.active{color:var(--black);}
.nav-right{display:flex;align-items:center;gap:12px;}
.nav-login{font-weight:800;font-size:13px;padding:10px 22px;background:var(--black);color:var(--white);border-radius:999px;min-height:44px;display:flex;align-items:center;transition:opacity .2s;}
.nav-login:hover{opacity:.8;}
.burger{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:8px;min-width:44px;min-height:44px;justify-content:center;align-items:center;}
@media(min-width:1024px){.burger{display:none;}}
.burger span{display:block;width:22px;height:2px;background:var(--black);border-radius:2px;transition:transform .3s,opacity .3s;}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.burger.open span:nth-child(2){opacity:0;}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.mobile-menu{position:fixed;inset:0;background:var(--black);z-index:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);}
.mobile-menu.open{opacity:1;pointer-events:all;}
.mobile-menu a{font-weight:900;font-size:clamp(28px,8vw,48px);color:var(--white);transition:color .2s;}
.mobile-menu a:hover{color:var(--accent-y);}

/* ── FILTER BAR ── */
.filter-bar{position:sticky;top:var(--nav-h);z-index:700;background:rgba(245,243,239,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--gray1);padding:12px var(--pad-mob) 0;}
@media(min-width:1024px){.filter-bar{padding:14px var(--pad-desk) 0;}}
.filter-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:200px;max-width:360px;position:relative;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--gray3);pointer-events:none;}
.search-input{width:100%;height:44px;padding:0 16px 0 40px;font-family:var(--font);font-weight:700;font-size:14px;color:var(--black);background:var(--white);border:2px solid var(--gray1);border-radius:999px;outline:none;transition:border-color .2s,box-shadow .2s;}
.search-input::placeholder{color:var(--gray2);}
.search-input:focus{border-color:var(--black);box-shadow:0 0 0 4px rgba(17,17,16,.05);}
.sort-tabs{display:flex;background:var(--white);border:2px solid var(--gray1);border-radius:999px;padding:3px;gap:2px;flex-shrink:0;}
.sort-tab{font-weight:800;font-size:13px;padding:8px 18px;border-radius:999px;color:var(--gray3);transition:background .2s,color .2s;min-height:36px;display:flex;align-items:center;}
.sort-tab.active{background:var(--black);color:var(--white);}
.sort-tab:hover:not(.active){color:var(--black);}
.sale-toggle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--gray3);cursor:pointer;flex-shrink:0;padding:10px 16px;border:2px solid var(--gray1);border-radius:999px;background:var(--white);transition:all .2s;min-height:44px;}
.sale-toggle.active{border-color:var(--accent-g);color:#287030;background:#EDFBEE;}
.toggle-dot{width:18px;height:18px;border-radius:50%;background:var(--gray1);display:flex;align-items:center;justify-content:center;font-size:10px;transition:background .2s;}
.sale-toggle.active .toggle-dot{background:var(--accent-g);}
.tags-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tags-row::-webkit-scrollbar{display:none;}
.tag-pill{flex-shrink:0;font-weight:800;font-size:12px;letter-spacing:.04em;padding:7px 16px;border-radius:999px;background:var(--white);color:var(--gray3);border:2px solid var(--gray1);transition:all .2s;min-height:36px;display:flex;align-items:center;white-space:nowrap;}
.tag-pill:hover{border-color:var(--gray2);color:var(--black);}
.tag-pill.active{background:var(--black);color:var(--white);border-color:var(--black);}

/* ── MAIN ── */
.main{padding:24px var(--pad-mob) 60px;max-width:1600px;margin:0 auto;}
@media(min-width:1024px){.main{padding:28px var(--pad-desk) 80px;}}
.result-info{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);margin-bottom:20px;}

/* ── MASONRY ── */
.masonry{columns:2;column-gap:12px;}
@media(min-width:640px){.masonry{columns:3;column-gap:14px;}}
@media(min-width:1024px){.masonry{columns:4;column-gap:16px;}}
@media(min-width:1400px){.masonry{columns:5;column-gap:18px;}}

/* ── WORK CARD ── */
.work-card{break-inside:avoid;margin-bottom:12px;background:var(--white);border-radius:20px;overflow:hidden;border:1.5px solid var(--gray1);cursor:pointer;position:relative;transition:transform .3s var(--ease),box-shadow .3s;}
@media(min-width:1024px){.work-card{margin-bottom:16px;}}
.work-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.1);border-color:var(--gray2);}
.card-media{width:100%;position:relative;overflow:hidden;background:var(--cream);}
.card-media img{width:100%;height:100%;object-fit:cover;display:block;}
.card-media-placeholder{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:var(--gray1);}
.card-media-placeholder span{font-size:32px;opacity:.3;}
/* 商品卡片用正方形，文章卡片用3/4 */
.card-media.is-product{aspect-ratio:1/1;}
.card-media.is-article{aspect-ratio:3/4;}
.card-video-wrap{position:absolute;inset:0;opacity:0;transition:opacity .4s var(--ease);background:var(--black);}
.work-card:hover .card-video-wrap{opacity:1;}
.card-play-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;pointer-events:none;}
.work-card:hover .card-play-hint{opacity:1;}
.play-ring{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:16px;}
.card-badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;}
.badge-sale{font-weight:900;font-size:10px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--accent-y);color:var(--black);}
.badge-product{font-weight:900;font-size:10px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--accent-o);color:var(--white);}
.card-body{padding:12px 14px 14px;}
.card-title{font-weight:900;font-size:13px;letter-spacing:-.01em;color:var(--black);margin-bottom:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-price{font-weight:900;font-size:13px;color:var(--accent-o);margin-bottom:6px;}
.card-footer{display:flex;align-items:center;justify-content:space-between;}
.card-author{display:flex;align-items:center;gap:7px;cursor:pointer;}
.card-author:hover .author-name{color:var(--black);}
.author-avatar{width:24px;height:24px;border-radius:50%;background:var(--gray1);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;overflow:hidden;border:1.5px solid var(--gray1);}
.author-avatar img{width:100%;height:100%;object-fit:cover;}
.author-name{font-weight:800;font-size:11px;color:var(--gray3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;transition:color .2s;}
.card-like{display:flex;align-items:center;gap:5px;font-weight:800;font-size:11px;color:var(--gray3);padding:4px 8px;border-radius:999px;transition:all .2s;min-height:28px;}
.card-like:hover{background:var(--cream);color:#C03030;}
.card-like.liked{color:#C03030;}
.like-icon{font-size:12px;transition:transform .2s var(--ease);}
.card-like:hover .like-icon,.card-like.liked .like-icon{transform:scale(1.25);}

/* ── SKELETON 加载骨架屏 ── */
.skeleton{background:linear-gradient(90deg,var(--gray1) 25%,#e8e7e3 50%,var(--gray1) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-card{break-inside:avoid;margin-bottom:12px;background:var(--white);border-radius:20px;overflow:hidden;border:1.5px solid var(--gray1);}
@media(min-width:1024px){.skeleton-card{margin-bottom:16px;}}
.skeleton-media{aspect-ratio:3/4;}
.skeleton-body{padding:12px 14px 14px;}
.skeleton-title{height:14px;border-radius:4px;margin-bottom:8px;}
.skeleton-title-short{height:14px;border-radius:4px;width:60%;margin-bottom:10px;}
.skeleton-footer{display:flex;align-items:center;justify-content:space-between;}
.skeleton-avatar{width:24px;height:24px;border-radius:50%;}
.skeleton-name{height:10px;border-radius:4px;width:60px;}

/* ── LOAD MORE ── */
.load-more-wrap{display:flex;justify-content:center;padding:40px 0 20px;}
.load-more-btn{font-weight:900;font-size:14px;letter-spacing:.04em;padding:16px 40px;border-radius:999px;min-height:52px;background:var(--white);color:var(--black);border:2px solid var(--gray1);transition:all .25s var(--ease);display:flex;align-items:center;gap:10px;}
.load-more-btn:hover{border-color:var(--black);box-shadow:0 4px 0 var(--gray1);}
.load-more-btn.loading .load-spinner{animation:spin-slow .8s linear infinite;}
.load-more-btn:disabled{opacity:.4;cursor:not-allowed;}
@keyframes spin-slow{to{transform:rotate(360deg);}}

/* ── EMPTY STATE ── */
.empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;gap:12px;}
.empty-state.show{display:flex;}
.empty-icon{font-size:52px;opacity:.4;}
.empty-title{font-weight:900;font-size:20px;color:var(--black);}
.empty-desc{font-weight:700;font-size:14px;color:var(--gray3);}

/* FOOTER */
footer{background:var(--black);color:rgba(255,255,255,.4);padding:48px var(--pad-mob) 36px;border-top:1px solid #1E1E1C;}
@media(min-width:1024px){footer{padding:48px var(--pad-desk) 36px;}}
.foot-row{display:flex;flex-direction:column;gap:16px;}
@media(min-width:640px){.foot-row{flex-direction:row;align-items:center;justify-content:space-between;}}
.foot-logo{font-weight:900;font-size:20px;color:var(--white);}
.foot-links{display:flex;gap:24px;flex-wrap:wrap;}
.foot-links a{font-weight:700;font-size:13px;color:rgba(255,255,255,.35);transition:color .2s;}
.foot-links a:hover{color:var(--white);}
.foot-copy{font-weight:700;font-size:12px;color:rgba(255,255,255,.18);margin-top:24px;}

/* REVEAL */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
.reveal.on{opacity:1;transform:none;}
</style>
</head>

<script>
const API_BASE = 'http://localhost:3001';

/* ── 状态 ── */
let currentTag  = 'all';
let currentSort = 'latest';
let saleOnly    = false;
let searchQuery = '';
let currentPage = 1;
let totalPages  = 1;
let isLoading   = false;
let allItems    = []; // 本地缓存，用于搜索过滤

/* ── Mobile menu ── */
function toggleMenu(){
  const m=document.getElementById('mobileMenu'),b=document.getElementById('burger');
  const o=m.classList.toggle('open');
  b.classList.toggle('open',o);
  document.body.style.overflow=o?'hidden':'';
}
function closeMenu(){
  document.getElementById('mobileMenu').classList.remove('open');
  document.getElementById('burger').classList.remove('open');
  document.body.style.overflow='';
}

/* ── 格式化数字 ── */
function fmtCount(n) {
  if (!n) return '0';
  return n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'') + 'k' : String(n);
}

/* ── 格式化机型名称 ── */
function fmtMachineType(type) {
  const map = { cylinder:'圆筒', lantern:'灯笼', hexagon:'六角', 'flat-round':'扁圆', mini:'迷你' };
  return map[type] || type;
}

/* ── 渲染骨架屏 ── */
function renderSkeletons(count = 8) {
  const grid = document.getElementById('masonryGrid');
  grid.innerHTML = '';
  for (let i = 0; i < count; i++) {
    grid.innerHTML += `
      <div class="skeleton-card">
        <div class="skeleton skeleton-media"></div>
        <div class="skeleton-body">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-title-short"></div>
          <div class="skeleton-footer">
            <div style="display:flex;align-items:center;gap:7px;">
              <div class="skeleton skeleton-avatar"></div>
              <div class="skeleton skeleton-name"></div>
            </div>
          </div>
        </div>
      </div>`;
  }
}

/* ── 生成单张卡片HTML ── */
function createCardHTML(item) {
  const isProduct = item.feedType === 'product';
  const isArticleWithSale = item.feedType === 'article' && item.hasSale;

  // 封面图
  let mediaHTML = '';
  const coverUrl = isProduct ? item.previewUrl : item.coverUrl;
  if (coverUrl) {
    mediaHTML = `<img src="${coverUrl}" alt="${item.title}" loading="lazy">`;
  } else {
    const icon = isProduct ? '🎠' : '📝';
    mediaHTML = `<div class="card-media-placeholder"><span>${icon}</span></div>`;
  }

  // 徽章
  let badges = '';
  if (isProduct) {
    badges = `<span class="badge-product">商品</span>`;
  } else if (isArticleWithSale) {
    badges = `<span class="badge-sale">可购买</span>`;
  }

  // 作者头像
  const avatarHTML = item.user?.profile?.avatarUrl
    ? `<img src="${item.user.profile.avatarUrl}" alt="avatar">`
    : (isProduct ? '🎠' : '✍️');

  // 价格（商品才显示）
  const priceHTML = isProduct
    ? `<p class="card-price">¥${Number(item.finalPrice).toFixed(2)}</p>`
    : '';

  // 点赞数（文章才显示）
  const likeHTML = !isProduct
    ? `<button class="card-like" onclick="toggleLike(event,this,'${item.id}')">
        <span class="like-icon">♡</span>
        <span class="like-count">${fmtCount(item.likeCount)}</span>
       </button>`
    : `<span style="font-weight:800;font-size:11px;color:var(--gray3);">${fmtCount(item.salesCount)} 已售</span>`;

  // 机型信息（商品才显示）
  const subtitleHTML = isProduct
    ? `<p style="font-size:11px;color:var(--gray3);font-weight:700;margin-bottom:4px;">${fmtMachineType(item.machineType)} · ${item.frameCount}帧</p>`
    : '';

  const mediaClass = isProduct ? 'card-media is-product' : 'card-media is-article';

  return `
    <div class="work-card reveal"
         data-id="${item.id}"
         data-type="${item.feedType}"
         data-title="${item.title}"
         data-author="${item.user?.profile?.nickname || ''}"
         onclick="goDetail(this)">
      <div class="${mediaClass}">
        ${mediaHTML}
        <div class="card-video-wrap">
          <div class="card-play-hint"><div class="play-ring">▶</div></div>
        </div>
        <div class="card-badges">${badges}</div>
      </div>
      <div class="card-body">
        ${subtitleHTML}
        <p class="card-title">${item.title}</p>
        ${priceHTML}
        <div class="card-footer">
          <div class="card-author" onclick="goCreator(event,'${item.user?.id}')">
            <div class="author-avatar">${avatarHTML}</div>
            <span class="author-name">@${item.user?.profile?.nickname || '未知用户'}</span>
          </div>
          ${likeHTML}
        </div>
      </div>
    </div>`;
}

/* ── 从API加载数据 ── */
async function fetchFeed(reset = false) {
  if (isLoading) return;
  isLoading = true;

  if (reset) {
    currentPage = 1;
    allItems = [];
    renderSkeletons();
    document.getElementById('loadMoreWrap').style.display = 'none';
  }

  const params = new URLSearchParams({
    page: currentPage,
    limit: 12,
    sort: currentSort,
    ...(saleOnly ? { saleOnly: 'true' } : {}),
    ...(currentTag !== 'all' ? { tag: currentTag } : {})
  });

  try {
    const res = await fetch(`${API_BASE}/api/feed?${params}`);
    const json = await res.json();

    if (!json.success) throw new Error('API错误');

    const { items, pagination } = json.data;
    totalPages = pagination.totalPages;

    allItems = reset ? items : [...allItems, ...items];

    renderItems(reset);

    // 更新加载更多按钮
    const loadMoreWrap = document.getElementById('loadMoreWrap');
    if (currentPage < totalPages) {
      loadMoreWrap.style.display = 'flex';
      document.getElementById('loadMoreBtn').disabled = false;
      document.getElementById('loadMoreBtn').querySelector('span:last-child').textContent = '加载更多';
      document.getElementById('loadMoreBtn').classList.remove('loading');
    } else {
      loadMoreWrap.style.display = 'none';
    }

  } catch (e) {
    console.error('加载失败', e);
    document.getElementById('masonryGrid').innerHTML =
      '<p style="color:var(--gray3);font-weight:700;padding:40px;text-align:center;">加载失败，请刷新重试</p>';
  }

  isLoading = false;
}

/* ── 渲染卡片列表（支持本地搜索过滤）── */
function renderItems(reset = false) {
  const grid = document.getElementById('masonryGrid');

  // 本地搜索过滤
  const filtered = searchQuery
    ? allItems.filter(item => {
        const title = item.title?.toLowerCase() || '';
        const author = item.user?.profile?.nickname?.toLowerCase() || '';
        const tags = item.tags?.toLowerCase() || '';
        return title.includes(searchQuery) || author.includes(searchQuery) || tags.includes(searchQuery);
      })
    : allItems;

  if (reset) grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.innerHTML = '';
    document.getElementById('emptyState').classList.add('show');
    document.getElementById('resultInfo').textContent = '共 0 件作品';
    return;
  }

  document.getElementById('emptyState').classList.remove('show');
  document.getElementById('resultInfo').textContent = `共 ${filtered.length} 件作品`;

  // 只渲染新增的部分
  const startIdx = reset ? 0 : grid.querySelectorAll('.work-card').length;
  const newItems = filtered.slice(startIdx);

  newItems.forEach(item => {
    const div = document.createElement('div');
    div.innerHTML = createCardHTML(item).trim();
    const card = div.firstChild;
    grid.appendChild(card);

    // 触发reveal动画
    requestAnimationFrame(() => {
      requestAnimationFrame(() => card.classList.add('on'));
    });
  });

  // 重新绑定scroll reveal
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('on'); obs.unobserve(e.target); }});
  }, { threshold:.08, rootMargin:'0px 0px -20px 0px' });
  grid.querySelectorAll('.reveal:not(.on)').forEach(el => obs.observe(el));
}

/* ── 跳转：卡片 → 详情页 ── */
function goDetail(card) {
  const id = card.dataset.id;
  const type = card.dataset.type;
  if (!id) return;
  window.location.href = `work-detail.html?type=${type}&id=${id}`;
}

/* ── 跳转：作者 → 创作者主页 ── */
function goCreator(e, userId) {
  e.stopPropagation();
  if (!userId) return;
  window.location.href = `creator-profile.html?id=${userId}`;
}

/* ── 点赞（本地切换，对接API时补上请求）── */
function toggleLike(e, btn, articleId) {
  e.stopPropagation();
  const liked = btn.classList.toggle('liked');
  const icon = btn.querySelector('.like-icon');
  const countEl = btn.querySelector('.like-count');
  icon.textContent = liked ? '♥' : '♡';
  let raw = countEl.textContent;
  let num = raw.includes('k') ? parseFloat(raw) * 1000 : parseInt(raw) || 0;
  num = liked ? num + 1 : num - 1;
  countEl.textContent = num >= 1000 ? (num/1000).toFixed(1).replace(/\.0$/,'') + 'k' : num;
  // TODO: 对接API时在这里调用 POST /api/articles/:id/like
}

/* ── 加载更多 ── */
function loadMore() {
  const btn = document.getElementById('loadMoreBtn');
  btn.classList.add('loading');
  btn.querySelector('span:last-child').textContent = '加载中…';
  currentPage++;
  fetchFeed(false);
}

/* ── 筛选器 ── */
function setSort(sort, btn) {
  currentSort = sort;
  document.querySelectorAll('.sort-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  fetchFeed(true);
}

function setTag(tag, btn) {
  currentTag = tag;
  document.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  fetchFeed(true);
}

function toggleSale() {
  saleOnly = !saleOnly;
  document.getElementById('saleToggle').classList.toggle('active', saleOnly);
  fetchFeed(true);
}

function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  // 搜索是本地过滤，不重新请求API
  renderItems(true);
}

/* ── 初始化 ── */
fetchFeed(true);

/* ── Desktop cursor ── */
if(window.matchMedia('(pointer:fine)').matches){
  const c=document.createElement('div'),r=document.createElement('div');
  const cs='position:fixed;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)';
  c.style.cssText=cs+';width:8px;height:8px;background:#111';
  r.style.cssText=cs+';width:32px;height:32px;border:1.5px solid rgba(17,17,16,.3);transition:width .3s,height .3s,opacity .3s';
  document.body.append(c,r);
  document.body.style.cursor='none';
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;c.style.left=mx+'px';c.style.top=my+'px';});
  (function tick(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;r.style.left=rx+'px';r.style.top=ry+'px';requestAnimationFrame(tick);})();
}
