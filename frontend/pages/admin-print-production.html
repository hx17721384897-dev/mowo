<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><script src="../js/runtime-config.js"></script>
<title>打印与裁切设置 - 哞屋后台</title><link rel="stylesheet" href="../css/style.css"><script src="../js/auth.js"></script>
<style>
:root{--ink:#111110;--paper:#fff;--bg:#f5f3ef;--line:#deddd8;--muted:#777773;--yellow:#f5e642;--orange:#f0642b;--green:#287a42;--red:#b82b2b;--sidebar-w:220px;--sidebar-collapsed:60px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;letter-spacing:0}.main{margin-left:var(--sidebar-w);min-height:100vh;transition:.2s}.main.expanded{margin-left:var(--sidebar-collapsed)}.topbar{height:62px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(245,243,239,.96);position:sticky;top:0;z-index:20}.topbar h1{font-size:19px}.content{padding:24px 28px 50px;max-width:1500px;margin:auto}.btn{height:36px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 13px;font-weight:800;cursor:pointer}.btn:hover{border-color:#999}.btn-black{background:var(--ink);color:#fff;border-color:var(--ink)}.btn-sm{height:30px;padding:0 9px;font-size:11px}.menu-btn{display:none;width:38px;padding:0}.intro{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:14px}.intro h2{font-size:20px;margin:0 0 5px}.intro p,.muted{font-size:12px;color:var(--muted);font-weight:700;margin:0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 15px}.metric span{font-size:11px;color:var(--muted);font-weight:800}.metric strong{display:block;font-size:25px;margin-top:4px}.notice{padding:10px 13px;border-left:3px solid var(--yellow);background:#fffdeb;font-size:11px;font-weight:700;margin-bottom:16px}.group-list{display:grid;gap:12px}.group{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.group.disabled{opacity:.62}.group.dragging,.sku-card.dragging{opacity:.35}.group.drag-over,.sku-list.drag-over{outline:3px solid var(--yellow);outline-offset:-3px}.group-head{display:grid;grid-template-columns:34px minmax(220px,1fr) auto;gap:10px;align-items:center;padding:14px 15px;border-bottom:1px solid var(--line)}.drag-handle{font-size:19px;color:#999;cursor:grab;user-select:none;text-align:center}.group-name{font-size:15px;font-weight:900}.group-meta{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.sku-list{min-height:72px;padding:10px;display:grid;gap:7px}.sku-card{display:grid;grid-template-columns:28px 52px minmax(160px,1.2fr) repeat(4,minmax(78px,.7fr)) 64px auto;gap:9px;align-items:center;border:1px solid #e5e3dd;background:#faf9f6;border-radius:7px;padding:8px}.sku-card.inactive{opacity:.58}.sku-img{width:52px;height:52px;border:1px solid var(--line);border-radius:6px;background:#eee;object-fit:cover}.sku-img.placeholder{display:grid;place-items:center;font-weight:900;color:#999}.sku-title{font-size:12px;font-weight:900}.sku-code{font-size:10px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.sku-field{font-size:11px;font-weight:800}.sku-field span{display:block;color:var(--muted);font-size:9px;margin-bottom:2px}.color-dot{display:inline-block;width:14px;height:14px;border:1px solid #aaa;border-radius:50%;vertical-align:-2px;margin-right:4px}.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px;font-weight:700}.unassigned{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px}.unassigned.drag-over{outline:3px solid #ffb1a0}.unassigned-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.unassigned h3{margin:0;font-size:15px}.unassigned-list{display:grid;gap:7px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:300}.overlay.show{display:flex}.modal{width:min(760px,100%);max-height:90vh;background:#fff;border-radius:8px;display:flex;flex-direction:column}.modal-head,.modal-actions{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-actions{border:0;border-top:1px solid var(--line);justify-content:flex-end}.modal-body{padding:16px 18px;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input,.field select,.filter-row input,.filter-row select{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font:inherit}.filter-row{display:grid;grid-template-columns:1.1fr repeat(3,.8fr);gap:7px;margin-bottom:10px}.pick-list{display:grid;gap:7px}.pick{display:grid;grid-template-columns:26px 48px 1fr;gap:9px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:7px;cursor:pointer}.pick:hover{background:#fffdec}.pick img{width:48px;height:48px;object-fit:cover;border-radius:5px;background:#eee}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 15px;border-radius:7px;font-size:12px;font-weight:800;z-index:500;display:none}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:90}.sidebar-backdrop.show{display:block}
@media(max-width:1050px){.sku-card{grid-template-columns:28px 52px 1fr 1fr 1fr}.sku-card>:nth-child(n+6){grid-column:auto}.group-head{grid-template-columns:34px 1fr}.actions{grid-column:2;justify-content:flex-start}}@media(max-width:760px){.main{margin-left:0!important}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.menu-btn{display:inline-block}.content{padding:16px}.topbar{padding:0 16px}.summary{grid-template-columns:1fr}.intro{align-items:flex-start}.sku-card{grid-template-columns:28px 45px 1fr}.sku-img{width:45px;height:45px}.sku-card>:nth-child(n+4){grid-column:3}.filter-row,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body>
<aside class="sidebar" id="sidebar"></aside><div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<main class="main" id="main"><header class="topbar"><div style="display:flex;align-items:center;gap:9px"><button class="btn menu-btn" onclick="openSidebar()">☰</button><h1>打印与裁切设置</h1></div><button class="btn" onclick="loadData()">刷新</button></header>
<div class="content"><div class="intro"><div><h2>生产顺序</h2><p>先按打印裁切组，再按组内真实 SKU；同一 SKU 的订单按付款时间排列。</p></div><button class="btn btn-black" onclick="openGroupModal()">新增打印裁切组</button></div>
<div class="summary"><div class="metric"><span>启用打印组</span><strong id="groupCount">0</strong></div><div class="metric"><span>已配置 SKU</span><strong id="configuredCount">0</strong></div><div class="metric"><span>尚未配置 SKU</span><strong id="unassignedCount">0</strong></div></div>
<div class="notice">拖动打印组或 SKU 即可调整顺序；拖动尚未配置的 SKU 到尺寸相同的打印组可快速加入。修改只影响之后新建的生产批次。</div>
<div class="group-list" id="groupList"><div class="empty">正在读取生产规则...</div></div>
<section class="unassigned" id="unassignedZone" ondragover="allowUnassignedDrop(event)" ondrop="dropToUnassigned(event)"><div class="unassigned-head"><div><h3>尚未配置的 SKU</h3><p class="muted">来自款式管理；未确认也可在预警后进入生产，但会排在打印队列末尾。</p></div></div><div class="unassigned-list" id="unassignedList"><div class="empty">正在检查...</div></div></section></div></main>
<div class="overlay" id="groupOverlay"><div class="modal"><div class="modal-head"><h2 id="groupModalTitle" style="margin:0;font-size:18px">新增打印裁切组</h2><button class="btn" onclick="closeOverlay('groupOverlay')">关闭</button></div><div class="modal-body"><div class="form-grid">
<div class="field full"><label>组名</label><input id="groupName" placeholder="例如：A4纸 · 5×5cm · 单页12帧"></div>
<div class="field"><label>帧图尺寸</label><select id="groupSize"></select></div><div class="field"><label>每页容纳帧数</label><input id="framesPerSheet" type="number" min="1" placeholder="12"></div>
<div class="field"><label>纸张规格</label><input id="paperSize" value="A4" placeholder="A4"></div><div class="field"><label>纸张类型</label><input id="paperType" value="普通打印纸" placeholder="普通打印纸"></div>
<div class="field"><label>纸张方向</label><select id="orientation"><option value="LANDSCAPE">横向</option><option value="PORTRAIT">纵向</option></select></div><div class="field"><label>输出清晰度</label><select id="renderDpi"><option value="600">600 DPI（推荐）</option><option value="300">300 DPI</option></select></div>
<div class="field"><label>成品宽度（毫米）</label><input id="frameWidthMm" type="number" min="1" placeholder="50"></div><div class="field"><label>成品高度（毫米）</label><input id="frameHeightMm" type="number" min="1" placeholder="50"></div>
<div class="field"><label>中间白线（微米）</label><input id="separatorMicrons" type="number" min="1" value="460"></div><div class="field"><label>裁切模具</label><input id="cuttingTool" placeholder="可暂不填写"></div>
</div></div><div class="modal-actions"><button class="btn" onclick="closeOverlay('groupOverlay')">取消</button><button class="btn btn-black" onclick="saveGroup()">保存</button></div></div></div>
<div class="overlay" id="templateOverlay"><div class="modal" style="width:min(560px,100%)"><div class="modal-head"><div><h2 style="margin:0 0 3px;font-size:18px">上传 Word 排版模板</h2><p class="muted" id="templateHint"></p></div><button class="btn" onclick="closeOverlay('templateOverlay')">关闭</button></div><div class="modal-body"><div class="field"><label>一页模板（.docx）</label><input id="templateFile" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></div><p class="muted" style="margin-top:10px">模板只保留一页，表格单元格数量必须等于该组的每页帧数。新上传会形成新版本，旧生产文件不受影响。</p></div><div class="modal-actions"><button class="btn" onclick="closeOverlay('templateOverlay')">取消</button><button class="btn btn-black" id="uploadTemplateBtn" onclick="uploadTemplate()">上传并启用</button></div></div></div>
<div class="overlay" id="skuOverlay"><div class="modal"><div class="modal-head"><div><h2 style="margin:0 0 3px;font-size:18px">添加 SKU</h2><p class="muted" id="skuModalHint"></p></div><button class="btn" onclick="closeOverlay('skuOverlay')">关闭</button></div><div class="modal-body"><div class="filter-row"><input id="skuSearch" placeholder="搜索款式或SKU编码" oninput="renderSkuPicker()"><select id="skuFrameFilter" onchange="renderSkuPicker()"></select><select id="skuMaterialFilter" onchange="renderSkuPicker()"></select><select id="skuColorFilter" onchange="renderSkuPicker()"></select></div><label style="display:flex;gap:7px;align-items:center;font-size:11px;font-weight:800;margin-bottom:9px"><input type="checkbox" id="selectAllSku" onchange="toggleAllSku(this.checked)"> 全选当前结果</label><div class="pick-list" id="skuPicker"></div></div><div class="modal-actions"><span class="muted" id="pickedCount">已选择 0 个</span><button class="btn" onclick="closeOverlay('skuOverlay')">取消</button><button class="btn btn-black" onclick="saveSkuRules()">添加所选 SKU</button></div></div></div>
<div class="toast" id="toast"></div><script src="../js/admin-sidebar.js"></script><script>
const API=window.MOWO_API_BASE||'',token=localStorage.getItem('mowo_token')||''
let groups=[],skus=[],editingGroupId=null,ruleGroupId=null,templateGroupId=null,pickedSkuIds=new Set(),dragState=null
const auth=()=>({Authorization:`Bearer ${token}`});const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
async function ensureStaff(){try{const u=await fetchCurrentUser();if(!u?.staffRole){location.href='index.html';return false}return true}catch{location.href='auth.html?redirect='+encodeURIComponent(location.pathname);return false}}
async function api(path,options={}){const r=await fetch(`${API}/api/admin/print-production${path}`,{...options,headers:{...auth(),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const j=await r.json();if(!j.success)throw new Error(j.message||'操作失败');return j}
async function loadData(){try{const j=await api('/');groups=j.data.groups||[];skus=j.data.skus||[];render()}catch(e){toast(e.message)}}
function skuImage(s,cls='sku-img'){return s.previewUrl?`<img class="${cls}" src="${esc(s.previewUrl)}" alt="${esc(s.modelName)}">`:`<div class="${cls} placeholder">无图</div>`}
function skuCard(s,rule=null,unassigned=false){return `<div class="sku-card ${s.isActive&&s.modelActive?'':'inactive'}" draggable="true" data-sku-id="${s.id}" data-rule-id="${rule?.id||''}" ondragstart="startSkuDrag(event,'${s.id}','${rule?.id||''}')" ondragover="allowSkuDrop(event,'${rule?.id||''}')" ondrop="dropOnSku(event,'${rule?.id||''}')" ondragend="endDrag(event)"><div class="drag-handle" title="拖动排序">⋮⋮</div>${skuImage(s)}<div><div class="sku-title">${esc(s.modelName)} · ${esc(s.skuCode||'未设置SKU编码')}</div><div class="sku-code">${esc(s.id)}</div></div><div class="sku-field"><span>尺寸 / 帧数</span>${esc(s.size)} · ${s.frameCount}帧</div><div class="sku-field"><span>材质</span>${esc(s.material)}</div><div class="sku-field"><span>颜色</span><i class="color-dot" style="background:${esc(s.colorHex)}"></i>${esc(s.colorName)}</div><div class="sku-field"><span>状态</span>${s.isActive&&s.modelActive?'已上架':'已下架'}</div><div class="sku-field"><span>预计页数</span>${rule?rule.pagesPerUnit+'页':'待确认'}</div>${unassigned?'':`<button class="btn btn-sm" onclick="removeRule('${rule.id}')">移出</button>`}</div>`}
function render(){const assignedIds=new Set(groups.flatMap(g=>g.rules.map(r=>r.skuId))),unassigned=skus.filter(s=>!assignedIds.has(s.id));groupCount.textContent=groups.filter(g=>g.isActive).length;configuredCount.textContent=skus.length-unassigned.length;unassignedCount.textContent=unassigned.length
groupList.innerHTML=groups.length?groups.map(g=>{const activeTemplate=(g.templates||[]).find(t=>t.status==='ACTIVE');return `<section class="group ${g.isActive?'':'disabled'}" draggable="true" data-group-id="${g.id}" ondragstart="startGroupDrag(event,'${g.id}')" ondragover="allowGroupDrop(event,'${g.id}')" ondrop="dropOnGroup(event,'${g.id}')" ondragend="endDrag(event)"><div class="group-head"><div class="drag-handle" title="拖动打印组排序">⋮⋮</div><div><div class="group-name">${esc(g.name)}</div><div class="group-meta">${esc(g.code)} · ${esc(g.paperSize)} ${g.orientation==='PORTRAIT'?'纵向':'横向'} · ${esc(g.paperType)} · 成品 ${g.frameWidthMm||'-'}×${g.frameHeightMm||'-'}mm · 单页${g.framesPerSheet}帧 · ${g.renderDpi}DPI · 白线${g.separatorMicrons}μm${g.cuttingTool?' · 模具 '+esc(g.cuttingTool):''}</div><div class="group-meta" style="margin-top:4px">${activeTemplate?`当前模板：${esc(activeTemplate.originalName)} · V${activeTemplate.versionNo}`:'当前模板：尚未上传'}</div></div><div class="actions"><button class="btn btn-sm" onclick="openSkuModal('${g.id}')">添加 SKU</button><button class="btn btn-sm" onclick="openTemplateModal('${g.id}')">上传模板</button><button class="btn btn-sm" onclick="openGroupModal('${g.id}')">编辑</button><button class="btn btn-sm" onclick="toggleGroup('${g.id}',${!g.isActive})">${g.isActive?'停用':'启用'}</button></div></div><div class="sku-list" data-group-id="${g.id}" ondragover="allowGroupDrop(event,'${g.id}')" ondrop="dropOnGroup(event,'${g.id}')">${g.rules.length?g.rules.map(r=>skuCard(skus.find(s=>s.id===r.skuId)||r.sku,r)).join(''):'<div class="empty">拖入尺寸相同的 SKU，或点击“添加 SKU”</div>'}</div></section>`}).join(''):'<div class="empty">还没有打印裁切组，请先新增</div>'
unassignedList.innerHTML=unassigned.length?unassigned.map(s=>skuCard(s,null,true)).join(''):'<div class="empty">全部已上架 SKU 都已配置</div>'}
function startGroupDrag(e,id){if(e.target.closest('button'))return e.preventDefault();dragState={type:'group',id};e.currentTarget.classList.add('dragging');e.dataTransfer.setData('text/plain',`group:${id}`);e.dataTransfer.effectAllowed='move'}
function startSkuDrag(e,skuId,ruleId){dragState={type:'sku',skuId,ruleId:ruleId||null};e.currentTarget.classList.add('dragging');e.stopPropagation();e.dataTransfer.setData('text/plain',`sku:${skuId}`);e.dataTransfer.effectAllowed='move'}
function endDrag(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));dragState=null}
function allowGroupDrop(e,id){if(!dragState)return;e.preventDefault();e.stopPropagation();e.currentTarget.closest('.group')?.classList.add('drag-over')}
function allowSkuDrop(e,targetRuleId){if(dragState?.type!=='sku'||!targetRuleId)return;e.preventDefault();e.stopPropagation();e.currentTarget.classList.add('drag-over')}
async function dropOnSku(e,targetRuleId){if(dragState?.type!=='sku'||!dragState.ruleId||!targetRuleId)return;e.preventDefault();e.stopPropagation();document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));const source=groups.find(g=>g.rules.some(r=>r.id===dragState.ruleId)),target=groups.find(g=>g.rules.some(r=>r.id===targetRuleId));try{if(!source||!target)return;if(source.id!==target.id){await api(`/rules/${dragState.ruleId}/move`,{method:'PUT',body:JSON.stringify({groupId:target.id})})}else{const ids=source.rules.map(r=>r.id),from=ids.indexOf(dragState.ruleId),to=ids.indexOf(targetRuleId);if(from===to)return;ids.splice(to,0,ids.splice(from,1)[0]);await api('/rules/reorder',{method:'PUT',body:JSON.stringify({ruleIds:ids})})}await loadData()}catch(err){toast(err.message)}}
async function dropOnGroup(e,targetGroupId){e.preventDefault();e.stopPropagation();document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(!dragState)return;try{if(dragState.type==='group'){const ids=groups.map(g=>g.id),from=ids.indexOf(dragState.id),to=ids.indexOf(targetGroupId);if(from<0||to<0||from===to)return;ids.splice(to,0,ids.splice(from,1)[0]);await api('/groups/reorder',{method:'PUT',body:JSON.stringify({groupIds:ids})})}else{const target=groups.find(g=>g.id===targetGroupId),sku=skus.find(s=>s.id===dragState.skuId);if(sku.size!==target.size)throw new Error(`该组只接受 ${target.size} 的 SKU`);if(!dragState.ruleId)await api('/rules',{method:'POST',body:JSON.stringify({groupId:targetGroupId,skuIds:[sku.id]})});else{const source=groups.find(g=>g.rules.some(r=>r.id===dragState.ruleId));if(source?.id===targetGroupId){const ids=source.rules.map(r=>r.id),from=ids.indexOf(dragState.ruleId);ids.splice(ids.length,0,ids.splice(from,1)[0]);await api('/rules/reorder',{method:'PUT',body:JSON.stringify({ruleIds:ids})})}else await api(`/rules/${dragState.ruleId}/move`,{method:'PUT',body:JSON.stringify({groupId:targetGroupId})})}}await loadData()}catch(err){toast(err.message)}}
function allowUnassignedDrop(e){if(dragState?.type==='sku'&&dragState.ruleId){e.preventDefault();unassignedZone.classList.add('drag-over')}}
async function dropToUnassigned(e){e.preventDefault();unassignedZone.classList.remove('drag-over');if(!dragState?.ruleId)return;try{await api(`/rules/${dragState.ruleId}`,{method:'DELETE'});await loadData()}catch(err){toast(err.message)}}
function openGroupModal(id=null){editingGroupId=id;const g=groups.find(x=>x.id===id),sizes=[...new Set(skus.map(s=>s.size).concat(g?.size||[]))];groupModalTitle.textContent=g?'编辑打印裁切组':'新增打印裁切组';groupSize.innerHTML=sizes.length?sizes.map(size=>`<option>${esc(size)}</option>`).join(''):'<option value="">请先在款式管理建立SKU</option>';for(const [key,value] of Object.entries({groupName:g?.name||'',groupSize:g?.size||'',framesPerSheet:g?.framesPerSheet||'',paperSize:g?.paperSize||'A4',paperType:g?.paperType||'普通打印纸',orientation:g?.orientation||'LANDSCAPE',renderDpi:g?.renderDpi||600,frameWidthMm:g?.frameWidthMm||'',frameHeightMm:g?.frameHeightMm||'',separatorMicrons:g?.separatorMicrons||460,cuttingTool:g?.cuttingTool||''}))document.getElementById(key).value=value;groupOverlay.classList.add('show')}
async function saveGroup(){const value=id=>document.getElementById(id).value,body={name:value('groupName'),size:value('groupSize'),framesPerSheet:Number(value('framesPerSheet')),paperSize:value('paperSize'),paperType:value('paperType'),orientation:value('orientation'),renderDpi:Number(value('renderDpi')),frameWidthMm:Number(value('frameWidthMm')),frameHeightMm:Number(value('frameHeightMm')),separatorMicrons:Number(value('separatorMicrons')),cuttingTool:value('cuttingTool')};try{await api(editingGroupId?`/groups/${editingGroupId}`:'/groups',{method:editingGroupId?'PUT':'POST',body:JSON.stringify(body)});closeOverlay('groupOverlay');toast('已保存');loadData()}catch(e){toast(e.message)}}
function openTemplateModal(groupId){templateGroupId=groupId;const g=groups.find(x=>x.id===groupId);templateHint.textContent=`${g.name} · ${g.paperSize} · ${g.size} · 单页 ${g.framesPerSheet} 帧`;templateFile.value='';templateOverlay.classList.add('show')}
async function uploadTemplate(){const file=templateFile.files[0];if(!file)return toast('请选择 .docx 模板');const btn=uploadTemplateBtn;btn.disabled=true;try{const form=new FormData();form.append('file',file);const r=await fetch(`${API}/api/admin/print-production/groups/${templateGroupId}/templates`,{method:'POST',headers:auth(),body:form});const j=await r.json();if(!j.success)throw new Error(j.message||'上传失败');closeOverlay('templateOverlay');toast(j.message);await loadData()}catch(e){toast(e.message)}finally{btn.disabled=false}}
function openSkuModal(groupId){ruleGroupId=groupId;pickedSkuIds.clear();const g=groups.find(x=>x.id===groupId);skuModalHint.textContent=`只显示尺寸为 ${g.size} 且尚未分配的 SKU`;const available=availableForGroup();for(const [id,values,first] of [['skuFrameFilter',[...new Set(available.map(s=>s.frameCount))].sort((a,b)=>a-b),'全部帧数'],['skuMaterialFilter',[...new Set(available.map(s=>s.material))],'全部材质'],['skuColorFilter',[...new Set(available.map(s=>s.colorName))],'全部颜色']])document.getElementById(id).innerHTML=`<option value="">${first}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}${id==='skuFrameFilter'?'帧':''}</option>`).join('');skuSearch.value='';selectAllSku.checked=false;renderSkuPicker();skuOverlay.classList.add('show')}
function availableForGroup(){const g=groups.find(x=>x.id===ruleGroupId);return skus.filter(s=>s.size===g?.size&&!s.assignment)}
function filteredPickerSkus(){const q=skuSearch.value.trim().toLowerCase(),f=skuFrameFilter.value,m=skuMaterialFilter.value,c=skuColorFilter.value;return availableForGroup().filter(s=>(!q||`${s.modelName} ${s.skuCode||''}`.toLowerCase().includes(q))&&(!f||String(s.frameCount)===f)&&(!m||s.material===m)&&(!c||s.colorName===c))}
function renderSkuPicker(){const rows=filteredPickerSkus();skuPicker.innerHTML=rows.length?rows.map(s=>`<label class="pick"><input type="checkbox" value="${s.id}" ${pickedSkuIds.has(s.id)?'checked':''} onchange="pickSku('${s.id}',this.checked)">${s.previewUrl?`<img src="${esc(s.previewUrl)}" alt="">`:'<div class="sku-img placeholder" style="width:48px;height:48px">无图</div>'}<div><div class="sku-title">${esc(s.modelName)} · ${esc(s.skuCode||'未设置编码')}</div><div class="sku-code">${esc(s.size)} · ${s.frameCount}帧 · ${esc(s.material)} · ${esc(s.colorName)} · ${s.isActive&&s.modelActive?'已上架':'已下架'}</div></div></label>`).join(''):'<div class="empty">没有符合条件的 SKU</div>';pickedCount.textContent=`已选择 ${pickedSkuIds.size} 个`}
function pickSku(id,checked){checked?pickedSkuIds.add(id):pickedSkuIds.delete(id);pickedCount.textContent=`已选择 ${pickedSkuIds.size} 个`}
function toggleAllSku(checked){filteredPickerSkus().forEach(s=>checked?pickedSkuIds.add(s.id):pickedSkuIds.delete(s.id));renderSkuPicker()}
async function saveSkuRules(){if(!pickedSkuIds.size)return toast('请至少选择一个 SKU');try{await api('/rules',{method:'POST',body:JSON.stringify({groupId:ruleGroupId,skuIds:[...pickedSkuIds]})});closeOverlay('skuOverlay');toast('SKU已添加');loadData()}catch(e){toast(e.message)}}
async function toggleGroup(id,isActive){const g=groups.find(x=>x.id===id);try{await api(`/groups/${id}`,{method:'PUT',body:JSON.stringify({name:g.name,size:g.size,framesPerSheet:g.framesPerSheet,paperSize:g.paperSize,paperType:g.paperType,orientation:g.orientation,renderDpi:g.renderDpi,frameWidthMm:g.frameWidthMm,frameHeightMm:g.frameHeightMm,separatorMicrons:g.separatorMicrons,cuttingTool:g.cuttingTool,isActive})});loadData()}catch(e){toast(e.message)}}
async function removeRule(id){if(!confirm('移出后，该SKU会回到“尚未配置”区域。已有生产批次不受影响。'))return;try{await api(`/rules/${id}`,{method:'DELETE'});loadData()}catch(e){toast(e.message)}}
function closeOverlay(id){document.getElementById(id).classList.remove('show')}function openSidebar(){sidebar.classList.add('open');sidebarBackdrop.classList.add('show')}function closeSidebar(){sidebar.classList.remove('open');sidebarBackdrop.classList.remove('show')}
document.addEventListener('DOMContentLoaded',async()=>{if(await ensureStaff())loadData()})
</script></body></html>
