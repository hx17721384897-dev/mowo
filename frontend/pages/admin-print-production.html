<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>打印与裁切设置 - 哞屋后台</title>
<script src="../js/auth.js"></script><script src="../js/feature-flags.js"></script>
<style>
:root{--black:#111110;--white:#fff;--bg:#f5f3ef;--line:#deddd8;--muted:#74746f;--yellow:#f5e642;--green:#277b42;--red:#bd3434;--sidebar-w:220px;--sidebar-collapsed:60px}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--black);letter-spacing:0}.main{margin-left:var(--sidebar-w);min-height:100vh}.main.expanded{margin-left:var(--sidebar-collapsed)}.topbar{height:62px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}.topbar h1{font-size:19px;margin:0}.content{padding:24px 28px 48px;max-width:1250px;margin:auto}.intro{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}.intro h2{font-size:21px;margin:0 0 6px}.intro p,.muted{font-size:12px;color:var(--muted);margin:0;line-height:1.7}.btn{height:38px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 14px;font-weight:800;cursor:pointer}.btn:hover{border-color:#999}.btn-black{background:var(--black);color:#fff;border-color:var(--black)}.btn-sm{height:30px;padding:0 9px;font-size:11px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}.metric strong{font-size:24px;display:block;margin-top:5px}.metric span{font-size:11px;color:var(--muted);font-weight:800}.notice{border:1px solid #e4c363;background:#fff9d8;padding:12px 15px;border-radius:7px;font-size:12px;font-weight:700;margin-bottom:16px}.group-list{display:flex;flex-direction:column;gap:12px}.group{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.group.disabled{opacity:.58}.group-head{display:grid;grid-template-columns:46px minmax(200px,1fr) auto;gap:12px;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.order-no{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--black);color:#fff;border-radius:6px;font-weight:900}.group-name{font-size:15px;font-weight:900}.group-meta{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.rules{padding:0 17px}.rule{display:grid;grid-template-columns:34px minmax(180px,1fr) 120px auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #ecebe7}.rule:last-child{border-bottom:0}.rule strong{font-size:13px}.rule span{font-size:11px;color:var(--muted)}.empty{padding:34px;text-align:center;color:var(--muted);font-weight:700}.unassigned{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.unassigned h3{font-size:14px;margin:0 0 10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 9px;border:1px solid #e2b4b4;background:#fff1f1;border-radius:6px;font-size:11px;font-weight:800}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:300}.overlay.show{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:8px;padding:22px}.modal h2{font-size:18px;margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input,.field select{width:100%;height:42px;border:1px solid var(--line);border-radius:7px;padding:0 11px;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 15px;border-radius:7px;font-size:12px;font-weight:800;display:none;z-index:500}.menu-btn{display:none}.sidebar-backdrop{display:none}@media(max-width:900px){.main{margin-left:0}.summary{grid-template-columns:1fr}.group-head,.rule{grid-template-columns:1fr}.order-no{display:none}.topbar{padding:0 16px}.content{padding:18px 14px}.menu-btn{display:inline-block}.intro{flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside><div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<main class="main" id="main"><header class="topbar"><div style="display:flex;align-items:center;gap:9px"><button class="btn menu-btn" onclick="openSidebar()">☰</button><h1>打印与裁切设置</h1></div><button class="btn" onclick="loadData()">刷新</button></header>
<div class="content">
  <div class="intro"><div><h2>生产顺序</h2><p>相同尺寸和版式集中生产。款式不决定打印方式，同组内按成品帧数、款式顺序和付款时间排列。</p></div><button class="btn btn-black" onclick="openGroupModal()">新增打印裁切组</button></div>
  <div class="summary"><div class="metric"><span>打印裁切组</span><strong id="groupCount">0</strong></div><div class="metric"><span>已配置规格</span><strong id="configuredCount">0</strong></div><div class="metric"><span>未配置规格</span><strong id="unassignedCount">0</strong></div></div>
  <div class="notice">修改顺序只影响之后新建的生产批次；已有批次继续使用创建时保存的顺序。</div>
  <div class="group-list" id="groupList"><div class="empty">正在读取生产规则...</div></div>
  <section class="unassigned"><h3>尚未配置的商品规格</h3><div class="chips" id="unassignedList"><span class="muted">正在检查...</span></div></section>
</div></main>
<div class="overlay" id="groupOverlay"><div class="modal"><h2 id="groupModalTitle">新增打印裁切组</h2><div class="form-grid">
  <div class="field full"><label>组名</label><input id="groupName" placeholder="例如：5×5cm · 每页12帧"></div>
  <div class="field"><label>帧图尺寸</label><select id="groupSize"></select></div><div class="field"><label>每页容纳帧数</label><input id="framesPerSheet" type="number" min="1" placeholder="12"></div>
  <div class="field"><label>纸张</label><input id="paperSize" value="A4"></div><div class="field"><label>裁切模具</label><input id="cuttingTool" placeholder="可暂不填写"></div>
  <div class="field full"><label>排版模板标识</label><input id="templateKey" placeholder="实际模板确定后填写"></div>
</div><div class="modal-actions"><button class="btn" onclick="closeOverlay('groupOverlay')">取消</button><button class="btn btn-black" onclick="saveGroup()">保存</button></div></div></div>
<div class="overlay" id="ruleOverlay"><div class="modal"><h2>添加适用规格</h2><div class="field"><label>选择现有商品规格</label><select id="ruleSpec"></select></div><div class="modal-actions"><button class="btn" onclick="closeOverlay('ruleOverlay')">取消</button><button class="btn btn-black" onclick="saveRule()">添加</button></div></div></div>
<div class="toast" id="toast"></div><script src="../js/admin-sidebar.js"></script>
<script>
const API=location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001',token=localStorage.getItem('mowo_token')||'';let groups=[],specifications=[],editingGroupId=null,ruleGroupId=null
const auth=()=>({Authorization:`Bearer ${token}`});const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}
async function ensureStaff(){try{const u=await fetchCurrentUser();if(!u?.staffRole){location.href='index.html';return false}return true}catch{location.href='auth.html?redirect='+encodeURIComponent(location.pathname);return false}}
async function api(path,options={}){const r=await fetch(`${API}/api/admin/print-production${path}`,{...options,headers:{...auth(),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const j=await r.json();if(!j.success)throw new Error(j.message||'操作失败');return j}
async function loadData(){try{const j=await api('/');groups=j.data.groups||[];specifications=j.data.specifications||[];render()}catch(e){toast(e.message)}}
function render(){const active=groups.filter(g=>g.isActive);const unassigned=specifications.filter(s=>!s.assignment?.active);document.getElementById('groupCount').textContent=active.length;document.getElementById('configuredCount').textContent=specifications.length-unassigned.length;document.getElementById('unassignedCount').textContent=unassigned.length;document.getElementById('groupList').innerHTML=groups.length?groups.map((g,i)=>`<section class="group ${g.isActive?'':'disabled'}"><div class="group-head"><div class="order-no">${i+1}</div><div><div class="group-name">${esc(g.name)}</div><div class="group-meta">${esc(g.code)} · ${esc(g.size)} · ${esc(g.paperSize)} 每页${g.framesPerSheet}帧${g.cuttingTool?' · 模具 '+esc(g.cuttingTool):''}</div></div><div class="actions"><button class="btn btn-sm" onclick="moveGroup('${g.id}',-1)">↑</button><button class="btn btn-sm" onclick="moveGroup('${g.id}',1)">↓</button><button class="btn btn-sm" onclick="openRuleModal('${g.id}')">添加规格</button><button class="btn btn-sm" onclick="openGroupModal('${g.id}')">编辑</button><button class="btn btn-sm" onclick="toggleGroup('${g.id}',${!g.isActive})">${g.isActive?'停用':'启用'}</button></div></div><div class="rules">${g.rules.length?g.rules.map((r,ri)=>`<div class="rule"><strong>${ri+1}</strong><div><strong>${esc(r.size)} · ${r.frameCount}帧</strong><br><span>每件 ${r.pagesPerUnit} 页，使用本组版式</span></div><div><button class="btn btn-sm" onclick="moveRule('${g.id}','${r.id}',-1)">↑</button> <button class="btn btn-sm" onclick="moveRule('${g.id}','${r.id}',1)">↓</button></div><button class="btn btn-sm" onclick="deleteRule('${r.id}')">删除</button></div>`).join(''):'<div class="empty">还没有适用规格</div>'}</div></section>`).join(''):'<div class="empty">还没有打印裁切组，请先新增</div>';document.getElementById('unassignedList').innerHTML=unassigned.length?unassigned.map(s=>`<span class="chip">${esc(s.size)} · ${s.frameCount}帧 · ${s.skuCount}个SKU</span>`).join(''):'<span class="muted">全部现有商品规格都已配置</span>'}
function openGroupModal(id=null){editingGroupId=id;const g=groups.find(x=>x.id===id),sizes=[...new Set(specifications.map(s=>s.size).concat(g?.size||[]))];document.getElementById('groupModalTitle').textContent=g?'编辑打印裁切组':'新增打印裁切组';document.getElementById('groupSize').innerHTML=sizes.length?sizes.map(size=>`<option value="${esc(size)}">${esc(size)}</option>`).join(''):'<option value="">请先在款式管理中建立 SKU</option>';for(const [key,value] of Object.entries({groupName:g?.name||'',groupSize:g?.size||'',framesPerSheet:g?.framesPerSheet||'',paperSize:g?.paperSize||'A4',cuttingTool:g?.cuttingTool||'',templateKey:g?.templateKey||''}))document.getElementById(key).value=value;document.getElementById('groupOverlay').classList.add('show')}
async function saveGroup(){const value=id=>document.getElementById(id).value;const body={name:value('groupName'),size:value('groupSize'),framesPerSheet:Number(value('framesPerSheet')),paperSize:value('paperSize'),cuttingTool:value('cuttingTool'),templateKey:value('templateKey')};try{await api(editingGroupId?`/groups/${editingGroupId}`:'/groups',{method:editingGroupId?'PUT':'POST',body:JSON.stringify(body)});closeOverlay('groupOverlay');toast('已保存');loadData()}catch(e){toast(e.message)}}
function openRuleModal(groupId){ruleGroupId=groupId;const g=groups.find(x=>x.id===groupId),available=specifications.filter(s=>s.size===g.size&&!s.assignment);document.getElementById('ruleSpec').innerHTML=available.length?available.map(s=>`<option value="${s.frameCount}">${esc(s.size)} · ${s.frameCount}帧 · ${s.modelNames.map(esc).join('、')}</option>`).join(''):'<option value="">没有可添加的规格</option>';document.getElementById('ruleOverlay').classList.add('show')}
async function saveRule(){const value=document.getElementById('ruleSpec').value;if(!value)return toast('没有可添加的规格');try{await api('/rules',{method:'POST',body:JSON.stringify({groupId:ruleGroupId,frameCount:Number(value)})});closeOverlay('ruleOverlay');toast('规则已添加');loadData()}catch(e){toast(e.message)}}
async function moveGroup(id,delta){const ids=groups.map(g=>g.id),i=ids.indexOf(id),j=i+delta;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];try{await api('/groups/reorder',{method:'PUT',body:JSON.stringify({groupIds:ids})});loadData()}catch(e){toast(e.message)}}
async function moveRule(groupId,id,delta){const g=groups.find(x=>x.id===groupId),ids=g.rules.map(r=>r.id),i=ids.indexOf(id),j=i+delta;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];try{await api('/rules/reorder',{method:'PUT',body:JSON.stringify({ruleIds:ids})});loadData()}catch(e){toast(e.message)}}
async function toggleGroup(id,isActive){const g=groups.find(x=>x.id===id);try{await api(`/groups/${id}`,{method:'PUT',body:JSON.stringify({name:g.name,size:g.size,framesPerSheet:g.framesPerSheet,paperSize:g.paperSize,cuttingTool:g.cuttingTool,templateKey:g.templateKey,isActive})});loadData()}catch(e){toast(e.message)}}
async function deleteRule(id){if(!confirm('删除后，新批次中的对应规格将无法进入生产。已有批次不受影响。'))return;try{await api(`/rules/${id}`,{method:'DELETE'});loadData()}catch(e){toast(e.message)}}function closeOverlay(id){document.getElementById(id).classList.remove('show')}function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarBackdrop').classList.add('show')}function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarBackdrop').classList.remove('show')}
document.addEventListener('DOMContentLoaded',async()=>{if(await ensureStaff())loadData()})
</script></body></html>
