<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>订单生产 — 哞屋后台</title>
<style>
:root{--white:#fff;--cream:#f5f3ef;--black:#111110;--line:#e5e3de;--muted:#77746e;--yellow:#f5e642;--blue:#e0f0f7;--sidebar-w:220px;--sidebar-collapsed:60px;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--black);min-height:100vh}.main{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .25s}.main.expanded{margin-left:var(--sidebar-collapsed)}.topbar{height:60px;padding:0 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(245,243,239,.96);z-index:20}.title{font-size:18px;font-weight:900}.top-actions,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.content{padding:24px 30px 40px;max-width:1500px;margin:auto}.btn{height:36px;padding:0 13px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#111;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px}.btn:hover{border-color:#111}.btn-black{background:#111;color:#fff;border-color:#111}.btn-yellow{background:var(--yellow);border-color:var(--yellow)}.btn:disabled{opacity:.42;cursor:not-allowed}.btn-sm{height:30px;font-size:12px;padding:0 10px}.stats{display:grid;grid-template-columns:repeat(8,minmax(105px,1fr));gap:9px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px;cursor:pointer;min-height:76px}.stat.active{border-color:#111;box-shadow:inset 0 -3px #111}.stat-label{font-size:11px;color:var(--muted);font-weight:800}.stat-value{font-size:24px;font-weight:900;margin-top:5px}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:14px}.page-title-wrap{display:flex;align-items:center;gap:7px}.page-title{font-weight:900;font-size:20px}.stage-help{position:relative;width:20px;height:20px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#5f5b54;font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;cursor:help}.stage-help:hover,.stage-help:focus-visible{border-color:#111;color:#111;outline:none}.stage-help-card{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);width:300px;background:#111;color:#fff;border-radius:7px;padding:12px 13px;box-shadow:0 12px 28px rgba(0,0,0,.18);font-size:12px;font-weight:700;line-height:1.65;text-align:left;visibility:hidden;opacity:0;transition:opacity .15s;z-index:40}.stage-help-card::before{content:"";position:absolute;left:-5px;top:50%;transform:translateY(-50%) rotate(45deg);width:10px;height:10px;background:#111}.stage-help:hover .stage-help-card,.stage-help:focus-visible .stage-help-card{visibility:visible;opacity:1}.stage-help-title{font-weight:900;margin-bottom:4px}.stage-help-text+.stage-help-text{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.18)}.page-desc,.notice{display:none}.search{height:36px;width:250px;border:1px solid var(--line);border-radius:7px;padding:0 12px;font-weight:700;background:#fff}.batch{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}.batch-head{padding:13px 16px;background:#faf9f7;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.batch-no{font-weight:900;font-size:14px}.batch-meta{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}.order{padding:14px 16px;border-bottom:1px solid var(--line)}.order:last-child{border-bottom:0}.order-head{display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(180px,1fr) 110px;gap:16px;align-items:start}.order-no{font-size:13px;font-weight:900}.order-sub,.address{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px;line-height:1.6}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--blue);font-size:11px;font-weight:900;justify-self:end}.units{margin-top:10px;display:grid;gap:7px}.unit{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(160px,1fr) auto;gap:12px;align-items:center;padding:9px 10px;background:var(--cream);border-radius:6px}.unit-no{font-size:12px;font-weight:900}.unit-spec,.unit-state{font-size:11px;color:var(--muted);font-weight:700;line-height:1.5}.fp-active{color:#17547c;font-weight:900}.fp-void{color:#a33;text-decoration:line-through}.tracking-grid{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1fr);gap:8px;margin-top:10px}.tracking-grid input{height:35px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-weight:700}.empty{background:#fff;border:1px solid var(--line);border-radius:8px;padding:52px 20px;text-align:center;color:var(--muted);font-weight:800}.overlay{display:none;position:fixed;inset:0;background:rgba(17,17,16,.55);z-index:300;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(500px,100%);background:#fff;border-radius:8px;padding:22px}.modal h2{font-size:18px;margin:0 0 5px}.modal p{font-size:12px;color:var(--muted);font-weight:700}.page-options{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.page-option{border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:13px;font-weight:800}.reason{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical;font:inherit}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:7px;z-index:400;font-size:13px;font-weight:800}.menu-btn{display:none}@media(max-width:1100px){.stats{grid-template-columns:repeat(4,1fr)}.order-head{grid-template-columns:1fr 1fr}.badge{grid-column:2;grid-row:1}.unit{grid-template-columns:1fr auto}.unit-state{grid-column:1/-1}}@media(max-width:800px){.main{margin-left:0!important}.content{padding:16px}.topbar{padding:0 16px}.menu-btn{display:inline-flex}.stats{grid-template-columns:repeat(2,1fr)}.page-head,.order-head{display:block}.page-title-wrap{margin-bottom:12px}.stage-help-card{left:calc(100% + 10px);right:auto;top:50%;transform:translateY(-50%);width:min(300px,calc(100vw - 96px))}.stage-help-card::before{left:-5px;right:auto;top:50%;transform:translateY(-50%) rotate(45deg)}.badge{margin-top:8px}.unit{display:block}.unit .actions{margin-top:8px}.tracking-grid{grid-template-columns:1fr}.search{width:100%}}
</style></head><body>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div><aside class="sidebar" id="sidebar"></aside>
<main class="main" id="main"><header class="topbar"><div class="top-actions"><button class="btn menu-btn" onclick="openSidebar()">菜单</button><div class="title">订单生产</div></div><div class="top-actions"><a class="btn" href="admin-production-batches.html">生产批次总览</a><button class="btn" onclick="loadOrders()">刷新</button></div></header><div class="content"><section class="stats" id="stats"></section><div class="page-head"><div><div class="page-title-wrap"><div class="page-title" id="pageTitle">订单总览</div><button class="stage-help" id="stageHelp" type="button" aria-label="查看当前环节说明">?<span class="stage-help-card" role="tooltip"><div class="stage-help-title" id="stageHelpTitle"></div><div class="stage-help-text" id="stageHelpDesc"></div><div class="stage-help-text" id="stageHelpNotice"></div></span></button></div><div class="page-desc" id="pageDesc"></div></div><input class="search" id="search" placeholder="搜索订单、收件人、手机号或面单" onkeydown="if(event.key==='Enter')loadOrders()"></div><div class="notice" id="notice"></div><div id="orders"><div class="empty">正在读取正式订单...</div></div></div></main>
<div class="overlay" id="reprintOverlay" onclick="if(event.target===this)closeReprint()"><div class="modal"><h2>重印帧素材包</h2><p id="reprintSub"></p><div class="page-options" id="reprintPages"></div><label style="font-size:12px;font-weight:900">返工原因</label><textarea class="reason" id="reprintReason" placeholder="例如：裁切偏移，第 2 页需要重新打印"></textarea><div class="modal-foot"><button class="btn" onclick="closeReprint()">取消</button><button class="btn btn-black" id="reprintSubmit" onclick="submitReprint()">生成新帧包码并下载</button></div></div></div><div class="toast" id="toast"></div>
<script src="../js/auth.js?v=20260826-formal-orders"></script><script src="../js/admin-sidebar.js?v=20260826-formal-orders"></script>
<script>
const API=location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001',token=localStorage.getItem('mowo_token')||'',view=new URLSearchParams(location.search).get('view')||'all'
const stages={all:{label:'订单总览',status:'',desc:'所有正式订单都以总订单为单位展示；生产状态只能通过对应环节操作推进。'},paid:{label:'已付款',status:'PAID',desc:'用户已经付款，但尚未进入生产批次。请前往生产批次页选择完整总订单。'},pending:{label:'待处理',status:'PENDING_ADDRESS_EXPORT',desc:'已经进入生产批次，等待导出收件地址。导出后进入处理中。'},locked:{label:'处理中',status:'WAITING_TRACKING',desc:'地址已经导出，等待绑定快递面单。绑定后进入待生产。'},processing:{label:'待生产',status:'READY_FOR_PRODUCTION',desc:'面单已经绑定。导出生产资料后，打印线与材料线同时开始，订单进入生产中。'},producing:{label:'生产中',status:'PRODUCING',desc:'查看每件产品的帧包码与生产进度；打印损坏时从这里按页返工。'},ready:{label:'待发货',status:'READY_TO_SHIP',desc:'整单所有产品已经完成配对和装箱，可在扫码生产页确认发货。'},shipped:{label:'已发货',status:'SHIPPED',desc:'已经确认发货的正式订单，只读留档。'}},stageOrder=['all','paid','pending','locked','processing','producing','ready','shipped'],statusLabel={PAID:'已付款',PENDING_ADDRESS_EXPORT:'待处理',WAITING_TRACKING:'处理中',READY_FOR_PRODUCTION:'待生产',PRODUCING:'生产中',READY_TO_SHIP:'待发货',SHIPPED:'已发货'}
let rows=[],counts={},reprintUnit=null
function auth(){return {Authorization:`Bearer ${token}`}}function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2800)}function time(v){return v?new Date(v).toLocaleString('zh-CN'):'-'}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}
async function ensureStaff(){try{const u=await fetchCurrentUser();if(!u?.staffRole){location.href='index.html';return false}return true}catch{location.href='auth.html?redirect='+encodeURIComponent(location.pathname+location.search);return false}}
function renderStats(){document.getElementById('stats').innerHTML=stageOrder.map(key=>{const s=stages[key],n=key==='all'?Object.values(counts).reduce((a,b)=>a+b,0):(counts[s.status]||0);return `<div class="stat ${key===view?'active':''}" onclick="location.href='admin-orders.html?view=${key}'"><div class="stat-label">${s.label}</div><div class="stat-value">${n}</div></div>`}).join('')}
async function loadOrders(){const s=stages[view]||stages.all,notice=view==='paid'?'这里不直接创建另一套排产记录。点击“前往创建批次”，使用唯一的正式生产批次功能。':view==='all'?'此页面只展示正式总订单 SO、生产批次 PB、单件产品 PU 和帧素材包 FP，不再读取旧定制订单状态。':'每次操作都会推动正式总订单进入下一环节，并保留操作记录。';document.getElementById('pageTitle').textContent=s.label;document.getElementById('pageDesc').textContent='';document.getElementById('notice').textContent='';document.getElementById('stageHelpTitle').textContent=s.label;document.getElementById('stageHelpDesc').textContent=s.desc;document.getElementById('stageHelpNotice').textContent=notice;document.getElementById('orders').innerHTML='<div class="empty">正在加载...</div>';const p=new URLSearchParams;if(s.status)p.set('status',s.status);const q=document.getElementById('search').value.trim();if(q)p.set('q',q);const res=await fetch(`${API}/api/admin/production-workflow/orders?${p}`,{headers:auth()});const j=await res.json();if(!j.success){document.getElementById('orders').innerHTML=`<div class="empty">${esc(j.message||'加载失败')}</div>`;return}rows=j.data.orders||[];counts=j.data.counts||{};renderStats();renderOrders()}
function groupRows(){const groups=new Map;for(const o of rows){const key=o.batchId||'NO_BATCH';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(o)}return groups}
function groupAction(batchId){if(batchId==='NO_BATCH')return `<a class="btn btn-black" href="admin-production-batches.html">前往创建批次</a>`;if(view==='pending')return `<button class="btn btn-black" onclick="exportAddresses('${esc(batchId)}')">导出本批次地址</button>`;if(view==='locked')return `<button class="btn btn-black" onclick="submitTracking('${esc(batchId)}')">确认本批次面单</button>`;if(view==='processing')return `<button class="btn btn-black" onclick="exportProduction('${esc(batchId)}')">导出生产资料并开工</button>`;if(view==='producing')return `<a class="btn btn-black" href="production-scan.html?v=20260904-1#overview">进入扫码作业</a>`;if(view==='ready')return `<a class="btn btn-black" href="production-scan.html?v=20260904-1#packing">进入装箱发货</a>`;return `<a class="btn" href="admin-production-batches.html?batchId=${encodeURIComponent(batchId)}">查看批次</a>`}
function renderOrders(){const box=document.getElementById('orders');if(!rows.length){box.innerHTML='<div class="empty">当前环节没有订单</div>';return}box.innerHTML=[...groupRows()].map(([batchId,orders])=>`<section class="batch"><div class="batch-head"><div><div class="batch-no">${batchId==='NO_BATCH'?'尚未进入生产批次':esc(batchId)}</div><div class="batch-meta">${orders.length} 个总订单 · ${orders.reduce((n,o)=>n+o.itemCount,0)} 件商品</div></div><div class="actions">${groupAction(batchId)}</div></div>${orders.map(renderOrder).join('')}</section>`).join('')}
function renderOrder(o){return `<article class="order"><div class="order-head"><div><div class="order-no">${esc(o.orderNo)}</div><div class="order-sub">${o.itemCount} 件 · 支付 ${time(o.paidAt)}</div></div><div class="address">${esc(o.receiverName||'未填写')} · ${esc(o.receiverPhone||'')}<br>${esc((o.receiverCity||'')+' '+(o.receiverAddress||''))}${o.trackingNo?`<br>${esc(o.trackingCompany)} ${esc(o.trackingNo)}`:''}</div><span class="badge">${esc(statusLabel[o.fulfillmentStatus]||o.fulfillmentStatus)}</span></div>${view==='locked'?renderTracking(o):''}<div class="units">${o.units.map(renderUnit).join('')}</div></article>`}
function renderTracking(o){return `<div class="tracking-grid tracking-row" data-batch="${esc(o.batchId)}" data-order="${esc(o.orderNo)}"><input class="tracking-no" value="${esc(o.trackingNo||'')}" placeholder="快递单号"><input class="tracking-company" value="${esc(o.trackingCompany||'')}" placeholder="快递公司"></div>`}
function renderUnit(u){const active=u.framePacks.find(p=>p.isActive),voided=u.framePacks.filter(p=>!p.isActive),w=u.workflow||{},progress=u.workflow?`帧包 ${w.frameStatus||'-'} · 领料 ${w.materialStatus||'-'} · 配对 ${w.pairingStatus||'-'} · 装箱 ${w.packageStatus||'-'}`:'尚未进入批次',history=[active?`<span class="fp-active">当前 ${esc(active.code)}</span>`:'',...voided.map(p=>`<span class="fp-void" title="${esc(p.voidReason||'已作废')}">${esc(p.code)}</span>`)].filter(Boolean).join(' · '),canReprint=view==='producing'&&active&&['CREATED','IN_PROGRESS'].includes(active.status)&&Number(u.printPageCount)>0;return `<div class="unit"><div><div class="unit-no">${esc(u.productionNo)} · ${esc(u.title)}</div><div class="unit-spec">${esc(u.specification)}</div></div><div class="unit-state">${esc(progress)}${history?`<br>${history}`:''}${u.reprints.length?`<br>返工 ${u.reprints.length} 次`:''}</div><div class="actions">${canReprint?`<button class="btn btn-sm btn-yellow" onclick="openReprint('${esc(u.id)}')">重印</button>`:''}</div></div>`}
function detailedFailure(j){const rows=Array.isArray(j?.data)?j.data:[];if(!rows.length)return j?.message||'操作失败';return `${j.message||'操作失败'}\n\n${rows.map(row=>`${row.productionNo||row.orderNo||'-'} · ${row.specification||''}\n原因：${row.reason||'未知'}`).join('\n\n')}`}
async function fileAction(url,name){const res=await fetch(url,{method:'POST',headers:auth()});if(!res.ok){const j=await res.json().catch(()=>({}));alert(detailedFailure(j));return false}download(await res.blob(),name);await loadOrders();return true}
async function exportAddresses(id){if(confirm(`导出 ${id} 的收件地址，并让订单进入处理中？`))await fileAction(`${API}/api/admin/production-workflow/batches/${encodeURIComponent(id)}/export-addresses`,`${id}_收件地址.csv`)}
async function submitTracking(id){const entries=[...document.querySelectorAll('.tracking-row')].filter(r=>r.dataset.batch===id).map(r=>({orderNo:r.dataset.order,trackingNo:r.querySelector('.tracking-no').value.trim(),trackingCompany:r.querySelector('.tracking-company').value.trim()})).filter(x=>x.trackingNo||x.trackingCompany);if(!entries.length)return toast('请至少填写一张面单');const res=await fetch(`${API}/api/admin/production-workflow/batches/${encodeURIComponent(id)}/tracking`,{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({entries})}),j=await res.json();if(!j.success)return toast(j.message||'录入失败');toast(j.message);await loadOrders()}
async function exportProduction(id){if(confirm(`导出 ${id} 的 Word、帧包标签和材料清单，并让打印线与材料线开始生产？`))await fileAction(`${API}/api/admin/production-workflow/batches/${encodeURIComponent(id)}/export-production`,`${id}_生产资料.zip`)}
function openReprint(id){reprintUnit=rows.flatMap(o=>o.units).find(u=>u.id===id);if(!reprintUnit)return;document.getElementById('reprintSub').textContent=`${reprintUnit.productionNo} · 共 ${reprintUnit.printPageCount} 页。只勾选实际损坏的页；系统仍会生成新的 FP 码。`;document.getElementById('reprintPages').innerHTML=Array.from({length:reprintUnit.printPageCount},(_,i)=>`<label class="page-option"><input type="checkbox" value="${i+1}"> 第 ${i+1} 页</label>`).join('');document.getElementById('reprintReason').value='';document.getElementById('reprintOverlay').classList.add('show')}function closeReprint(){document.getElementById('reprintOverlay').classList.remove('show');reprintUnit=null}
async function submitReprint(){if(!reprintUnit)return;const pages=[...document.querySelectorAll('#reprintPages input:checked')].map(x=>Number(x.value)),reason=document.getElementById('reprintReason').value.trim();if(!pages.length)return toast('请选择需要重印的页');if(!reason)return toast('请填写返工原因');if(!confirm(`将作废当前帧包码，生成新的 FP 码，并只打印第 ${pages.join('、')} 页。继续吗？`))return;const btn=document.getElementById('reprintSubmit');btn.disabled=true;const res=await fetch(`${API}/api/admin/production-workflow/units/${encodeURIComponent(reprintUnit.id)}/reprint`,{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({pages,reason})}),j=await res.json();btn.disabled=false;if(!j.success)return toast(j.message||'返工失败');const file=await fetch(j.data.downloadUrl);download(await file.blob(),j.data.fileName);toast(j.message);closeReprint();await loadOrders()}
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarBackdrop').classList.add('show')}function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarBackdrop').classList.remove('show')}document.addEventListener('DOMContentLoaded',async()=>{if(await ensureStaff())loadOrders()})
</script></body></html>
