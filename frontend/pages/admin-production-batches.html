<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生产批次 - 哞屋后台</title>
<script src="../js/auth.js"></script>
<script src="../js/feature-flags.js"></script>
<style>
:root{--black:#111110;--white:#fff;--bg:#f5f3ef;--line:#deddd8;--muted:#777773;--yellow:#f5e642;--green:#278445;--orange:#b45b14;--red:#c93333;--sidebar-w:220px;--sidebar-collapsed:60px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--black);letter-spacing:0}.main{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .25s}.main.expanded{margin-left:var(--sidebar-collapsed)}
.topbar{height:62px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(245,243,239,.96);position:sticky;top:0;z-index:20}.topbar h1{font-size:19px}.top-actions{display:flex;gap:8px}.content{padding:24px 28px 48px;max-width:1500px;margin:auto}.btn{height:38px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 14px;font-weight:800;cursor:pointer}.btn:hover{border-color:#999}.btn-black{background:var(--black);color:#fff;border-color:var(--black)}.btn:disabled{opacity:.45;cursor:not-allowed}.menu-btn{display:none;width:38px;padding:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.stat-label{font-size:12px;color:var(--muted);font-weight:800}.stat-value{font-size:27px;font-weight:900;margin-top:6px}.layout{display:grid;grid-template-columns:minmax(430px,.9fr) minmax(540px,1.25fr);gap:16px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-title{font-size:15px;font-weight:900}.panel-sub{font-size:11px;color:var(--muted);margin-top:3px}.batch-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 18px;border-bottom:1px solid #ecebe7;cursor:pointer}.batch-row:hover,.batch-row.active{background:#fffdec}.batch-no{font-weight:900;font-size:13px}.batch-meta{font-size:11px;color:var(--muted);margin-top:5px}.badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:5px;font-size:11px;font-weight:900;background:#efefec}.badge-ready{background:#fff5b3}.badge-progress{background:#dcecff;color:#174e7c}.badge-complete{background:#dcefe2;color:#176832}.badge-warning{background:#fff0dc;color:#98460d}.badge-error{background:#ffe1e1;color:#a21d1d}.empty{padding:44px 20px;text-align:center;color:var(--muted);font-weight:700}.detail-body{padding:18px}.detail-title{font-size:20px;font-weight:900}.detail-meta{font-size:12px;color:var(--muted);margin-top:5px}.progress-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:16px 0}.progress-item{border-left:3px solid var(--line);padding:7px 9px;background:#faf9f6}.progress-num{font-size:18px;font-weight:900}.progress-label{font-size:10px;color:var(--muted);font-weight:800}.section{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.section h3{font-size:13px;margin-bottom:10px}.demand-row{display:grid;grid-template-columns:1fr repeat(3,74px);gap:8px;padding:9px 0;border-bottom:1px solid #ecebe7;font-size:12px;align-items:center}.demand-row strong{font-size:12px}.order{border-top:1px solid #ecebe7;padding:12px 0}.order:first-child{border-top:0}.order-head{display:flex;justify-content:space-between;gap:12px}.order-no{font-size:12px;font-weight:900}.order-address{font-size:10px;color:var(--muted);margin-top:3px}.unit{display:grid;grid-template-columns:minmax(150px,1fr) repeat(4,70px);gap:7px;align-items:center;margin-top:8px;padding:8px;background:#f7f6f2;font-size:10px}.unit strong{font-size:11px}.unit-state{font-weight:800;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:300}.overlay.show{display:flex}.modal{background:#fff;border-radius:8px;width:min(920px,100%);max-height:90vh;display:flex;flex-direction:column}.modal-head,.modal-foot{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.modal-foot{border-top:1px solid var(--line);border-bottom:0}.modal-body{padding:12px 20px;overflow:auto}.candidate{display:grid;grid-template-columns:28px minmax(180px,1fr) 90px minmax(220px,1.2fr);gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid #ecebe7}.candidate.disabled{opacity:.62}.candidate-no{font-size:12px;font-weight:900}.candidate-info{font-size:10px;color:var(--muted);margin-top:3px}.issue{font-size:11px;font-weight:700}.issue.error{color:var(--red)}.issue.warning{color:var(--orange)}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 16px;border-radius:7px;font-size:12px;font-weight:800;z-index:500;display:none}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:90}.sidebar-backdrop.show{display:block}
.filters{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px;padding:12px 20px;background:#f7f6f2;border-bottom:1px solid var(--line)}.filters input,.filters select{height:35px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 9px;font:inherit;font-size:11px}.filter-actions{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.filter-checks{display:flex;gap:12px;font-size:11px;font-weight:800}.print-row{display:grid;grid-template-columns:36px minmax(130px,1fr) 100px 65px;gap:8px;padding:8px 0;border-bottom:1px solid #ecebe7;font-size:11px;align-items:center}.mixed-note{color:var(--orange);font-size:10px;font-weight:800;margin-top:4px}
.workflow-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tracking-input{width:100%;min-height:170px;border:1px solid var(--line);border-radius:7px;padding:12px;font:12px/1.7 monospace;resize:vertical}.file-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #ecebe7;font-size:12px}.order-stage{font-size:10px;font-weight:900;color:#174e7c;margin-top:4px}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.main{margin-left:0!important}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.menu-btn{display:inline-block}.content{padding:16px}.topbar{padding:0 16px}.stats{grid-template-columns:1fr 1fr}.candidate{grid-template-columns:28px 1fr}.candidate>:nth-child(3),.candidate>:nth-child(4){grid-column:2}.progress-grid{grid-template-columns:repeat(2,1fr)}.unit{grid-template-columns:1fr 1fr}.unit strong{grid-column:1/-1}}
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>
<main class="main" id="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px"><button class="btn menu-btn" onclick="openSidebar()">☰</button><h1>生产批次</h1></div>
    <div class="top-actions"><button class="btn" onclick="loadAll()">刷新</button><button class="btn btn-black" onclick="openCreateModal()">创建生产批次</button></div>
  </header>
  <div class="content">
    <section class="stats">
      <div class="stat"><div class="stat-label">批次总数</div><div class="stat-value" id="statTotal">-</div></div>
      <div class="stat"><div class="stat-label">已创建</div><div class="stat-value" id="statReady">-</div></div>
      <div class="stat"><div class="stat-label">生产中</div><div class="stat-value" id="statProgress">-</div></div>
      <div class="stat"><div class="stat-label">异常待处理</div><div class="stat-value" id="statExceptions">-</div></div>
    </section>
    <div class="layout">
      <section class="panel"><div class="panel-head"><div><div class="panel-title">批次记录</div><div class="panel-sub">创建批次和下载文件已经分开，重复查看不会改变库存</div></div></div><div id="batchList"><div class="empty">正在加载...</div></div></section>
      <section class="panel"><div class="panel-head"><div><div class="panel-title">批次详情</div><div class="panel-sub">帧包和领料是两条并行工作线</div></div></div><div id="batchDetail"><div class="empty">从左侧选择一个生产批次</div></div></section>
    </div>
  </div>
</main>

<div class="overlay" id="createOverlay" onclick="if(event.target===this)closeCreateModal()">
  <div class="modal">
    <div class="modal-head"><div><div class="panel-title">创建生产批次</div><div class="panel-sub">选择的是完整总订单，订单内所有生产件会一起进入批次</div></div><button class="btn" onclick="closeCreateModal()">关闭</button></div>
    <div class="filters"><input id="filterPaidFrom" type="date" title="支付开始日期"><input id="filterPaidTo" type="date" title="支付结束日期"><input id="filterOrderNo" placeholder="订单号"><select id="filterPlatform"><option value="">全部来源</option><option value="SELF">本站</option><option value="TAOBAO">淘宝</option><option value="DOUYIN">抖音</option><option value="XHS">小红书</option></select><select id="filterModel"><option value="">全部款式</option></select><select id="filterSku"><option value="">全部 SKU</option></select><select id="filterSize"><option value="">全部尺寸</option></select><select id="filterFrame"><option value="">全部帧数</option></select><select id="filterPrintGroup"><option value="">全部打印裁切组</option></select><div class="filter-actions"><div class="filter-checks"><label><input id="filterReady" type="checkbox"> 只看资料完整</label><label><input id="filterKit" type="checkbox"> 只看材料充足</label></div><div><button class="btn" onclick="resetFilters()">重置</button> <button class="btn" onclick="selectCurrent()">全选当前结果</button> <button class="btn btn-black" onclick="loadCandidates()">筛选</button></div></div></div>
    <div class="modal-body" id="candidateList"><div class="empty">正在检查待生产订单...</div></div>
    <div class="modal-foot"><div style="font-size:12px;font-weight:800">已选择 <span id="selectedCount">0</span> 个总订单 · <span id="selectedUnits">0</span> 件 · 已确认约 <span id="selectedPages">0</span> 页<span id="selectedUnknown"></span></div><button class="btn btn-black" id="createBtn" onclick="createBatch()" disabled>确认创建</button></div>
  </div>
</div>
<div class="overlay" id="trackingOverlay" onclick="if(event.target===this)closeTrackingModal()">
  <div class="modal" style="width:min(680px,100%)">
    <div class="modal-head"><div><div class="panel-title">绑定快递面单</div><div class="panel-sub">每行填写：总订单号, 快递单号, 快递公司</div></div><button class="btn" onclick="closeTrackingModal()">关闭</button></div>
    <div class="modal-body"><textarea class="tracking-input" id="trackingInput" placeholder="SO-20260826-XXXXXXXX, SF1234567890, 顺丰"></textarea></div>
    <div class="modal-foot"><span class="panel-sub">面单绑定后，地址和订单内容锁定并进入待生产。</span><button class="btn btn-black" onclick="submitTracking()">确认绑定</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/admin-sidebar.js"></script>
<script>
const API = location.hostname === '127.0.0.1' ? 'http://127.0.0.1:3001' : 'http://localhost:3001'
const token = localStorage.getItem('mowo_token') || ''
let batches = [], candidates = [], candidateMeta = {}, selected = new Set(), activeBatchId = null
const statusText = {READY:'已创建',IN_PROGRESS:'生产中',COMPLETED:'生产完成',ARCHIVED:'已归档',Open:'旧批次',Locked:'旧批次',Processing:'旧批次'}
const stateText = {WAITING:'待处理',COMPLETED:'已完成',PICKED:'已领取',NORMAL:'正常'}
const fulfillmentText = {PAID:'已付款',PENDING_ADDRESS_EXPORT:'待处理',WAITING_TRACKING:'处理中',READY_FOR_PRODUCTION:'待生产',PRODUCING:'生产中',READY_TO_SHIP:'待发货',SHIPPED:'已发货'}
function auth(){return {Authorization:`Bearer ${token}`}}
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2600)}
function formatTime(value){return value?new Date(value).toLocaleString('zh-CN'):'-'}
function badge(status){const cls=status==='READY'?'badge-ready':status==='IN_PROGRESS'?'badge-progress':status==='COMPLETED'?'badge-complete':'';return `<span class="badge ${cls}">${esc(statusText[status]||status)}</span>`}
async function ensureStaff(){try{const user=await fetchCurrentUser();if(!user?.staffRole){location.href='index.html';return false}return true}catch{location.href='auth.html?redirect='+encodeURIComponent(location.pathname);return false}}
async function loadAll(){const res=await fetch(`${API}/api/admin/production-batches`,{headers:auth()});const json=await res.json();if(!json.success)return toast(json.message||'加载失败');batches=json.data||[];renderStats();renderBatches();if(activeBatchId&&batches.some(b=>b.id===activeBatchId))loadDetail(activeBatchId)}
function renderStats(){document.getElementById('statTotal').textContent=batches.length;document.getElementById('statReady').textContent=batches.filter(b=>b.status==='READY').length;document.getElementById('statProgress').textContent=batches.filter(b=>b.status==='IN_PROGRESS').length;document.getElementById('statExceptions').textContent=batches.reduce((n,b)=>n+(b.progress?.exceptions||0),0)}
function renderBatches(){const box=document.getElementById('batchList');if(!batches.length){box.innerHTML='<div class="empty">还没有正式生产批次</div>';return}box.innerHTML=batches.map(b=>`<div class="batch-row ${b.id===activeBatchId?'active':''}" onclick="loadDetail('${esc(b.id)}')"><div><div class="batch-no">${esc(b.id)}</div><div class="batch-meta">${formatTime(b.createdAt)} · ${b.salesOrderCount} 单 · ${b.productionUnitCount} 件 · ${b.skuCount} 种 SKU${b.legacy?' · 旧批次':''}</div></div><div>${badge(b.status)}${b.warningCount?`<div class="badge badge-warning" style="margin-top:5px">${b.warningCount} 条提醒</div>`:''}</div></div>`).join('')}
async function loadDetail(id){activeBatchId=id;renderBatches();document.getElementById('batchDetail').innerHTML='<div class="empty">正在加载批次详情...</div>';const res=await fetch(`${API}/api/admin/production-batches/${encodeURIComponent(id)}`,{headers:auth()});const json=await res.json();if(!json.success){document.getElementById('batchDetail').innerHTML=`<div class="empty">${esc(json.message||'加载失败')}</div>`;return}renderDetail(json.data);renderPrintQueue(json.data)}
function renderDetail(data){if(data.legacy){document.getElementById('batchDetail').innerHTML=`<div class="detail-body"><div class="detail-title">${esc(data.batch.id)}</div><div class="empty">这是旧流程产生的批次，尚没有完整总订单和单件冻结关系，仅保留只读兼容。</div></div>`;return}const p=data.progress;const warnings=data.batch.warnings||[];document.getElementById('batchDetail').innerHTML=`<div class="detail-body"><div style="display:flex;justify-content:space-between;gap:12px"><div><div class="detail-title">${esc(data.batch.id)}</div><div class="detail-meta">${formatTime(data.batch.createdAt)} · ${data.batch.salesOrderCount} 个总订单 · ${data.batch.productionUnitCount} 个生产件</div></div>${badge(data.batch.status)}</div><div class="workflow-actions"><button class="btn" onclick="exportAddresses()">导出地址</button><button class="btn" onclick="openTrackingModal()">填写面单</button><button class="btn btn-black" onclick="exportProduction()">导出生产资料</button><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit" href="production-scan.html?tab=pair">进入扫码生产</a></div>${warnings.length?`<div class="section"><h3>创建时提醒</h3>${warnings.map(w=>`<div class="issue warning">${esc(w.message)}</div>`).join('')}</div>`:''}<div class="progress-grid"><div class="progress-item"><div class="progress-num">${p.frameCompleted}/${p.total}</div><div class="progress-label">帧包完成</div></div><div class="progress-item"><div class="progress-num">${p.materialPicked}/${p.total}</div><div class="progress-label">材料已领</div></div><div class="progress-item"><div class="progress-num">${p.paired}/${p.total}</div><div class="progress-label">已经配对</div></div><div class="progress-item"><div class="progress-num">${p.packaged}/${p.total}</div><div class="progress-label">完成装箱</div></div><div class="progress-item"><div class="progress-num">${p.exceptions}</div><div class="progress-label">异常</div></div></div><div class="section"><h3>本批次可打印 Word</h3>${(data.productionFiles||[]).map(f=>`<div class="file-row"><div><strong>${esc(f.displayName)}</strong><div class="panel-sub">${f.targetFrameCount}帧 · ${formatTime(f.createdAt)}</div></div><a class="btn" href="${esc(f.downloadUrl)}">下载</a></div>`).join('')||'<div class="issue warning">尚未生成可打印 Word，不能开始生产。</div>'}</div><div class="section"><h3>标准材料包需求</h3><div class="demand-row" style="font-weight:900"><span>SKU</span><span>需要</span><span>可用</span><span>已领</span></div>${data.materialDemand.map(d=>`<div class="demand-row"><strong>${esc(d.skuCode||d.skuId)}</strong><span>${d.required}</span><span class="${d.available<d.required?'issue warning':''}">${d.available}</span><span>${d.picked}</span></div>`).join('')}</div><div class="section"><h3>总订单与生产件</h3>${data.orders.map(renderOrder).join('')}</div></div>`}
function renderPrintQueue(data){if(data.legacy)return;const anchor=document.querySelector('#batchDetail .progress-grid');if(!anchor)return;anchor.insertAdjacentHTML('afterend',`<div class="section"><h3>帧素材打印顺序</h3>${(data.printQueue||[]).map(q=>`<div class="print-row"><strong>${q.sequence||'-'}</strong><div><strong>${esc(q.productionNo)}</strong><br><span>${esc(q.groupName||'未配置')}</span></div><span>${esc(q.rule?.size||'')} · ${q.rule?.frameCount||'-'}帧</span><span>${q.pageCount||'-'}页</span></div>`).join('')||'<div class="empty">没有打印顺序</div>'}</div>`)}
function renderOrder(o){return `<div class="order"><div class="order-head"><div><div class="order-no">${esc(o.orderNo)}</div><div class="order-stage">${esc(fulfillmentText[o.fulfillmentStatus]||o.fulfillmentStatus)}${o.trackingNo?` · ${esc(o.trackingCompany)} ${esc(o.trackingNo)}`:''}</div><div class="order-address">${esc(o.receiverName)} · ${esc(o.receiverCity||'')} ${esc(o.receiverAddress||'')}</div></div><span class="badge">${o.items.reduce((n,i)=>n+i.quantity,0)} 件</span></div>${o.items.flatMap(i=>i.productionUnits.map(u=>{const w=u.workflow||{};return `<div class="unit"><strong>${esc(u.productionNo)}${u.framePack?`<br><span style="color:#174e7c">${esc(u.framePack.code)}</span>`:''}<br><span style="font-weight:700;color:var(--muted)">${esc(u.specification)}</span></strong><span class="unit-state">帧包 ${stateText[w.frameStatus]||w.frameStatus}</span><span class="unit-state">领料 ${stateText[w.materialStatus]||w.materialStatus}</span><span class="unit-state">配对 ${stateText[w.pairingStatus]||w.pairingStatus}</span><span class="unit-state">装箱 ${stateText[w.packageStatus]||w.packageStatus}</span></div>`})).join('')}</div>`}
async function downloadAction(url,options,filename){const res=await fetch(url,options);if(!res.ok){const json=await res.json().catch(()=>({}));toast(json.message||'操作失败');return false}const blob=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);await loadDetail(activeBatchId);await loadAll();return true}
async function exportAddresses(){if(!activeBatchId)return;await downloadAction(`${API}/api/admin/production-workflow/batches/${encodeURIComponent(activeBatchId)}/export-addresses`,{method:'POST',headers:auth()},`${activeBatchId}_收件地址.csv`)}
function openTrackingModal(){if(!activeBatchId)return;document.getElementById('trackingOverlay').classList.add('show')}
function closeTrackingModal(){document.getElementById('trackingOverlay').classList.remove('show')}
async function submitTracking(){const entries=document.getElementById('trackingInput').value.split(/\r?\n/).map(line=>line.split(/[,，\t]/).map(x=>x.trim())).filter(x=>x.some(Boolean)).map(([orderNo,trackingNo,trackingCompany])=>({orderNo,trackingNo,trackingCompany}));const res=await fetch(`${API}/api/admin/production-workflow/batches/${encodeURIComponent(activeBatchId)}/tracking`,{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({entries})});const json=await res.json();if(!json.success)return toast(json.message||'绑定失败');toast(json.message);closeTrackingModal();document.getElementById('trackingInput').value='';await loadDetail(activeBatchId)}
async function exportProduction(){if(!activeBatchId)return;await downloadAction(`${API}/api/admin/production-workflow/batches/${encodeURIComponent(activeBatchId)}/export-production`,{method:'POST',headers:auth()},`${activeBatchId}_生产资料.zip`)}
async function openCreateModal(){document.getElementById('createOverlay').classList.add('show');selected.clear();updateSelected();await loadCandidates()}
async function loadCandidates(){document.getElementById('candidateList').innerHTML='<div class="empty">正在检查待生产订单...</div>';const params=new URLSearchParams;for(const [id,key] of [['filterPaidFrom','paidFrom'],['filterPaidTo','paidTo'],['filterOrderNo','orderNo'],['filterPlatform','platform'],['filterModel','modelId'],['filterSku','skuId'],['filterSize','size'],['filterFrame','frameCount'],['filterPrintGroup','printGroupId']]){const v=document.getElementById(id).value;if(v)params.set(key,v)}if(document.getElementById('filterReady').checked)params.set('readyOnly','true');if(document.getElementById('filterKit').checked)params.set('kitAvailableOnly','true');const res=await fetch(`${API}/api/admin/production-batches/candidates?${params}`,{headers:auth()});const json=await res.json();if(!json.success){document.getElementById('candidateList').innerHTML=`<div class="empty">${esc(json.message||'加载失败')}</div>`;return}candidates=json.data||[];candidateMeta=json.meta||{};fillFilterOptions();renderCandidates();updateSelected()}
function fillSelect(id,first,items,value,label){const el=document.getElementById(id),current=el.value;el.innerHTML=`<option value="">${first}</option>`+items.map(x=>`<option value="${esc(value(x))}">${esc(label(x))}</option>`).join('');el.value=current}
function fillFilterOptions(){fillSelect('filterModel','全部款式',candidateMeta.models||[],x=>x.id,x=>x.name);fillSelect('filterSku','全部 SKU',candidateMeta.skus||[],x=>x.id,x=>`${x.modelName} · ${x.code||x.size+' '+x.frameCount+'帧'}`);fillSelect('filterSize','全部尺寸',candidateMeta.sizes||[],x=>x,x=>x);fillSelect('filterFrame','全部帧数',candidateMeta.frameCounts||[],x=>x,x=>`${x}帧`);fillSelect('filterPrintGroup','全部打印裁切组',candidateMeta.printGroups||[],x=>x.id,x=>x.name)}
function closeCreateModal(){document.getElementById('createOverlay').classList.remove('show')}
function renderCandidates(){const box=document.getElementById('candidateList');if(!candidates.length){box.innerHTML='<div class="empty">没有符合条件的待生产总订单</div>';return}box.innerHTML=candidates.map(c=>{const issues=[...c.hardBlocks.map(x=>`<div class="issue error">阻止：${esc(x.message)}</div>`),...c.warnings.map(x=>`<div class="issue warning">提醒：${esc(x.message)}</div>`)].join('')||'<div class="issue" style="color:var(--green)">资料完整，可以进入批次</div>';const mixed=c.includesUnmatchedItems?`<div class="mixed-note">筛选命中 ${c.matchedUnitCount} 件；另有 ${c.extraUnitCount} 件会随整张订单一并加入</div>`:'';const unknown=c.unconfiguredPrintUnitCount?` · ${c.unconfiguredPrintUnitCount}件打印方式待确认`:'';return `<label class="candidate ${c.ready?'':'disabled'}"><input type="checkbox" ${c.ready?'':'disabled'} ${selected.has(c.id)?'checked':''} onchange="toggleCandidate('${c.id}',this.checked)"><div><div class="candidate-no">${esc(c.orderNo)}</div><div class="candidate-info">${esc(c.receiverName)} · ${c.itemCount} 种商品 · ${c.productionUnitCount} 件 · 已确认约${c.estimatedPrintPages}页${unknown}</div>${mixed}</div><span class="badge ${c.ready?'badge-complete':'badge-error'}">${c.ready?'可选择':'暂不可生产'}</span><div>${issues}</div></label>`}).join('')}
function toggleCandidate(id,checked){checked?selected.add(id):selected.delete(id);updateSelected()}
function updateSelected(){for(const id of [...selected])if(!candidates.some(c=>c.id===id))selected.delete(id);const rows=candidates.filter(c=>selected.has(c.id)),unknown=rows.reduce((n,c)=>n+(c.unconfiguredPrintUnitCount||0),0);document.getElementById('selectedCount').textContent=selected.size;document.getElementById('selectedUnits').textContent=rows.reduce((n,c)=>n+c.productionUnitCount,0);document.getElementById('selectedPages').textContent=rows.reduce((n,c)=>n+c.estimatedPrintPages,0);document.getElementById('selectedUnknown').textContent=unknown?` · ${unknown}件待确认`:'';document.getElementById('createBtn').disabled=!selected.size}
function selectCurrent(){candidates.filter(c=>c.ready).forEach(c=>selected.add(c.id));renderCandidates();updateSelected()}
function resetFilters(){for(const id of ['filterPaidFrom','filterPaidTo','filterOrderNo','filterPlatform','filterModel','filterSku','filterSize','filterFrame','filterPrintGroup'])document.getElementById(id).value='';document.getElementById('filterReady').checked=false;document.getElementById('filterKit').checked=false;loadCandidates()}
async function createBatch(acknowledgeWarnings=false){if(!selected.size)return;const btn=document.getElementById('createBtn');btn.disabled=true;const res=await fetch(`${API}/api/admin/production-batches`,{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({salesOrderIds:[...selected],acknowledgeWarnings})});const json=await res.json();btn.disabled=false;if(res.status===409&&json.code==='BATCH_WARNINGS_REQUIRE_ACK'){if(confirm(`${json.message}\n\n${(json.data||[]).map(x=>x.message).join('\n')}\n\n仍然创建这个生产批次吗？`))return createBatch(true);return}if(!json.success)return toast(json.message||'创建失败');closeCreateModal();toast('生产批次已创建');activeBatchId=json.data.batchId;await loadAll();await loadDetail(activeBatchId)}
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarBackdrop').classList.add('show')}function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarBackdrop').classList.remove('show')}
document.addEventListener('DOMContentLoaded',async()=>{if(await ensureStaff())loadAll()})
</script>
</body>
</html>
