<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知中心 — 哞屋创作者中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;--accent-b:#7EC8E3;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --sidebar-w:240px;--topbar-h:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--cream);color:var(--black);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}

/* ── 侧栏 ── */
.sidebar{width:var(--sidebar-w);background:var(--black);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:800;transition:transform .35s var(--ease);}
@media(max-width:1023px){.sidebar{transform:translateX(-100%);}.sidebar.open{transform:none;}}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.sidebar-logo-mark{width:36px;height:36px;border-radius:10px;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--black);flex-shrink:0;}
.sidebar-logo-cn{font-weight:900;font-size:16px;color:var(--white);}
.sidebar-logo-sub{font-weight:700;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);}
.sidebar-user{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.sidebar-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:var(--black);flex-shrink:0;border:2px solid rgba(255,255,255,.1);}
.sidebar-user-name{font-weight:800;font-size:13px;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sidebar-user-badge{display:inline-flex;align-items:center;gap:3px;margin-top:2px;font-weight:800;font-size:10px;letter-spacing:.06em;padding:1px 7px;border-radius:999px;background:rgba(143,214,148,.15);color:var(--accent-g);}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px;}
.sidebar-nav::-webkit-scrollbar{width:0;}
.nav-sec{font-weight:800;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);padding:8px 10px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;font-weight:800;font-size:13px;color:rgba(255,255,255,.55);transition:background .15s,color .15s;position:relative;white-space:nowrap;margin-bottom:2px;}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85);}
.nav-item.active{background:rgba(255,255,255,.1);color:var(--white);}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent-y);}
.nav-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:rgba(255,255,255,.05);}
.nav-item.active .nav-icon{background:rgba(245,230,66,.15);}
.sidebar-bottom{padding:12px 10px 20px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0;}
.cert-v{background:rgba(143,214,148,.08);border:1px solid rgba(143,214,148,.15);border-radius:14px;padding:12px 14px;}
.cert-vt{font-weight:900;font-size:13px;color:var(--accent-g);}
.cert-vd{font-weight:700;font-size:11px;color:rgba(255,255,255,.35);margin-top:2px;}
.cert-vb{margin-top:8px;padding:5px 14px;border-radius:999px;background:rgba(143,214,148,.15);color:var(--accent-g);font-weight:800;font-size:11px;cursor:default;}
.backdrop{display:none;position:fixed;inset:0;z-index:799;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);}
.backdrop.show{display:block;}

/* ── 顶栏 ── */
.topbar{position:fixed;top:0;right:0;left:var(--sidebar-w);z-index:700;height:var(--topbar-h);background:rgba(245,243,239,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--gray1);display:flex;align-items:center;justify-content:space-between;padding:0 32px;}
@media(max-width:1023px){.topbar{left:0;padding:0 20px;}}
.topbar-left{display:flex;align-items:center;gap:14px;}
.menu-btn{width:36px;height:36px;border-radius:10px;background:var(--gray1);display:none;align-items:center;justify-content:center;font-size:16px;}
@media(max-width:1023px){.menu-btn{display:flex;}}
.bc-home{font-weight:700;font-size:13px;color:var(--gray3);transition:color .2s;}
.bc-home:hover{color:var(--black);}
.bc-sep{color:var(--gray2);font-size:12px;margin:0 6px;}
.bc-cur{font-weight:900;font-size:14px;color:var(--black);}
.topbar-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);border:2px solid var(--gray1);}

/* ── 主区 ── */
.main{margin-left:var(--sidebar-w);padding-top:var(--topbar-h);}
@media(max-width:1023px){.main{margin-left:0;}}
.inner{padding:32px;max-width:760px;}
@media(max-width:640px){.inner{padding:20px 16px 60px;}}

/* ── 通用 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font);font-weight:800;font-size:13px;padding:10px 22px;border-radius:999px;min-height:44px;transition:all .2s;cursor:pointer;border:none;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-ghost{background:var(--white);color:var(--black);border:1.5px solid var(--gray1);}
.btn-ghost:hover{border-color:var(--black);}
.btn-sm{font-size:12px;padding:7px 16px;min-height:34px;}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease),transform .55s var(--ease);}
.reveal.on{opacity:1;transform:none;}
.d1{transition-delay:.06s}.d2{transition-delay:.12s}

/* ── 通知卡片 ── */
.notif-list{display:flex;flex-direction:column;gap:10px;}
.notif-card{background:var(--white);border-radius:18px;border:1.5px solid var(--gray1);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;transition:border-color .2s,box-shadow .2s;cursor:default;position:relative;}
.notif-card.unread{border-color:#FFE082;background:#FFFDE7;box-shadow:0 2px 12px rgba(245,230,66,.12);}
.notif-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06);}
.notif-icon{width:40px;height:40px;border-radius:12px;background:var(--gray1);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.notif-icon.approved{background:rgba(143,214,148,.2);}
.notif-icon.rejected{background:rgba(255,107,53,.12);}
.notif-icon.offshelf{background:rgba(200,200,200,.2);}
.notif-body{flex:1;min-width:0;}
.notif-title{font-weight:900;font-size:14px;margin-bottom:4px;}
.notif-msg{font-weight:700;font-size:13px;color:var(--gray3);line-height:1.6;}
.notif-time{font-weight:700;font-size:11px;color:var(--gray2);margin-top:6px;}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-o);position:absolute;top:14px;right:14px;flex-shrink:0;}

/* ── 空状态 ── */
.empty{padding:64px 20px;text-align:center;background:var(--white);border-radius:22px;border:1.5px dashed var(--gray2);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-weight:900;font-size:15px;margin-bottom:6px;}
.empty-sub{font-weight:700;font-size:13px;color:var(--gray3);line-height:1.6;}

/* ── 骨架 ── */
.skeleton{background:linear-gradient(90deg,var(--gray1) 25%,var(--cream) 50%,var(--gray1) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.sk-card{background:var(--white);border-radius:18px;border:1.5px solid var(--gray1);padding:16px 18px;margin-bottom:10px;}
.sk-line{height:13px;border-radius:6px;margin-bottom:9px;}

/* ── Toast ── */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:9000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

<!-- ── 侧栏 ── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-mark">哞</div>
    <div style="line-height:1.2;"><p class="sidebar-logo-cn">创作者中心</p><p class="sidebar-logo-sub">MOWO Studio</p></div>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-avatar" id="sidebarAvatar">创</div>
    <div style="flex:1;min-width:0;">
      <p class="sidebar-user-name" id="sidebarName">加载中…</p>
      <span class="sidebar-user-badge">✦ 认证创作者</span>
    </div>
  </div>
  <nav class="sidebar-nav">
    <p class="nav-sec">数据中心</p>
    <a href="creator-dashboard.html"  class="nav-item"><span class="nav-icon">📊</span>数据总览</a>
    <a href="creator-earnings.html"   class="nav-item"><span class="nav-icon">💰</span>收益与提现</a>
    <p class="nav-sec" style="margin-top:12px;">创作管理</p>
    <a href="creator-animations.html" class="nav-item"><span class="nav-icon">🎬</span>我的动画</a>
    <a href="creator-collab.html"     class="nav-item"><span class="nav-icon">🎨</span>我的联名</a>
    <a href="creator-links.html"      class="nav-item"><span class="nav-icon">🔗</span>引流链接</a>
    <p class="nav-sec" style="margin-top:12px;">系统</p>
    <a href="creator-notifications.html" class="nav-item active" id="navNotif">
      <span class="nav-icon">🔔</span>通知
    </a>
  </nav>
  <div class="sidebar-bottom">
    <div class="cert-v">
      <p class="cert-vt">✦ 已认证创作者</p>
      <p class="cert-vd">创作者认证有效</p>
      <button class="cert-vb">认证有效 ✓</button>
    </div>
  </div>
</aside>

<!-- ── 顶栏 ── -->
<header class="topbar">
  <div class="topbar-left">
    <button class="menu-btn" onclick="openSidebar()">☰</button>
    <div style="display:flex;align-items:center;">
      <a href="index.html" class="bc-home">哞屋</a>
      <span class="bc-sep">›</span>
      <span class="bc-cur">通知中心</span>
    </div>
  </div>
  <div class="topbar-avatar" id="topbarAvatar"></div>
</header>

<!-- ── 主内容 ── -->
<main class="main">
  <div class="inner">

    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px;" class="reveal">
      <div>
        <h1 style="font-weight:900;font-size:26px;letter-spacing:-.02em;margin-bottom:6px;">通知中心</h1>
        <p style="font-weight:700;font-size:13px;color:var(--gray3);">审核结果、上下架动态会在这里通知你</p>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="markAllRead()" id="btnReadAll">全部已读</button>
    </div>

    <!-- 骨架 -->
    <div id="notifSkeleton" class="reveal d1">
      <div class="sk-card"><div class="sk-line skeleton" style="width:60%"></div><div class="sk-line skeleton" style="width:80%"></div></div>
      <div class="sk-card"><div class="sk-line skeleton" style="width:55%"></div><div class="sk-line skeleton" style="width:75%"></div></div>
      <div class="sk-card"><div class="sk-line skeleton" style="width:65%"></div><div class="sk-line skeleton" style="width:70%"></div></div>
    </div>

    <!-- 列表 -->
    <div class="notif-list reveal d2" id="notifList" style="display:none;"></div>

    <!-- 空状态 -->
    <div class="empty reveal d1" id="notifEmpty" style="display:none;">
      <div class="empty-icon">🔔</div>
      <p class="empty-text">暂无通知</p>
      <p class="empty-sub">审核结果、上下架、修改申请结果会在这里推送</p>
    </div>

    <!-- 加载更多 -->
    <div style="text-align:center;margin-top:20px;" id="loadMoreWrap" style="display:none;">
      <button class="btn btn-ghost btn-sm" onclick="loadMore()" id="btnLoadMore">加载更多</button>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const CAPI = (location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001')
const BASE = location.pathname.includes('/pages/') ? '../pages/' : './'

let page  = 1
let total = 0

function getToken() { return localStorage.getItem('mowo_token') }

function requireCreator() {
  const raw = localStorage.getItem('mowo_user')
  if (!raw) { location.href = BASE + 'auth.html'; return false }
  const u = JSON.parse(raw)
  if (u.certifyStatus !== 2) { location.href = BASE + 'index.html'; return false }
  const nick = u.nickname || u.phone || '创'
  const char = nick.slice(-1).toUpperCase()
  ;['topbarAvatar','sidebarAvatar'].forEach(id => {
    const el = document.getElementById(id); if(el) el.textContent = char
  })
  const nameEl = document.getElementById('sidebarName')
  if (nameEl) nameEl.textContent = nick
  return true
}

function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('backdrop').classList.add('show') }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('backdrop').classList.remove('show') }

let toastTimer
function showToast(msg, dur=2400) {
  const el = document.getElementById('toast')
  el.textContent = msg; el.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.classList.remove('show'), dur)
}

const typeMap = {
  approved:          { icon: '✅', iconCls: 'approved', title: '作品审核通过' },
  rejected:          { icon: '❌', iconCls: 'rejected', title: '作品审核未通过' },
  offshelf:          { icon: '📦', iconCls: 'offshelf', title: '作品已下架' },
  onshelf:           { icon: '🛍️', iconCls: 'approved', title: '作品已上架' },
  revision_approved: { icon: '✅', iconCls: 'approved', title: '修改申请通过' },
  revision_rejected: { icon: '❌', iconCls: 'rejected', title: '修改申请未通过' },
}

function fmtTime(iso) {
  if (!iso) return ''
  const d   = new Date(iso)
  const now = new Date()
  const diff = now - d
  if (diff < 60000)     return '刚刚'
  if (diff < 3600000)   return `${Math.floor(diff/60000)}分钟前`
  if (diff < 86400000)  return `${Math.floor(diff/3600000)}小时前`
  if (diff < 604800000) return `${Math.floor(diff/86400000)}天前`
  return `${d.getMonth()+1}月${d.getDate()}日`
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function renderCard(n) {
  const t   = typeMap[n.type] || { icon: '🔔', iconCls: '', title: n.type }
  const unread = !n.isRead
  return `
  <div class="notif-card${unread?' unread':''}" id="notifCard_${n.id}" onclick="goToApplyNotif()" style="cursor:pointer;">
    <div class="notif-icon ${t.iconCls}">${t.icon}</div>
    <div class="notif-body">
      <p class="notif-title">${t.title}</p>
      <p class="notif-msg">${escHtml(n.message || n.workTitle)}</p>
      <p class="notif-time">${fmtTime(n.createdAt)}</p>
    </div>
    ${unread ? '<div class="notif-dot"></div>' : ''}
  </div>`
}

function goToApplyNotif() {
  location.href = 'creator-collab.html?tab=notif'
}

async function loadNotifications(reset = false) {
  if (reset) { page = 1 }
  const skeleton = document.getElementById('notifSkeleton')
  const list     = document.getElementById('notifList')
  const empty    = document.getElementById('notifEmpty')

  if (reset) {
    skeleton.style.display = ''
    list.style.display     = 'none'
    list.innerHTML         = ''
    empty.style.display    = 'none'
  }

  try {
    const res  = await fetch(`${CAPI}/api/creator/notifications?page=${page}&limit=20`, {
      headers: { Authorization: `Bearer ${getToken()}` }
    })
    const json = await res.json()
    skeleton.style.display = 'none'
    if (!json.success) throw new Error(json.message)

    total = json.data.total
    const items = json.data.notifications || []

    if (reset && !items.length) {
      empty.style.display = ''
      document.getElementById('loadMoreWrap').style.display = 'none'
      return
    }

    list.style.display = ''
    list.innerHTML += items.map(renderCard).join('')

    const loaded = list.querySelectorAll('.notif-card').length
    const loadMoreWrap = document.getElementById('loadMoreWrap')
    if (loaded < total) {
      loadMoreWrap.style.display = ''
    } else {
      loadMoreWrap.style.display = 'none'
    }
  } catch(e) {
    skeleton.style.display = 'none'
    if (!document.querySelector('.notif-card')) {
      empty.style.display = ''
    }
  }
}

async function loadMore() {
  page++
  const btn = document.getElementById('btnLoadMore')
  btn.disabled = true; btn.textContent = '加载中…'
  await loadNotifications(false)
  btn.disabled = false; btn.textContent = '加载更多'
}

async function markRead(id, cardEl) {
  if (!cardEl.classList.contains('unread')) return
  try {
    await fetch(`${CAPI}/api/creator/notifications/${id}/read`, {
      method: 'POST', headers: { Authorization: `Bearer ${getToken()}` }
    })
    cardEl.classList.remove('unread')
    const dot = cardEl.querySelector('.notif-dot')
    if (dot) dot.remove()
  } catch(e) {}
}

async function markAllRead() {
  const btn = document.getElementById('btnReadAll')
  btn.disabled = true; btn.textContent = '处理中…'
  try {
    const res  = await fetch(`${CAPI}/api/creator/notifications/read-all`, {
      method: 'POST', headers: { Authorization: `Bearer ${getToken()}` }
    })
    const json = await res.json()
    if (!json.success) throw new Error(json.message)
    document.querySelectorAll('.notif-card.unread').forEach(el => {
      el.classList.remove('unread')
      const dot = el.querySelector('.notif-dot')
      if (dot) dot.remove()
    })
    showToast('已全部标记为已读')
  } catch(e) {
    showToast('操作失败：' + e.message, 3000)
  } finally {
    btn.disabled = false; btn.textContent = '全部已读'
  }
}

function initReveal() {
  const els = document.querySelectorAll('.reveal')
  const io  = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target) } })
  }, { threshold: 0.05 })
  els.forEach(el => io.observe(el))
}

document.addEventListener('DOMContentLoaded', () => {
  if (!requireCreator()) return
  initReveal()
  loadNotifications(true)
})
</script>
<script src="../js/feature-flags.js"></script>
</body>
</html>
