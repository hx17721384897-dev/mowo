<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料领用 - 哞屋后台</title><script src="../js/auth.js"></script><link rel="stylesheet" href="../css/production-scan.css"></head>
<body><aside class="sidebar" id="sidebar"></aside><main class="main" id="main">
<header class="topbar"><div><h1>材料领用</h1><div class="topbar-meta">扫描 KB/BX 为生产批次预留材料，配对时才正式扣减</div></div><div class="scan-ready"><span class="scan-dot"></span>扫码枪已就绪</div></header>
<div class="content"><div class="grid"><section class="panel"><h2>按批次领取材料包</h2><p class="sub">先选择生产批次，再直接扫描材料批次或箱码。</p><div class="field"><label>生产批次</label><select class="select" id="batchId" onchange="loadPicks()"><option value="">请选择</option></select></div><div class="field"><label>手工输入备用</label><div class="scan-row"><input class="input code" id="manualCode" placeholder="KB-... / BX-..."><button class="btn" id="manualBtn">读取</button></div></div><div class="result" id="sourceResult">等待扫描材料来源。</div><div class="field"><label>领取数量</label><input class="input" id="quantity" type="number" min="1" value="1"></div><button class="btn btn-black" id="pickBtn" onclick="confirmPick()" disabled>确认领用</button></section><section class="panel"><h2>本批次领料记录</h2><p class="sub">未配对的数量可以退回；已配对消耗的材料不能在这里撤销。</p><div id="picks"><div class="empty">请先选择生产批次</div></div></section></div></div>
</main><div class="toast" id="toast"></div><script src="../js/admin-sidebar.js"></script><script src="../js/production-scan-common.js"></script>
<script>
const S=MowoScan;let source=null
async function loadBatches(keep=''){const d=await S.request('/api/admin/production-workflow/scan-overview');batchId.innerHTML='<option value="">请选择生产批次</option>'+d.batches.map(b=>`<option value="${S.esc(b.id)}">${S.esc(b.id)} · ${b.materialPicked}/${b.total} 已领</option>`).join('');batchId.value=keep||new URLSearchParams(location.search).get('batchId')||''}
async function scan(code,type){if(!batchId.value)throw new Error('请先选择生产批次');if(!['KIT_BATCH','KIT_BOX'].includes(type))throw new Error('当前是材料领用工作台，只能扫描 KB 或 BX');const info=await S.request(`/api/admin/production-workflow/pairing/lookup/${encodeURIComponent(code.trim())}`);source={code:code.trim().toUpperCase(),info};sourceResult.className='result ok';sourceResult.innerHTML=`<span class="code-big">${S.esc(source.code)}</span><br>${S.esc(info.skuCode||'')} · ${S.esc(info.specification||'')}<br>当前可领：${Number(info.freeQty||0)} 套`;quantity.max=Number(info.freeQty||0);quantity.value=Math.min(Math.max(1,Number(quantity.value)||1),Number(info.freeQty||1));pickBtn.disabled=Number(info.freeQty||0)<1;S.beep(true)}
async function confirmPick(){if(!source||!batchId.value)return;try{await S.request('/api/admin/production-workflow/material-picks',{method:'POST',body:JSON.stringify({batchId:batchId.value,kitCode:source.code,quantity:Number(quantity.value)})});S.beep(true);S.toast('材料领用成功');quantity.blur();source=null;sourceResult.className='result';sourceResult.textContent='等待扫描下一批材料来源。';pickBtn.disabled=true;const keep=batchId.value;await loadBatches(keep);await loadPicks()}catch(e){S.beep(false);S.toast(e.message,true)}}
async function loadPicks(){if(!batchId.value){picks.innerHTML='<div class="empty">请先选择生产批次</div>';return}try{const rows=await S.request(`/api/admin/production-workflow/material-picks?batchId=${encodeURIComponent(batchId.value)}`);picks.innerHTML=rows.length?rows.map(p=>`<div class="row"><div><div class="row-title">${S.esc(p.sourceCode)} · ${p.quantity} 套</div><div class="row-meta">剩余 ${p.remainingQty} · 已配对消耗 ${p.consumedQty} · 已退 ${p.returnedQty}<br>${S.formatTime(p.pickedAt)}</div></div>${p.remainingQty>0?`<button class="btn btn-red" onclick="returnPick('${p.id}',${p.remainingQty})">退回</button>`:`<span class="badge ok">${S.esc(p.status)}</span>`}</div>`).join(''):'<div class="empty">本批次还没有领料记录</div>'}catch(e){S.toast(e.message,true)}}
async function returnPick(id,max){const qty=Number(prompt(`退回数量（最多 ${max}）`,String(max))),reason=prompt('请填写退回原因','本批次未使用');if(!Number.isInteger(qty)||qty<1||qty>max||!reason)return;try{await S.request(`/api/admin/production-workflow/material-picks/${encodeURIComponent(id)}/return`,{method:'POST',body:JSON.stringify({quantity:qty,reason})});S.toast('材料已退回');const keep=batchId.value;await loadBatches(keep);await loadPicks()}catch(e){S.toast(e.message,true)}}
document.addEventListener('DOMContentLoaded',async()=>{if(!await S.ensureStaff())return;await loadBatches();if(batchId.value)await loadPicks();S.installScanner(scan);const run=S.manual('manualCode',scan);manualBtn.onclick=run})
</script></body></html>
