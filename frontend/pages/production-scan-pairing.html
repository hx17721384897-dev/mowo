<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单件配对 - 哞屋后台</title><script src="../js/auth.js"></script><link rel="stylesheet" href="../css/production-scan.css"></head>
<body><aside class="sidebar" id="sidebar"></aside><main class="main" id="main">
<header class="topbar"><div><h1>单件配对</h1><div class="topbar-meta">先扫描一次已领用的 KB/BX，随后连续扫描同规格 FP</div></div><div class="scan-ready"><span class="scan-dot"></span>扫码枪已就绪</div></header>
<div class="content"><div class="grid"><section class="panel"><h2>当前材料来源</h2><p class="sub">更换材料箱或批次时直接扫描新的 KB/BX。页面会始终醒目显示当前来源。</p><div class="result" id="sourceResult">尚未选择材料来源，请先扫描 KB 或 BX。</div><div class="field"><label>手工输入备用</label><div class="scan-row"><input class="input code" id="manualCode" placeholder="KB / BX / FP"><button class="btn btn-black" id="manualBtn">处理</button></div></div><div class="result" id="pairResult">选择材料来源后，可以连续扫描帧素材包。</div></section><section class="panel"><h2>本机最近配对</h2><p class="sub">系统核对批次、SKU、帧包完成状态和已领数量后才会扣减一套材料包。</p><div id="recent"><div class="empty">暂无记录</div></div></section></div></div>
</main><div class="toast" id="toast"></div><script src="../js/admin-sidebar.js?v=20260829-2"></script><script src="../js/production-scan-common.js?v=20260829-3"></script>
<script>
const S=MowoScan,history=[];let activeSource=null
async function scan(code,type){code=code.trim().toUpperCase();if(type==='KIT_BATCH'||type==='KIT_BOX'){const info=await S.request(`/api/admin/production-workflow/pairing/lookup/${encodeURIComponent(code)}`);activeSource={code,info};sourceResult.className='result ok active-source flash';sourceResult.innerHTML=`<span class="code-big">${S.esc(code)}</span><br>${S.esc(info.skuCode||'')} · ${S.esc(info.specification||'')}<br>库存 ${Number(info.freeQty||0)} 套；实际可配数量以本生产批次已领记录为准`;pairResult.className='result';pairResult.textContent='材料来源已锁定，请连续扫描 FP。';S.beep(true);S.toast('材料来源已切换');return}if(type!=='FRAME')throw new Error('当前是单件配对工作台，请扫描 KB、BX 或 FP');if(!activeSource)throw new Error('请先扫描已领用的 KB 或 BX 材料来源');try{const info=await S.request(`/api/admin/production-workflow/pairing/lookup/${encodeURIComponent(code)}`),data=await S.request('/api/admin/production-workflow/pairing',{method:'POST',body:JSON.stringify({framePackCode:code,kitCode:activeSource.code})});pairResult.className='result ok flash';pairResult.innerHTML=`<span class="code-big">${S.esc(code)}</span><br>${S.esc(info.productionNo||'')} · ${S.esc(info.specification||'')}<br>已与 ${S.esc(activeSource.code)} 配对并正式消耗一套材料包`;history.unshift({code,info,source:activeSource.code,time:new Date()});recent.innerHTML=history.slice(0,15).map(x=>`<div class="row"><div><div class="row-title">${S.esc(x.code)}</div><div class="row-meta">${S.esc(x.info.specification||'')}<br>${S.esc(x.source)} · ${S.formatTime(x.time)}</div></div><span class="badge ok">已配对</span></div>`).join('');S.beep(true);S.toast(data.frameCode?'配对成功':'操作成功')}catch(e){pairResult.className='result error flash';pairResult.textContent=e.message;S.beep(false);throw e}}
document.addEventListener('DOMContentLoaded',async()=>{if(!await S.ensureStaff())return;S.installScanner(scan);const run=S.manual('manualCode',scan);manualBtn.onclick=run})
</script></body></html>
