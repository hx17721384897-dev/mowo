<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>装箱发货 - 哞屋后台</title><script src="../js/auth.js"></script><link rel="stylesheet" href="../css/production-scan.css"></head>
<body><aside class="sidebar" id="sidebar"></aside><main class="main" id="main">
<header class="topbar"><div><h1>装箱发货</h1><div class="topbar-meta">先扫描快递面单，再逐件扫描已经配对的 FP</div></div><div class="scan-ready"><span class="scan-dot"></span>扫码枪已就绪</div></header>
<div class="content"><div class="grid"><section class="panel"><h2>当前快递箱</h2><p class="sub">无需点击输入框。非 FP 编码在本页面会作为快递面单读取。</p><div class="field"><label>手工输入备用</label><div class="scan-row"><input class="input code" id="manualCode" placeholder="快递单号 / FP-..."><button class="btn btn-black" id="manualBtn">处理</button></div></div><div id="packingWork" class="result">等待扫描快递面单。</div></section><section class="panel"><h2>待齐套区</h2><p class="sub">未配齐记录保存在服务器，刷新或换电脑后仍可继续。</p><div id="waitingList"><div class="empty">正在加载...</div></div></section></div></div>
</main><div class="toast" id="toast"></div><script src="../js/admin-sidebar.js"></script><script src="../js/production-scan-common.js"></script>
<script>
const S=MowoScan;let currentTracking='',packingData=null
async function scan(code,type){code=code.trim();if(type==='FRAME'){if(!currentTracking)throw new Error('请先扫描快递面单');return scanUnit(code.toUpperCase())}return loadPacking(code)}
async function loadPacking(value){currentTracking=String(value||'').trim();if(!currentTracking)return;try{packingData=await S.request(`/api/admin/production-workflow/packing/${encodeURIComponent(currentTracking)}`);renderPacking();loadWaiting();S.beep(true)}catch(e){packingWork.className='result error';packingWork.textContent=e.message;currentTracking='';packingData=null;S.beep(false);throw e}}
function renderPacking(){const d=packingData,done=d.units.filter(x=>x.scanned).length,paired=d.units.filter(x=>x.paired).length;packingWork.className='result';packingWork.innerHTML=`<span class="code-big">${S.esc(currentTracking)}</span><br><strong>${S.esc(d.order.orderNo)} · ${S.esc(d.order.receiverName)}</strong><div class="summary"><div class="sum"><b>${d.units.length}</b><span>应有产品</span></div><div class="sum"><b>${paired}</b><span>已经配对</span></div><div class="sum"><b>${done}</b><span>已经装箱</span></div><div class="sum"><b>${d.units.length-done}</b><span>仍缺</span></div></div>${d.units.map(u=>`<div class="unit ${u.scanned?'done':u.paired?'':'blocked'}"><div><div class="unit-no">${S.esc(u.productionNo)}</div><div class="unit-spec">${S.esc(u.specification)}</div></div><span class="badge">${u.scanned?'已装箱':u.paired?'等待扫描':'尚未配对'}</span></div>`).join('')}<div class="actions"><button class="btn btn-black" onclick="shipOrder()" ${d.complete?'':'disabled'}>确认交付快递并发货</button><button class="btn" onclick="clearBox()">结束当前箱</button></div>`}
async function scanUnit(code){try{const data=await S.request(`/api/admin/production-workflow/packing/${encodeURIComponent(currentTracking)}/scan`,{method:'POST',body:JSON.stringify({framePackCode:code})});S.beep(true);S.toast(data.complete?'整单已经配齐':'本件已装箱');await loadPacking(currentTracking)}catch(e){S.beep(false);throw e}}
async function shipOrder(){if(!confirm('确认箱内产品已经核对并交付快递？'))return;try{const data=await S.request(`/api/admin/production-workflow/packing/${encodeURIComponent(currentTracking)}/ship`,{method:'POST'});S.beep(true);S.toast(`${data.orderNo} 已发货`);clearBox();loadWaiting()}catch(e){S.toast(e.message,true)}}
function clearBox(){currentTracking='';packingData=null;packingWork.className='result';packingWork.textContent='等待扫描快递面单。'}
async function loadWaiting(){try{const rows=await S.request('/api/admin/production-workflow/packing-sessions');waitingList.innerHTML=rows.length?rows.map(x=>`<div class="row"><div><div class="row-title">${S.esc(x.orderNo)} · ${S.esc(x.receiverName)}</div><div class="row-meta">${S.esc(x.trackingNo)} · 已装箱 ${x.scanned}/${x.total}</div></div><button class="btn" onclick="loadPacking('${S.esc(x.trackingNo)}')">继续</button></div>`).join(''):'<div class="empty">当前没有等待齐套的订单</div>'}catch(e){S.toast(e.message,true)}}
document.addEventListener('DOMContentLoaded',async()=>{if(!await S.ensureStaff())return;S.installScanner(scan);const run=S.manual('manualCode',scan);manualBtn.onclick=run;loadWaiting()})
</script></body></html>
