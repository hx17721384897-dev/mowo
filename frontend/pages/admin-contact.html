<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联络留言 — 哞屋管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --white:#FFFFFF; --cream:#F5F3EF; --black:#111110;
  --gray1:#EBEBEA; --gray2:#C4C3BF; --gray3:#787874;
  --accent-y:#F5E642; --accent-o:#FF6B35; --accent-g:#8FD694;
  --accent-b:#7EC8E3; --accent-p:#C8A8E8;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --sidebar-w:220px; --sidebar-collapsed:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:var(--font);cursor:pointer;border:none;outline:none;}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--black);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:width .3s cubic-bezier(0.22,1,0.36,1);overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;}
.sidebar-logo-icon{width:32px;height:32px;background:var(--accent-y);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sidebar-logo-text{font-weight:900;font-size:15px;color:var(--white);letter-spacing:.04em;}
.sidebar-logo-sub{font-weight:700;font-size:10px;color:var(--gray3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:1px;}
.sidebar-toggle{position:absolute;top:26px;right:12px;width:28px;height:28px;background:rgba(255,255,255,.08);border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray3);font-size:12px;transition:background .2s;}
.sidebar-toggle:hover{background:rgba(255,255,255,.15);color:var(--white);}
.sidebar-nav{flex:1;padding:16px 0;overflow-y:auto;overflow-x:hidden;}
.nav-section-label{font-weight:800;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gray3);padding:12px 20px 6px;white-space:nowrap;overflow:hidden;transition:opacity .2s;}
.sidebar.collapsed .nav-section-label{opacity:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;color:var(--gray3);font-weight:800;font-size:13px;text-decoration:none;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--white);}
.nav-item.active{background:rgba(245,230,66,.12);color:var(--accent-y);}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-y);border-radius:0 2px 2px 0;}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.nav-label{transition:opacity .2s;}
.sidebar.collapsed .nav-label{opacity:0;}
.nav-badge{margin-left:auto;background:var(--accent-o);color:var(--white);font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;min-width:20px;text-align:center;}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap;overflow:hidden;}
.sidebar-user{display:flex;align-items:center;gap:10px;}
.sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);flex-shrink:0;}
.sidebar-user-name{font-weight:800;font-size:12px;color:var(--white);}
.sidebar-user-role{font-weight:700;font-size:10px;color:var(--gray3);}
.sidebar.collapsed .sidebar-user-info{display:none;}

/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .3s cubic-bezier(0.22,1,0.36,1);}
.main.expanded{margin-left:var(--sidebar-collapsed);}
.topbar{position:sticky;top:0;z-index:50;background:rgba(245,243,239,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray1);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-weight:900;font-size:18px;letter-spacing:-.01em;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.topbar-time{font-weight:700;font-size:12px;color:var(--gray3);}
.content{padding:28px 32px;flex:1;}

/* FILTER SECTION */
.filter-section{margin-bottom:18px;}
.row-label{font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray3);margin-bottom:9px;}

/* Row 1 status cards — equal width grid */
.status-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}

/* Row 2 type cards — horizontal scroll */
.type-scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.type-scroll::-webkit-scrollbar{display:none;}
.type-row{display:flex;gap:10px;width:max-content;}

/* Shared filter card */
.fc{background:var(--white);border:2px solid var(--gray1);border-radius:14px;padding:13px 16px;cursor:pointer;transition:border-color .18s,background .18s,transform .18s,box-shadow .18s;user-select:none;display:flex;flex-direction:column;gap:5px;}
.type-row .fc{min-width:108px;flex-shrink:0;}
.fc:hover{border-color:var(--gray2);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07);}
.fc-label{font-weight:800;font-size:11px;letter-spacing:.06em;color:var(--gray3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fc-num{font-weight:900;font-size:24px;letter-spacing:-.02em;line-height:1;}
.fc-num.c-orange{color:var(--accent-o);}
.fc-num.c-blue{color:#1a7a9a;}
.fc-num.c-green{color:#2a7a30;}
.fc-num.c-red{color:#c94000;}
.fc-num.c-gold{color:#b07800;}

/* Active states */
.fc.active{border-color:transparent;}
.fc.active .fc-label,.fc.active .fc-num{color:var(--white) !important;}
.fc.st-pending.active   {background:#e08000;}
.fc.st-processing.active{background:#1a7a9a;}
.fc.st-done.active      {background:#2a7a30;}
.fc.st-spam.active      {background:#c94000;}
.fc.st-starred.active   {background:#9a8800;}
.fc.tp-card.active      {background:var(--black);}

/* SEARCH */
.search-bar{display:flex;gap:10px;align-items:center;background:var(--white);border:2px solid var(--gray1);border-radius:14px;padding:10px 16px;margin-bottom:10px;}
.search-input{flex:1;font-family:var(--font);font-weight:700;font-size:13px;color:var(--black);background:transparent;border:none;outline:none;}
.search-input::placeholder{color:var(--gray2);}
.sbtn{padding:7px 18px;font-weight:800;font-size:12px;letter-spacing:.04em;border-radius:9px;transition:opacity .15s;}
.sbtn:hover{opacity:.8;}
.sbtn-primary{background:var(--black);color:var(--white);}
.sbtn-ghost{background:var(--gray1);color:var(--black);}

/* BUTTONS */
.btn{height:38px;padding:0 16px;border-radius:10px;font-family:var(--font);font-weight:800;font-size:13px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn-black{background:var(--black);color:var(--white);}
.btn-black:hover{opacity:.85;}
.btn-ghost{background:var(--white);color:var(--black);border:1.5px solid var(--gray1);}
.btn-ghost:hover{border-color:var(--black);}
.btn-sm{height:32px;padding:0 12px;font-size:12px;border-radius:8px;}

/* Active filter tags */
.filter-tags{display:flex;gap:6px;flex-wrap:wrap;min-height:4px;margin-bottom:14px;}
.ftag{font-weight:800;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--black);color:var(--white);display:flex;align-items:center;gap:5px;}
.ftag-x{background:none;color:rgba(255,255,255,.6);font-size:13px;padding:0;line-height:1;transition:color .12s;}
.ftag-x:hover{color:var(--white);}

/* TABLE */
.table-wrap{background:var(--white);border:2px solid var(--gray1);border-radius:16px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray3);padding:12px 16px;text-align:left;background:var(--cream);border-bottom:2px solid var(--gray1);}
td{padding:13px 16px;border-bottom:1px solid var(--gray1);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(0,0,0,.012);}
.td-name{font-weight:800;font-size:14px;}
.td-sub{font-size:12px;color:var(--gray3);margin-top:2px;}
.td-preview{font-size:13px;color:var(--gray3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.td-time{font-size:12px;color:var(--gray3);white-space:nowrap;}

.type-badge{display:inline-block;font-weight:800;font-size:11px;letter-spacing:.04em;padding:3px 10px;border-radius:999px;white-space:nowrap;}
.type-artist  {background:rgba(245,230,66,.2); color:#8a7e00;}
.type-channel {background:rgba(255,107,53,.15);color:#c94000;}
.type-media   {background:rgba(126,200,227,.2);color:#1a7a9a;}
.type-join    {background:rgba(143,214,148,.2);color:#2a7a30;}
.type-feedback{background:rgba(200,168,232,.2);color:#6a3a9a;}
.type-factory {background:rgba(184,169,154,.2);color:#6a5a4a;}

/* Status select in row */
.row-status-sel{font-family:var(--font);font-weight:800;font-size:11px;padding:5px 8px;border-radius:8px;border:2px solid var(--gray1);background:var(--cream);color:var(--black);cursor:pointer;outline:none;transition:border-color .15s;-webkit-appearance:none;max-width:88px;}
.row-status-sel:focus{border-color:var(--black);}

/* Star button in row */
.star-btn{background:none;font-size:16px;padding:3px 6px;border-radius:7px;transition:background .15s;line-height:1;}
.star-btn:hover{background:rgba(245,200,0,.15);}
.star-btn.on{color:#f5c800;}

/* Action btn */
.act-btn{padding:5px 12px;font-weight:800;font-size:11px;border-radius:8px;background:var(--black);color:var(--white);transition:opacity .15s;}
.act-btn:hover{opacity:.8;}
.actions-cell{display:flex;align-items:center;gap:5px;}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:center;gap:7px;padding:20px;}
.pg-btn{width:34px;height:34px;border-radius:9px;font-weight:800;font-size:13px;background:var(--gray1);color:var(--black);transition:all .15s;display:flex;align-items:center;justify-content:center;}
.pg-btn:hover{background:var(--gray2);}
.pg-btn.active{background:var(--black);color:var(--white);}
.pg-info{font-weight:700;font-size:13px;color:var(--gray3);padding:0 6px;}

/* EMPTY */
.empty-wrap{text-align:center;padding:72px 20px;color:var(--gray3);}
.empty-icon{font-size:44px;margin-bottom:14px;}
.empty-text{font-weight:700;font-size:15px;}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:1000;background:rgba(17,17,16,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s;}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal-box{background:var(--white);border-radius:24px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;transform:translateY(28px) scale(.97);transition:transform .32s;scrollbar-width:none;}
.modal-bg.open .modal-box{transform:none;}
.modal-box::-webkit-scrollbar{display:none;}
.modal-hd{padding:22px 28px 16px;border-bottom:2px solid var(--gray1);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.modal-hd-left{flex:1;min-width:0;}
.modal-name{font-weight:900;font-size:20px;letter-spacing:-.01em;margin-bottom:8px;}
.modal-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.modal-x{width:34px;height:34px;border-radius:50%;background:var(--gray1);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;transition:all .18s;}
.modal-x:hover{background:var(--gray2);transform:rotate(90deg);}

/* Modal controls */
.modal-ctrl{padding:14px 28px;border-bottom:1px solid var(--gray1);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ctrl-label{font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray3);}
.ctrl-status{font-family:var(--font);font-weight:800;font-size:13px;padding:8px 14px;border:2px solid var(--gray1);border-radius:10px;background:var(--cream);color:var(--black);cursor:pointer;outline:none;transition:border-color .15s;-webkit-appearance:none;}
.ctrl-status:focus{border-color:var(--black);}
.ctrl-star{padding:8px 14px;font-weight:900;font-size:13px;border-radius:10px;background:var(--gray1);color:var(--black);transition:all .18s;display:inline-flex;align-items:center;gap:5px;border:2px solid transparent;}
.ctrl-star.on{background:rgba(245,200,0,.2);color:#7a6200;border-color:#f5c800;}
.ctrl-star:hover{opacity:.8;}
.ctrl-save{padding:8px 16px;font-weight:900;font-size:13px;border-radius:10px;background:var(--black);color:var(--white);transition:opacity .15s;margin-left:auto;}
.ctrl-save:hover{opacity:.8;}

/* Modal body */
.modal-bd{padding:18px 28px 28px;}
.sec{margin-bottom:22px;}
.sec-title{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray3);margin-bottom:10px;}
.dfield{margin-bottom:10px;}
.dlabel{font-weight:800;font-size:12px;color:var(--gray3);margin-bottom:3px;}
.dvalue{font-weight:700;font-size:14px;color:var(--black);line-height:1.6;word-break:break-all;}
.drow{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.msg-box{background:var(--cream);padding:14px 16px;border-radius:12px;font-weight:700;font-size:14px;line-height:1.9;white-space:pre-wrap;word-break:break-word;}
.att-list{display:flex;flex-direction:column;gap:8px;}
.att-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--cream);border-radius:10px;font-weight:700;font-size:13px;}
.att-item a{color:var(--black);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.att-item a:hover{text-decoration:underline;}
.note-ta{width:100%;padding:12px 14px;font-family:var(--font);font-weight:700;font-size:13px;color:var(--black);background:var(--cream);border:2px solid var(--gray1);border-radius:12px;outline:none;resize:vertical;min-height:80px;transition:border-color .15s;}
.note-ta:focus{border-color:var(--black);}

/* Status badge */
.sbadge{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:11px;padding:3px 10px;border-radius:999px;white-space:nowrap;}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.sb-pending   {background:rgba(245,166,35,.15);color:#b07800;}
.sb-processing{background:rgba(126,200,227,.2); color:#1a7a9a;}
.sb-done      {background:rgba(143,214,148,.2); color:#2a7a30;}
.sb-spam      {background:rgba(255,107,53,.15); color:#c94000;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar"></aside>

<!-- MAIN -->
<div class="main" id="main">
  <header class="topbar">
    <span class="topbar-title">💌 联络留言</span>
    <div class="topbar-right">
      <span class="topbar-time" id="topbarTime"></span>
      <button class="btn btn-ghost btn-sm" onclick="loadStats();loadList(1)">↻ 刷新</button>
    </div>
  </header>

  <div class="content">

    <div class="filter-section">
      <!-- 第一行：状态 -->
      <div class="row-label">按状态筛选</div>
      <div class="status-cards">
        <div class="fc st-pending"    data-f="status"  data-v="pending"    onclick="toggleFC(this)">
          <div class="fc-label">待处理</div>
          <div class="fc-num c-orange" id="fcPending">–</div>
        </div>
        <div class="fc st-processing" data-f="status"  data-v="processing" onclick="toggleFC(this)">
          <div class="fc-label">处理中</div>
          <div class="fc-num c-blue"   id="fcProcessing">–</div>
        </div>
        <div class="fc st-done"       data-f="status"  data-v="done"       onclick="toggleFC(this)">
          <div class="fc-label">已处理</div>
          <div class="fc-num c-green"  id="fcDone">–</div>
        </div>
        <div class="fc st-spam"       data-f="status"  data-v="spam"       onclick="toggleFC(this)">
          <div class="fc-label">垃圾信息</div>
          <div class="fc-num c-red"    id="fcSpam">–</div>
        </div>
        <div class="fc st-starred"    data-f="starred" data-v="1"          onclick="toggleFC(this)">
          <div class="fc-label">⭐ 星标</div>
          <div class="fc-num c-gold"   id="fcStarred">–</div>
        </div>
      </div>

      <!-- 第二行：分类（横向滚动） -->
      <div class="row-label">按分类筛选</div>
      <div class="type-scroll">
        <div class="type-row">
          <div class="fc tp-card" data-f="type" data-v="artist"   onclick="toggleFC(this)">
            <div class="fc-label">🎨 画师联名</div>
            <div class="fc-num" id="fcArtist">–</div>
          </div>
          <div class="fc tp-card" data-f="type" data-v="channel"  onclick="toggleFC(this)">
            <div class="fc-label">🏪 线下渠道</div>
            <div class="fc-num" id="fcChannel">–</div>
          </div>
          <div class="fc tp-card" data-f="type" data-v="media"    onclick="toggleFC(this)">
            <div class="fc-label">📣 媒体合作</div>
            <div class="fc-num" id="fcMedia">–</div>
          </div>
          <div class="fc tp-card" data-f="type" data-v="join"     onclick="toggleFC(this)">
            <div class="fc-label">💼 加入哞屋</div>
            <div class="fc-num" id="fcJoin">–</div>
          </div>
          <div class="fc tp-card" data-f="type" data-v="feedback" onclick="toggleFC(this)">
            <div class="fc-label">💡 反馈创意</div>
            <div class="fc-num" id="fcFeedback">–</div>
          </div>
          <div class="fc tp-card" data-f="type" data-v="factory"  onclick="toggleFC(this)">
            <div class="fc-label">🏭 厂家合作</div>
            <div class="fc-num" id="fcFactory">–</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 搜索 -->
    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="搜索姓名 / 联系方式 / 内容…" type="text">
      <button class="sbtn sbtn-primary" onclick="applySearch()">搜索</button>
      <button class="sbtn sbtn-ghost"   onclick="resetAll()">重置</button>
    </div>
    <div class="filter-tags" id="filterTags"></div>

    <!-- 表格 -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>来源</th>
            <th>姓名 / 联系</th>
            <th>内容摘要</th>
            <th>状态</th>
            <th>时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" style="text-align:center;padding:60px;color:var(--gray3);font-weight:700">加载中…</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-bg" id="detailModal" onclick="handleBg(event)">
  <div class="modal-box">
    <div class="modal-hd">
      <div class="modal-hd-left">
        <div class="modal-name" id="mName">–</div>
        <div class="modal-meta" id="mMeta"></div>
      </div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-ctrl">
      <span class="ctrl-label">状态</span>
      <select class="ctrl-status" id="mStatusSel" onchange="mUpdateStatus()">
        <option value="pending">待处理</option>
        <option value="processing">处理中</option>
        <option value="done">已处理</option>
        <option value="spam">垃圾信息</option>
      </select>
      <button class="ctrl-star" id="mStarBtn" onclick="mToggleStar()">☆ 加星标</button>
      <button class="ctrl-save" onclick="saveNote()">💾 保存备注</button>
    </div>
    <div class="modal-bd" id="mBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='http://localhost:3001/api'
let token=localStorage.getItem('mowo_token')||''
window.addEventListener('mowoTokenRefreshed', () => { token = localStorage.getItem('mowo_token') || ''; });
let curItem=null, curPage=1
let fStatus='', fStarred='', fType='', fKeyword=''

const TL={artist:'画师联名',channel:'线下渠道',media:'媒体合作',join:'加入哞屋',feedback:'反馈创意',factory:'厂家合作'}
const SL={pending:'待处理',processing:'处理中',done:'已处理',spam:'垃圾信息'}
const ML={artist:'IP/作品介绍',channel:'合作想法',media:'合作方向',join:'自我介绍',feedback:'反馈内容',factory:'补充说明'}

function H(){return{'Content-Type':'application/json','Authorization':'Bearer '+token}}
async function api(path,opts={}){const r=await fetch(API+path,{headers:H(),...opts});return r.json()}

function toast(msg,ms=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms)}

// ── Stats ──
async function loadStats(){
  const r=await api('/admin/contact/stats');if(!r.success)return
  const d=r.data
  document.getElementById('fcPending').textContent    =d.byStatus?.pending    ??0
  document.getElementById('fcProcessing').textContent =d.byStatus?.processing ??0
  document.getElementById('fcDone').textContent       =d.byStatus?.done       ??0
  document.getElementById('fcSpam').textContent       =d.byStatus?.spam       ??0
  document.getElementById('fcStarred').textContent    =d.starredTotal          ??0
  document.getElementById('fcArtist').textContent     =d.byType?.artist        ??0
  document.getElementById('fcChannel').textContent    =d.byType?.channel       ??0
  document.getElementById('fcMedia').textContent      =d.byType?.media         ??0
  document.getElementById('fcJoin').textContent       =d.byType?.join          ??0
  document.getElementById('fcFeedback').textContent   =d.byType?.feedback      ??0
  document.getElementById('fcFactory').textContent    =d.byType?.factory       ??0
  const badge=document.getElementById('sidebarBadge')
  const n=d.pendingTotal??0;if(badge){badge.textContent=n;badge.style.display=n>0?'':'none'}
}

// ── Filter card toggle ──
function toggleFC(card){
  const f=card.dataset.f,v=card.dataset.v
  const active=card.classList.contains('active')
  // 同维度互斥
  document.querySelectorAll(`[data-f="${f}"]`).forEach(c=>c.classList.remove('active'))
  if(!active){
    card.classList.add('active')
    if(f==='status') fStatus=v
    if(f==='starred')fStarred=v
    if(f==='type')   fType=v
  } else {
    if(f==='status') fStatus=''
    if(f==='starred')fStarred=''
    if(f==='type')   fType=''
  }
  curPage=1;renderTags();loadList(1)
}

// ── Active filter tags ──
const tagClearFns=[]
function renderTags(){
  tagClearFns.length=0
  const tags=[]
  if(fStatus) {tags.push(SL[fStatus]||fStatus);tagClearFns.push(()=>{fStatus='';document.querySelectorAll('[data-f="status"]').forEach(c=>c.classList.remove('active'))})}
  if(fStarred){tags.push('⭐ 星标');tagClearFns.push(()=>{fStarred='';document.querySelectorAll('[data-f="starred"]').forEach(c=>c.classList.remove('active'))})}
  if(fType)   {tags.push(TL[fType]||fType);tagClearFns.push(()=>{fType='';document.querySelectorAll('[data-f="type"]').forEach(c=>c.classList.remove('active'))})}
  if(fKeyword){tags.push(`"${fKeyword}"`);tagClearFns.push(()=>{fKeyword='';document.getElementById('searchInput').value=''})}
  document.getElementById('filterTags').innerHTML=tags.map((t,i)=>`<span class="ftag">${esc(t)}<button class="ftag-x" onclick="clearTag(${i})">✕</button></span>`).join('')
}
function clearTag(i){tagClearFns[i]?.();curPage=1;renderTags();loadList(1)}

// ── Load list ──
async function loadList(page=1){
  curPage=page
  const p=new URLSearchParams({page,limit:20})
  if(fStatus) p.set('status',fStatus); else p.set('status','')
  if(fStarred)p.set('starred',fStarred)
  if(fType)   p.set('type',fType)
  if(fKeyword)p.set('keyword',fKeyword)
  const r=await api('/admin/contact?'+p)
  if(!r.success){toast('加载失败：'+r.message);return}
  renderTable(r.data.items);renderPager(r.data.pagination)
}

// ── Table ──
function renderTable(items){
  const tb=document.getElementById('tableBody')
  if(!items.length){tb.innerHTML=`<tr><td colspan="6"><div class="empty-wrap"><div class="empty-icon">📭</div><div class="empty-text">暂无留言</div></div></td></tr>`;return}
  tb.innerHTML=items.map(item=>`
    <tr>
      <td><span class="type-badge type-${item.type}">${TL[item.type]||item.type}</span></td>
      <td>
        <div class="td-name">${esc(item.name)}</div>
        <div class="td-sub">${esc(item.contact)}</div>
      </td>
      <td><div class="td-preview">${esc(item.message)}</div></td>
      <td>
        <select class="row-status-sel" onchange="quickStatus('${item.id}',this)">
          <option value="pending"    ${item.status==='pending'   ?'selected':''}>待处理</option>
          <option value="processing" ${item.status==='processing'?'selected':''}>处理中</option>
          <option value="done"       ${item.status==='done'      ?'selected':''}>已处理</option>
          <option value="spam"       ${item.status==='spam'      ?'selected':''}>垃圾</option>
        </select>
      </td>
      <td class="td-time">${fmt(item.createdAt)}</td>
      <td>
        <div class="actions-cell">
          <button class="act-btn" onclick="openDetail('${item.id}')">查看</button>
          <button class="star-btn ${item.isStarred?'on':''}"
            title="${item.isStarred?'取消星标':'加星标'}"
            onclick="quickStar('${item.id}',${item.isStarred},this)"
          >${item.isStarred?'⭐':'☆'}</button>
        </div>
      </td>
    </tr>
  `).join('')
}

// ── Quick status (select) ──
async function quickStatus(id,sel){
  const status=sel.value
  const r=await api(`/admin/contact/${id}/status`,{method:'PUT',body:JSON.stringify({status})})
  if(r.success){toast(`✅ 已改为「${SL[status]}」`);loadStats()}
  else{toast('失败：'+r.message);loadList(curPage)}
}

// ── Quick star toggle ──
async function quickStar(id,cur,btn){
  const nv=!cur
  const r=await api(`/admin/contact/${id}/star`,{method:'PUT',body:JSON.stringify({isStarred:nv})})
  if(r.success){
    btn.textContent=nv?'⭐':'☆'
    btn.classList.toggle('on',nv)
    btn.title=nv?'取消星标':'加星标'
    btn.setAttribute('onclick',`quickStar('${id}',${nv},this)`)
    toast(nv?'⭐ 已加星标':'已取消星标');loadStats()
  } else toast('失败：'+r.message)
}

// ── Pagination ──
function renderPager(p){
  const tot=Math.ceil(p.total/p.limit),el=document.getElementById('pagination')
  if(tot<=1){el.innerHTML='';return}
  let h=''
  if(p.page>1)h+=`<button class="pg-btn" onclick="loadList(${p.page-1})">‹</button>`
  for(let i=Math.max(1,p.page-2);i<=Math.min(tot,p.page+2);i++)
    h+=`<button class="pg-btn ${i===p.page?'active':''}" onclick="loadList(${i})">${i}</button>`
  if(p.page<tot)h+=`<button class="pg-btn" onclick="loadList(${p.page+1})">›</button>`
  h+=`<span class="pg-info">共 ${p.total} 条</span>`
  el.innerHTML=h
}

// ── Search ──
function applySearch(){fKeyword=document.getElementById('searchInput').value.trim();curPage=1;renderTags();loadList(1)}
function resetAll(){
  fStatus='';fStarred='';fType='';fKeyword=''
  document.getElementById('searchInput').value=''
  document.querySelectorAll('.fc.active').forEach(c=>c.classList.remove('active'))
  renderTags();loadList(1)
}
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')applySearch()})

// ── Open detail ──
async function openDetail(id){
  const r=await api(`/admin/contact/${id}`)
  if(!r.success){toast('加载失败');return}
  const item=r.data;curItem=item

  document.getElementById('mName').textContent=item.name
  document.getElementById('mMeta').innerHTML=`
    <span class="type-badge type-${item.type}">${TL[item.type]||item.type}</span>
    <span class="sbadge sb-${item.status}"><span class="sdot"></span>${SL[item.status]||item.status}</span>
    <span style="font-size:12px;color:var(--gray3)">${fmt(item.createdAt)}</span>
  `
  document.getElementById('mStatusSel').value=item.status
  const sb=document.getElementById('mStarBtn')
  sb.textContent=item.isStarred?'⭐ 已加星标':'☆ 加星标'
  sb.classList.toggle('on',item.isStarred)

  // Extra
  const ex=item.extra||{}
  let xHtml=''
  if(item.type==='artist'){
    xHtml=drow([{l:'创作平台',v:ex.platform},{l:'粉丝量级',v:ex.fanbase}])+lnk('作品集链接',ex.portfolioUrl)
  } else if(item.type==='channel'){
    xHtml=drow([{l:'公司/门店',v:ex.company},{l:'所在城市',v:ex.city}])+df('门店类型',ex.storeType)
  } else if(item.type==='media'){
    xHtml=drow([{l:'主要平台',v:ex.platform},{l:'粉丝/阅读量',v:ex.fanbase}])+lnk('主页链接',ex.profileUrl)
  } else if(item.type==='join'){
    xHtml=drow([{l:'应聘方向',v:ex.direction},{l:'工作年限',v:ex.experience}])+lnk('个人链接',ex.portfolioUrl)
  } else if(item.type==='feedback'){
    xHtml=drow([{l:'反馈类型',v:ex.feedbackType},{l:'愿意参与内测',v:ex.wantBeta?'是 ✓':'否'}])
  } else if(item.type==='factory'){
    xHtml=drow([{l:'公司/工厂',v:ex.company},{l:'所在城市',v:ex.city}])+drow([{l:'主要生产品类',v:ex.category},{l:'年产能规模',v:ex.capacity}])+df('已合作品牌',ex.brands)+lnk('官网/资质链接',ex.certUrl)
  }

  // Attachments
  let attHtml=''
  if(item.attachmentUrls?.length){
    attHtml=`<div class="sec"><div class="sec-title">附件（${item.attachmentUrls.length}个）</div><div class="att-list">
      ${item.attachmentUrls.map(a=>`<div class="att-item"><span>${/\.(pdf|doc|docx)$/i.test(a.filename)?'📄':'🖼️'}</span><a href="${esc(a.url)}" target="_blank">${esc(a.filename)}</a><a href="${esc(a.url)}" target="_blank" download style="font-size:12px;color:var(--gray3);white-space:nowrap;flex-shrink:0">下载</a></div>`).join('')}
    </div></div>`
  }

  document.getElementById('mBody').innerHTML=`
    <div class="sec"><div class="sec-title">联系信息</div>${drow([{l:'姓名',v:item.name},{l:'联系方式',v:item.contact}])}</div>
    ${xHtml?`<div class="sec"><div class="sec-title">补充信息</div>${xHtml}</div>`:''}
    <div class="sec"><div class="sec-title">${ML[item.type]||'内容'}</div><div class="msg-box">${esc(item.message)}</div></div>
    ${attHtml}
    <div class="sec"><div class="sec-title">内部备注</div><textarea class="note-ta" id="noteTa" placeholder="添加处理备注…">${esc(item.note||'')}</textarea></div>
    <div class="sec"><div class="sec-title">系统信息</div>
      ${item.submitterUserId?`<div class="dfield"><div class="dlabel">提交账号</div><div class="dvalue"><a href="admin-users.html?highlight=${esc(item.submitterUserId)}" target="_blank" style="color:var(--black);font-weight:800;text-decoration:underline">查看用户主页 →</a></div></div>`:'<div class="dfield"><div class="dlabel">提交账号</div><div class="dvalue" style="color:var(--gray3)">未登录提交</div></div>'}
      ${item.ip?`<div class="dfield"><div class="dlabel">提交IP</div><div class="dvalue" style="font-family:monospace;font-size:13px">${esc(item.ip)}${item.isBlocked?' 🚫 已封禁':''}</div></div>`:''}
      ${item.handledAt?`<div class="dfield"><div class="dlabel">最后处理</div><div class="dvalue" style="font-size:13px;color:var(--gray3)">${fmt(item.handledAt)}</div></div>`:''}
    </div>
  `

  document.getElementById('detailModal').classList.add('open')
  document.body.style.overflow='hidden'
}

// ── Modal status update ──
async function mUpdateStatus(){
  if(!curItem)return
  const status=document.getElementById('mStatusSel').value
  const r=await api(`/admin/contact/${curItem.id}/status`,{method:'PUT',body:JSON.stringify({status})})
  if(r.success){
    curItem.status=status
    // update meta badge
    const meta=document.getElementById('mMeta')
    const badge=meta.querySelector('.sbadge')
    if(badge){badge.className=`sbadge sb-${status}`;badge.innerHTML=`<span class="sdot"></span>${SL[status]}`}
    toast(`✅ 状态已改为「${SL[status]}」`);loadList(curPage);loadStats()
  } else {
    toast('失败：'+r.message)
    document.getElementById('mStatusSel').value=curItem.status
  }
}

// ── Modal star toggle ──
async function mToggleStar(){
  if(!curItem)return
  const nv=!curItem.isStarred
  const r=await api(`/admin/contact/${curItem.id}/star`,{method:'PUT',body:JSON.stringify({isStarred:nv})})
  if(r.success){
    curItem.isStarred=nv
    const sb=document.getElementById('mStarBtn')
    sb.textContent=nv?'⭐ 已加星标':'☆ 加星标'
    sb.classList.toggle('on',nv)
    toast(nv?'⭐ 已加星标':'已取消星标');loadList(curPage);loadStats()
  } else toast('失败：'+r.message)
}

// ── Save note ──
async function saveNote(){
  if(!curItem)return
  const note=document.getElementById('noteTa')?.value||''
  const r=await api(`/admin/contact/${curItem.id}/note`,{method:'PUT',body:JSON.stringify({note})})
  if(r.success)toast('💾 备注已保存'); else toast('失败：'+r.message)
}

function closeModal(){document.getElementById('detailModal').classList.remove('open');document.body.style.overflow='';curItem=null}
function handleBg(e){if(e.target===e.currentTarget)closeModal()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()})

// ── Helpers ──
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(iso){if(!iso)return'';return new Date(iso).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function df(label,value){if(!value)return'';return`<div class="dfield"><div class="dlabel">${esc(label)}</div><div class="dvalue">${esc(value)}</div></div>`}
function lnk(label,url){if(!url)return'';return`<div class="dfield"><div class="dlabel">${esc(label)}</div><div class="dvalue"><a href="${esc(url)}" target="_blank" style="color:var(--black);text-decoration:underline">${esc(url)}</a></div></div>`}
function drow(fields){const c=fields.filter(f=>f.v).map(f=>`<div class="dfield"><div class="dlabel">${esc(f.l)}</div><div class="dvalue">${esc(f.v)}</div></div>`).join('');return c?`<div class="drow">${c}</div>`:''}



// ── Clock ──
function updateClock(){
  const now=new Date()
  document.getElementById('topbarTime').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
}
updateClock();setInterval(updateClock,1000)

// ── Init ──
async function init(){
  if(!token){location.href='index.html';return}
  try{
    const me=await api('/auth/me')
    if(!me.success||me.data.role<2){location.href='index.html';return}
    const name=me.data.profile?.nickname||me.data.phone||'管理员'
    const roleMap={0:'普通用户',1:'生产端',2:'管理员',3:'超级管理员'}
    document.getElementById('sidebarName').textContent=name
    document.getElementById('sidebarRole').textContent=roleMap[me.data.role]||'管理员'
    document.getElementById('sidebarAvatar').textContent=name.slice(0,1)
  }catch(e){location.href='index.html';return}
  await loadStats();await loadList(1)
}
init()
</script>
