<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/runtime-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帧图资产库 - 哞屋后台</title>
<script src="../js/auth.js"></script>
<script src="../js/feature-flags.js"></script>
<script src="../js/private-upload.js"></script>
<style>
:root{--black:#111110;--white:#fff;--bg:#f5f3ef;--line:#deddd8;--muted:#777773;--yellow:#f5e642;--green:#267a43;--orange:#b45b14;--red:#c93333;--sidebar-w:220px;--sidebar-collapsed:60px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--black);letter-spacing:0}.main{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .25s}.main.expanded{margin-left:var(--sidebar-collapsed)}.topbar{height:62px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(245,243,239,.96);position:sticky;top:0;z-index:20}.topbar h1{font-size:19px}.top-actions{display:flex;gap:8px}.btn{height:36px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 13px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.btn:hover{border-color:#999}.btn-black{background:var(--black);color:#fff;border-color:var(--black)}.btn-danger{color:var(--red);border-color:#efb1b1}.btn:disabled{opacity:.45;cursor:not-allowed}.menu-btn{display:none;width:38px;padding:0}.content{padding:20px 24px 42px;max-width:1700px;margin:auto}.summary{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:9px;margin-bottom:14px}.summary button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:12px;text-align:left;cursor:pointer}.summary button.active{background:#fffde9;border-color:#c9b900}.summary b{display:block;font-size:22px}.summary span{font-size:11px;color:var(--muted);font-weight:800}.workspace{display:grid;grid-template-columns:170px minmax(430px,1fr) minmax(340px,420px);min-height:690px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.filter-nav{border-right:1px solid var(--line);padding:14px 10px;background:#faf9f6}.filter-title{font-size:11px;color:var(--muted);font-weight:900;padding:4px 9px 8px}.filter-item{width:100%;height:35px;border:0;background:transparent;border-radius:6px;padding:0 9px;display:flex;align-items:center;justify-content:space-between;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.filter-item:hover{background:#efeee9}.filter-item.active{background:#e6f3ef;color:#096957}.filter-count{font-size:10px;color:var(--muted)}.tag-list{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.gallery{min-width:0;border-right:1px solid var(--line)}.toolbar{padding:12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(170px,1fr) 130px auto;gap:8px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit;font-size:12px;padding:0 10px;outline:none}.toolbar input,.toolbar select,.field input,.field select{height:36px}.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#888}.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding:11px;align-content:start}.asset-grid.list{display:block}.asset-card{border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden;cursor:pointer;min-width:0}.asset-card:hover,.asset-card.active{border-color:#159078;box-shadow:0 0 0 1px #159078}.cover{aspect-ratio:1.18;background:#ecebe7;display:flex;align-items:center;justify-content:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover-empty{font-size:12px;color:var(--muted);font-weight:800}.card-body{padding:9px}.card-title{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-no{font-size:9px;color:var(--muted);margin-top:3px}.card-meta{font-size:10px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between}.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.chip{display:inline-flex;align-items:center;min-height:20px;padding:2px 6px;border-radius:4px;background:#efefec;font-size:9px;font-weight:800}.chip-green{background:#ddf2e4;color:#176832}.chip-yellow{background:#fff4bd;color:#795f00}.chip-red{background:#ffe2e2;color:#9d2424}.asset-grid.list .asset-card{display:grid;grid-template-columns:86px 1fr;margin-bottom:8px}.asset-grid.list .cover{aspect-ratio:auto;height:82px}.pager{height:48px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:9px;font-size:11px;font-weight:800}.detail{min-width:0;background:#fff;overflow:visible;max-height:none}.empty{padding:64px 20px;text-align:center;color:var(--muted);font-size:12px;font-weight:700}.detail-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.detail-title{font-size:18px;font-weight:900}.detail-no{font-size:10px;color:var(--muted);margin-top:4px}.detail-body{padding:16px}.preview{aspect-ratio:1.35;background:#eeede9;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}.preview img{width:100%;height:100%;object-fit:contain}.preview-control{position:absolute;left:8px;bottom:8px;width:34px;height:34px;border:0;border-radius:6px;background:#fff;font-size:16px;cursor:pointer}.frames{display:flex;gap:5px;overflow:auto;padding:7px 0}.frame{width:48px;height:48px;flex:0 0 48px;border:2px solid transparent;border-radius:5px;overflow:hidden;background:#eee;cursor:pointer}.frame.active{border-color:#159078}.frame img{width:100%;height:100%;object-fit:cover}.section{border-top:1px solid var(--line);padding-top:13px;margin-top:13px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.section h3{font-size:12px}.info{display:grid;grid-template-columns:105px 1fr;font-size:11px}.info dt,.info dd{padding:7px 8px;border-bottom:1px solid #ecebe7}.info dt{color:var(--muted);background:#faf9f6;font-weight:800}.info dd{font-weight:700;word-break:break-word}.relations{font-size:10px}.relation{padding:7px 0;border-bottom:1px solid #ecebe7;display:flex;justify-content:space-between;gap:8px}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:300}.overlay.show{display:flex}.modal{width:min(760px,100%);max-height:90vh;background:#fff;border-radius:8px;display:flex;flex-direction:column}.modal-head,.modal-foot{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.modal-body{padding:17px 18px;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{min-width:0}.field.wide{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field textarea{min-height:76px;padding:9px;resize:vertical}.field-hint{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}.file-box{border:1px dashed #aaa;border-radius:7px;padding:16px;text-align:center;background:#faf9f6}.file-box input{height:auto;border:0}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:7px;font-size:12px;font-weight:800;z-index:500;display:none}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:90}.sidebar-backdrop.show{display:block}@media(max-width:1250px){.workspace{grid-template-columns:150px minmax(420px,1fr) 350px}.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:980px){.workspace{grid-template-columns:150px 1fr}.detail{position:fixed;right:0;top:0;bottom:0;width:min(430px,92vw);max-height:none;overflow:auto;z-index:180;box-shadow:-8px 0 26px rgba(0,0,0,.18);display:none}.detail.open{display:block}}@media(max-width:760px){.main{margin-left:0!important}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.menu-btn{display:inline-block}.content{padding:12px}.topbar{padding:0 12px}.summary{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.filter-nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:8px}.filter-title,.tag-list{display:none}.filter-item{width:auto;flex:0 0 auto;gap:8px}.toolbar{grid-template-columns:1fr auto}.toolbar select{display:none}.asset-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:9px}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}
.production-links{margin-top:7px;padding-top:6px;border-top:1px solid #ecebe7;display:grid;gap:4px}.production-links a{font-size:9px;color:#086f5c;font-weight:800;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.production-links a:hover{text-decoration:underline}
.production-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.production-actions .btn{height:30px;padding:0 9px}.render-frame-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.render-frame-card{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#faf9f6}.render-frame-card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#fff}.render-frame-name{padding:8px 10px;font-size:11px;font-weight:900;display:flex;justify-content:space-between;gap:8px}.render-summary{font-size:11px;color:var(--muted);margin-bottom:12px;font-weight:700}
@media(min-width:981px){.workspace{grid-template-columns:170px minmax(0,1fr) minmax(300px,420px)}.detail{overflow:hidden}.detail-body{max-width:100%;overflow:hidden}.preview,.frames{width:75%;max-width:100%;margin-left:auto;margin-right:auto}.preview-control{width:26px;height:26px;font-size:13px}.frame{width:36px;height:36px;flex:0 0 36px}}@media(min-width:981px) and (max-width:1250px){.workspace{grid-template-columns:150px minmax(0,1fr) minmax(280px,350px)}}
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>
<main class="main" id="main">
  <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn menu-btn" onclick="openSidebar()">☰</button><h1>帧图资产库</h1></div><div class="top-actions"><button class="btn" onclick="loadAll()">刷新</button><button class="btn btn-black" id="createAssetBtn" onclick="location.href='admin-frame-making.html'" hidden>制作新帧图</button></div></header>
  <div class="content">
    <section class="summary" id="summary"></section>
    <section class="workspace">
      <nav class="filter-nav" id="filterNav"></nav>
      <div class="gallery">
        <div class="toolbar"><input id="keyword" placeholder="搜索 ANM、名称、用户、定制或订单" onkeydown="if(event.key==='Enter')applyFilters()"><select id="tagFilter" onchange="applyFilters()"><option value="">全部标签</option></select><button class="btn" id="viewBtn" title="切换列表视图" onclick="toggleView()">☰</button></div>
        <div class="asset-grid" id="assetGrid"><div class="empty">正在加载...</div></div>
        <div class="pager"><button class="btn" id="prevBtn" onclick="changePage(-1)">上一页</button><span id="pageText">第 1 页</span><button class="btn" id="nextBtn" onclick="changePage(1)">下一页</button></div>
      </div>
      <aside class="detail" id="detail"><div class="empty">选择一套动画，查看帧图、版本和业务关系</div></aside>
    </section>
  </div>
</main>

<div class="overlay" id="assetModal" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div><strong id="modalTitle">新增帧图</strong><div class="field-hint" id="modalHint">导入后生成统一 ANM 编号和 V1</div></div><button class="btn" onclick="closeModal()">关闭</button></div><div class="modal-body"><div class="form-grid">
  <div class="field wide"><label>动画名称 *</label><input id="formTitle" maxlength="200"></div>
  <div class="field"><label>素材来源 *</label><select id="formSource"><option value="OFFLINE_CUSTOM">线下定制</option><option value="CREATOR_SUBMISSION">创作者提供</option><option value="INTERNAL_CREATED">内部制作</option></select></div>
  <div class="field"><label>当前用途 *</label><select id="formUsage"><option value="PRIVATE_CUSTOM">私人定制</option><option value="INTERNAL_TEST">内部测试</option><option value="UNDECIDED">暂未确定</option><option value="COLLAB_SALE">联名销售</option><option value="COMPANY_PRODUCT">公司自营</option></select></div>
  <div class="field"><label>权利主体 *</label><select id="formRights"><option value="OFFLINE_CUSTOMER">线下客户</option><option value="CREATOR">创作者</option><option value="COMPANY">哞屋公司</option><option value="USER">网站用户</option><option value="UNCONFIRMED">暂未确认</option></select></div>
  <div class="field"><label>授权状态 *</label><select id="formAuth"><option value="PRIVATE_ONLY">仅限私人定制</option><option value="PENDING">授权确认中</option><option value="AUTHORIZED">已确认可合作使用</option></select></div>
  <div class="field"><label>客户或权利人名称</label><input id="formHolder" maxlength="120"></div>
  <div class="field"><label>联系方式</label><input id="formContact" maxlength="200"><div class="field-hint">仅负责人可以查看完整联系方式</div></div>
  <div class="field"><label>绑定网站账号手机号</label><input id="formOwnerPhone" maxlength="20" placeholder="没有账号可以留空"><div class="field-hint">线下客户以后注册账号时可以再绑定</div></div>
  <div class="field"><label>标签</label><input id="formTags" maxlength="300" placeholder="用逗号分隔"></div>
  <div class="field wide"><label>内部备注</label><textarea id="formNotes" maxlength="4000"></textarea></div>
  <div class="field wide" id="frameUploadField"><label>核心帧图 *</label><div class="file-box"><input id="formFrames" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div class="field-hint" id="frameFileHint">请选择 1 至 50 张图片，按文件名自然顺序保存</div></div></div>
</div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-black" id="saveBtn" onclick="saveAsset()">保存</button></div></div></div>
<div class="overlay" id="productionModal"><div class="modal" style="width:min(620px,100%)"><div class="modal-head"><div><strong>新增生产文件版本</strong><div class="field-hint">只显示已经上传模板的打印裁切组</div></div><button class="btn" onclick="closeProductionModal()">关闭</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>动画版本</label><select id="productionAnimationVersion" onchange="refreshProductionCompatibility()"></select></div><div class="field"><label>目标商品帧数</label><input id="productionTargetFrames" type="number" min="1" oninput="refreshProductionCompatibility()" placeholder="12"></div><div class="field wide"><label>打印模板</label><select id="productionTemplate"></select><div class="field-hint" id="productionTemplateHint">输入目标帧数后，系统会排除不能整页排版的模板</div></div><div class="field wide"><label style="display:flex;align-items:center;gap:8px"><input id="productionMarker" type="checkbox" checked style="width:auto;height:auto"> 添加自适应右下角帧号</label></div></div></div><div class="modal-foot"><button class="btn" onclick="closeProductionModal()">取消</button><button class="btn btn-black" id="generateProductionBtn" onclick="generateProductionFile()">生成 Word 文件</button></div></div></div>
<div class="overlay" id="renderFramesModal" onclick="if(event.target===this)closeRenderFrames()"><div class="modal" style="width:min(960px,100%)"><div class="modal-head"><div><strong id="renderFramesTitle">加工帧预览</strong><div class="field-hint">按生产文件使用的加工顺序展示</div></div><button class="btn" onclick="closeRenderFrames()">关闭</button></div><div class="modal-body"><div class="render-summary" id="renderFramesSummary">正在读取...</div><div class="render-frame-grid" id="renderFramesGrid"></div></div></div></div>
<div class="toast" id="toast"></div>
<script src="../js/admin-sidebar.js"></script>
<script>
const API=window.MOWO_API_BASE||'',token=localStorage.getItem('mowo_token')||''
const labels={source:{WEB_CUSTOM:'网站定制',OFFLINE_CUSTOM:'线下定制',CREATOR_SUBMISSION:'创作者提供',INTERNAL_CREATED:'内部制作'},usage:{PRIVATE_CUSTOM:'私人定制',COLLAB_SALE:'联名销售',COMPANY_PRODUCT:'公司自营',INTERNAL_TEST:'内部测试',UNDECIDED:'暂未确定'},rights:{USER:'网站用户',OFFLINE_CUSTOMER:'线下客户',CREATOR:'创作者',COMPANY:'哞屋公司',UNCONFIRMED:'暂未确认'},auth:{PRIVATE_ONLY:'仅限私人使用',PENDING:'授权确认中',AUTHORIZED:'已授权'},status:{ACTIVE:'正常',USER_DELETED:'用户已删除',ARCHIVED:'已归档'}}
const categories=[['all','全部帧图'],['private','私人定制'],['collab','联名作品'],['company','公司自营'],['internal','内部测试'],['incomplete','待整理'],['user_deleted','用户已删除'],['archived','已归档']]
let currentUser=null,stats={},assets=[],activeId=null,active=null,page=1,category='all',total=0,listView=false,playTimer=null,frameData=[],productionOptions=null
function auth(){return{Authorization:`Bearer ${token}`}}function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2800)}function fmt(v){return v?new Date(v).toLocaleString('zh-CN'):'-'}function tags(v){return String(v||'').split(/[，,]/).map(x=>x.trim()).filter(Boolean)}
async function api(path,options={}){const r=await fetch(`${API}${path}`,{...options,headers:{...auth(),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let j;try{j=await r.json()}catch{j={success:false,message:'服务器返回内容异常'}}if(!r.ok||!j.success)throw new Error(j.message||'操作失败');return j.data}
async function init(){try{currentUser=await fetchCurrentUser();if(!['OWNER','PRODUCTION','COLLAB_OPS'].includes(currentUser?.staffRole)){location.href='index.html';return}document.getElementById('createAssetBtn').hidden=currentUser.staffRole!=='OWNER';document.getElementById('keyword').value=new URLSearchParams(location.search).get('keyword')||'';await loadAll()}catch(e){toast(e.message);setTimeout(()=>location.href='index.html',1000)}}
async function loadAll(){await Promise.all([loadStats(),loadAssets()])}
async function loadStats(){stats=await api('/api/admin/frame-library/stats');renderSummary();renderFilters();const s=document.getElementById('tagFilter'),old=s.value;s.innerHTML='<option value="">全部标签</option>'+(stats.tags||[]).map(t=>`<option value="${esc(t.name)}">${esc(t.name)} (${t._count.assets})</option>`).join('');s.value=old}
function countFor(k){return k==='all'?stats.all:k==='private'?stats.private:k==='collab'?stats.collab:k==='company'?stats.company:k==='internal'?stats.internal:k==='incomplete'?stats.incomplete:k==='user_deleted'?stats.userDeleted:stats.archived}
function renderSummary(){const top=[['all','全部资产'],['private','私人定制'],['collab','联名作品'],['internal','内部测试'],['incomplete','待整理'],['archived','已归档']];document.getElementById('summary').innerHTML=top.map(([k,n])=>`<button class="${category===k?'active':''}" onclick="setCategory('${k}')"><b>${countFor(k)||0}</b><span>${n}</span></button>`).join('')}
function renderFilters(){document.getElementById('filterNav').innerHTML='<div class="filter-title">资料分类</div>'+categories.map(([k,n])=>`<button class="filter-item ${category===k?'active':''}" onclick="setCategory('${k}')"><span>${n}</span><span class="filter-count">${countFor(k)||0}</span></button>`).join('')+`<div class="tag-list"><div class="filter-title">常用标签</div>${(stats.tags||[]).slice(0,12).map(t=>`<button class="filter-item" onclick="selectTag('${esc(t.name)}')"><span>${esc(t.name)}</span><span class="filter-count">${t._count.assets}</span></button>`).join('')}</div>`}
async function loadAssets(){const p=new URLSearchParams({page:String(page),limit:'24',category});const q=document.getElementById('keyword')?.value.trim();const tag=document.getElementById('tagFilter')?.value;if(q)p.set('keyword',q);if(tag)p.set('tag',tag);document.getElementById('assetGrid').innerHTML='<div class="empty">正在加载...</div>';try{const data=await api('/api/admin/frame-library?'+p);assets=data.items;total=data.total;renderAssets();renderPager()}catch(e){document.getElementById('assetGrid').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function productionLinks(files,limit=3){if(!files?.length)return '<div class="production-links"><span class="card-no">生产文件：尚未生成</span></div>';return `<div class="production-links">${files.slice(0,limit).map(f=>`<a href="#" onclick="downloadProductionFile(decodeURIComponent('${encodeURIComponent(f.downloadUrl)}'),decodeURIComponent('${encodeURIComponent(f.displayName)}'),event)" title="${esc(f.displayName)}">${esc(f.displayName)}</a>`).join('')}</div>`}
function renderAssets(){const box=document.getElementById('assetGrid');box.className='asset-grid'+(listView?' list':'');if(!assets.length){box.innerHTML='<div class="empty">当前分类没有帧图资产</div>';return}box.innerHTML=assets.map(a=>`<article class="asset-card ${a.id===activeId?'active':''}" onclick="openDetail('${a.id}')"><div class="cover">${a.coverUrl?`<img src="${esc(a.coverUrl)}" loading="lazy" onerror="this.outerHTML='<span class=cover-empty>预览失效</span>'">`:'<span class="cover-empty">暂无帧图</span>'}</div><div class="card-body"><div class="card-title">${esc(a.title)}</div><div class="card-meta"><span>${a.baseFrameCount||0} 帧</span><span>${fmt(a.updatedAt).split(' ')[0]}</span></div><div class="chips"><span class="chip chip-green">${esc(labels.source[a.sourceChannel]||a.sourceChannel)}</span><span class="chip ${a.authorizationStatus==='AUTHORIZED'?'chip-green':'chip-yellow'}">${esc(labels.usage[a.usageType]||a.usageType)}</span>${a.status!=='ACTIVE'?`<span class="chip chip-red">${esc(labels.status[a.status]||a.status)}</span>`:''}</div>${productionLinks(a.productionFiles)}</div></article>`).join('')}
function renderPager(){const pages=Math.max(1,Math.ceil(total/24));document.getElementById('pageText').textContent=`第 ${page} / ${pages} 页 · 共 ${total} 套`;document.getElementById('prevBtn').disabled=page<=1;document.getElementById('nextBtn').disabled=page>=pages}
function setCategory(k){category=k;page=1;renderSummary();renderFilters();loadAssets()}function selectTag(name){document.getElementById('tagFilter').value=name;applyFilters()}function applyFilters(){page=1;loadAssets()}function changePage(n){page=Math.max(1,page+n);loadAssets()}function toggleView(){listView=!listView;document.getElementById('viewBtn').textContent=listView?'▦':'☰';renderAssets()}
async function openDetail(id){activeId=id;renderAssets();clearInterval(playTimer);document.getElementById('detail').classList.add('open');document.getElementById('detail').innerHTML='<div class="empty">正在读取详情...</div>';try{active=await api('/api/admin/frame-library/'+encodeURIComponent(id));renderDetail();injectProductionSection();if(active.currentVersionNo)await loadVersion(active.currentVersionNo)}catch(e){document.getElementById('detail').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function injectProductionSection(){const sections=[...document.querySelectorAll('#detail .section')],before=sections.find(section=>section.querySelector('h3')?.textContent==='不可覆盖版本');if(!before)return;const section=document.createElement('div');section.className='section';section.innerHTML=`<div class="section-head"><h3>生产文件</h3><button class="btn" onclick="openProductionModal()">新增文件版本</button></div>${active.productionFiles?.length?`<div class="relations">${active.productionFiles.map(f=>`<div class="relation"><div><a href="#" onclick="downloadProductionFile(decodeURIComponent('${encodeURIComponent(f.downloadUrl)}'),decodeURIComponent('${encodeURIComponent(f.displayName)}'),event)" style="color:#086f5c;font-weight:800;text-decoration:none">${esc(f.displayName)}</a><div class="field-hint">动画V${f.animationVersionNo} · 模板V${f.templateVersionNo} · 加工帧${f.renderedFrameCount}张 · ${fmt(f.createdAt)}</div></div><div class="production-actions"><button class="btn" onclick="openRenderFrames('${f.id}')">查看加工帧</button>${f.canDelete?`<button class="btn btn-danger" onclick="deleteProductionFile('${f.id}','${encodeURIComponent(f.displayName)}')">删除</button>`:f.deleteBlockedReason?`<span class="field-hint">${esc(f.deleteBlockedReason)}</span>`:''}</div></div>`).join('')}</div>`:'<div class="field-hint">生产文件：尚未生成</div>'}`;before.before(section)}
async function downloadProductionFile(url,name,event){event?.preventDefault();event?.stopPropagation();try{const response=await fetch(url);if(!response.ok)throw new Error('下载链接已失效，请刷新页面后重试');const blob=await response.blob(),objectUrl=URL.createObjectURL(blob),link=document.createElement('a');link.href=objectUrl;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),1000)}catch(e){toast(e.message)}}
async function openRenderFrames(fileId){renderFramesModal.classList.add('show');renderFramesTitle.textContent='加工帧预览';renderFramesSummary.textContent='正在读取...';renderFramesGrid.innerHTML='';try{const data=await api(`/api/admin/frame-library/${active.id}/production-files/${fileId}/frames`);renderFramesTitle.textContent=data.displayName;renderFramesSummary.textContent=`动画 V${data.animationVersionNo} · ${data.size} · ${data.widthPx}×${data.heightPx}px · 共 ${data.frames.length} 张${data.markerEnabled?' · 已加帧号':' · 未加帧号'}`;renderFramesGrid.innerHTML=data.frames.map(frame=>`<div class="render-frame-card"><img src="${esc(frame.url)}" loading="lazy" alt="${esc(frame.name)}"><div class="render-frame-name"><span>第 ${frame.index} 帧</span><span>${esc(frame.name)}</span></div></div>`).join('')||'<div class="empty">没有可查看的加工帧</div>'}catch(e){renderFramesSummary.textContent=e.message}}
function closeRenderFrames(){renderFramesModal.classList.remove('show')}
async function deleteProductionFile(fileId,encodedName){const name=decodeURIComponent(encodedName);if(!confirm(`删除生产文件“${name}”？\n\n只删除这个 Word 文件版本，不会删除动画原始帧和可复用加工帧。`))return;try{await api(`/api/admin/frame-library/${active.id}/production-files/${fileId}`,{method:'DELETE'});toast('生产文件已删除');await loadAssets();await openDetail(active.id)}catch(e){toast(e.message)}}
function renderDetail(){const d=active,owner=d.owner?`${d.owner.nickname}${d.owner.phone?' · '+d.owner.phone:''}`:'未绑定网站账号';document.getElementById('detail').innerHTML=`<div class="detail-head"><div><div class="detail-title">${esc(d.title)}</div><div class="detail-no">${esc(d.assetNo)} · 当前 V${d.currentVersionNo}</div></div><button class="btn" onclick="closeDetail()">×</button></div><div class="detail-body"><div class="preview" id="preview"><span class="cover-empty">正在加载帧图...</span></div><div class="frames" id="frames"></div><div class="section"><div class="section-head"><h3>资料信息</h3>${currentUser.staffRole==='OWNER'?'<button class="btn" onclick="openEdit()">编辑</button>':''}</div><dl class="info"><dt>来源</dt><dd>${esc(labels.source[d.sourceChannel]||d.sourceChannel)}</dd><dt>当前用途</dt><dd>${esc(labels.usage[d.usageType]||d.usageType)}</dd><dt>权利主体</dt><dd>${esc(labels.rights[d.rightsHolderType]||d.rightsHolderType)}${d.rightsHolderName?' · '+esc(d.rightsHolderName):''}</dd><dt>联系方式</dt><dd>${esc(d.rightsHolderContact||d.rightsHolderContactMasked||'-')}</dd><dt>绑定账号</dt><dd>${esc(owner)}</dd><dt>授权状态</dt><dd>${esc(labels.auth[d.authorizationStatus]||d.authorizationStatus)}</dd><dt>资料状态</dt><dd>${esc(labels.status[d.status]||d.status)}</dd><dt>标签</dt><dd>${d.tags.length?d.tags.map(t=>`<span class="chip">${esc(t.name)}</span>`).join(' '):'-'}</dd><dt>内部备注</dt><dd>${esc(d.internalNotes||'-')}</dd><dt>建立时间</dt><dd>${fmt(d.createdAt)}</dd></dl></div><div class="section"><h3>不可覆盖版本</h3><div class="relations">${d.versions.map(v=>`<button class="relation" style="width:100%;border-left:0;border-right:0;border-top:0;background:#fff;cursor:pointer" onclick="loadVersion(${v.versionNo})"><strong>V${v.versionNo} · ${v.baseFrameCount} 帧</strong><span>${fmt(v.createdAt)}</span></button>`).join('')||'<div class="empty">暂无正式版本</div>'}</div></div><div class="section"><h3>关联记录</h3><div class="relations"><div class="relation"><strong>定制记录</strong><span>${d._count.customizationRequests}</span></div>${d.customizationRequests.map(x=>`<div class="relation"><span>${esc(x.requestNo||'未编号')}</span><span>${esc(x.status)}</span></div>`).join('')}<div class="relation"><strong>联名作品</strong><span>${d._count.collabWorks}</span></div>${d.collabWorks.map(x=>`<div class="relation"><span>${esc(x.title)}</span><span>${esc(x.status)}</span></div>`).join('')}<div class="relation"><strong>订单商品</strong><span>${d._count.salesOrderItems}</span></div>${d.salesOrderItems.map(x=>`<div class="relation"><span>${esc(x.salesOrder.orderNo)} · ${esc(x.skuCode||'-')}</span><span>${esc(x.salesOrder.status)}</span></div>`).join('')}</div></div>${currentUser.staffRole==='OWNER'?`<div class="detail-actions">${d.status==='ARCHIVED'?'<button class="btn" onclick="restoreAsset()">恢复资料</button>':'<button class="btn" onclick="archiveAsset()">归档</button>'}<button class="btn btn-danger" onclick="deleteAsset()">永久删除</button></div>`:''}</div>`}
async function loadVersion(no){clearInterval(playTimer);try{const v=await api(`/api/admin/frame-library/${active.id}/versions/${no}`);frameData=v.frames||[];const preview=document.getElementById('preview'),strip=document.getElementById('frames');if(!frameData.length){preview.innerHTML='<span class="cover-empty">该版本没有可读取的帧图</span>';strip.innerHTML='';return}preview.innerHTML=`<img id="previewImg" src="${esc(frameData[0].url)}"><button class="preview-control" id="playBtn" onclick="togglePlay()">▶</button>`;strip.innerHTML=frameData.map((f,i)=>`<button class="frame ${i===0?'active':''}" onclick="showFrame(${i})"><img src="${esc(f.url)}" loading="lazy"></button>`).join('')}catch(e){document.getElementById('preview').innerHTML=`<span class="cover-empty">${esc(e.message)}</span>`}}
function showFrame(i){const f=frameData[i];if(!f)return;document.getElementById('previewImg').src=f.url;document.querySelectorAll('.frame').forEach((e,n)=>e.classList.toggle('active',n===i))}function togglePlay(){if(playTimer){clearInterval(playTimer);playTimer=null;document.getElementById('playBtn').textContent='▶';return}let i=0;document.getElementById('playBtn').textContent='Ⅱ';playTimer=setInterval(()=>{i=(i+1)%frameData.length;showFrame(i)},110)}
function openCreate(){active=null;document.getElementById('modalTitle').textContent='新增帧图资产';document.getElementById('modalHint').textContent='导入后生成统一 ANM 编号和 V1';for(const id of ['formTitle','formHolder','formContact','formOwnerPhone','formTags','formNotes'])document.getElementById(id).value='';document.getElementById('formSource').value='OFFLINE_CUSTOM';document.getElementById('formUsage').value='PRIVATE_CUSTOM';document.getElementById('formRights').value='OFFLINE_CUSTOMER';document.getElementById('formAuth').value='PRIVATE_ONLY';document.getElementById('formFrames').value='';document.getElementById('frameUploadField').style.display='block';document.getElementById('assetModal').classList.add('show')}
function openEdit(){document.getElementById('modalTitle').textContent='编辑资产资料';document.getElementById('modalHint').textContent=active.assetNo+' · 不会覆盖历史帧图版本';document.getElementById('formTitle').value=active.title;document.getElementById('formSource').value=active.sourceChannel;document.getElementById('formUsage').value=active.usageType;document.getElementById('formRights').value=active.rightsHolderType;document.getElementById('formAuth').value=active.authorizationStatus;document.getElementById('formHolder').value=active.rightsHolderName||'';document.getElementById('formContact').value=active.rightsHolderContact||'';document.getElementById('formOwnerPhone').value='';document.getElementById('formOwnerPhone').placeholder=active.owner?'已绑定；留空保持不变':'输入已注册的手机号完成绑定';document.getElementById('formTags').value=active.tags.map(t=>t.name).join('，');document.getElementById('formNotes').value=active.internalNotes||'';document.getElementById('frameUploadField').style.display='none';document.getElementById('assetModal').classList.add('show')}
function closeModal(){document.getElementById('assetModal').classList.remove('show')}function formPayload(){return{title:document.getElementById('formTitle').value,sourceChannel:document.getElementById('formSource').value,usageType:document.getElementById('formUsage').value,rightsHolderType:document.getElementById('formRights').value,authorizationStatus:document.getElementById('formAuth').value,rightsHolderName:document.getElementById('formHolder').value,rightsHolderContact:document.getElementById('formContact').value,ownerPhone:document.getElementById('formOwnerPhone').value,tags:tags(document.getElementById('formTags').value),internalNotes:document.getElementById('formNotes').value}}
async function saveAsset(){const btn=document.getElementById('saveBtn');btn.disabled=true;try{const payload=formPayload();if(active){await api('/api/admin/frame-library/'+active.id,{method:'PATCH',body:JSON.stringify(payload)});toast('资料已更新');closeModal();await loadStats();await openDetail(active.id)}else{const files=[...document.getElementById('formFrames').files].sort((a,b)=>a.name.localeCompare(b.name,'zh-CN',{numeric:true}));if(!files.length)throw new Error('请选择核心帧图');document.getElementById('frameFileHint').textContent=`正在上传 0/${files.length}`;payload.frameKeys=await MowoPrivateUpload.uploadFiles({files,token,purpose:'LIBRARY_FRAME',onProgress:(n,t)=>document.getElementById('frameFileHint').textContent=`正在上传 ${n}/${t}`});const result=await api('/api/admin/frame-library',{method:'POST',body:JSON.stringify(payload)});toast(`已建立 ${result.assetNo}`);closeModal();page=1;await loadAll();await openDetail(result.id)}}catch(e){toast(e.message)}finally{btn.disabled=false;document.getElementById('frameFileHint').textContent='请选择 1 至 50 张图片，按文件名自然顺序保存'}}
async function archiveAsset(){if(!confirm(`归档 ${active.assetNo}？归档不会删除帧图和历史关系。`))return;try{await api(`/api/admin/frame-library/${active.id}/archive`,{method:'POST',body:'{}'});toast('已归档');activeId=null;closeDetail();await loadAll()}catch(e){toast(e.message)}}async function restoreAsset(){try{await api(`/api/admin/frame-library/${active.id}/restore`,{method:'POST',body:'{}'});toast('已恢复');await loadAll();await openDetail(active.id)}catch(e){toast(e.message)}}async function deleteAsset(){if(!confirm(`永久删除 ${active.assetNo}？只有完全没有业务关联的内部测试素材才能删除，此操作不能撤销。`))return;try{await api(`/api/admin/frame-library/${active.id}`,{method:'DELETE'});toast('内部测试素材已永久删除');activeId=null;closeDetail();await loadAll()}catch(e){toast(e.message)}}
async function openProductionModal(){try{productionOptions=await api(`/api/admin/frame-library/${active.id}/production-options`);productionAnimationVersion.innerHTML=productionOptions.versions.map(v=>`<option value="${v.id}" data-frames="${v.baseFrameCount}">V${v.versionNo} · ${v.baseFrameCount}个核心帧</option>`).join('');productionTargetFrames.value=productionOptions.versions[0]?.baseFrameCount||'';refreshProductionCompatibility();productionModal.classList.add('show')}catch(e){toast(e.message)}}
function refreshProductionCompatibility(){const option=productionAnimationVersion.selectedOptions[0],base=Number(option?.dataset.frames||0),target=Number(productionTargetFrames.value||0);const compatible=(productionOptions?.templates||[]).filter(t=>target>0&&base>0&&target%base===0&&target%t.framesPerSheet===0);productionTemplate.innerHTML=compatible.map(t=>`<option value="${t.id}">${esc(t.groupName)} · ${esc(t.paperSize)} · ${esc(t.size)} · 单页${t.framesPerSheet}帧 · 模板V${t.templateVersionNo}</option>`).join('');productionTemplateHint.textContent=!target?'请输入目标商品帧数':target%base!==0?`目标帧数必须是核心 ${base} 帧的整数倍`:compatible.length?`找到 ${compatible.length} 个兼容模板`:'没有可整页排版的兼容模板，请先在打印与裁切设置上传模板'}
function closeProductionModal(){productionModal.classList.remove('show')}
async function generateProductionFile(){if(!productionTemplate.value)return toast('当前没有可用模板');const btn=generateProductionBtn;btn.disabled=true;btn.textContent='正在生成...';try{await api(`/api/admin/frame-library/${active.id}/production-files`,{method:'POST',body:JSON.stringify({animationVersionId:productionAnimationVersion.value,templateVersionId:productionTemplate.value,targetFrameCount:Number(productionTargetFrames.value),markerEnabled:productionMarker.checked})});closeProductionModal();toast('生产文件已经生成');await loadAssets();await openDetail(active.id)}catch(e){toast(e.message)}finally{btn.disabled=false;btn.textContent='生成 Word 文件'}}
function closeDetail(){clearInterval(playTimer);document.getElementById('detail').classList.remove('open');document.getElementById('detail').innerHTML='<div class="empty">选择一套动画，查看帧图、版本和业务关系</div>'}function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarBackdrop').classList.add('show')}function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarBackdrop').classList.remove('show')}
document.addEventListener('DOMContentLoaded',init)
</script>
</body>
</html>
