<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的收货地址 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cream:#F5F3EF;--black:#111110;
  --gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;
  --accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;
  --font:'Nunito','Noto Sans SC',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);--nav-h:65px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);-webkit-font-smoothing:antialiased;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}
a{text-decoration:none;color:inherit;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:var(--nav-h);background:rgba(245,243,239,.96);backdrop-filter:blur(20px);border-bottom:1.5px solid var(--gray1);}
@media(min-width:1024px){.nav{padding:0 48px;}}
.nav-logo-cn{font-weight:900;font-size:22px;color:var(--black);}
.nav-logo-en{font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray3);display:block;}
.nav-links{display:none;list-style:none;gap:32px;}
@media(min-width:1024px){.nav-links{display:flex;}}
.nav-links a{font-weight:800;font-size:14px;color:var(--gray3);transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--black);}
.nav-right{display:flex;align-items:center;gap:8px;}
.nav-login-btn{font-weight:900;font-size:14px;padding:9px 20px;border-radius:999px;background:var(--accent-y);color:var(--black);}
.nav-user{position:relative;}
.nav-avatar-btn{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:2px solid transparent;transition:border-color .2s;}
.nav-avatar-btn:hover,.nav-avatar-btn.open{border-color:var(--gray1);background:var(--white);}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);}
.nav-uname{font-weight:800;font-size:13px;display:none;}
@media(min-width:640px){.nav-uname{display:block;}}
.nav-chevron{font-size:10px;color:var(--gray3);transition:transform .25s;}
.nav-avatar-btn.open .nav-chevron{transform:rotate(180deg);}
.user-dropdown{position:absolute;top:calc(100% + 10px);right:0;width:232px;background:var(--white);border-radius:20px;border:1.5px solid var(--gray1);box-shadow:0 8px 40px rgba(0,0,0,.12);padding:8px;opacity:0;pointer-events:none;transform:translateY(-8px) scale(.97);transform-origin:top right;transition:opacity .25s,transform .25s;z-index:100;}
.user-dropdown.open{opacity:1;pointer-events:all;transform:none;}
.dropdown-head{padding:12px 14px 14px;border-bottom:1px solid var(--gray1);margin-bottom:6px;display:flex;align-items:center;gap:12px;}
.dh-av{width:38px;height:38px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:var(--black);border:2px solid var(--gray1);}
.dh-name{font-weight:900;font-size:14px;}
.dh-role{font-size:11px;font-weight:700;color:var(--gray3);margin-top:2px;}
.di{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:12px;font-weight:800;font-size:13px;color:var(--black);transition:background .15s;width:100%;text-align:left;}
.di:hover{background:var(--cream);}

/* PAGE */
.page{max-width:760px;margin:0 auto;padding:calc(var(--nav-h) + 40px) 24px 80px;}
@media(min-width:1024px){.page{padding:calc(var(--nav-h) + 56px) 48px 80px;}}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
.page-title{font-weight:900;font-size:28px;}
.btn-add{display:flex;align-items:center;gap:6px;padding:10px 20px;border-radius:999px;background:var(--accent-y);color:var(--black);font-weight:900;font-size:14px;transition:opacity .2s;}
.btn-add:hover{opacity:.85;}

/* ADDRESS CARDS */
.address-list{display:flex;flex-direction:column;gap:12px;}
.address-card{background:var(--white);border:1.5px solid var(--gray1);border-radius:20px;padding:18px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;transition:border-color .2s;}
.address-card.is-default{border-color:var(--accent-y);}
.card-main{flex:1;min-width:0;}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.tag-default{background:var(--accent-y);color:var(--black);font-weight:900;font-size:11px;padding:2px 8px;border-radius:999px;}
.tag-label{background:var(--gray1);color:var(--gray3);font-weight:800;font-size:11px;padding:2px 8px;border-radius:999px;}
.card-name{font-weight:900;font-size:15px;}
.card-phone{font-weight:700;font-size:13px;color:var(--gray3);margin-left:8px;}
.card-addr{font-size:13px;font-weight:700;color:var(--gray3);margin-top:4px;line-height:1.5;word-break:break-all;}
.card-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.btn-action{padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px;color:var(--black);border:1.5px solid var(--gray1);transition:background .15s,border-color .15s;}
.btn-action:hover{background:var(--cream);border-color:var(--gray2);}
.btn-action.del{color:#e74c3c;border-color:#fdd;}
.btn-action.del:hover{background:#fff5f5;border-color:#e74c3c;}
.btn-action.set-default{border-color:var(--accent-y);}
.btn-action.set-default:hover{background:var(--accent-y);}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;}
.empty-icon{font-size:52px;margin-bottom:16px;}
.empty-title{font-weight:900;font-size:18px;margin-bottom:8px;}
.empty-desc{color:var(--gray3);font-size:14px;font-weight:700;}

/* MODAL OVERLAY */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:800;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
@media(min-width:640px){.modal-overlay{align-items:center;}}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--white);border-radius:24px 24px 0 0;padding:24px 20px 32px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;transform:translateY(24px);transition:transform .3s var(--ease);}
@media(min-width:640px){.modal{border-radius:24px;transform:translateY(8px) scale(.97);}}
.modal-overlay.open .modal{transform:none;}
.modal-title{font-weight:900;font-size:18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{font-size:20px;color:var(--gray3);background:var(--gray1);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.modal-close:hover{background:var(--gray2);}

/* SMART PARSE AREA */
.smart-area{background:var(--cream);border-radius:14px;padding:14px;margin-bottom:18px;}
.smart-label{font-weight:800;font-size:12px;color:var(--gray3);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.smart-textarea{width:100%;border:1.5px solid var(--gray1);border-radius:10px;padding:10px 12px;font-size:13px;font-family:var(--font);font-weight:700;color:var(--black);background:var(--white);resize:vertical;min-height:68px;outline:none;transition:border-color .2s;}
.smart-textarea:focus{border-color:var(--black);}
.smart-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.smart-hint{font-size:11px;font-weight:700;color:var(--gray3);}
.smart-hint.ok{color:#27ae60;}
.smart-hint.warn{color:var(--accent-o);}
.btn-parse{padding:6px 14px;border-radius:999px;background:var(--black);color:var(--white);font-weight:900;font-size:12px;transition:opacity .2s;}
.btn-parse:hover{opacity:.8;}

/* FORM */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
.form-row.full{grid-template-columns:1fr;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-label{font-weight:800;font-size:12px;color:var(--gray3);}
.form-label .req{color:var(--accent-o);}
.form-input,.form-select{border:1.5px solid var(--gray1);border-radius:10px;padding:9px 12px;font-size:14px;font-family:var(--font);font-weight:700;color:var(--black);background:var(--white);outline:none;transition:border-color .2s;width:100%;}
.form-input:focus,.form-select:focus{border-color:var(--black);}
.form-input::placeholder{color:var(--gray2);}
.form-select:disabled{color:var(--gray2);background:var(--cream);cursor:not-allowed;}

/* TAGS */
.label-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.label-tag{padding:5px 12px;border-radius:999px;font-weight:800;font-size:12px;border:1.5px solid var(--gray1);background:var(--white);color:var(--gray3);transition:background .15s,border-color .15s,color .15s;}
.label-tag.active{background:var(--black);color:var(--white);border-color:var(--black);}

/* MODAL ACTIONS */
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-save{flex:1;padding:13px;border-radius:14px;background:var(--black);color:var(--white);font-weight:900;font-size:15px;transition:opacity .2s;}
.btn-save:hover{opacity:.85;}
.btn-cancel{padding:13px 20px;border-radius:14px;border:1.5px solid var(--gray1);font-weight:800;font-size:15px;color:var(--black);}
.btn-cancel:hover{background:var(--gray1);}

/* TOAST */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--black);color:var(--white);padding:10px 20px;border-radius:999px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:1000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo-cn">哞屋</span>
    <span class="nav-logo-en">MOWOBOX</span>
  </a>
  <ul class="nav-links">
    <li><a href="./showcase.html">联名作品</a></li>
    <li><a href="./customize-start.html">定制动画机</a></li>
    <li><a href="./cart.html">购物车</a></li>
  </ul>
  <div class="nav-right">
    <div class="nav-user" id="navUserArea">
      <button class="nav-login nav-login-btn" id="navLoginBtn">登录</button>
    </div>
  </div>
</nav>

<!-- PAGE -->
<div class="page">
  <div class="page-header">
    <h1 class="page-title">收货地址</h1>
    <button class="btn-add" onclick="openModal()">＋ 新增地址</button>
  </div>
  <div class="address-list" id="addressList">
    <!-- 动态渲染 -->
  </div>
</div>

<!-- 新增/编辑 Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-title">
      <span id="modalTitle">新增地址</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <!-- 智能识别 -->
    <div class="smart-area">
      <div class="smart-label">🪄 智能识别（粘贴收件人信息，自动拆分）</div>
      <textarea class="smart-textarea" id="smartText" placeholder="粘贴如：张三 13800138000 广东省深圳市南山区科技园南路88号B座501"></textarea>
      <div class="smart-footer">
        <span class="smart-hint" id="smartHint">粘贴后点击识别，或直接手动填写</span>
        <button class="btn-parse" onclick="doParse()">一键识别</button>
      </div>
    </div>

    <!-- 姓名 + 手机 -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">收件人姓名 <span class="req">*</span></label>
        <input class="form-input" id="fName" type="text" placeholder="姓名" maxlength="20">
      </div>
      <div class="form-group">
        <label class="form-label">手机号 <span class="req">*</span></label>
        <input class="form-input" id="fPhone" type="tel" placeholder="11位手机号" maxlength="11">
      </div>
    </div>

    <!-- 省市区 -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">省/直辖市 <span class="req">*</span></label>
        <select class="form-select" id="fProvince"></select>
      </div>
      <div class="form-group">
        <label class="form-label">市/州</label>
        <select class="form-select" id="fCity" disabled></select>
      </div>
    </div>
    <div class="form-row full" style="margin-bottom:12px">
      <div class="form-group">
        <label class="form-label">区/县</label>
        <select class="form-select" id="fDistrict" disabled></select>
      </div>
    </div>

    <!-- 详细地址 -->
    <div class="form-row full">
      <div class="form-group">
        <label class="form-label">详细地址 <span class="req">*</span></label>
        <input class="form-input" id="fDetail" type="text" placeholder="街道、楼栋、门牌号等" maxlength="200">
      </div>
    </div>

    <!-- 标签 -->
    <div class="form-group" style="margin-bottom:4px">
      <label class="form-label">地址标签（可选）</label>
      <div class="label-tags" id="labelTags">
        <button class="label-tag" data-label="家" onclick="toggleLabel(this)">🏠 家</button>
        <button class="label-tag" data-label="公司" onclick="toggleLabel(this)">🏢 公司</button>
        <button class="label-tag" data-label="学校" onclick="toggleLabel(this)">🎓 学校</button>
      </div>
    </div>

    <!-- 操作 -->
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveAddress()">保存地址</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="../js/runtime-config.js"></script>
<script type="module">
import { smartParseAddress, initCascadeSelects, fillAddressForm } from '../js/address-utils.js'

const API = window.MOWO_API_BASE || ''
let token = ''
let regions = null
let editingId = null
let addresses = []

// ── 初始化 ──────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  token = localStorage.getItem('mowo_token') || ''
  if (!token) {
    const redirect = location.pathname + location.search
    window.location.href = `index.html?auth=1&redirect=${encodeURIComponent(redirect)}`
    return
  }

  // 加载地区数据
  const r = await fetch('../assets/regions.json')
  regions = await r.json()

  // 初始化联级下拉
  initCascadeSelects({
    provinceEl: document.getElementById('fProvince'),
    cityEl:     document.getElementById('fCity'),
    districtEl: document.getElementById('fDistrict'),
    regions
  })

  await loadAddresses()
})

window.addEventListener('mowoTokenRefreshed', () => {
  token = localStorage.getItem('mowo_token') || ''
})

// ── 加载地址列表 ──────────────────────────────────────────────────
async function loadAddresses() {
  try {
    const res = await fetch(`${API}/api/addresses`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    const data = await res.json()
    if (!data.success) throw new Error()
    addresses = data.data || []
    renderAddresses()
  } catch {
    showToast('加载地址失败，请刷新重试')
  }
}

function renderAddresses() {
  const list = document.getElementById('addressList')
  if (!addresses.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📍</div>
        <div class="empty-title">还没有收货地址</div>
        <div class="empty-desc">添加常用地址，下次购买更快捷</div>
      </div>`
    return
  }
  list.innerHTML = addresses.map(addr => `
    <div class="address-card ${addr.isDefault ? 'is-default' : ''}">
      <div class="card-main">
        <div class="card-top">
          ${addr.isDefault ? '<span class="tag-default">默认</span>' : ''}
          ${addr.label ? `<span class="tag-label">${escHtml(addr.label)}</span>` : ''}
        </div>
        <div>
          <span class="card-name">${escHtml(addr.name)}</span>
          <span class="card-phone">${maskPhone(addr.phone)}</span>
        </div>
        <div class="card-addr">${escHtml(addr.province + addr.city + addr.district + ' ' + addr.detail)}</div>
      </div>
      <div class="card-actions">
        ${!addr.isDefault ? `<button class="btn-action set-default" onclick="setDefault('${addr.id}')">设为默认</button>` : ''}
        <button class="btn-action" onclick="editAddress('${addr.id}')">编辑</button>
        <button class="btn-action del" onclick="deleteAddress('${addr.id}')">删除</button>
      </div>
    </div>
  `).join('')
}

// ── Modal 开关 ────────────────────────────────────────────────────
window.openModal = function(id) {
  editingId = id || null
  document.getElementById('modalTitle').textContent = id ? '编辑地址' : '新增地址'
  document.getElementById('smartText').value = ''
  document.getElementById('smartHint').textContent = '粘贴后点击识别，或直接手动填写'
  document.getElementById('smartHint').className = 'smart-hint'

  if (id) {
    const addr = addresses.find(a => a.id === id)
    if (addr) {
      document.getElementById('fName').value = addr.name
      document.getElementById('fPhone').value = addr.phone
      document.getElementById('fDetail').value = addr.detail
      // 标签
      document.querySelectorAll('.label-tag').forEach(t => {
        t.classList.toggle('active', t.dataset.label === addr.label)
      })
      // 联级回填
      fillAddressForm({
        provinceEl: document.getElementById('fProvince'),
        cityEl:     document.getElementById('fCity'),
        districtEl: document.getElementById('fDistrict'),
        detailEl:   null  // detail 已手动填了
      }, { province: addr.province, city: addr.city, district: addr.district, detail: '' })
    }
  } else {
    document.getElementById('fName').value = ''
    document.getElementById('fPhone').value = ''
    document.getElementById('fDetail').value = ''
    document.getElementById('fProvince').value = ''
    document.getElementById('fCity').innerHTML = '<option value="">请选择市/州</option>'
    document.getElementById('fCity').disabled = true
    document.getElementById('fDistrict').innerHTML = '<option value="">请选择区/县</option>'
    document.getElementById('fDistrict').disabled = true
    document.querySelectorAll('.label-tag').forEach(t => t.classList.remove('active'))
  }

  document.getElementById('modalOverlay').classList.add('open')
}

window.closeModal = function() {
  document.getElementById('modalOverlay').classList.remove('open')
}

window.handleOverlayClick = function(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal()
}

window.editAddress = function(id) { openModal(id) }

// ── 智能解析 ──────────────────────────────────────────────────────
window.doParse = function() {
  const text = document.getElementById('smartText').value.trim()
  if (!text) return
  const parsed = smartParseAddress(text, regions)
  fillAddressForm({
    nameEl:     document.getElementById('fName'),
    phoneEl:    document.getElementById('fPhone'),
    provinceEl: document.getElementById('fProvince'),
    cityEl:     document.getElementById('fCity'),
    districtEl: document.getElementById('fDistrict'),
    detailEl:   document.getElementById('fDetail')
  }, parsed)

  const hint = document.getElementById('smartHint')
  if (parsed.confidence === 'high') {
    hint.textContent = '✅ 识别完成，请核对信息'
    hint.className = 'smart-hint ok'
  } else if (parsed.confidence === 'medium') {
    hint.textContent = '⚠️ 部分字段未识别，请手动补全'
    hint.className = 'smart-hint warn'
  } else {
    hint.textContent = '识别内容较少，请手动填写'
    hint.className = 'smart-hint'
  }
}

// ── 标签选择 ──────────────────────────────────────────────────────
window.toggleLabel = function(el) {
  const isActive = el.classList.contains('active')
  document.querySelectorAll('.label-tag').forEach(t => t.classList.remove('active'))
  if (!isActive) el.classList.add('active')
}

// ── 保存地址 ──────────────────────────────────────────────────────
window.saveAddress = async function() {
  const name     = document.getElementById('fName').value.trim()
  const phone    = document.getElementById('fPhone').value.trim()
  const province = document.getElementById('fProvince').value
  const city     = document.getElementById('fCity').value
  const district = document.getElementById('fDistrict').value
  const detail   = document.getElementById('fDetail').value.trim()
  const activeTag = document.querySelector('.label-tag.active')
  const label = activeTag ? activeTag.dataset.label : null

  // 前端简单校验
  if (!name) return showToast('请填写收件人姓名')
  if (!/^1[3-9]\d{9}$/.test(phone)) return showToast('请填写正确的手机号')
  if (!province) return showToast('请选择省份')
  if (!city) return showToast('请选择城市')
  if (!district) return showToast('请选择区/县')
  if (!detail || detail.length < 5) return showToast('详细地址不少于5个字符')

  const body = { name, phone, province, city, district, detail, label }
  const url = editingId ? `${API}/api/addresses/${editingId}` : `${API}/api/addresses`
  const method = editingId ? 'PUT' : 'POST'

  try {
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify(body)
    })
    const data = await res.json()
    if (!data.success) return showToast(data.message || '保存失败')
    closeModal()
    showToast(editingId ? '地址已更新' : '地址已添加')
    await loadAddresses()
  } catch {
    showToast('网络错误，请重试')
  }
}

// ── 设为默认 ──────────────────────────────────────────────────────
window.setDefault = async function(id) {
  try {
    const res = await fetch(`${API}/api/addresses/${id}/default`, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${token}` }
    })
    const data = await res.json()
    if (!data.success) return showToast(data.message || '操作失败')
    showToast('已设为默认地址')
    await loadAddresses()
  } catch {
    showToast('网络错误')
  }
}

// ── 删除地址 ──────────────────────────────────────────────────────
window.deleteAddress = async function(id) {
  const addr = addresses.find(a => a.id === id)
  if (!addr) return
  const label = addr.label ? `「${addr.label}」` : ''
  const confirm = window.confirm(`确定删除${label}${addr.name}的地址吗？`)
  if (!confirm) return

  try {
    const res = await fetch(`${API}/api/addresses/${id}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${token}` }
    })
    const data = await res.json()
    if (!data.success) return showToast(data.message || '删除失败')
    showToast('地址已删除')
    await loadAddresses()
  } catch {
    showToast('网络错误')
  }
}

// ── 工具函数 ──────────────────────────────────────────────────────
function maskPhone(p) {
  return p ? p.replace(/^(\d{3})\d{4}(\d{4})$/, '$1****$2') : ''
}

function escHtml(s) {
  if (!s) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

let _toastTimer
function showToast(msg) {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('show')
  clearTimeout(_toastTimer)
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2500)
}
</script>
