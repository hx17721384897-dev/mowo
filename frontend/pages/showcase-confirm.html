<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联名作品详情 — 哞屋 MOWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --white:    #FFFFFF;
  --cream:    #F5F3EF;
  --black:    #111110;
  --gray1:    #EBEBEA;
  --gray2:    #C4C3BF;
  --gray3:    #787874;
  --accent-y: #F5E642;
  --accent-o: #FF6B35;
  --accent-g: #8FD694;
  --font:     'Nunito', 'Noto Sans SC', sans-serif;
  --ease:     cubic-bezier(0.22, 1, 0.36, 1);
  --pad-mob:  20px;
  --pad-desk: 48px;
  --nav-h:    75px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--cream);color:var(--black);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;}

/* ── NAV ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;align-items:center;justify-content:space-between;padding:14px var(--pad-mob);background:rgba(245,243,239,.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.06);}
@media(min-width:1024px){.nav{padding:20px var(--pad-desk);}}
.nav-logo{line-height:1;}
.nav-logo-cn{font-weight:900;font-size:22px;letter-spacing:-.01em;color:var(--black);display:block;}
.nav-logo-en{font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray3);display:block;margin-top:1px;}
.nav-links{display:none;list-style:none;gap:36px;}
@media(min-width:1024px){.nav-links{display:flex;}}
.nav-links a{font-weight:800;font-size:14px;color:var(--gray3);transition:color .2s;position:relative;padding-bottom:3px;}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent-y);border-radius:2px;transform:scaleX(0);transition:transform .25s var(--ease);}
.nav-links a:hover{color:var(--black);}
.nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);}
.nav-links a.active{color:var(--black);}
.nav-right{display:flex;align-items:center;gap:8px;}
.nav-login{font-weight:800;font-size:13px;padding:10px 22px;background:var(--black);color:var(--white);border-radius:999px;min-height:44px;display:flex;align-items:center;transition:opacity .2s;}
.nav-login:hover{opacity:.8;}

/* ── BREADCRUMB ── */
.breadcrumb{padding:calc(var(--nav-h) + 20px) var(--pad-mob) 0;max-width:1200px;margin:0 auto;}
@media(min-width:1024px){.breadcrumb{padding:calc(var(--nav-h) + 28px) var(--pad-desk) 0;}}
.back-btn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--gray3);transition:color .2s;}
.back-btn:hover{color:var(--black);}
.back-arrow{font-size:16px;transition:transform .2s var(--ease);}
.back-btn:hover .back-arrow{transform:translateX(-3px);}

/* ── DETAIL LAYOUT ── */
.detail-wrap{max-width:1200px;margin:0 auto;padding:20px var(--pad-mob) 80px;display:grid;grid-template-columns:1fr;gap:32px;}
@media(min-width:900px){.detail-wrap{grid-template-columns:420px 1fr;gap:48px;padding:24px var(--pad-desk) 100px;align-items:start;}}
@media(min-width:1200px){.detail-wrap{grid-template-columns:460px 1fr;}}

/* ── LEFT: GALLERY ── */
.detail-media{position:relative;}
@media(min-width:900px){.detail-media{position:sticky;top:calc(var(--nav-h) + 24px);}}

.gallery-main{width:100%;aspect-ratio:1/1;border-radius:24px;overflow:hidden;background:var(--white);border:2px solid var(--gray1);position:relative;margin-bottom:12px;}
@media(max-width:899px){.gallery-main{aspect-ratio:4/3;max-height:60vw;}}

.gallery-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);}
.gallery-slide.active{opacity:1;pointer-events:all;}
.gallery-slide img{width:100%;height:100%;object-fit:cover;display:block;}
.gallery-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px;opacity:.2;background:var(--gray1);}

.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:1.5px solid var(--gray1);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--black);cursor:pointer;z-index:5;transition:all .2s var(--ease);box-shadow:0 2px 12px rgba(0,0,0,.1);}
.gallery-arrow:hover{background:var(--white);box-shadow:0 4px 20px rgba(0,0,0,.15);transform:translateY(-50%) scale(1.06);}
.gallery-arrow-prev{left:12px;}
.gallery-arrow-next{right:12px;}
.gallery-arrow.hidden{display:none;}

.gallery-counter{position:absolute;bottom:12px;right:12px;z-index:5;background:rgba(0,0,0,.45);color:var(--white);backdrop-filter:blur(8px);font-weight:800;font-size:11px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;}

.gallery-thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.gallery-thumbs::-webkit-scrollbar{display:none;}
@media(max-width:899px){.gallery-thumbs{display:none;}}

.gallery-thumb{flex-shrink:0;width:64px;height:64px;border-radius:10px;overflow:hidden;border:2.5px solid transparent;cursor:pointer;background:var(--white);display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.6;transition:border-color .2s,transform .2s,opacity .2s;}
.gallery-thumb:hover{opacity:.85;transform:scale(1.04);}
.gallery-thumb.active{border-color:var(--black);opacity:1;}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;}

/* ── RIGHT: INFO ── */
.detail-info{}

/* Author row */
.author-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.author-av{width:48px;height:48px;border-radius:50%;background:var(--accent-y);border:2px solid var(--gray1);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.author-av img{width:100%;height:100%;object-fit:cover;}
.author-meta{flex:1;min-width:0;}
.author-handle{font-weight:900;font-size:15px;color:var(--black);}
.author-stats{font-weight:700;font-size:12px;color:var(--gray3);margin-top:2px;}
.follow-btn{margin-left:auto;font-weight:800;font-size:13px;padding:8px 20px;border-radius:999px;min-height:40px;border:2px solid var(--gray1);color:var(--gray3);transition:all .2s;display:flex;align-items:center;flex-shrink:0;}
.follow-btn:hover{border-color:var(--black);color:var(--black);}
.follow-btn.following{background:var(--black);color:var(--white);border-color:var(--black);}

/* Title + badges */
.badge-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.badge{font-weight:900;font-size:10px;letter-spacing:.06em;padding:4px 12px;border-radius:999px;}
.badge-exclusive{background:var(--accent-y);color:var(--black);}
.badge-newbie{background:var(--accent-o);color:var(--white);}
.work-title{font-weight:900;font-size:clamp(22px,3.5vw,30px);letter-spacing:-.02em;line-height:1.2;margin-bottom:16px;}

/* Stats row */
.stats-row{display:flex;gap:20px;align-items:center;padding:14px 0;border-top:1px solid var(--gray1);border-bottom:1px solid var(--gray1);margin-bottom:20px;}
.stat-item{display:flex;align-items:center;gap:6px;}
.stat-icon{font-size:15px;}
.stat-val{font-weight:900;font-size:15px;}
.stat-lab{font-weight:700;font-size:11px;color:var(--gray3);}
.like-big{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:2px solid var(--gray1);font-weight:900;font-size:14px;color:var(--gray3);transition:all .2s;min-height:44px;margin-left:auto;}
.like-big:hover{border-color:var(--accent-o);color:var(--accent-o);}
.like-big.liked{background:#FFF2EC;border-color:var(--accent-o);color:var(--accent-o);}
.like-big-icon{font-size:17px;transition:transform .25s var(--ease);}
.like-big.liked .like-big-icon,.like-big:hover .like-big-icon{transform:scale(1.2);}

/* Description */
.work-desc{font-weight:700;font-size:14px;line-height:1.9;color:var(--gray3);margin-bottom:24px;}

/* SKU 选配 */
.section-label{font-weight:900;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gray3);margin-bottom:10px;}
.sku-group{margin-bottom:16px;}
.sku-opts{display:flex;gap:8px;flex-wrap:wrap;}
.sku-opt{padding:8px 16px;border-radius:12px;border:1.5px solid var(--gray1);font-weight:800;font-size:13px;background:var(--white);transition:border-color .2s,background .2s,color .2s;cursor:pointer;}
.sku-opt:hover{border-color:var(--gray3);}
.sku-opt.selected{border-color:var(--black);background:var(--black);color:var(--white);}

/* CTA block */
.cta-block{background:var(--black);border-radius:24px;padding:22px;margin-bottom:20px;}
.cta-price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:16px;}
.cta-price{font-weight:900;font-size:32px;letter-spacing:-.02em;color:var(--accent-y);}
.cta-price-unit{font-weight:700;font-size:14px;color:rgba(255,255,255,.4);}
.cta-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-cart{height:52px;border-radius:999px;font-weight:900;font-size:14px;background:rgba(255,255,255,.1);color:var(--white);border:1.5px solid rgba(255,255,255,.2);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-cart:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);}
.btn-buy{height:52px;border-radius:999px;font-weight:900;font-size:14px;background:var(--accent-y);color:var(--black);transition:opacity .2s,transform .2s;display:flex;align-items:center;justify-content:center;}
.btn-buy:hover{opacity:.9;transform:translateY(-1px);}
.btn-cart:disabled,.btn-buy:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}

/* Collab info */
.collab-info{background:var(--white);border:1.5px solid var(--gray1);border-radius:16px;padding:16px 18px;}
.collab-label{font-weight:900;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray3);margin-bottom:6px;}
.collab-note{font-weight:700;font-size:12px;color:var(--gray3);line-height:1.7;}

/* Toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--black);color:var(--white);font-weight:800;font-size:13px;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:9000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Loading / error states */
.page-loading{display:flex;align-items:center;justify-content:center;min-height:60vh;font-weight:700;font-size:15px;color:var(--gray3);}

/* Footer */
footer{background:var(--black);color:rgba(255,255,255,.4);padding:48px var(--pad-mob) 36px;}
@media(min-width:1024px){footer{padding:48px var(--pad-desk) 36px;}}
.foot-row{display:flex;flex-direction:column;gap:16px;}
@media(min-width:640px){.foot-row{flex-direction:row;align-items:center;justify-content:space-between;}}
.foot-logo{font-weight:900;font-size:20px;color:var(--white);}
.foot-links{display:flex;gap:24px;flex-wrap:wrap;}
.foot-links a{font-weight:700;font-size:13px;color:rgba(255,255,255,.35);transition:color .2s;}
.foot-links a:hover{color:var(--white);}
.foot-copy{font-weight:700;font-size:12px;margin-top:24px;}

/* Reveal */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
.reveal.on{opacity:1;transform:none;}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo-cn">哞屋</span>
    <span class="nav-logo-en">MOWO</span>
  </a>
  <ul class="nav-links">
    <li><a href="about.html">关于我们</a></li>
    <li><a href="products.html">产品介绍</a></li>
    <li><a href="showcase.html" class="active">画师联名</a></li>
    <li><a href="customize-start.html">创作中心</a></li>
    <li><a href="contact.html">联络我们</a></li>
  </ul>
  <div class="nav-right">
    <button class="nav-login nav-login-btn" id="navLoginBtn">登录</button>
  </div>
</nav>

<!-- BREADCRUMB -->
<div class="breadcrumb">
  <a href="showcase.html" class="back-btn">
    <span class="back-arrow">←</span>
    <span>返回画师联名</span>
  </a>
</div>

<!-- CONTENT -->
<div id="pageRoot">
  <div class="page-loading">加载中…</div>
</div>

<div class="toast" id="toast"></div>

<footer>
  <div class="foot-row">
    <span class="foot-logo">哞屋 MOWO</span>
    <div class="foot-links">
      <a href="about.html">关于我们</a>
      <a href="products.html">产品介绍</a>
      <a href="showcase.html">画师联名</a>
      <a href="customize-start.html">创作中心</a>
      <a href="contact.html">联络我们</a>
    </div>
  </div>
  <p class="foot-copy">© 2025 哞屋 MOWO. All rights reserved.</p>
</footer>

<script src="../js/auth.js"></script>
<script>
const API = (location.hostname === '127.0.0.1' ? 'http://127.0.0.1:3001' : 'http://localhost:3001')
const urlParams = new URLSearchParams(location.search)
const workId = urlParams.get('workId')

let workData = null
let skuList = []           // [{id, size, material, colorOptions:[]}]
let selectedSkuId = null
let currentSlide = 0
let slides = []            // [{type:'img', src}]
let isLiked = false
let likeCount = 0
let isFollowing = false

/* ── Init ── */
document.addEventListener('DOMContentLoaded', async () => {
  if (!workId) { window.location.href = './showcase.html'; return }
  await loadWork()
})

async function loadWork() {
  try {
    const token = localStorage.getItem('mowo_token') || ''
    const headers = token ? { Authorization: `Bearer ${token}` } : {}
    const res = await fetch(`${API}/api/collab/works/${workId}`, { headers })
    const data = await res.json()
    if (!data.success) throw new Error(data.message || '作品不存在')
    workData = data.data
    skuList = workData.supportedSkus || []
    isLiked = workData.isLiked || false
    likeCount = workData.likeCount || 0

    // 如果已登录，查关注状态
    if (token && workData.creatorId) {
      try {
        const fr = await fetch(`${API}/api/users/${workData.creatorId}/follow-status`, { headers })
        const fd = await fr.json()
        if (fd.success) isFollowing = fd.data?.following ?? false
      } catch {}
    }

    renderPage()
  } catch (e) {
    document.getElementById('pageRoot').innerHTML =
      `<div class="page-loading">${esc(e.message)}</div>`
  }
}

/* ── Render ── */
function renderPage() {
  const w = workData
  const creator = w.creator || {}
  const creatorName = creator.nickname || '认证创作者'
  const creatorInitial = creatorName.charAt(0)

  // 构建轮播幻灯片：封面 + 帧图（最多8张）
  slides = []
  if (w.coverUrl) slides.push({ src: w.coverUrl })
  const frames = Array.isArray(w.animationFrames) ? w.animationFrames : []
  frames.slice(0, 8).forEach(src => { if (src !== w.coverUrl) slides.push({ src }) })
  if (!slides.length) slides.push(null)  // 占位

  // 封面头像
  const avatarHtml = creator.avatarUrl
    ? `<img src="${esc(creator.avatarUrl)}" alt="avatar">`
    : esc(creatorInitial)

  // 徽章
  let badges = ''

  // 基础价格
  const basePrice = w.basePrice ? `¥${Number(w.basePrice).toFixed(0)}` : '询价'

  // SKU 区块（只有 supportedSkus 时才显示）
  let skuHtml = ''
  if (skuList.length) {
    // 按 size 分组
    const sizes = [...new Set(skuList.map(s => s.size).filter(Boolean))]
    const materials = [...new Set(skuList.map(s => s.material).filter(Boolean))]

    if (sizes.length) skuHtml += `
      <div class="sku-group">
        <p class="section-label">尺寸规格</p>
        <div class="sku-opts" id="sizeOpts">
          ${sizes.map(sz => `<button class="sku-opt" data-dim="size" data-val="${esc(sz)}" onclick="selectDim('size','${esc(sz)}')">${esc(sz)}</button>`).join('')}
        </div>
      </div>`

    if (materials.length) skuHtml += `
      <div class="sku-group">
        <p class="section-label">材质</p>
        <div class="sku-opts" id="matOpts">
          ${materials.map(m => `<button class="sku-opt" data-dim="mat" data-val="${esc(m)}" onclick="selectDim('mat','${esc(m)}')">${esc(m)}</button>`).join('')}
        </div>
      </div>`
  }

  document.getElementById('pageRoot').innerHTML = `
  <div class="detail-wrap">

    <!-- LEFT: Gallery -->
    <div class="detail-media reveal">
      <div class="gallery-main" id="galleryMain">
        ${buildSlides()}
        <button class="gallery-arrow gallery-arrow-prev${slides.length <= 1 ? ' hidden' : ''}" onclick="moveSlide(-1)">‹</button>
        <button class="gallery-arrow gallery-arrow-next${slides.length <= 1 ? ' hidden' : ''}" onclick="moveSlide(1)">›</button>
        ${slides.length > 1 ? `<div class="gallery-counter" id="galleryCounter">1 / ${slides.length}</div>` : ''}
      </div>
      <div class="gallery-thumbs" id="galleryThumbs">${buildThumbs()}</div>
    </div>

    <!-- RIGHT: Info -->
    <div class="detail-info">

      <!-- Author row -->
      <div class="author-row reveal d1">
        <div class="author-av">${avatarHtml}</div>
        <div class="author-meta">
          <div class="author-handle">@${esc(creatorName)}</div>
          <div class="author-stats">${fmtCount(creator.followerCount || 0)} 粉丝</div>
        </div>
        <button class="follow-btn ${isFollowing ? 'following' : ''}" id="followBtn"
          onclick="toggleFollow('${esc(w.creatorId)}')">
          ${isFollowing ? '✓ 已关注' : '+ 关注'}
        </button>
      </div>

      <!-- Badges + Title -->
      ${badges ? `<div class="badge-row reveal d1">${badges}</div>` : ''}
      <h1 class="work-title reveal d2">${esc(w.title || '联名作品')}</h1>

      <!-- Stats row -->
      <div class="stats-row reveal d2">
        <div class="stat-item">
          <span class="stat-icon">🎨</span>
          <span class="stat-val">${slides.length}</span>
          <span class="stat-lab">帧预览</span>
        </div>
        <button class="like-big ${isLiked ? 'liked' : ''}" id="likeBigBtn" onclick="toggleLike()">
          <span class="like-big-icon">${isLiked ? '♥' : '♡'}</span>
          <span id="likeBigCount">${fmtCount(likeCount)}</span>
        </button>
      </div>

      <!-- Description -->
      ${w.description ? `<p class="work-desc reveal d3">${esc(w.description)}</p>` : ''}

      <!-- SKU -->
      ${skuHtml}

      <!-- CTA block -->
      <div class="cta-block reveal d3">
        <div class="cta-price-row">
          <span class="cta-price" id="ctaPrice">${basePrice}</span>
          <span class="cta-price-unit">起 · 含硬件</span>
        </div>
        <div class="cta-btns">
          <button class="btn-cart" id="btnCart" onclick="addToCart()" ${skuList.length ? '' : 'disabled'}>
            🛒 加入购物车
          </button>
          <button class="btn-buy" id="btnBuy" onclick="buyNow()" ${skuList.length ? '' : 'disabled'}>
            立即购买
          </button>
        </div>
      </div>

      <!-- Collab info -->
      <div class="collab-info reveal">
        <p class="collab-label">关于联名</p>
        <p class="collab-note">
          购买此作品即直接支持创作者。创作者将在冷静期结束后获得销售分成。
        </p>
      </div>

    </div>
  </div>`

  // 触发 reveal 动画
  requestAnimationFrame(() => {
    document.querySelectorAll('.reveal').forEach(el => {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); obs.unobserve(e.target) } })
      }, { threshold: .08 })
      obs.observe(el)
    })
  })
}

/* ── Gallery ── */
function buildSlides() {
  return slides.map((s, i) => {
    const active = i === 0 ? ' active' : ''
    if (!s) return `<div class="gallery-slide${active}"><div class="gallery-placeholder">🎨</div></div>`
    return `<div class="gallery-slide${active}"><img src="${esc(s.src)}" alt="frame ${i + 1}" loading="${i === 0 ? 'eager' : 'lazy'}"></div>`
  }).join('')
}

function buildThumbs() {
  return slides.map((s, i) => {
    const active = i === 0 ? ' active' : ''
    if (!s) return `<div class="gallery-thumb${active}" onclick="goSlide(${i})">🎨</div>`
    return `<div class="gallery-thumb${active}" onclick="goSlide(${i})"><img src="${esc(s.src)}" alt="thumb ${i + 1}" loading="lazy"></div>`
  }).join('')
}

function goSlide(idx) {
  const all = document.querySelectorAll('.gallery-slide')
  const thumbs = document.querySelectorAll('.gallery-thumb')
  if (!all.length) return
  all[currentSlide]?.classList.remove('active')
  thumbs[currentSlide]?.classList.remove('active')
  currentSlide = (idx + slides.length) % slides.length
  all[currentSlide]?.classList.add('active')
  thumbs[currentSlide]?.classList.add('active')
  const counter = document.getElementById('galleryCounter')
  if (counter) counter.textContent = `${currentSlide + 1} / ${slides.length}`
}

function moveSlide(dir) { goSlide(currentSlide + dir) }

/* ── SKU 选配 ── */
let selectedSize = null
let selectedMat = null

function selectDim(dim, val) {
  if (dim === 'size') {
    selectedSize = val
    document.querySelectorAll('[data-dim="size"]').forEach(b => b.classList.toggle('selected', b.dataset.val === val))
  } else {
    selectedMat = val
    document.querySelectorAll('[data-dim="mat"]').forEach(b => b.classList.toggle('selected', b.dataset.val === val))
  }
  matchSku()
}

function matchSku() {
  // 找出同时满足已选 size + material 的 SKU
  const matched = skuList.find(s => {
    const sizeOk = !selectedSize || s.size === selectedSize
    const matOk = !selectedMat || s.material === selectedMat
    return sizeOk && matOk
  })
  selectedSkuId = matched?.id || null

  if (matched?.price) {
    const el = document.getElementById('ctaPrice')
    if (el) el.textContent = `¥${Number(matched.price).toFixed(0)}`
  }

  const hasChoice = skuList.length > 0
  const ready = !hasChoice || selectedSkuId
  const btnCart = document.getElementById('btnCart')
  const btnBuy = document.getElementById('btnBuy')
  if (btnCart) btnCart.disabled = !ready
  if (btnBuy) btnBuy.disabled = !ready
}

/* ── 点赞 ── */
async function toggleLike() {
  const token = localStorage.getItem('mowo_token')
  if (!token) { if (typeof openAuthModal === 'function') openAuthModal(); return }

  isLiked = !isLiked
  likeCount = isLiked ? likeCount + 1 : Math.max(0, likeCount - 1)
  const btn = document.getElementById('likeBigBtn')
  const countEl = document.getElementById('likeBigCount')
  if (btn) {
    btn.classList.toggle('liked', isLiked)
    btn.querySelector('.like-big-icon').textContent = isLiked ? '♥' : '♡'
  }
  if (countEl) countEl.textContent = fmtCount(likeCount)

  try {
    await fetch(`${API}/api/collab/works/${workId}/like`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` }
    })
  } catch {
    isLiked = !isLiked
    likeCount = isLiked ? likeCount + 1 : Math.max(0, likeCount - 1)
    if (btn) {
      btn.classList.toggle('liked', isLiked)
      btn.querySelector('.like-big-icon').textContent = isLiked ? '♥' : '♡'
    }
    if (countEl) countEl.textContent = fmtCount(likeCount)
  }
}

/* ── 关注 ── */
async function toggleFollow(creatorId) {
  const token = localStorage.getItem('mowo_token')
  if (!token) { if (typeof openAuthModal === 'function') openAuthModal(); return }

  const btn = document.getElementById('followBtn')
  const prev = isFollowing
  isFollowing = !isFollowing
  if (btn) {
    btn.classList.toggle('following', isFollowing)
    btn.textContent = isFollowing ? '✓ 已关注' : '+ 关注'
  }

  try {
    const res = await fetch(`${API}/api/users/${creatorId}/follow`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` }
    })
    const data = await res.json()
    if (!data.success) throw new Error()
    isFollowing = data.following ?? isFollowing
    if (btn) {
      btn.classList.toggle('following', isFollowing)
      btn.textContent = isFollowing ? '✓ 已关注' : '+ 关注'
    }
    showToast(isFollowing ? '已关注创作者' : '已取消关注')
  } catch {
    isFollowing = prev
    if (btn) {
      btn.classList.toggle('following', isFollowing)
      btn.textContent = isFollowing ? '✓ 已关注' : '+ 关注'
    }
  }
}

/* ── 购物车 ── */
async function addToCart() {
  const token = localStorage.getItem('mowo_token')
  if (!token) {
    const cart = JSON.parse(localStorage.getItem('mowo_guest_cart') || '[]')
    const exists = cart.find(i => i.contentId === workId && i.hardwareSkuId === (selectedSkuId || ''))
    if (exists) { exists.quantity++ } else {
      cart.push({ contentId: workId, hardwareSkuId: selectedSkuId || '', itemType: 'MARKET', title: workData?.title || '联名作品', quantity: 1 })
    }
    localStorage.setItem('mowo_guest_cart', JSON.stringify(cart))
    showToast('🛒 已加入购物车（登录后可结算）')
    return
  }

  if (!selectedSkuId && skuList.length > 0) { showToast('请先选择规格'); return }
  const skuId = selectedSkuId || skuList[0]?.id
  if (!skuId) { showToast('暂无可用规格'); return }

  const btn = document.getElementById('btnCart')
  if (btn) btn.disabled = true
  try {
    const res = await fetch(`${API}/api/cart/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ itemType: 'MARKET', contentId: workId, hardwareSkuId: skuId, quantity: 1 })
    })
    const data = await res.json()
    if (!data.success) throw new Error(data.message || '加入失败')
    showToast('🛒 已加入购物车')
  } catch (e) {
    showToast(e.message || '加入购物车失败')
  } finally {
    if (btn) btn.disabled = false
  }
}

/* ── 立即购买 ── */
async function buyNow() {
  const token = localStorage.getItem('mowo_token')
  if (!token) { window.location.href = './cart.html'; return }
  if (!selectedSkuId && skuList.length > 0) { showToast('请先选择规格'); return }
  const skuId = selectedSkuId || skuList[0]?.id
  if (!skuId) { showToast('暂无可用规格'); return }

  const btn = document.getElementById('btnBuy')
  if (btn) btn.disabled = true
  try {
    const res = await fetch(`${API}/api/cart/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ itemType: 'MARKET', contentId: workId, hardwareSkuId: skuId, quantity: 1 })
    })
    const data = await res.json()
    if (!data.success) throw new Error(data.message || '操作失败')
    sessionStorage.setItem('mowo_checkout_items', JSON.stringify([data.data.id]))
    window.location.href = './checkout.html'
  } catch (e) {
    showToast(e.message || '操作失败，请重试')
    if (btn) btn.disabled = false
  }
}

/* ── Helpers ── */
function showToast(msg, ms = 2500) {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('show')
  setTimeout(() => el.classList.remove('show'), ms)
}

function fmtCount(n) {
  if (!n) return '0'
  return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n)
}

function esc(s) {
  if (!s) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}
