<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引流链接审核 — 哞屋后台</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--white:#FFFFFF;--cream:#F5F3EF;--black:#111110;--gray1:#EBEBEA;--gray2:#C4C3BF;--gray3:#787874;--accent-y:#F5E642;--accent-o:#FF6B35;--accent-g:#8FD694;--accent-b:#7EC8E3;--font:'Nunito','Noto Sans SC',sans-serif;--sidebar-w:220px;--sidebar-collapsed:60px;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cream);color:var(--black);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}
.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--black);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:width .3s cubic-bezier(0.22,1,0.36,1);overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;}
.sidebar-logo-icon{width:32px;height:32px;background:var(--accent-y);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sidebar-logo-text{font-weight:900;font-size:15px;color:var(--white);}
.sidebar-logo-sub{font-weight:700;font-size:10px;color:var(--gray3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-top:1px;}
.sidebar-toggle{position:absolute;top:26px;right:12px;width:28px;height:28px;background:rgba(255,255,255,.08);border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray3);font-size:12px;}
.sidebar-toggle:hover{background:rgba(255,255,255,.15);color:var(--white);}
.sidebar-nav{flex:1;padding:16px 0;overflow-y:auto;overflow-x:hidden;}
.nav-section-label{font-weight:800;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gray3);padding:12px 20px 6px;white-space:nowrap;}
.sidebar.collapsed .nav-section-label{opacity:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:background .15s;white-space:nowrap;color:var(--gray3);font-weight:800;font-size:13px;text-decoration:none;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--white);}
.nav-item.active{background:rgba(245,230,66,.12);color:var(--accent-y);}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-y);border-radius:0 2px 2px 0;}
.nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.nav-label{transition:opacity .2s;}
.sidebar.collapsed .nav-label{opacity:0;}
.nav-group-header{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:background .15s;color:var(--gray3);font-weight:800;font-size:13px;user-select:none;}
.nav-group-header:hover{background:rgba(255,255,255,.06);color:var(--white);}
.nav-group-header.open{color:var(--accent-y);}
.nav-group-arrow{margin-left:auto;font-size:10px;transition:transform .2s;flex-shrink:0;}
.nav-group-header.open .nav-group-arrow{transform:rotate(180deg);}
.nav-sub{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.nav-sub.open{max-height:400px;}
.nav-sub-item{display:flex;align-items:center;gap:6px;padding:7px 20px 7px 44px;cursor:pointer;transition:background .15s;color:var(--gray3);font-weight:700;font-size:12px;text-decoration:none;}
.nav-sub-item:hover{background:rgba(255,255,255,.06);color:var(--white);}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap;}
.sidebar-user{display:flex;align-items:center;gap:10px;}
.sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--black);flex-shrink:0;}
.sidebar-user-name{font-weight:800;font-size:12px;color:var(--white);}
.sidebar-user-role{font-weight:700;font-size:10px;color:var(--gray3);}
.sidebar.collapsed .sidebar-user-info{display:none;}
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;transition:margin-left .3s cubic-bezier(0.22,1,0.36,1);display:flex;flex-direction:column;}
.main.expanded{margin-left:var(--sidebar-collapsed);}
.topbar{position:sticky;top:0;z-index:50;background:rgba(245,243,239,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray1);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-weight:900;font-size:18px;}
.content{padding:28px 32px;flex:1;}
.btn{height:38px;padding:0 16px;border-radius:10px;font-family:var(--font);font-weight:800;font-size:13px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn-black{background:var(--black);color:var(--white);}
.btn-black:hover{opacity:.85;}
.btn-yellow{background:var(--accent-y);color:var(--black);}
.btn-yellow:hover{opacity:.85;}
.btn-ghost{background:var(--white);color:var(--black);border:1.5px solid var(--gray1);}
.btn-ghost:hover{border-color:var(--black);}
.btn-sm{height:32px;padding:0 12px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.4;pointer-events:none;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--white);border-radius:14px;padding:16px 18px;border:1.5px solid var(--gray1);cursor:pointer;transition:all .2s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.07);}
.stat-card.active-filter{border-color:var(--black);background:var(--black);}
.stat-card.active-filter .stat-label,.stat-card.active-filter .stat-num{color:var(--white);}
.stat-label{font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray3);margin-bottom:6px;}
.stat-num{font-weight:900;font-size:24px;}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.form-input,.form-select{height:38px;border:1.5px solid var(--gray1);border-radius:10px;padding:0 12px;font-family:var(--font);font-weight:700;font-size:13px;color:var(--black);background:var(--white);outline:none;transition:border-color .2s;}
.form-input:focus,.form-select:focus{border-color:var(--black);}

/* 链接卡片 */
.link-card{background:var(--white);border-radius:16px;border:1.5px solid var(--gray1);padding:20px;margin-bottom:12px;}
.link-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
.creator-chip{display:flex;align-items:center;gap:8px;}
.chip-avatar{width:32px;height:32px;border-radius:50%;background:var(--gray1);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--gray3);flex-shrink:0;}
.chip-name{font-weight:900;font-size:13px;}
.chip-date{font-weight:700;font-size:11px;color:var(--gray3);}
.link-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.platform-badge{padding:3px 10px;border-radius:999px;font-weight:800;font-size:11px;}
.pb-bilibili{background:rgba(127,200,227,.15);color:#1565a0;}
.pb-xiaohongshu{background:rgba(255,90,90,.1);color:#c0321a;}
.pb-weibo{background:rgba(255,90,0,.1);color:#c04a00;}
.pb-douyin{background:rgba(0,0,0,.06);color:#111;}
.pb-other{background:var(--gray1);color:var(--gray3);}
.status-badge{padding:3px 10px;border-radius:999px;font-weight:800;font-size:11px;}
.sb-pending{background:#FFF3CD;color:#856404;}
.sb-approved{background:#D4EDDA;color:#1a5c2e;}
.sb-rejected{background:#FFE0DC;color:#993C1D;}
.link-url{font-weight:700;font-size:13px;color:var(--accent-b);margin-bottom:6px;word-break:break-all;}
.link-url a{color:inherit;}
.link-title{font-weight:800;font-size:14px;margin-bottom:4px;}
.link-desc{font-weight:700;font-size:12px;color:var(--gray3);margin-bottom:10px;}

/* 审核表单（内联展开） */
.review-form{background:var(--cream);border-radius:12px;padding:16px;margin-top:12px;display:none;}
.review-form.open{display:block;}
.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;}
.review-field-label{font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray3);display:block;margin-bottom:4px;}
.review-field{width:100%;height:36px;border:1.5px solid var(--gray1);border-radius:8px;padding:0 10px;font-family:var(--font);font-weight:700;font-size:13px;color:var(--black);background:var(--white);outline:none;}
.review-field:focus{border-color:var(--black);}
.review-check-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:800;font-size:13px;cursor:pointer;}
.review-note-field{width:100%;border:1.5px solid var(--gray1);border-radius:8px;padding:8px 10px;font-family:var(--font);font-weight:700;font-size:13px;resize:none;outline:none;margin-bottom:10px;}
.review-note-field:focus{border-color:var(--black);}
.review-actions{display:flex;gap:8px;}

.empty-state{padding:48px 20px;text-align:center;}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty-text{font-weight:800;font-size:14px;color:var(--gray3);}
.loading-row{padding:32px;text-align:center;font-weight:700;font-size:13px;color:var(--gray3);}
.pagination{padding:14px 16px;border-top:1px solid var(--gray1);display:flex;align-items:center;justify-content:space-between;background:var(--white);border-radius:0 0 16px 16px;}
.pagination-info{font-weight:700;font-size:12px;color:var(--gray3);}
.pagination-btns{display:flex;gap:4px;}
.page-btn{width:32px;height:32px;border-radius:8px;font-family:var(--font);font-weight:800;font-size:12px;border:1.5px solid var(--gray1);background:var(--white);cursor:pointer;}
.page-btn:hover{border-color:var(--black);}
.page-btn.active{background:var(--black);color:var(--white);border-color:var(--black);}
.page-btn:disabled{opacity:.4;pointer-events:none;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--white);padding:12px 22px;border-radius:12px;font-weight:800;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── 移动端侧边栏开关 ── */
.menu-btn{width:36px;height:36px;border-radius:10px;background:var(--gray1);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-right:4px;}
.menu-btn:hover{background:var(--gray2);}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:190;display:none;}
.sidebar-backdrop.show{display:block;}
@media(max-width:1023px){
  .sidebar{transform:translateX(-100%);z-index:200;}
  .sidebar.open{transform:none;}
  .main{margin-left:0!important;}
  .topbar{padding:0 16px;}
  .menu-btn{display:flex;}
}
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main" id="main">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" onclick="openSidebar()">&#9776;</button>
    <span class="topbar-title">引流链接审核</span>
    <button class="btn btn-ghost btn-sm" onclick="loadLinks(currentPage)">↻ 刷新</button>
  </header>
  <div class="content">
    <div class="stats-grid">
      <div class="stat-card" onclick="filterStatus('',this)">
        <div class="stat-label">全部</div><div class="stat-num" id="statTotal">—</div>
      </div>
      <div class="stat-card" onclick="filterStatus('pending',this)">
        <div class="stat-label">待审核</div><div class="stat-num" id="statPending">—</div>
      </div>
      <div class="stat-card" onclick="filterStatus('approved',this)">
        <div class="stat-label">已通过</div><div class="stat-num" id="statApproved">—</div>
      </div>
      <div class="stat-card" onclick="filterStatus('rejected',this)">
        <div class="stat-label">不符合</div><div class="stat-num" id="statRejected">—</div>
      </div>
    </div>
    <div class="toolbar">
      <input class="form-input" id="searchInput" type="text" placeholder="搜索创作者昵称…" style="width:200px;" oninput="onSearch()">
      <select class="form-select" id="platformFilter" style="width:120px;" onchange="loadLinks(1)">
        <option value="">全部平台</option>
        <option value="bilibili">B站</option>
        <option value="xiaohongshu">小红书</option>
        <option value="weibo">微博</option>
        <option value="douyin">抖音</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div id="linkList"><div class="loading-row">正在加载…</div></div>
    <div id="paginationWrap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
  document.body.style.overflow = '';
}
</script>
<script src="../js/auth.js"></script>
<script>
const API = (location.hostname==='127.0.0.1'?'http://127.0.0.1:3001':'http://localhost:3001')
let currentPage = 1, currentStatus = '', searchTimer = null
const PL = {bilibili:'B站',xiaohongshu:'小红书',weibo:'微博',douyin:'抖音',other:'其他'}
const PLC= {bilibili:'pb-bilibili',xiaohongshu:'pb-xiaohongshu',weibo:'pb-weibo',douyin:'pb-douyin',other:'pb-other'}
const SL = {pending:'待审核',approved:'已通过',rejected:'不符合要求'}
const SC = {pending:'sb-pending',approved:'sb-approved',rejected:'sb-rejected'}

function showToast(msg,dur){dur=dur||2500;const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},dur)}
function getToken(){return localStorage.getItem('mowo_token')}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})}

async function apiFetch(path,opts){
  opts=opts||{}
  const res=await fetch(API+path,Object.assign({},opts,{headers:Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+getToken()},opts.headers||{})}))
  return res.json()
}


function toggleNavGroup(key){const sub=document.getElementById('navSub-'+key);if(!sub)return;sub.classList.toggle('open');sub.previousElementSibling?.classList.toggle('open')}

// 加载统计
async function loadStats(){
  const data=await apiFetch('/api/admin/links/social/stats')
  if(!data.success)return
  const d=data.data
  document.getElementById('statTotal').textContent=d.total
  document.getElementById('statPending').textContent=d.pending
  document.getElementById('statApproved').textContent=d.approved
  document.getElementById('statRejected').textContent=d.rejected
}

function filterStatus(status,card){
  currentStatus=status
  document.querySelectorAll('.stat-card').forEach(function(c){c.classList.remove('active-filter')})
  card.classList.add('active-filter')
  loadLinks(1)
}

function onSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(function(){loadLinks(1)},400)}

async function loadLinks(page){
  currentPage=page
  document.getElementById('linkList').innerHTML='<div class="loading-row">正在加载…</div>'
  const keyword=document.getElementById('searchInput').value.trim()
  const platform=document.getElementById('platformFilter').value
  let url='/api/admin/links/social?page='+page+'&limit=20'
  if(currentStatus) url+='&status='+currentStatus
  if(platform)      url+='&platform='+platform
  if(keyword)       url+='&keyword='+encodeURIComponent(keyword)

  const data=await apiFetch(url)
  if(!data.success){showToast('加载失败');return}
  const links=data.data.links
  const pg=data.data.pagination

  if(links.length===0){
    document.getElementById('linkList').innerHTML='<div class="empty-state"><div class="empty-icon">🔗</div><div class="empty-text">暂无链接</div></div>'
    document.getElementById('paginationWrap').innerHTML=''
    return
  }

  document.getElementById('linkList').innerHTML=links.map(function(l){
    return '<div class="link-card" id="lc-'+l.id+'">'+
      '<div class="link-card-header">'+
        '<div class="creator-chip">'+
          (l.creatorAvatar?'<img class="chip-avatar" src="'+escHtml(l.creatorAvatar)+'" alt="">':'<div class="chip-avatar">'+escHtml((l.creatorNickname||'?')[0].toUpperCase())+'</div>')+
          '<div><div class="chip-name">'+escHtml(l.creatorNickname)+'</div><div class="chip-date">'+fmtDate(l.createdAt)+'</div></div>'+
        '</div>'+
        '<div class="link-badges">'+
          '<span class="platform-badge '+(PLC[l.platform]||'pb-other')+'">'+(PL[l.platform]||l.platform)+'</span>'+
          '<span class="status-badge '+(SC[l.status]||'sb-pending')+'">'+(SL[l.status]||l.status)+'</span>'+
        '</div>'+
      '</div>'+
      (l.videoTitle?'<p class="link-title">'+escHtml(l.videoTitle)+'</p>':'')+
      '<p class="link-url"><a href="'+escHtml(l.videoUrl)+'" target="_blank" rel="noopener">'+escHtml(l.videoUrl)+'</a></p>'+
      (l.description?'<p class="link-desc">'+escHtml(l.description)+'</p>':'')+
      (l.reviewNote?'<div style="margin-top:8px;padding:8px 12px;background:var(--cream);border-radius:8px;font-size:12px;font-weight:700;color:var(--gray3);">审核备注：'+escHtml(l.reviewNote)+'</div>':'')+
      (l.status==='approved'?'<div style="margin-top:10px;display:flex;gap:16px;font-size:12px;font-weight:700;color:var(--gray3);">'+
        '<span>播放量 <b style="color:var(--black);">'+l.viewCount.toLocaleString()+'</b></span>'+
        '<span>点赞 <b style="color:var(--black);">'+l.likeCount.toLocaleString()+'</b></span>'+
        '<span>声量系数 <b style="color:var(--black);">×'+l.manualMod+'</b></span>'+
      '</div>':'')+
      (l.status==='pending'?'<div style="margin-top:12px;"><button class="btn btn-black btn-sm" onclick="toggleReview(\''+l.id+'\')">审核</button></div>':'')+
      // 审核表单
      '<div class="review-form" id="rf-'+l.id+'">'+
        '<div class="review-grid">'+
          '<div><label class="review-field-label">播放量</label><input class="review-field" type="number" id="rv-views-'+l.id+'" min="0" placeholder="0"></div>'+
          '<div><label class="review-field-label">点赞数</label><input class="review-field" type="number" id="rv-likes-'+l.id+'" min="0" placeholder="0"></div>'+
          '<div><label class="review-field-label">声量系数（0.5~2.0）</label><input class="review-field" type="number" id="rv-mod-'+l.id+'" min="0.5" max="2" step="0.1" value="1.0"></div>'+
        '</div>'+
        '<label class="review-check-row"><input type="checkbox" id="rv-brand-'+l.id+'" style="margin-right:4px;"> 视频中有品牌提及（哞屋/MOWO/mowobox）</label>'+
        '<textarea class="review-note-field" id="rv-note-'+l.id+'" rows="2" placeholder="审核备注（选填）"></textarea>'+
        '<div class="review-actions">'+
          '<button class="btn btn-yellow btn-sm" onclick="submitReview(\''+l.id+'\',\'approved\')">✓ 通过</button>'+
          '<button class="btn btn-sm" style="background:#FFE0DC;color:#993C1D;" onclick="submitReview(\''+l.id+'\',\'rejected\')">✗ 不符合</button>'+
          '<button class="btn btn-ghost btn-sm" onclick="toggleReview(\''+l.id+'\')">取消</button>'+
        '</div>'+
      '</div>'+
    '</div>'
  }).join('')

  // 分页
  const pw=document.getElementById('paginationWrap')
  if(pg.totalPages<=1){pw.innerHTML='';return}
  let btns='<button class="page-btn" '+(page<=1?'disabled':'')+' onclick="loadLinks('+(page-1)+')">‹</button>'
  for(let i=1;i<=pg.totalPages;i++){
    if(i===1||i===pg.totalPages||Math.abs(i-page)<=1)
      btns+='<button class="page-btn '+(i===page?'active':'')+'" onclick="loadLinks('+i+')">'+i+'</button>'
    else if(Math.abs(i-page)===2)
      btns+='<span style="padding:0 2px;color:var(--gray3);">…</span>'
  }
  btns+='<button class="page-btn" '+(page>=pg.totalPages?'disabled':'')+' onclick="loadLinks('+(page+1)+')">›</button>'
  pw.innerHTML='<div class="pagination"><span class="pagination-info">共 '+pg.total+' 条</span><div class="pagination-btns">'+btns+'</div></div>'
}

function toggleReview(id){document.getElementById('rf-'+id)?.classList.toggle('open')}

async function submitReview(id,status){
  const views=parseInt(document.getElementById('rv-views-'+id).value)||0
  const likes=parseInt(document.getElementById('rv-likes-'+id).value)||0
  const mod=parseFloat(document.getElementById('rv-mod-'+id).value)||1.0
  const brand=document.getElementById('rv-brand-'+id).checked
  const note=document.getElementById('rv-note-'+id).value.trim()

  const data=await apiFetch('/api/admin/links/social/'+id+'/review',{
    method:'PUT',
    body:JSON.stringify({status,brandMentioned:brand,viewCount:views,likeCount:likes,manualMod:mod,reviewNote:note||undefined})
  })
  if(data.success){
    showToast(status==='approved'?'✅ 已通过审核':'已标记为不符合')
    loadStats()
    loadLinks(currentPage)
  } else {
    showToast('❌ '+data.message)
  }
}

window.addEventListener('DOMContentLoaded',async function(){
  const userStr=localStorage.getItem('mowo_user')
  if(userStr){try{const u=JSON.parse(userStr);document.getElementById('sidebarName').textContent=u.nickname||u.phone||'管理员';document.getElementById('sidebarAvatar').textContent=(u.nickname||'管')[0].toUpperCase();const rm={0:'用户',1:'生产端',2:'管理员',3:'超管'};document.getElementById('sidebarRole').textContent=rm[u.role]||'—'}catch(e){}}
  // 默认显示待审核
  currentStatus='pending'
  document.querySelectorAll('.stat-card')[1].classList.add('active-filter')
  loadStats()
  loadLinks(1)
})
</script>
